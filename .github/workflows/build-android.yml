name: Build Heydarbaba Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          cp "aysəl.mp3" "www/aysəl.mp3"

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp "file_0000000098808210b95a759be7dd5505.png" resources/icon.png

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icon
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heydarbaba-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

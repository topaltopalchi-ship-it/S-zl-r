<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SÖZLƏR — Azərbaycan Türkcəsi</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f5f1e8,#e6f0ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#222;
}

.container{
  width:92%;
  max-width:540px;
  background:#fff;
  border-radius:25px;
  padding:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  font-size:42px;
  margin:5px 0;
  letter-spacing:3px;
}

.subtitle{
  color:#666;
  margin-bottom:25px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin:7px 0;
  font-size:18px;
  cursor:pointer;
  background:#222;
  color:white;
}

button:active{
  transform:scale(.98);
}

.back{
  background:#777;
}

.hidden{
  display:none;
}

.stats{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:20px;
}

.scrambled{
  font-size:36px;
  letter-spacing:8px;
  margin:25px 0;
  min-height:50px;
}

.hint{
  background:#f1f1f1;
  border-radius:12px;
  padding:14px;
  margin:15px 0;
  min-height:25px;
}

input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:20px;
  text-align:center;
  margin-bottom:8px;
}

.message{
  min-height:30px;
  margin:10px 0;
  font-weight:bold;
}

.arabic{
  direction:rtl;
  font-size:36px;
  letter-spacing:3px;
}

/* Ü — و با ۷ کوچک بالا */
.special-u{
  position:relative;
  display:inline-block;
  padding-top:12px;
}

.special-u::before{
  content:"۷";
  position:absolute;
  top:-7px;
  left:50%;
  transform:translateX(-50%) scale(.45);
  font-weight:bold;
}

/* Ö — و با همزه کوچک بالا */
.special-o{
  position:relative;
  display:inline-block;
  padding-top:12px;
}

.special-o::before{
  content:"ء";
  position:absolute;
  top:-7px;
  left:50%;
  transform:translateX(-50%) scale(.55);
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<!-- MENU -->
<div id="menu">

<h1>SÖZLƏR</h1>

<div class="subtitle">
Azərbaycan Türkcəsi söz oyunu
</div>

<button onclick="startGame('latin')">
🇦🇿 Azərbaycan Türkcəsi — Latın əlifbası
</button>

<button onclick="startGame('arabic')">
☪️ Azərbaycan Türkcəsi — Ərəb əlifbası
</button>

</div>


<!-- GAME -->
<div id="game" class="hidden">

<div class="stats">

<span>
⭐ Xal:
<span id="score">0</span>
</span>

<span>
Söz:
<span id="number">1</span>
</span>

</div>

<h2>Sözü tap</h2>

<div id="scrambled" class="scrambled"></div>

<div id="hint" class="hint">
💡 İpucu üçün düyməyə basın.
</div>

<input
id="answer"
type="text"
autocomplete="off"
placeholder="Cavabınızı yazın..."
>

<button onclick="checkAnswer()">
Yoxla
</button>

<button onclick="showHint()">
💡 İpucu
</button>

<div id="message" class="message"></div>

<button onclick="nextWord()">
➡️ Növbəti söz
</button>

<button class="back" onclick="backToMenu()">
↩️ Geri
</button>

</div>

</div>


<script>

/* =========================
   Azərbaycan Türkcəsi sözlər
   ========================= */

const words = [

{
latin:"günəş",
arabic:"گۈنەش",
hint:"Yerə işıq və istilik verir."
},

{
latin:"çörək",
arabic:"چۆرەک",
hint:"Süfrədə yeyilən əsas qidalardan biridir."
},

{
latin:"bulud",
arabic:"بۇلۇد",
hint:"Göydə görünür və yağış gətirə bilər."
},

{
latin:"su",
arabic:"سۇ",
hint:"İçmək üçün lazımdır."
},

{
latin:"kitab",
arabic:"کیتاب",
hint:"Oxumaq üçün istifadə olunur."
},

{
latin:"məktəb",
arabic:"مەکتەب",
hint:"Şagirdlərin təhsil aldığı yer."
},

{
latin:"ev",
arabic:"ئەۋ",
hint:"İnsanların yaşadığı yer."
},

{
latin:"qapı",
arabic:"قاپى",
hint:"Evə giriş üçün istifadə olunur."
},

{
latin:"çiçək",
arabic:"چیچەک",
hint:"Təbiətdə və bağlarda bitir."
},

{
latin:"dəniz",
arabic:"دەنیز",
hint:"Böyük su sahəsidir."
},

{
latin:"dağ",
arabic:"داغ",
hint:"Yer səthindən yüksələn böyük təbii relyefdir."
},

{
latin:"ağac",
arabic:"آغاج",
hint:"Meşədə və bağlarda bitir."
},

{
latin:"göy",
arabic:"گۆی",
hint:"Səmanın rəngidir."
},

{
latin:"ay",
arabic:"آی",
hint:"Gecə göydə görünür."
},

{
latin:"ulduz",
arabic:"اولدوز",
hint:"Gecə səmasında parlayır."
}

];


let alphabet="latin";
let current=0;
let score=0;
let hintUsed=false;


/* =========================
   Oyunu başlat
   ========================= */

function startGame(type){

alphabet=type;
current=0;
score=0;
hintUsed=false;

document.getElementById("menu").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

showWord();

}


/* =========================
   Söz göstər
   ========================= */

function showWord(){

const item=words[current];

document.getElementById("score").textContent=score;

document.getElementById("number").textContent=current+1;

document.getElementById("answer").value="";

document.getElementById("message").textContent="";

document.getElementById("hint").textContent=
"💡 İpucu üçün düyməyə basın.";

hintUsed=false;

const word=
alphabet==="latin"
?item.latin
:item.arabic;

const scrambled=document.getElementById("scrambled");

if(alphabet==="latin"){

scrambled.className="scrambled";

scrambled.textContent=
shuffle(word);

}else{

scrambled.className="scrambled arabic";

scrambled.innerHTML=
makeArabicDisplay(word);

}

}


/* =========================
   Qarışdır
   ========================= */

function shuffle(word){

let letters=Array.from(word);

for(let i=letters.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[letters[i],letters[j]]=
[letters[j],letters[i]];

}

return letters.join(" ");

}


/* =========================
   Ərəb yazısını göstər
   ========================= */

function makeArabicDisplay(word){

let result="";

for(let char of word){

if(char==="ۇ"){

result+=
'<span class="special-u">و</span>';

}

else if(char==="ۆ"){

result+=
'<span class="special-o">و</span>';

}

else{

result+=char;

}

}

return result;

}


/* =========================
   Cavabı yoxla
   ========================= */

function checkAnswer(){

const input=
document.getElementById("answer")
.value
.trim()
.toLowerCase();

const correct=
alphabet==="latin"
?words[current].latin
:words[current].arabic;

const message=
document.getElementById("message");


if(input===correct){

let points=
hintUsed ? 5 : 10;

score+=points;

message.textContent=
"🎉 Düzdür! +"+points+" xal";

document.getElementById("score")
.textContent=score;

}else{

message.textContent=
"❌ Düz deyil. Yenidən cəhd edin.";

}

}


/* =========================
   İpucu
   ========================= */

function showHint(){

document.getElementById("hint")
.textContent=
"💡 "+words[current].hint;

hintUsed=true;

}


/* =========================
   Növbəti söz
   ========================= */

function nextWord(){

current++;

if(current>=words.length){

current=0;

}

showWord();

}


/* =========================
   Menyu
   ========================= */

function backToMenu(){

document.getElementById("game")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

}

</script>

</body>
</html>

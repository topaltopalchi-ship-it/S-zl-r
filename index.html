<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.12),transparent 30%),
    linear-gradient(145deg,#17253c,#0c1424 65%,#08101d);
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:16px 14px 30px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:8px 0 18px;
}

.glass{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:28px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.home-card{
  padding:20px;
}

.mode-title{
  text-align:center;
  margin-bottom:12px;
  opacity:.85;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode-btn{
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:14px;
  color:#fff;
  background:rgba(255,255,255,.08);
  font-weight:800;
  touch-action:manipulation;
}

.mode-btn.selected{
  background:rgba(214,155,50,.35);
  border-color:#e2ad4e;
}

.start-btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:18px;
  color:#fff;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(135deg,#e0a53d,#b87818);
  touch-action:manipulation;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  text-align:center;
  padding:10px 5px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
}

.stat small{
  display:block;
  opacity:.6;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:18px;
}

.stage-title{
  text-align:center;
  font-weight:900;
  margin:22px 0 12px;
}

.stage-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.stage-btn{
  min-height:52px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-weight:900;
  touch-action:manipulation;
}

.stage-btn.open{
  background:rgba(214,155,50,.25);
}

.stage-btn.current{
  border:2px solid #e4b24e;
}

.stage-btn.locked{
  opacity:.35;
}

.stage-info{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  opacity:.65;
}


/* GAME */

.game-top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.top-box{
  text-align:center;
  padding:10px 4px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
}

.top-box small{
  display:block;
  opacity:.55;
  font-size:10px;
}

.top-box strong{
  display:block;
  margin-top:3px;
}

.game-card{
  padding:16px;
}


/* ANSWER SLOTS */

.word-slots{
  min-height:78px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.answer-word{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  min-height:48px;

  /*
    مهم:
    ترتیب واقعی حروف همان ترتیب جواب می‌ماند،
    ولی برای حالت عربی در JS جهت نمایش اصلاح می‌شود.
  */
}

.answer-word.arabic{
  direction:ltr;
  flex-direction:row-reverse;
}

.answer-slot{
  width:36px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  font-size:20px;
  font-weight:900;
}

.answer-slot.found{
  background:rgba(74,180,112,.28);
  border-color:rgba(110,230,150,.6);
}


/* CURRENT WORD */

.current-word{
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:5px 0 14px;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}


/* TOUCH AREA */

.letters-area{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
}

.letter{
  aspect-ratio:1;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:20px;
  color:#fff;
  font-size:25px;
  font-weight:900;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.20),
    rgba(255,255,255,.07)
  );
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 18px rgba(0,0,0,.2);
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letter.selected{
  transform:scale(.92);
  background:rgba(218,163,55,.72);
  border-color:#ffd978;
}


/* BUTTONS */

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.action-btn{
  border:0;
  border-radius:18px;
  padding:14px 5px;
  color:#fff;
  background:rgba(255,255,255,.09);
  font-weight:900;
  touch-action:manipulation;
}

.check-btn{
  background:linear-gradient(135deg,#e0a53d,#b87818);
}

.hint-btn{
  background:rgba(214,155,50,.22);
}

.message{
  min-height:28px;
  margin-top:12px;
  text-align:center;
  font-weight:800;
}

.correct{
  color:#9cf0b9;
}

.wrong{
  color:#ffaaa0;
}

.shake{
  animation:shake .35s;
}

.pop{
  animation:pop .25s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

@keyframes pop{
  50%{transform:scale(1.03)}
}


/* MUSIC */

.music-btn{
  position:fixed;
  right:14px;
  bottom:14px;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:20px;
  z-index:20;
}


/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.62);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:390px;
  padding:25px;
  text-align:center;
  border-radius:28px;
  background:#182b3d;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-card h2{
  margin-top:0;
}

.modal-card p{
  line-height:1.7;
  opacity:.8;
}

.modal-card button{
  width:100%;
  border:0;
  border-radius:17px;
  padding:14px;
  margin-top:8px;
  color:#fff;
  background:linear-gradient(135deg,#e0a53d,#b87818);
  font-weight:900;
  touch-action:manipulation;
}

@media(max-width:360px){

  .letter{
    font-size:21px;
    border-radius:17px;
  }

  .answer-slot{
    width:32px;
    height:39px;
    font-size:18px;
  }

}
</style>
</head>

<body>

<audio id="music" loop preload="auto">
  <source
    src="https://topaltopalchi.github.io/S-zl-r/ays%C9%99l.mp3"
    type="audio/mpeg">
</audio>

<div class="app">

<section id="homeScreen" class="screen active">

  <div class="logo">حیدربابا</div>

  <div class="glass home-card">

    <div class="mode-title">Əlifbanı seç</div>

    <div class="mode-buttons">

      <button id="latinBtn" class="mode-btn selected">
        🇮🇷 Latin
      </button>

      <button id="arabicBtn" class="mode-btn">
        🇮🇷 Ərəb
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <small>Mərhələ</small>
        <strong id="homeStage">1</strong>
      </div>

      <div class="stat">
        <small>Sikkə</small>
        <strong id="homeCoins">0</strong>
      </div>

      <div class="stat">
        <small>Xal</small>
        <strong id="homeScore">0</strong>
      </div>

    </div>

    <button id="continueBtn" class="start-btn">
      Oyuna başla
    </button>

    <div class="stage-title">
      Mərhələlər
    </div>

    <div id="stageGrid" class="stage-grid"></div>

    <div id="stageInfo" class="stage-info"></div>

  </div>

</section>


<section id="gameScreen" class="screen">

  <div class="logo" style="font-size:30px;">
    حیدربابا
  </div>

  <div class="game-top">

    <div class="top-box">
      <small>Mərhələ</small>
      <strong id="gameStage">1</strong>
    </div>

    <div class="top-box">
      <small>Sikkə</small>
      <strong id="gameCoins">0</strong>
    </div>

    <div class="top-box">
      <small>Can</small>
      <strong id="gameLives">❤️❤️❤️</strong>
    </div>

  </div>

  <div class="glass game-card">

    <div id="wordSlots" class="word-slots"></div>

    <div id="currentWord" class="current-word"></div>

    <div id="lettersArea" class="letters-area"></div>

    <div class="game-actions">

      <button id="clearBtn" class="action-btn">
        Təmizlə
      </button>

      <button id="checkBtn" class="action-btn check-btn">
        Yoxla
      </button>

      <button id="shuffleBtn" class="action-btn">
        Qarışdır
      </button>

    </div>

    <div id="message" class="message"></div>

    <button
      id="hintBtn"
      class="action-btn hint-btn"
      style="width:100%;margin-top:10px;"
    >
      💡 İpucu
    </button>

  </div>

</section>

</div>


<button id="musicBtn" class="music-btn">
  🔊
</button>


<div id="modal" class="modal">

  <div class="modal-card">

    <h2 id="modalTitle"></h2>

    <p id="modalText"></p>

    <button id="modalAction"></button>

  </div>

</div>


<script>

/* =====================================================
   STAGES
   ===================================================== */

const stages = [

  {
    latinLetters:["a","t","a","n"],
    arabicLetters:["ا","ت","ا","ن"],
    latinAnswers:["ata","ana"],
    arabicAnswers:["اتا","انا"]
  },

  {
    latinLetters:["a","l","m","a"],
    arabicLetters:["ا","ل","م","ا"],
    latinAnswers:["alma","al"],
    arabicAnswers:["الما","ال"]
  },

  {
    latinLetters:["g","ü","n"],
    arabicLetters:["گ","و","ن"],
    latinAnswers:["gün"],
    arabicAnswers:["گون"]
  },

  {
    latinLetters:["g","ü","n","ə","ş"],
    arabicLetters:["گ","و","ن","ش"],
    latinAnswers:["gün","günəş"],
    arabicAnswers:["گون","گونش"]
  },

  {
    latinLetters:["ç","ö","r","ə","k"],
    arabicLetters:["چ","و","ر","ک"],
    latinAnswers:["çörək"],
    arabicAnswers:["چورک"]
  },

  {
    latinLetters:["g","ü","l"],
    arabicLetters:["گ","و","ل"],
    latinAnswers:["gül"],
    arabicAnswers:["گول"]
  },

  {
    latinLetters:["a","ğ","a","c"],
    arabicLetters:["ا","غ","ا","ج"],
    latinAnswers:["ağac","ağ"],
    arabicAnswers:["اغاج","اغ"]
  },

  {
    latinLetters:["g","ö","z"],
    arabicLetters:["گ","و","ز"],
    latinAnswers:["göz","öz"],
    arabicAnswers:["گوز","اوز"]
  },

  {
    latinLetters:["q","a","r","a"],
    arabicLetters:["ق","ا","ر","ا"],
    latinAnswers:["qara","qar","ara"],
    arabicAnswers:["قارا","قار","ارا"]
  },

  {
    latinLetters:["d","a","ş"],
    arabicLetters:["د","ا","ش"],
    latinAnswers:["daş","aş"],
    arabicAnswers:["داش","اش"]
  },

  {
    latinLetters:["s","u"],
    arabicLetters:["س","و"],
    latinAnswers:["su"],
    arabicAnswers:["سو"]
  },

  {
    latinLetters:["a","y"],
    arabicLetters:["ا","ی"],
    latinAnswers:["ay"],
    arabicAnswers:["ای"]
  },

  {
    latinLetters:["d","o","s","t"],
    arabicLetters:["د","و","س","ت"],
    latinAnswers:["dost"],
    arabicAnswers:["دوست"]
  },

  {
    latinLetters:["g","e","c","ə"],
    arabicLetters:["گ","ئ","ج","ا"],
    latinAnswers:["gecə"],
    arabicAnswers:["گئجا"]
  },

  {
    latinLetters:["s","e","v"],
    arabicLetters:["س","ئ","و"],
    latinAnswers:["sev"],
    arabicAnswers:["سئو"]
  },

  {
    latinLetters:["s","e","v","i"],
    arabicLetters:["س","ئ","و","ی"],
    latinAnswers:["sevi"],
    arabicAnswers:["سئوی"]
  },

  {
    latinLetters:["b","a","l"],
    arabicLetters:["ب","ا","ل"],
    latinAnswers:["bal"],
    arabicAnswers:["بال"]
  },

  {
    latinLetters:["d","a","ğ"],
    arabicLetters:["د","ا","غ"],
    latinAnswers:["dağ"],
    arabicAnswers:["داغ"]
  },

  {
    latinLetters:["y","o","l"],
    arabicLetters:["ی","و","ل"],
    latinAnswers:["yol"],
    arabicAnswers:["یول"]
  },

  {
    latinLetters:["e","l"],
    arabicLetters:["ئ","ل"],
    latinAnswers:["el"],
    arabicAnswers:["ئل"]
  }

];


/* =====================================================
   STATE
   ===================================================== */

let mode =
  localStorage.getItem("hb_mode") || "latin";

let coins =
  Number(localStorage.getItem("hb_coins") || 0);

let score =
  Number(localStorage.getItem("hb_score") || 0);

let unlockedStage =
  Number(localStorage.getItem("hb_unlockedStage") || 1);

let selectedStage =
  Number(localStorage.getItem("hb_selectedStage") || 1);

let lives = 3;

let currentLetters = [];

let currentWord = "";

let selectedIndexes = [];

let foundWords = [];

let dragging = false;

let activePointerId = null;

let gameOver = false;

let modalActionType = "";

if(unlockedStage < 1)
  unlockedStage = 1;

if(unlockedStage > stages.length)
  unlockedStage = stages.length;

if(selectedStage < 1)
  selectedStage = 1;

if(selectedStage > unlockedStage)
  selectedStage = unlockedStage;


/* =====================================================
   ELEMENTS
   ===================================================== */

const music =
  document.getElementById("music");

const homeScreen =
  document.getElementById("homeScreen");

const gameScreen =
  document.getElementById("gameScreen");

const latinBtn =
  document.getElementById("latinBtn");

const arabicBtn =
  document.getElementById("arabicBtn");

const continueBtn =
  document.getElementById("continueBtn");

const stageGrid =
  document.getElementById("stageGrid");

const stageInfo =
  document.getElementById("stageInfo");

const homeStage =
  document.getElementById("homeStage");

const homeCoins =
  document.getElementById("homeCoins");

const homeScore =
  document.getElementById("homeScore");

const gameStage =
  document.getElementById("gameStage");

const gameCoins =
  document.getElementById("gameCoins");

const gameLives =
  document.getElementById("gameLives");

const wordSlots =
  document.getElementById("wordSlots");

const currentWordEl =
  document.getElementById("currentWord");

const lettersArea =
  document.getElementById("lettersArea");

const message =
  document.getElementById("message");

const clearBtn =
  document.getElementById("clearBtn");

const checkBtn =
  document.getElementById("checkBtn");

const shuffleBtn =
  document.getElementById("shuffleBtn");

const hintBtn =
  document.getElementById("hintBtn");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalAction =
  document.getElementById("modalAction");

const musicBtn =
  document.getElementById("musicBtn");


/* =====================================================
   SAVE
   ===================================================== */

function save(){

  localStorage.setItem("hb_mode",mode);

  localStorage.setItem("hb_coins",coins);

  localStorage.setItem("hb_score",score);

  localStorage.setItem(
    "hb_unlockedStage",
    unlockedStage
  );

  localStorage.setItem(
    "hb_selectedStage",
    selectedStage
  );

}


/* =====================================================
   MODE
   ===================================================== */

function setMode(newMode){

  mode = newMode;

  latinBtn.classList.toggle(
    "selected",
    mode === "latin"
  );

  arabicBtn.classList.toggle(
    "selected",
    mode === "arabic"
  );

  save();

}

latinBtn.onclick = function(){
  setMode("latin");
};

arabicBtn.onclick = function(){
  setMode("arabic");
};


/* =====================================================
   HOME
   ===================================================== */

function updateHome(){

  homeStage.textContent =
    selectedStage;

  homeCoins.textContent =
    coins;

  homeScore.textContent =
    score;

}


function renderStages(){

  stageGrid.innerHTML = "";

  for(
    let i=0;
    i<stages.length;
    i++
  ){

    const number = i + 1;

    const btn =
      document.createElement("button");

    btn.className =
      "stage-btn";

    if(number <= unlockedStage){

      btn.classList.add("open");

      btn.textContent =
        number;

      if(number === selectedStage){

        btn.classList.add("current");

      }

      btn.onclick = function(){

        selectedStage =
          number;

        save();

        updateHome();

        renderStages();

      };

    }else{

      btn.classList.add("locked");

      btn.textContent =
        "🔒";

    }

    stageGrid.appendChild(btn);

  }

  stageInfo.textContent =
    `${unlockedStage} / ${stages.length} mərhələ açıqdır`;

}


continueBtn.onclick = function(){

  startGame(selectedStage);

};


/* =====================================================
   START
   ===================================================== */

function startGame(stageNumber){

  if(stageNumber > unlockedStage)
    return;

  selectedStage =
    stageNumber;

  lives = 3;

  foundWords = [];

  currentWord = "";

  selectedIndexes = [];

  dragging = false;

  activePointerId = null;

  gameOver = false;

  message.textContent = "";

  message.className = "message";

  homeScreen.classList.remove("active");

  gameScreen.classList.add("active");

  loadStage();

  startMusic();

  save();

}


/* =====================================================
   LOAD
   ===================================================== */

function loadStage(){

  const stage =
    stages[selectedStage - 1];

  currentLetters =
    mode === "latin"
      ? [...stage.latinLetters]
      : [...stage.arabicLetters];

  shuffleArray(currentLetters);

  gameStage.textContent =
    selectedStage;

  gameCoins.textContent =
    coins;

  updateLives();

  renderSlots();

  renderLetters();

  clearCurrentWord();

}


/* =====================================================
   ANSWERS
   ===================================================== */

function getAnswers(){

  const stage =
    stages[selectedStage - 1];

  return mode === "latin"
    ? stage.latinAnswers
    : stage.arabicAnswers;

}


/* =====================================================
   ANSWER SLOTS
   ===================================================== */

function renderSlots(){

  wordSlots.innerHTML = "";

  const answers =
    getAnswers();

  answers.forEach(answer=>{

    const word =
      document.createElement("div");

    word.className =
      "answer-word";

    /*
      فقط نمایش را برای عربی اصلاح می‌کنیم.
      ترتیب واقعی answer اصلاً تغییر نمی‌کند.
    */
    if(mode === "arabic"){

      word.classList.add("arabic");

    }

    if(foundWords.includes(answer)){

      [...answer].forEach(letter=>{

        const slot =
          document.createElement("div");

        slot.className =
          "answer-slot found";

        slot.textContent =
          letter;

        word.appendChild(slot);

      });

    }else{

      [...answer].forEach(()=>{

        const slot =
          document.createElement("div");

        slot.className =
          "answer-slot";

        slot.textContent =
          "";

        word.appendChild(slot);

      });

    }

    wordSlots.appendChild(word);

  });

}


/* =====================================================
   RENDER LETTERS
   ===================================================== */

function renderLetters(){

  lettersArea.innerHTML = "";

  currentLetters.forEach(
    (letter,index)=>{

      const el =
        document.createElement("div");

      el.className =
        "letter";

      el.dataset.index =
        index;

      el.textContent =
        letter;

      lettersArea.appendChild(el);

    }
  );

}


/* =====================================================
   TOUCH SYSTEM
   ===================================================== */

lettersArea.addEventListener(
  "pointerdown",
  function(e){

    if(gameOver)
      return;

    if(
      e.pointerType === "mouse" &&
      e.button !== 0
    )
      return;

    const letter =
      e.target.closest(".letter");

    if(!letter)
      return;

    e.preventDefault();

    dragging = true;

    activePointerId =
      e.pointerId;

    clearCurrentWord();

    try{

      lettersArea.setPointerCapture(
        e.pointerId
      );

    }catch(err){}

    const index =
      Number(letter.dataset.index);

    addLetter(index);

  },
  {passive:false}
);


lettersArea.addEventListener(
  "pointermove",
  function(e){

    if(!dragging)
      return;

    if(
      activePointerId !==
      e.pointerId
    )
      return;

    e.preventDefault();

    const element =
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    if(!element)
      return;

    const letter =
      element.closest(".letter");

    if(!letter)
      return;

    const index =
      Number(letter.dataset.index);

    addLetter(index);

  },
  {passive:false}
);


lettersArea.addEventListener(
  "pointerup",
  function(e){

    if(
      activePointerId !==
      e.pointerId
    )
      return;

    e.preventDefault();

    dragging = false;

    try{

      if(
        lettersArea.hasPointerCapture(
          e.pointerId
        )
      ){

        lettersArea.releasePointerCapture(
          e.pointerId
        );

      }

    }catch(err){}

    activePointerId = null;

  },
  {passive:false}
);


lettersArea.addEventListener(
  "pointercancel",
  function(e){

    dragging = false;

    activePointerId = null;

    try{

      if(
        lettersArea.hasPointerCapture(
          e.pointerId
        )
      ){

        lettersArea.releasePointerCapture(
          e.pointerId
        );

      }

    }catch(err){}

  },
  {passive:false}
);


/* =====================================================
   ADD LETTER
   ===================================================== */

function addLetter(index){

  if(
    selectedIndexes.includes(index)
  )
    return;

  selectedIndexes.push(index);

  currentWord +=
    currentLetters[index];

  currentWordEl.textContent =
    currentWord;

  const elements =
    lettersArea.querySelectorAll(
      ".letter"
    );

  if(elements[index]){

    elements[index]
      .classList
      .add("selected");

  }

}


/* =====================================================
   CLEAR
   ===================================================== */

function clearCurrentWord(){

  currentWord = "";

  selectedIndexes = [];

  currentWordEl.textContent =
    "";

  const elements =
    lettersArea.querySelectorAll(
      ".letter"
    );

  elements.forEach(el=>{

    el.classList.remove(
      "selected"
    );

  });

}


/* =====================================================
   CHECK
   ===================================================== */

checkBtn.onclick =
function(){

  checkWord();

};


function checkWord(){

  if(!currentWord){

    message.textContent =
      "Əvvəlcə hərfləri seç.";

    message.className =
      "message wrong";

    return;

  }

  const answers =
    getAnswers();

  if(
    answers.includes(currentWord) &&
    !foundWords.includes(currentWord)
  ){

    foundWords.push(
      currentWord
    );

    score += 10;

    coins += 1;

    playCorrectSound();

    message.textContent =
      "Düzdür! 👏";

    message.className =
      "message correct";

    renderSlots();

    updateGameStats();

    clearCurrentWord();

    if(
      foundWords.length ===
      answers.length
    ){

      setTimeout(
        finishStage,
        500
      );

    }

  }else{

    playWrongSound();

    message.textContent =
      "Bu söz düzgün deyil.";

    message.className =
      "message wrong";

    lettersArea.classList.remove(
      "shake"
    );

    void lettersArea.offsetWidth;

    lettersArea.classList.add(
      "shake"
    );

    clearCurrentWord();

    loseLife();

  }

}


/* =====================================================
   LIVES
   ===================================================== */

function loseLife(){

  lives--;

  updateLives();

  if(lives <= 0){

    setTimeout(
      showGameOver,
      300
    );

  }

}


function updateLives(){

  gameLives.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3-lives);

}


function updateGameStats(){

  gameCoins.textContent =
    coins;

  save();

}


/* =====================================================
   FINISH
   ===================================================== */

function finishStage(){

  score += 10;

  coins += 5;

  if(
    selectedStage === unlockedStage &&
    unlockedStage < stages.length
  ){

    unlockedStage++;

  }

  save();

  if(
    selectedStage <
    stages.length
  ){

    showModal(
      "Əla! 🎉",
      `Mərhələ ${selectedStage} tamamlandı.<br>
       5 sikkə qazandın.<br>
       Növbəti mərhələ açıldı.`,
      "Növbəti mərhələ",
      "next"
    );

  }else{

    showModal(
      "Təbriklər! 🎉",
      `Bütün ${stages.length} mərhələni tamamladın.`,
      "1-ci mərhələ",
      "restart"
    );

  }

}


/* =====================================================
   GAME OVER
   ===================================================== */

function showGameOver(){

  gameOver = true;

  showModal(
    "Canlar bitdi ❤️",
    "Bu mərhələni yenidən sınaya bilərsən.",
    "Yenidən cəhd et",
    "retry"
  );

}


/* =====================================================
   MODAL
   ===================================================== */

function showModal(
  title,
  text,
  buttonText,
  actionType
){

  modalTitle.textContent =
    title;

  modalText.innerHTML =
    text;

  modalAction.textContent =
    buttonText;

  modalActionType =
    actionType;

  modal.classList.add(
    "show"
  );

}


modalAction.onclick =
function(){

  modal.classList.remove(
    "show"
  );

  if(
    modalActionType ===
    "next"
  ){

    selectedStage++;

    save();

    startGame(
      selectedStage
    );

  }

  else if(
    modalActionType ===
    "retry"
  ){

    startGame(
      selectedStage
    );

  }

  else if(
    modalActionType ===
    "restart"
  ){

    selectedStage = 1;

    save();

    startGame(1);

  }

};


/* =====================================================
   CLEAR
   ===================================================== */

clearBtn.onclick =
function(){

  clearCurrentWord();

};


/* =====================================================
   SHUFFLE
   ===================================================== */

shuffleBtn.onclick =
function(){

  shuffleArray(
    currentLetters
  );

  clearCurrentWord();

  renderLetters();

};


function shuffleArray(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


/* =====================================================
   HINT
   ===================================================== */

hintBtn.onclick =
function(){

  if(coins < 10){

    message.textContent =
      "İpucu üçün 10 sikkə lazımdır.";

    message.className =
      "message wrong";

    return;

  }

  const remaining =
    getAnswers().filter(
      word =>
        !foundWords.includes(word)
    );

  if(!remaining.length)
    return;

  coins -= 10;

  gameCoins.textContent =
    coins;

  save();

  message.textContent =
    `İpucu: ${remaining[0].charAt(0)}...`;

  message.className =
    "message";

};


/* =====================================================
   MUSIC
   ===================================================== */

async function startMusic(){

  try{

    await music.play();

    musicBtn.textContent =
      "🔊";

  }catch(err){

    musicBtn.textContent =
      "🔇";

  }

}


musicBtn.onclick =
async function(){

  if(music.paused){

    try{

      await music.play();

      musicBtn.textContent =
        "🔊";

    }catch(err){

      musicBtn.textContent =
        "🔇";

    }

  }else{

    music.pause();

    musicBtn.textContent =
      "🔇";

  }

};


/* =====================================================
   SOUNDS
   ===================================================== */

function playCorrectSound(){

  try{

    const ctx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value =
      720;

    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .18,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + .22
    );

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    osc.stop(
      ctx.currentTime + .23
    );

  }catch(err){}

}


function playWrongSound(){

  try{

    const ctx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value =
      180;

    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .13,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + .18
    );

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    osc.stop(
      ctx.currentTime + .19
    );

  }catch(err){}

}


/* =====================================================
   INIT
   ===================================================== */

setMode(mode);

updateHome();

renderStages();

</script>

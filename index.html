<!DOCTYPE html>
<html lang="az" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172033">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,"Noto Sans",sans-serif;
  background:
    radial-gradient(circle at top,#354866 0,#182236 42%,#0d1422 100%);
  color:#fff;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.hidden{
  display:none!important;
}

/* HOME */

#home{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.home-card{
  width:min(440px,100%);
  padding:26px 18px;
  border-radius:30px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(0,0,0,.35);
  text-align:center;
}

.logo{
  font-size:45px;
  font-weight:900;
  margin-bottom:4px;
}

.subtitle{
  opacity:.75;
  margin-bottom:22px;
}

.mode-title{
  font-size:14px;
  opacity:.7;
  margin-bottom:10px;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode-btn,
.start-btn{
  border:0;
  color:#fff;
  border-radius:17px;
  padding:14px;
  font-weight:800;
  cursor:pointer;
}

.mode-btn{
  background:rgba(255,255,255,.1);
}

.mode-btn.active{
  background:linear-gradient(135deg,#bd8737,#dfb05e);
}

.start-btn{
  width:100%;
  margin-top:15px;
  background:linear-gradient(135deg,#bd8737,#dfb05e);
  font-size:17px;
}

/* STAGE SELECT */

.stage-title{
  margin-top:24px;
  margin-bottom:10px;
  font-weight:800;
}

.stage-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.stage-btn{
  height:50px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  font-weight:900;
}

.stage-btn.unlocked{
  background:rgba(211,164,75,.22);
}

.stage-btn.current{
  background:linear-gradient(135deg,#bd8737,#dfb05e);
}

.stage-btn.locked{
  opacity:.35;
}

.home-info{
  margin-top:18px;
  font-size:13px;
  opacity:.65;
}

/* GAME */

#game{
  min-height:100vh;
  padding:12px;
}

.game-shell{
  width:min(520px,100%);
  margin:auto;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:7px;
  align-items:center;
  margin-bottom:10px;
}

.top-box{
  min-height:46px;
  border-radius:15px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.11);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-weight:800;
}

.top-box:first-child{
  justify-content:flex-start;
  padding-left:12px;
}

.top-box:last-child{
  justify-content:flex-end;
  padding-right:4px;
}

.small-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:rgba(255,255,255,.1);
}

.stage-title-game{
  text-align:center;
  padding:12px;
  margin-bottom:10px;
  border-radius:19px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  font-weight:900;
  font-size:18px;
}

/* ANSWERS */

.answers-card{
  padding:12px;
  border-radius:21px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  margin-bottom:11px;
}

.answers{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  min-height:37px;
}

.answer{
  min-width:60px;
  padding:8px 10px;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.4);
  font-size:15px;
  font-weight:800;
  text-align:center;
}

.answer.found{
  color:#fff;
  background:rgba(211,164,75,.28);
  border:1px solid rgba(232,190,105,.5);
}

.current-word{
  height:45px;
  margin-top:9px;
  border-radius:15px;
  background:rgba(0,0,0,.18);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

/* LETTERS */

.letters-card{
  padding:17px 11px;
  border-radius:27px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.11);
  touch-action:none;
}

.letters{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:11px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letter{
  width:62px;
  height:62px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:900;
  color:#fff;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.2),
      rgba(255,255,255,.06)
    );
  border:1px solid rgba(255,255,255,.2);
  box-shadow:
    0 8px 20px rgba(0,0,0,.2),
    inset 0 1px rgba(255,255,255,.2);
  touch-action:none;
}

.letter.selected{
  transform:translateY(-5px) scale(1.05);
  background:linear-gradient(145deg,#d2a34f,#9d6e25);
}

.letter.wrong{
  animation:shake .35s;
}

.letter.correct{
  animation:pop .35s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

@keyframes pop{
  50%{transform:scale(1.15)}
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:11px;
}

.control{
  min-height:47px;
  border:0;
  border-radius:15px;
  color:#fff;
  background:rgba(255,255,255,.1);
  font-weight:800;
}

.control.primary{
  background:linear-gradient(135deg,#bd8737,#dfb05e);
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  margin-top:10px;
  padding:9px 11px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
}

.lives{
  letter-spacing:2px;
}

.hint{
  border:0;
  color:#fff;
  background:rgba(255,255,255,.1);
  border-radius:12px;
  padding:8px 11px;
  font-weight:800;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(3,7,14,.75);
  backdrop-filter:blur(8px);
}

.modal-card{
  width:min(380px,100%);
  padding:27px 20px;
  border-radius:27px;
  background:#1d283b;
  border:1px solid rgba(255,255,255,.15);
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.modal-title{
  font-size:28px;
  font-weight:900;
}

.modal-text{
  margin-top:8px;
  opacity:.75;
  line-height:1.7;
}

.modal-buttons{
  display:grid;
  gap:8px;
  margin-top:19px;
}

.modal-buttons button{
  border:0;
  border-radius:15px;
  padding:13px;
  color:#fff;
  background:rgba(255,255,255,.1);
  font-weight:800;
}

.modal-buttons .primary{
  background:linear-gradient(135deg,#bd8737,#dfb05e);
}

@media(max-width:380px){

  .letter{
    width:55px;
    height:55px;
    font-size:25px;
    border-radius:17px;
  }

  .letters{
    gap:8px;
  }

  .stage-grid{
    gap:5px;
  }

  .stage-btn{
    height:46px;
  }

  .logo{
    font-size:40px;
  }
}
</style>
</head>

<body>

<!-- HOME -->

<section id="home">

  <div class="home-card">

    <div class="logo">حیدربابا</div>

    <div class="subtitle">
      Azərbaycan söz oyunu
    </div>

    <div class="mode-title">
      Əlifba seç
    </div>

    <div class="mode-buttons">

      <button class="mode-btn active" id="latinMode">
        🇮🇷 Latin
      </button>

      <button class="mode-btn" id="arabicMode">
        🇮🇷 Ərəb
      </button>

    </div>

    <div class="stage-title">
      Mərhələ seç
    </div>

    <div id="stageGrid" class="stage-grid"></div>

    <button class="start-btn" id="startBtn">
      Oyuna başla
    </button>

    <div class="home-info">
      🔓 Açıq mərhələ: <span id="unlockedText">1</span>
      &nbsp; | &nbsp;
      🪙 <span id="homeCoins">0</span>
    </div>

  </div>

</section>


<!-- GAME -->

<section id="game" class="hidden">

  <div class="game-shell">

    <div class="topbar">

      <div class="top-box">
        🪙 <span id="coinTop">0</span>
      </div>

      <div class="top-box">
        Mərhələ <span id="stageTop">1</span>
      </div>

      <div class="top-box">
        <button class="small-btn" id="musicBtn">🔊</button>
      </div>

    </div>

    <div class="stage-title-game">
      حیدربابا
    </div>

    <div class="answers-card">

      <div id="answers" class="answers"></div>

      <div id="currentWord" class="current-word"></div>

    </div>

    <div class="letters-card">

      <div id="letters" class="letters"></div>

    </div>

    <div class="controls">

      <button class="control" id="clearBtn">
        Təmizlə
      </button>

      <button class="control primary" id="submitBtn">
        Yoxla
      </button>

      <button class="control" id="shuffleBtn">
        Qarışdır
      </button>

    </div>

    <div class="status">

      <div class="lives" id="lives">
        ❤️❤️❤️
      </div>

      <div>
        🪙 <span id="coinBottom">0</span>
      </div>

      <button class="hint" id="hintBtn">
        💡 İpucu
      </button>

    </div>

  </div>

</section>


<!-- MODAL -->

<div id="modal" class="modal hidden">

  <div class="modal-card">

    <div id="modalTitle" class="modal-title">
      Təbriklər! 🎉
    </div>

    <div id="modalText" class="modal-text"></div>

    <div class="modal-buttons">

      <button class="primary" id="nextBtn">
        Növbəti mərhələ
      </button>

      <button id="restartBtn">
        Yenidən oyna
      </button>

      <button id="homeBtn">
        Əsas menyu
      </button>

    </div>

  </div>

</div>


<!-- MUSIC -->

<audio
  id="music"
  preload="auto"
  loop
  playsinline
  src="ays%C9%99l.mp3">
</audio>


<script>

/* =====================================================
   STAGES
   ===================================================== */

const stages = [

  {
    latinLetters:["a","t","a","n"],
    arabicLetters:["ا","ت","ا","ن"],
    latinAnswers:["ata","ana","an"],
    arabicAnswers:["اتا","انا","ان"]
  },

  {
    latinLetters:["a","l","s"],
    arabicLetters:["ا","ل","س"],
    latinAnswers:["al","sal","as"],
    arabicAnswers:["ال","سال","اس"]
  },

  {
    latinLetters:["g","ü","n","ə","ş"],
    arabicLetters:["گ","و","ن","ش","ا"],
    latinAnswers:["gün","günəş","şən"],
    arabicAnswers:["گون","گونش","شن"]
  },

  {
    latinLetters:["ç","ö","r","ə","k"],
    arabicLetters:["چ","و","ر","ک"],
    latinAnswers:["çörək","kör"],
    arabicAnswers:["چورک","کور"]
  },

  {
    latinLetters:["g","ü","l","ə"],
    arabicLetters:["گ","و","ل","ا"],
    latinAnswers:["gül","gəl","əl"],
    arabicAnswers:["گول","گل","ال"]
  },

  {
    latinLetters:["a","ğ","a","c"],
    arabicLetters:["ا","غ","ا","ج"],
    latinAnswers:["ağac","ağ","ac"],
    arabicAnswers:["اغاج","اغ","اج"]
  },

  {
    latinLetters:["g","ö","z"],
    arabicLetters:["گ","و","ز"],
    latinAnswers:["göz","öz"],
    arabicAnswers:["گوز","اوز"]
  },

  {
    latinLetters:["q","a","r","a"],
    arabicLetters:["ق","ا","ر","ا"],
    latinAnswers:["qar","qara","ara"],
    arabicAnswers:["قار","قارا","ارا"]
  },

  {
    latinLetters:["d","a","ş"],
    arabicLetters:["د","ا","ش"],
    latinAnswers:["daş","aş"],
    arabicAnswers:["داش","اش"]
  },

  {
    latinLetters:["s","e","v","i"],
    arabicLetters:["س","ئ","و","ی"],
    latinAnswers:["sev","sevi"],
    arabicAnswers:["سئو","سئوی"]
  }

];


/* =====================================================
   SAVED DATA
   ===================================================== */

let mode =
  localStorage.getItem("mode") || "latin";

/*
  unlockedStage = تعداد مراحلی که باز شده.
  حداقل همیشه مرحله 1 باز است.
*/

let unlockedStage =
  Math.max(
    1,
    Number(
      localStorage.getItem("unlockedStage") || 1
    )
  );

let selectedStage =
  Math.min(
    unlockedStage - 1,
    Number(
      localStorage.getItem("selectedStage") || 0
    )
  );

let coins =
  Number(localStorage.getItem("coins") || 0);

let score =
  Number(localStorage.getItem("score") || 0);

let lives = 3;

let selected = [];

let found = [];

let dragging = false;


/* =====================================================
   ELEMENTS
   ===================================================== */

const home =
  document.getElementById("home");

const game =
  document.getElementById("game");

const stageGrid =
  document.getElementById("stageGrid");

const unlockedText =
  document.getElementById("unlockedText");

const homeCoins =
  document.getElementById("homeCoins");

const startBtn =
  document.getElementById("startBtn");

const latinMode =
  document.getElementById("latinMode");

const arabicMode =
  document.getElementById("arabicMode");

const lettersEl =
  document.getElementById("letters");

const answersEl =
  document.getElementById("answers");

const currentWordEl =
  document.getElementById("currentWord");

const coinTop =
  document.getElementById("coinTop");

const coinBottom =
  document.getElementById("coinBottom");

const stageTop =
  document.getElementById("stageTop");

const livesEl =
  document.getElementById("lives");

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

const clearBtn =
  document.getElementById("clearBtn");

const submitBtn =
  document.getElementById("submitBtn");

const shuffleBtn =
  document.getElementById("shuffleBtn");

const hintBtn =
  document.getElementById("hintBtn");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const nextBtn =
  document.getElementById("nextBtn");

const restartBtn =
  document.getElementById("restartBtn");

const homeBtn =
  document.getElementById("homeBtn");


/* =====================================================
   SAVE
   ===================================================== */

function save(){

  localStorage.setItem(
    "mode",
    mode
  );

  localStorage.setItem(
    "unlockedStage",
    unlockedStage
  );

  localStorage.setItem(
    "selectedStage",
    selectedStage
  );

  localStorage.setItem(
    "coins",
    coins
  );

  localStorage.setItem(
    "score",
    score
  );

}


/* =====================================================
   MODE
   ===================================================== */

function setMode(newMode){

  mode = newMode;

  latinMode.classList.toggle(
    "active",
    mode === "latin"
  );

  arabicMode.classList.toggle(
    "active",
    mode === "arabic"
  );

  document.documentElement.dir =
    mode === "arabic"
      ? "rtl"
      : "ltr";

  save();

  if(!game.classList.contains("hidden")){
    loadStage();
  }

}

latinMode.addEventListener(
  "click",
  ()=>setMode("latin")
);

arabicMode.addEventListener(
  "click",
  ()=>setMode("arabic")
);


/* =====================================================
   STAGE SELECT
   ===================================================== */

function renderStageButtons(){

  stageGrid.innerHTML = "";

  for(
    let i = 0;
    i < stages.length;
    i++
  ){

    const button =
      document.createElement("button");

    button.className =
      "stage-btn";

    if(i < unlockedStage){
      button.classList.add("unlocked");
    }else{
      button.classList.add("locked");
    }

    if(i === selectedStage){
      button.classList.add("current");
    }

    if(i < unlockedStage){

      button.textContent =
        i + 1;

      button.addEventListener(
        "click",
        ()=>{
          selectedStage = i;
          save();
          renderStageButtons();
        }
      );

    }else{

      button.textContent = "🔒";

    }

    stageGrid.appendChild(button);

  }

  unlockedText.textContent =
    unlockedStage;

  homeCoins.textContent =
    coins;

}


function updateStatus(){

  coinTop.textContent =
    coins;

  coinBottom.textContent =
    coins;

  stageTop.textContent =
    selectedStage + 1;

  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3-lives);

}


/* =====================================================
   GET DATA
   ===================================================== */

function getLetters(){

  return mode === "latin"
    ? stages[selectedStage].latinLetters
    : stages[selectedStage].arabicLetters;

}

function getAnswers(){

  return mode === "latin"
    ? stages[selectedStage].latinAnswers
    : stages[selectedStage].arabicAnswers;

}


/* =====================================================
   RENDER ANSWERS
   ===================================================== */

function renderAnswers(){

  answersEl.innerHTML = "";

  getAnswers().forEach(
    word=>{

      const div =
        document.createElement("div");

      div.className =
        "answer";

      if(found.includes(word)){
        div.classList.add("found");
      }

      div.textContent =
        word;

      answersEl.appendChild(div);

    }
  );

}


/* =====================================================
   RENDER LETTERS
   ===================================================== */

function renderLetters(){

  lettersEl.innerHTML = "";

  getLetters().forEach(
    (letter,index)=>{

      const div =
        document.createElement("div");

      div.className =
        "letter";

      div.textContent =
        letter;

      div.dataset.index =
        index;

      div.dataset.letter =
        letter;

      lettersEl.appendChild(div);

    }
  );

}


/* =====================================================
   LOAD STAGE
   ===================================================== */

function loadStage(){

  lives = 3;

  selected = [];

  found = [];

  renderLetters();

  renderAnswers();

  currentWordEl.textContent = "";

  updateStatus();

  save();

}


/* =====================================================
   CURRENT WORD
   ===================================================== */

function currentWord(){

  return selected
    .map(
      index =>
        lettersEl.children[index]
          ?.dataset.letter || ""
    )
    .join("");

}


/* =====================================================
   CLEAR
   ===================================================== */

function clearSelection(){

  selected = [];

  [...lettersEl.children]
    .forEach(
      el =>
        el.classList.remove("selected")
    );

  currentWordEl.textContent = "";

}


/* =====================================================
   SELECT LETTER
   ===================================================== */

function selectLetter(el){

  if(!el){
    return;
  }

  const index =
    Number(el.dataset.index);

  if(
    selected.includes(index)
  ){
    return;
  }

  selected.push(index);

  el.classList.add("selected");

  currentWordEl.textContent =
    currentWord();

}


/* =====================================================
   PHONE DRAG
   ===================================================== */

lettersEl.addEventListener(
  "pointerdown",
  function(e){

    const letter =
      e.target.closest(".letter");

    if(!letter){
      return;
    }

    e.preventDefault();

    dragging = true;

    try{
      lettersEl.setPointerCapture(
        e.pointerId
      );
    }catch(err){}

    clearSelection();

    selectLetter(letter);

  },
  {passive:false}
);


lettersEl.addEventListener(
  "pointermove",
  function(e){

    if(!dragging){
      return;
    }

    e.preventDefault();

    const element =
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    if(!element){
      return;
    }

    const letter =
      element.closest(".letter");

    if(
      letter &&
      lettersEl.contains(letter)
    ){
      selectLetter(letter);
    }

  },
  {passive:false}
);


function stopDragging(){

  dragging = false;

}

lettersEl.addEventListener(
  "pointerup",
  stopDragging
);

lettersEl.addEventListener(
  "pointercancel",
  stopDragging
);

document.addEventListener(
  "touchmove",
  function(e){

    if(dragging){
      e.preventDefault();
    }

  },
  {passive:false}
);


/* =====================================================
   AUDIO
   ===================================================== */

let audioContext = null;

function playTone(type){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.frequency.value =
      type === "correct"
        ? 660
        : 170;

    gain.gain.value = .05;

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .18
    );

    osc.stop(
      audioContext.currentTime + .18
    );

  }catch(e){}

}


/* =====================================================
   MUSIC
   ===================================================== */

function startMusic(){

  music.volume = .32;

  music.play()
    .then(()=>{
      musicBtn.textContent =
        "🔊";
    })
    .catch(()=>{
      musicBtn.textContent =
        "🔇";
    });

}

function toggleMusic(){

  if(music.paused){

    startMusic();

  }else{

    music.pause();

    musicBtn.textContent =
      "🔇";

  }

}

musicBtn.addEventListener(
  "click",
  toggleMusic
);


/* =====================================================
   SUBMIT
   ===================================================== */

function submitWord(){

  const word =
    currentWord();

  if(!word){
    return;
  }

  const answers =
    getAnswers();

  if(
    answers.includes(word) &&
    !found.includes(word)
  ){

    found.push(word);

    score +=
      word.length;

    coins += 2;

    playTone("correct");

    selected.forEach(
      index=>{

        const el =
          lettersEl.children[index];

        if(el){
          el.classList.add(
            "correct"
          );
        }

      }
    );

    renderAnswers();

    clearSelection();

    save();

    updateStatus();

    if(
      found.length ===
      answers.length
    ){

      setTimeout(
        finishStage,
        400
      );

    }

    return;

  }


  lives--;

  playTone("wrong");

  selected.forEach(
    index=>{

      const el =
        lettersEl.children[index];

      if(el){
        el.classList.add("wrong");
      }

    }
  );

  clearSelection();

  updateStatus();

  if(lives <= 0){

    setTimeout(
      gameOver,
      350
    );

  }

}


/* =====================================================
   SHUFFLE
   ===================================================== */

function shuffle(){

  const children =
    [...lettersEl.children];

  children.sort(
    ()=>Math.random()-.5
  );

  children.forEach(
    child =>
      lettersEl.appendChild(child)
  );

  clearSelection();

}


/* =====================================================
   HINT
   ===================================================== */

function hint(){

  if(coins < 10){

    alert(
      "İpucu üçün 10 sikkə lazımdır."
    );

    return;
  }

  const remaining =
    getAnswers().filter(
      word =>
        !found.includes(word)
    );

  if(!remaining.length){
    return;
  }

  coins -= 10;

  const word =
    remaining[0];

  const index =
    getAnswers().indexOf(word);

  const el =
    answersEl.children[index];

  if(el){

    el.style.boxShadow =
      "0 0 0 2px rgba(232,190,105,.8)";

    setTimeout(
      ()=>{
        el.style.boxShadow = "";
      },
      1500
    );

  }

  save();

  updateStatus();

}


/* =====================================================
   FINISH STAGE
   ===================================================== */

function finishStage(){

  score += 10;

  coins += 5;

  /*
    مرحله بعد را باز می‌کنیم.
  */

  if(
    selectedStage + 1 >=
    unlockedStage &&
    unlockedStage < stages.length
  ){

    unlockedStage =
      selectedStage + 2;

  }

  save();

  renderStageButtons();

  updateStatus();

  if(
    selectedStage >=
    stages.length - 1
  ){

    modalTitle.textContent =
      "تبریک! 🎉";

    modalText.textContent =
      "همه مراحل فعلی را تمام کردی.";

    nextBtn.textContent =
      "از مرحله اول";

  }else{

    modalTitle.textContent =
      "Təbriklər! 🎉";

    modalText.textContent =
      `Mərhələ ${selectedStage + 1} tamamlandı. +5 🪙`;

    nextBtn.textContent =
      "Növbəti mərhələ";

  }

  modal.classList.remove(
    "hidden"
  );

}


/* =====================================================
   NEXT
   ===================================================== */

nextBtn.addEventListener(
  "click",
  function(){

    modal.classList.add(
      "hidden"
    );

    if(
      selectedStage >=
      stages.length - 1
    ){

      selectedStage = 0;

    }else{

      selectedStage++;

    }

    save();

    loadStage();

  }
);


/* =====================================================
   RESTART
   ===================================================== */

restartBtn.addEventListener(
  "click",
  function(){

    modal.classList.add(
      "hidden"
    );

    loadStage();

  }
);


/* =====================================================
   HOME
   ===================================================== */

homeBtn.addEventListener(
  "click",
  function(){

    modal.classList.add(
      "hidden"
    );

    game.classList.add(
      "hidden"
    );

    home.classList.remove(
      "hidden"
    );

    renderStageButtons();

  }
);


/* =====================================================
   GAME OVER
   ===================================================== */

function gameOver(){

  modalTitle.textContent =
    "جان‌ها تمام شد ❤️‍🩹";

  modalText.textContent =
    "این مرحله را دوباره امتحان کن.";

  nextBtn.textContent =
    "دوباره تلاش کن";

  modal.classList.remove(
    "hidden"
  );

}


/* =====================================================
   BUTTONS
   ===================================================== */

clearBtn.addEventListener(
  "click",
  clearSelection
);

submitBtn.addEventListener(
  "click",
  submitWord
);

shuffleBtn.addEventListener(
  "click",
  shuffle
);

hintBtn.addEventListener(
  "click",
  hint
);


/* =====================================================
   START
   ===================================================== */

startBtn.addEventListener(
  "click",
  function(){

    home.classList.add(
      "hidden"
    );

    game.classList.remove(
      "hidden"
    );

    loadStage();

    startMusic();

  }
);


/* =====================================================
   INITIAL
   ===================================================== */

setMode(mode);

renderStageButtons();

updateStatus();

</script>

</body>
</html>

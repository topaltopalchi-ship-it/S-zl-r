<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>حیدربابا</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#07111f;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  direction:rtl;
}

body::before,
body::after{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(70px);
  opacity:.22;
  z-index:-2;
}

body::before{
  top:-80px;
  left:-80px;
  background:#e5a93f;
}

body::after{
  right:-100px;
  bottom:-80px;
  background:#3979d8;
}

button{
  font:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:16px 14px 30px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
  animation:screenIn .45s ease both;
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.985);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:8px 0 18px;
  text-shadow:0 4px 20px rgba(0,0,0,.45);
}

.glass{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.14),
    rgba(255,255,255,.035)
  );
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  box-shadow:
    0 25px 60px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
}

.home-card{
  padding:20px;
}

.mode-title{
  text-align:center;
  margin-bottom:12px;
  opacity:.82;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode-btn{
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:14px;
  color:#fff;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.11),
    rgba(255,255,255,.045)
  );
  font-weight:800;
}

.mode-btn:active{
  transform:scale(.95);
}

.mode-btn.selected{
  background:linear-gradient(
    145deg,
    rgba(226,173,78,.62),
    rgba(170,105,20,.32)
  );
  border-color:#efbd5a;
}

.start-btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:20px;
  color:#fff;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(135deg,#efbd58,#b97618);
}

.start-btn:active{
  transform:scale(.97);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  text-align:center;
  padding:10px 5px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
}

.stat small{
  display:block;
  opacity:.6;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:18px;
}

.stage-title{
  text-align:center;
  font-weight:900;
  margin:22px 0 12px;
}

.stage-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.stage-btn{
  position:relative;
  min-height:118px;
  padding:0;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  background:#172536;
  color:#fff;
  font-weight:900;
  box-shadow:0 10px 22px rgba(0,0,0,.24);
}
.stage-btn .stage-photo{
  display:block;
  width:100%;
  height:118px;
  object-fit:cover;
  transition:filter .25s ease,transform .25s ease;
}
.stage-btn .stage-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.72));
}
.stage-btn .stage-number{
  position:absolute;
  top:7px;
  right:7px;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#1b8b45;
  border:2px solid rgba(255,255,255,.9);
  font-size:14px;
  z-index:2;
}
.stage-btn .stage-name{
  position:absolute;
  right:5px;
  left:5px;
  bottom:7px;
  padding:5px 4px;
  border-radius:10px;
  background:rgba(0,0,0,.48);
  font-size:10px;
  line-height:1.25;
  z-index:2;
}
.stage-btn .stage-status{
  position:absolute;
  left:7px;
  top:7px;
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#159447;
  font-size:15px;
  z-index:2;
}
.stage-btn.current{
  border:2px solid #efbd5a;
  box-shadow:0 0 18px rgba(235,177,70,.34),0 10px 24px rgba(0,0,0,.28);
}
.stage-btn.current .stage-number{
  background:#b97618;
}
.stage-btn.locked{
  opacity:.92;
  cursor:not-allowed;
}
.stage-btn.locked .stage-photo{
  filter:grayscale(1) brightness(.55);
}
.stage-btn.locked .stage-shade{
  background:rgba(0,0,0,.34);
}
.stage-btn.locked .stage-number{
  background:#424b55;
}
.stage-btn.locked .stage-status{
  background:rgba(25,30,35,.92);
  border:1px solid rgba(255,255,255,.55);
}
.stage-btn:not(.locked):active{
  transform:scale(.96);
}
.stage-btn.unlock-pop{animation:stageUnlockPop .9s ease both;border-color:#ffd978;}
.treasure-card{margin-top:14px;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(239,189,88,.28);text-align:right;}.treasure-card img{display:block;width:100%;height:145px;object-fit:cover;}.treasure-body{padding:12px 13px 13px;}.treasure-kicker{font-size:11px;color:#efbd58;font-weight:900;margin-bottom:4px;}.treasure-title{font-size:18px;font-weight:900;margin-bottom:6px;}.treasure-text{font-size:13px;line-height:1.8;opacity:.82;}.treasure-stars{margin-top:8px;font-size:20px;letter-spacing:2px;}
@keyframes stageUnlockPop{0%{transform:scale(.82);opacity:.35;}55%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);opacity:1;}}
.stage-stars{position:absolute;right:5px;left:5px;bottom:38px;z-index:3;font-size:12px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.8);}
@media(max-width:360px){
  .stage-grid{gap:6px;}
  .stage-btn,.stage-btn .stage-photo{min-height:105px;height:105px;}
  .stage-btn .stage-name{font-size:9px;}
}

.stage-btn.current{
  border:2px solid #efbd5a;
  box-shadow:0 0 18px rgba(235,177,70,.22);
}

.stage-btn.locked{
  opacity:.28;
  cursor:not-allowed;
}

.stage-btn:not(.locked):active{
  transform:scale(.94);
}

.stage-info{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  opacity:.65;
}

.game-top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.top-box{
  text-align:center;
  padding:10px 4px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
}

.top-box small{
  display:block;
  opacity:.55;
  font-size:10px;
}

.top-box strong{
  display:block;
  margin-top:3px;
}

.game-card{
  padding:16px;
}

.word-slots{
  min-height:78px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.answer-word{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  direction:ltr;
  flex-direction:row;
  unicode-bidi:isolate;
}

.answer-word.arabic{
  direction:ltr;
  flex-direction:row-reverse;
}

.answer-slot{
  width:36px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  font-size:20px;
  font-weight:900;
}

.answer-slot.found{
  background:linear-gradient(
    145deg,
    rgba(74,190,118,.48),
    rgba(40,125,75,.22)
  );
  border-color:rgba(110,230,150,.70);
}

.current-word{
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:5px 0 14px;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  direction:ltr;
  unicode-bidi:isolate;
}

.letters-area{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  direction:ltr;
}

.letter{
  aspect-ratio:1;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:22px;
  color:#fff;
  font-size:25px;
  font-weight:900;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.18),
    rgba(255,255,255,.055)
  );
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    0 9px 20px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.10);
  touch-action:none;
}

.letter.selected{
  transform:scale(.88) translateY(-2px);
  background:linear-gradient(
    145deg,
    rgba(236,181,72,.90),
    rgba(178,112,20,.68)
  );
  border-color:#ffd978;
}

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.action-btn{
  border:0;
  border-radius:19px;
  padding:14px 5px;
  color:#fff;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.10),
    rgba(255,255,255,.045)
  );
  font-weight:900;
}

.action-btn:active{
  transform:scale(.94);
}

.check-btn{
  background:linear-gradient(135deg,#efbd58,#b97618);
}

.hint-btn{
  background:rgba(214,155,50,.22);
}

.exit-btn{
  background:linear-gradient(
    145deg,
    rgba(180,70,70,.45),
    rgba(110,35,35,.30)
  );
  border:1px solid rgba(255,150,150,.20);
}

.message{
  min-height:28px;
  margin-top:12px;
  text-align:center;
  font-weight:800;
}

.meanings-panel{
  margin-top:16px;
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
}
.meanings-title{
  margin:0 0 10px;
  text-align:center;
  color:#efbd58;
  font-size:16px;
}
.meanings-list{
  display:grid;
  gap:8px;
}
.meaning-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:9px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.055);
}
.meaning-word{
  font-weight:900;
  direction:auto;
}
.meaning-text{
  opacity:.86;
  text-align:left;
  font-size:14px;
}

.correct{
  color:#9cf0b9;
}

.wrong{
  color:#ffaaa0;
}

.shake{
  animation:shake .38s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(4px)}
}

.music-btn{
  position:fixed;
  right:14px;
  bottom:14px;
  width:50px;
  height:50px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:rgba(255,255,255,.10);
  color:#fff;
  font-size:20px;
  z-index:20;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.68);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:390px;
  padding:25px;
  text-align:center;
  border-radius:28px;
  background:linear-gradient(
    145deg,
    #20384d,
    #122333
  );
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.modal-card h2{
  margin-top:0;
}

.modal-card p{
  line-height:1.8;
  opacity:.8;
}

.modal-card button{
  width:100%;
  border:0;
  border-radius:17px;
  padding:14px;
  margin-top:8px;
  color:#fff;
  background:linear-gradient(135deg,#e0a53d,#b87818);
  font-weight:900;
}

.modal-secondary{
  background:rgba(255,255,255,.09)!important;
}


.round2-gallery{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:14px 0 6px;
}
.round2-gallery figure{
  margin:0;
  overflow:hidden;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
}
.round2-gallery figure:first-child{
  grid-column:1 / -1;
}
.round2-gallery img{
  display:block;
  width:100%;
  height:120px;
  object-fit:cover;
}
.round2-gallery figure:first-child img{
  height:150px;
}
.round2-gallery figcaption{
  padding:7px 8px;
  font-size:11px;
  text-align:center;
  opacity:.82;
}
.round2-badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(239,189,88,.18);
  border:1px solid rgba(239,189,88,.35);
  color:#efbd58;
  font-weight:900;
  margin-bottom:8px;
}

@media(max-width:360px){

  .letter{
    font-size:21px;
    border-radius:17px;
  }

  .answer-slot{
    width:32px;
    height:39px;
    font-size:18px;
  }

}


.cover-wrap{display:flex;justify-content:center;margin:0 auto 16px;}
.cover-image{display:block;width:min(180px,48vw);height:min(180px,48vw);object-fit:cover;border-radius:28px;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 45px rgba(0,0,0,.38);}
.cover-small{margin-bottom:10px;}.cover-small .cover-image{width:92px;height:92px;border-radius:20px;}

.album-btn{width:100%;margin-top:10px;padding:13px;border:1px solid rgba(239,189,88,.35);border-radius:14px;background:rgba(239,189,88,.08);color:#fff;font-weight:900;font-size:14px;cursor:pointer}.album-screen{padding:18px 12px 30px}.album-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.album-back{border:0;border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;cursor:pointer}.album-title{text-align:center;font-size:26px;font-weight:1000;flex:1}.album-progress{text-align:center;opacity:.72;font-size:12px;margin-bottom:14px}.album-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.album-item{position:relative;overflow:hidden;border-radius:17px;min-height:180px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.album-item img{width:100%;height:180px;object-fit:cover;display:block}.album-item.locked img{filter:grayscale(1) brightness(.38)}.album-lock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30px;background:rgba(0,0,0,.22)}.album-item.locked .album-lock{display:flex}.album-caption{position:absolute;bottom:0;right:0;left:0;padding:24px 9px 8px;background:linear-gradient(transparent,rgba(0,0,0,.9));font-size:12px;font-weight:900}.album-stars{display:block;margin-top:3px;font-size:11px}
.album-badges{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 14px}.album-badge{padding:9px 4px;text-align:center;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);opacity:.42;filter:grayscale(1);transition:.25s}.album-badge.unlocked{opacity:1;filter:none;border-color:rgba(239,189,88,.45);background:linear-gradient(145deg,rgba(239,189,88,.16),rgba(255,255,255,.05));box-shadow:0 8px 18px rgba(0,0,0,.18)}.album-badge-icon{font-size:22px;display:block}.album-badge-title{display:block;margin-top:3px;font-size:10px;font-weight:900}.album-badge-count{display:block;margin-top:2px;font-size:9px;opacity:.65}
.badge-pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.62);z-index:150}.badge-pop.show{display:flex;animation:screenIn .28s ease both}.badge-pop-card{width:min(340px,92vw);padding:26px 20px;text-align:center;border-radius:28px;background:linear-gradient(145deg,#243d52,#102232);border:1px solid rgba(239,189,88,.45);box-shadow:0 25px 80px rgba(0,0,0,.58),0 0 35px rgba(239,189,88,.18)}.badge-pop-icon{font-size:64px;display:block;animation:badgeBounce .75s ease both}.badge-pop-kicker{color:#efbd58;font-weight:900;font-size:13px;margin-top:5px}.badge-pop-title{font-size:24px;font-weight:1000;margin:7px 0}.badge-pop-text{font-size:13px;line-height:1.8;opacity:.78}.badge-pop-close{margin-top:14px;width:100%;padding:12px;border:0;border-radius:15px;color:#fff;background:linear-gradient(135deg,#efbd58,#b97618);font-weight:900}@keyframes badgeBounce{0%{transform:scale(.45) rotate(-12deg);opacity:0}55%{transform:scale(1.16) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0)}}

</style>
</head>

<body>

<audio id="music" loop preload="auto">
  <source src="./aysəl.mp3" type="audio/mpeg">
</audio>

<div class="app">

<!-- ================= HOME ================= -->

<section id="homeScreen" class="screen active">

  <div class="logo">حیدربابا</div>

  <div class="cover-wrap"><img class="cover-image" src="./cover.png" alt="حیدربابا"></div>

  <div class="glass home-card">

    <div class="mode-title">
      الفبا را انتخاب کنید
    </div>

    <div class="mode-buttons">

      <button id="latinBtn" class="mode-btn selected">
        🇦🇿 لاتین
      </button>

      <button id="arabicBtn" class="mode-btn">
        🇮🇷 فارسی
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <small>مرحله</small>
        <strong id="homeStage">1</strong>
      </div>

      <div class="stat">
        <small>سکه</small>
        <strong id="homeCoins">0</strong>
      </div>

      <div class="stat">
        <small>امتیاز</small>
        <strong id="homeScore">0</strong>
      </div>

    </div>

    <button id="continueBtn" class="start-btn">
      شروع بازی
    </button>

    <div class="stage-title">
      مراحل
    </div>

    <div id="stageGrid" class="stage-grid"></div>

    <div id="stageInfo" class="stage-info"></div>
    <button id="albumBtn" class="album-btn">🏛️ آلبوم گنجینه‌ها</button>

  </div>

</section>


<!-- ================= GAME ================= -->

<section id="gameScreen" class="screen">

  <div class="logo" style="font-size:30px;">
    حیدربابا
  </div>

  <div class="cover-wrap cover-small"><img class="cover-image" src="./cover.png" alt="حیدربابا"></div>

  <div class="game-top">

    <div class="top-box">
      <small>مرحله</small>
      <strong id="gameStage">1</strong>
    </div>

    <div class="top-box">
      <small>سکه</small>
      <strong id="gameCoins">0</strong>
    </div>

    <div class="top-box">
      <small>جان</small>
      <strong id="gameLives">❤️❤️❤️</strong>
    </div>

  </div>

  <div class="glass game-card">

    <div id="wordSlots" class="word-slots"></div>

    <div id="currentWord" class="current-word"></div>

    <div id="lettersArea" class="letters-area"></div>

    <div class="game-actions">

      <button id="clearBtn" class="action-btn">
        پاک کردن
      </button>

      <button id="checkBtn" class="action-btn check-btn">
        بررسی
      </button>

      <button id="shuffleBtn" class="action-btn">
        درهم‌ریختن
      </button>

      <button
        id="exitBtn"
        class="action-btn exit-btn"
        style="grid-column:1 / -1;"
      >
        🏠 خروج

function renderAlbum(){
  albumGrid.innerHTML="";
  let discovered=0;
  for(let i=0;i<stageLandmarks.length;i++){
    const landmark=stageLandmarks[i], stageNumber=i+1, unlocked=stageNumber<unlockedStage, stars=Number(stageStars[stageNumber]||0);
    if(unlocked) discovered++;
    const item=document.createElement("div");
    item.className="album-item"+(unlocked ? "" : " locked");
    item.innerHTML='<img src="'+landmark[1]+'" alt="'+landmark[0]+'" loading="lazy"><div class="album-lock">🔒</div><div class="album-caption">'+landmark[0]+'<span class="album-stars">'+(stars ? "⭐".repeat(stars) : "هنوز کشف نشده")+'</span></div>';

function renderStages(){

  stageGrid.innerHTML="";

  for(let i=0;i<stages.length;i++){

    const number=i+1;
    const landmark=stageLandmarks[i%stageLandmarks.length];

    const btn=document.createElement("button");
    btn.className="stage-btn";

    const completed=number<unlockedStage;
    const available=number<=unlockedStage;
    const stars=Number(stageStars[number] || 0);

    btn.innerHTML=`
      <img class="stage-photo" src="${landmark[1]}" alt="${landmark[0]}" loading="lazy">
      <span class="stage-shade"></span>
      <span class="stage-number">${number}</span>
      <span class="stage-name">${landmark[0]}</span>
      ${stars ? `<span class="stage-stars">${"⭐".repeat(stars)}</span>` : ""}
      <span class="stage-status">${completed ? "✓" : (available ? "▶" : "🔒")}</span>
    `;

    if(number===selectedStage){
      btn.classList.add("current");
    }

    if(!available){
      btn.classList.add("locked");
      btn.onclick=()=>{
        showLockedMessage();
      };
    }else{
      btn.onclick=()=>{
        selectedStage=number;
        save();
        updateHome();
        renderStages();
      };
    }

    if(number===justUnlockedStage){ btn.classList.add("unlock-pop"); }

    stageGrid.appendChild(btn);
  }

  stageInfo.textContent=
    `${unlockedStage} از ${stages.length} مرحله باز است • گنجینه‌های آذربایجان ایران`;
}

  if(

    stageNumber>stages.length ||

function renderMeanings(){
  if(!meaningsList) return;
  const found = foundWords.slice();

  if(found.length===0){
    const empty = document.createElement("div");

  getAnswers().forEach(answer=>{

      document.createElement("div");

    word.className=
      "answer-word";


    if(mode==="arabic"){

      word.classList.add(
        "arabic"
      );

      const slot=
        document.createElement("div");

        ? "answer-slot found"
        : "answer-slot";

      word.appendChild(slot);

    });

function renderLetters(){

  lettersArea.innerHTML="";

  currentLetters.forEach(
    (letter,index)=>{

      const el=
        document.createElement("div");

      el.className="letter";

      el.dataset.index=
        index;

      el.textContent=
        letter;

      lettersArea.appendChild(el);

    }
  );

}


/* =========================================================
   لمس و انتخاب حروف
========================================================= */

lettersArea.addEventListener(
  "pointerdown",
  e=>{

    if(gameOver)
      return;

    const letter=
      e.target.closest(".letter");

    if(!letter)
      return;

    e.preventDefault();

    dragging=true;

    activePointerId=
      e.pointerId;

    clearCurrentWord();

    try{

      lettersArea.setPointerCapture(
        e.pointerId
      );

    }catch(err){}

    addLetter(
      Number(letter.dataset.index)
    );

  },
  {passive:false}
);


lettersArea.addEventListener(
  "pointermove",
  e=>{

    if(!dragging)
      return;

    if(activePointerId!==e.pointerId)
      return;

    e.preventDefault();

    const element=
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    if(!element)
      return;

    const letter=
      element.closest(".letter");

    if(!letter)
      return;

    addLetter(
      Number(letter.dataset.index)
    );

  },
  {passive:false}
);


lettersArea.addEventListener(
  "pointerup",
  e=>{

    if(
      activePointerId!==e.pointerId
    )
      return;

    e.preventDefault();

    dragging=false;

    try{

      if(
        lettersArea.hasPointerCapture(
          e.pointerId
        )
      ){

        lettersArea.releasePointerCapture(
          e.pointerId
        );

      }

    }catch(err){}

    activePointerId=null;

  },
  {passive:false}
);


lettersArea.addEventListener(
  "pointercancel",
  ()=>{
    dragging=false;
    activePointerId=null;
  },
  {passive:false}
);


/* =========================================================
   اضافه کردن حرف
========================================================= */

function addLetter(index){

  if(
    selectedIndexes.includes(index)
  )
    return;


  selectedIndexes.push(index);

  currentWord+=
    currentLetters[index];


  currentWordEl.textContent=
    currentWord;


  const elements=
    lettersArea.querySelectorAll(
      ".letter"
    );


  if(elements[index]){

    elements[index].classList.add(
      "selected"
    );

  }

}

  currentWord="";

  selectedIndexes=[];

  lettersArea

      el.classList.remove(

    });

}

function checkWord(){

  if(!currentWord){

    message.textContent=
      "ابتدا حروف را انتخاب کنید.";

    message.className=
      "message wrong";

    return;

  }


  const answers=
    getAnswers();


  if(
    answers.includes(currentWord) &&
    !foundWords.includes(currentWord)
  ){

    foundWords.push(
      currentWord
    );


    score+=10;

    coins+=1;


    playCorrectSound();


    message.textContent=
      "درست است! 👏";

    message.className=
      "message correct";


    renderSlots();

    updateGameStats();

    clearCurrentWord();


    /*
      فقط وقتی تمام کلمات مرحله پیدا شوند
      مرحله بعدی باز می‌شود
    */

    if(
      foundWords.length===
      answers.length
    ){

      setTimeout(
        finishStage,
        500
      );

    }

  }else{

    playWrongSound();


    message.textContent=
      "این کلمه درست نیست.";

    message.className=
      "message wrong";


    lettersArea.classList.remove(
      "shake"
    );

    void lettersArea.offsetWidth;

    lettersArea.classList.add(
      "shake"
    );


    clearCurrentWord();

    loseLife();

  }

}

========================================================= */

function finishStage(){

  score+=10;

  coins+=5;


  const earnedStars = lives>=3 ? 3 : (lives===2 ? 2 : 1);
  if(earnedStars > Number(stageStars[selectedStage] || 0)) stageStars[selectedStage]=earnedStars;

  if(selectedStage===unlockedStage && unlockedStage<stages.length){
    unlockedStage++;
    justUnlockedStage=unlockedStage;
  }

  save();

  updateHome();

  renderStages();


  /*
    بعد از مرحله ۲۰، دوره دوم با معرفی
    جاذبه‌های آذربایجان آغاز می‌شود.
  */

  if(selectedStage===20){

    showRoundTwoIntro();

    return;

  }


  if(
    selectedStage<
    stages.length
  ){

    showModal(

      "عالی! 🎉",

      `مرحله ${selectedStage} کامل شد.<br>
       ۵ سکه دریافت کردید.<br>
       ⭐ امتیاز این مرحله: ${"⭐".repeat(Number(stageStars[selectedStage] || earnedStars))}<br>
       🔓 مرحله ${selectedStage+1} باز شد.` + treasureCardHTML(selectedStage,Number(stageStars[selectedStage] || earnedStars)),

      "مرحله بعد",

      "next"

    );

  }else{

    showModal(

      "تبریک! 🎉",

      `همه ${stages.length} مرحله را کامل کردید.<br>
       🏆 بازی را کامل کردید!<br>
       ⭐ مجموع بهترین ستاره‌ها: ${Object.values(stageStars).reduce((a,b)=>a+Number(b||0),0)} از ${stages.length*3}` + treasureCardHTML(selectedStage,Number(stageStars[selectedStage] || earnedStars)),

      `مرحله ${stages.length}`,

      "final"

    );

  }

}

    if(
      selectedStage<

      selectedStage++;

      save();

      startGame(
        selectedStage
      );

    }


  }else if(
    modalActionType==="round2"
  ){

    modalCancel.textContent="ادامه بازی";

    if(selectedStage<unlockedStage){

      selectedStage=21;

      save();

      startGame(
        selectedStage
      );

    }


  }else if(
    modalActionType==="retry"
  ){

    startGame(
      selectedStage
    );


  }else if(
    modalActionType==="final"
  ){

    selectedStage=
      stages.length;

    save();

    startGame(
      stages.length
    );


  }else if(
    modalActionType==="exit"
  ){

    gameOver=false;

    dragging=false;

    activePointerId=null;

    clearCurrentWord();

      "active"

========================================================= */

hintBtn.onclick=()=>{

  if(coins<10){

    message.textContent=
      "برای راهنما ۱۰ سکه لازم است.";

    message.className=
      "message wrong";

    return;

  }


  const remaining=
    getAnswers().filter(
      word=>
        !foundWords.includes(word)
    );


  if(!remaining.length)
    return;


  coins-=10;

  gameCoins.textContent=
    coins;

  save();


  message.textContent=
    `راهنما: ${remaining[0].charAt(0)}...`;

  message.className=
    "message";

};

function shuffleArray(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

}

/* =========================================================
   صدای درست
========================================================= */

function playCorrectSound(){

  try{

    const AudioContext=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioContext)
      return;


    const ctx=
      new AudioContext();

    const osc=
      ctx.createOscillator();

    const gain=
      ctx.createGain();


    osc.frequency.value=
      720;


    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .18,
      ctx.currentTime+.02
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+.22
    );


    osc.connect(gain);

    gain.connect(
      ctx.destination
    );


    osc.start();

    osc.stop(
      ctx.currentTime+.23
    );

  }catch(err){}

}

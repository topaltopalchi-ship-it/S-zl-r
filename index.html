<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff8e7,#e8f5e9);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#222;
}

.game{
  width:min(95%,600px);
  background:white;
  border-radius:25px;
  padding:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  margin:5px 0 15px;
  font-size:42px;
  letter-spacing:4px;
}

button{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  margin:5px;
  font-size:17px;
  cursor:pointer;
  background:#1976d2;
  color:white;
  transition:.15s;
}

button:active{
  transform:scale(.95);
}

button.secondary{
  background:#757575;
}

button.music{
  background:#8e24aa;
}

.hidden{
  display:none!important;
}

.modeButtons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin:15px 0;
}

.modeButtons button{
  min-width:130px;
}

.info{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
  font-size:18px;
}

.info span{
  background:#f1f1f1;
  padding:8px 12px;
  border-radius:10px;
}

.word{
  font-size:42px;
  font-weight:bold;
  margin:25px 0;
  min-height:55px;
}

input{
  width:90%;
  max-width:450px;
  padding:14px;
  font-size:22px;
  text-align:center;
  border:2px solid #bbb;
  border-radius:13px;
  outline:none;
}

input:focus{
  border-color:#1976d2;
}

.message{
  min-height:35px;
  font-size:21px;
  font-weight:bold;
  margin:12px 0;
}

.correct{
  animation:correctAnim .45s;
}

.wrong{
  animation:wrongAnim .45s;
}

@keyframes correctAnim{
  0%{transform:scale(1)}
  50%{transform:scale(1.15);color:#2e7d32}
  100%{transform:scale(1)}
}

@keyframes wrongAnim{
  0%{transform:translateX(0)}
  25%{transform:translateX(-12px)}
  50%{transform:translateX(12px)}
  75%{transform:translateX(-8px)}
  100%{transform:translateX(0)}
}

.musicStatus{
  font-size:14px;
  min-height:22px;
  margin-top:5px;
  color:#666;
}

.lives{
  color:#d32f2f;
}

.score{
  color:#1565c0;
}

.timer{
  color:#ef6c00;
}

.small{
  font-size:14px;
  color:#777;
}

#gameScreen{
  position:relative;
}

</style>
</head>

<body>

<div class="game">

  <!-- HOME -->
  <div id="homeScreen">

    <h1>SÖZLƏR</h1>

    <p>دۆز آذەربایجان تورکجه سؤزلری</p>

    <div class="modeButtons">
      <button onclick="chooseMode('latin')">🇮🇷 لاتین</button>
      <button onclick="chooseMode('arabic')">🇮🇷 عربی</button>
    </div>

    <button class="music" onclick="toggleMusic()">
      <span id="homeMusicText">▶️ پخش موسیقی</span>
    </button>

    <div id="homeMusicStatus" class="musicStatus">
      موسیقی آماده است
    </div>

    <p class="small">
      برای شروع، یکی از دو حالت نوشتاری را انتخاب کن.
    </p>

  </div>


  <!-- GAME -->
  <div id="gameScreen" class="hidden">

    <div class="info">
      <span class="lives">❤️ جان: <b id="lives">3</b></span>
      <span class="score">⭐ امتیاز: <b id="score">0</b></span>
      <span>🏆 رکورد: <b id="bestScore">0</b></span>
      <span class="timer">⏱️ <b id="timer">30</b></span>
    </div>

    <div>
      <button class="music" onclick="toggleMusic()">
        <span id="gameMusicText">⏸️ توقف موسیقی</span>
      </button>

      <button class="secondary" onclick="goHome()">
        🏠 خانه
      </button>
    </div>

    <div id="musicStatus" class="musicStatus">
      موسیقی آماده است
    </div>

    <div>
      مرحله:
      <b id="stage">1</b>
    </div>

    <div id="word" class="word"></div>

    <input
      id="answerInput"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="جواب را بنویس..."
    >

    <div>
      <button onclick="checkAnswer()">✅ بررسی</button>
      <button onclick="useHint()" class="secondary">💡 راهنما -۵</button>
    </div>

    <div id="message" class="message"></div>

  </div>


  <!-- END -->
  <div id="endScreen" class="hidden">

    <h2>🎉 بازی تمام شد!</h2>

    <p>
      امتیاز شما:
      <b id="finalScore">0</b>
    </p>

    <p>
      رکورد:
      <b id="finalBest">0</b>
    </p>

    <button onclick="restartGame()">🔄 دوباره بازی کن</button>
    <button onclick="goHome()" class="secondary">🏠 خانه</button>

  </div>

</div>


<!-- موسیقی پس‌زمینه -->
<audio
  id="bgMusic"
  src="https://topaltopalchi-ship-it.github.io/S-zl-r/aysal.mp3"
  loop
  preload="auto">
</audio>


<script>

/* =========================
   WORDS
========================= */

const words = [

  {latin:"su", arabic:"سو"},
  {latin:"ev", arabic:"ائو"},
  {latin:"at", arabic:"آت"},
  {latin:"ay", arabic:"آی"},
  {latin:"əl", arabic:"ال"},
  {latin:"gül", arabic:"گول"},
  {latin:"gün", arabic:"گون"},
  {latin:"göy", arabic:"گوی"},
  {latin:"çay", arabic:"چای"},
  {latin:"daş", arabic:"داش"},
  {latin:"baş", arabic:"باش"},
  {latin:"quş", arabic:"قوش"},
  {latin:"od", arabic:"اود"},
  {latin:"yol", arabic:"یول"},
  {latin:"qapı", arabic:"قاپی"},
  {latin:"ana", arabic:"آنا"},
  {latin:"ata", arabic:"آتا"},
  {latin:"dost", arabic:"دوست"},
  {latin:"göz", arabic:"گؤز"},
  {latin:"söz", arabic:"سؤز"},
  {latin:"günəş", arabic:"گونش"},
  {latin:"çörək", arabic:"چورک"},
  {latin:"torpaq", arabic:"تورپاق"},
  {latin:"uşaq", arabic:"اوشاق"},
  {latin:"qardaş", arabic:"قارداش"},
  {latin:"bacı", arabic:"باجی"},
  {latin:"məktəb", arabic:"مکتب"},
  {latin:"kitab", arabic:"کیتاب"},
  {latin:"qələm", arabic:"قلم"},
  {latin:"ağac", arabic:"آغاج"},
  {latin:"çiçək", arabic:"چیچک"},
  {latin:"göyərti", arabic:"گؤیرتی"},
  {latin:"yağış", arabic:"یاغیش"},
  {latin:"külək", arabic:"کولک"},
  {latin:"dəniz", arabic:"دنیز"},
  {latin:"dağ", arabic:"داغ"},
  {latin:"göl", arabic:"گؤل"},
  {latin:"şəhər", arabic:"شهر"},
  {latin:"kənd", arabic:"کند"},
  {latin:"Azərbaycan", arabic:"آذربایجان"},
  {latin:"türk", arabic:"تورک"},
  {latin:"dil", arabic:"دیل"},
  {latin:"salam", arabic:"سلام"},
  {latin:"sağ ol", arabic:"ساغ اول"},
  {latin:"gözəl", arabic:"گؤزل"},
  {latin:"böyük", arabic:"بؤیوک"},
  {latin:"kiçik", arabic:"کیچیک"},
  {latin:"yaxşı", arabic:"یاخشی"},
  {latin:"ağıllı", arabic:"آغیللی"},
  {latin:"ürək", arabic:"اورک"},
  {latin:"sevgi", arabic:"سئویگی"},
  {latin:"dostluq", arabic:"دوستلوغ"},
  {latin:"azadlıq", arabic:"آزادلیق"}

];


/* =========================
   VARIABLES
========================= */

let mode = "latin";
let currentWord = null;

let lives = 3;
let score = 0;
let stage = 1;

let timer = 30;
let timerInterval = null;

let musicOn = true;

let usedWords = [];


/* =========================
   ELEMENTS
========================= */

const homeScreen = document.getElementById("homeScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");

const wordElement = document.getElementById("word");
const answerInput = document.getElementById("answerInput");
const messageElement = document.getElementById("message");

const livesElement = document.getElementById("lives");
const scoreElement = document.getElementById("score");
const bestScoreElement = document.getElementById("bestScore");
const timerElement = document.getElementById("timer");
const stageElement = document.getElementById("stage");

const finalScoreElement = document.getElementById("finalScore");
const finalBestElement = document.getElementById("finalBest");

const bgMusic = document.getElementById("bgMusic");

const homeMusicText = document.getElementById("homeMusicText");
const gameMusicText = document.getElementById("gameMusicText");

const homeMusicStatus = document.getElementById("homeMusicStatus");
const musicStatus = document.getElementById("musicStatus");


/* =========================
   MUSIC
========================= */

bgMusic.volume = 0.35;

function updateMusicButtons(){

  if(musicOn){

    homeMusicText.textContent = "⏸️ توقف موسیقی";
    gameMusicText.textContent = "⏸️ توقف موسیقی";

  }else{

    homeMusicText.textContent = "▶️ پخش موسیقی";
    gameMusicText.textContent = "▶️ پخش موسیقی";

  }

}


function startMusic(){

  if(!musicOn){
    return;
  }

  bgMusic.volume = 0.35;

  const promise = bgMusic.play();

  if(promise !== undefined){

    promise
      .then(() => {

        musicStatus.textContent = "🎵 موسیقی در حال پخش است";
        homeMusicStatus.textContent = "🎵 موسیقی در حال پخش است";

      })
      .catch(() => {

        musicStatus.textContent =
          "⚠️ برای پخش موسیقی، دکمه موسیقی را لمس کن.";

        homeMusicStatus.textContent =
          "⚠️ برای پخش موسیقی، دکمه موسیقی را لمس کن.";

      });

  }

}


function stopMusic(){

  bgMusic.pause();

}


function toggleMusic(){

  if(bgMusic.paused){

    musicOn = true;

    bgMusic.volume = 0.35;

    const promise = bgMusic.play();

    if(promise !== undefined){

      promise
        .then(() => {

          homeMusicStatus.textContent = "🎵 موسیقی در حال پخش است";
          musicStatus.textContent = "🎵 موسیقی در حال پخش است";

        })
        .catch(() => {

          homeMusicStatus.textContent =
            "⚠️ موسیقی اجرا نشد؛ دوباره دکمه را بزن.";

          musicStatus.textContent =
            "⚠️ موسیقی اجرا نشد؛ دوباره دکمه را بزن.";

        });

    }

  }else{

    musicOn = false;
    stopMusic();

    homeMusicStatus.textContent = "⏸️ موسیقی متوقف شد";
    musicStatus.textContent = "⏸️ موسیقی متوقف شد";

  }

  updateMusicButtons();

}


/* اگر فایل موسیقی خطا داشته باشد */
bgMusic.addEventListener("error", function(){

  musicOn = false;

  homeMusicStatus.textContent =
    "❌ فایل موسیقی پیدا نشد.";

  musicStatus.textContent =
    "❌ فایل موسیقی پیدا نشد.";

  updateMusicButtons();

});


bgMusic.addEventListener("loadeddata", function(){

  homeMusicStatus.textContent =
    "🎵 موسیقی آماده است";

  musicStatus.textContent =
    "🎵 موسیقی آماده است";

});


/* =========================
   AUDIO EFFECTS
========================= */

let audioContext = null;


function getAudioContext(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  return audioContext;

}


function playCorrectSound(){

  const ctx = getAudioContext();

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "sine";

  oscillator.frequency.setValueAtTime(
    523.25,
    ctx.currentTime
  );

  oscillator.frequency.setValueAtTime(
    659.25,
    ctx.currentTime + 0.12
  );

  gain.gain.setValueAtTime(
    0.001,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.25,
    ctx.currentTime + 0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + 0.35
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start();
  oscillator.stop(ctx.currentTime + 0.35);

}


function playWrongSound(){

  const ctx = getAudioContext();

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "sawtooth";

  oscillator.frequency.setValueAtTime(
    220,
    ctx.currentTime
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    110,
    ctx.currentTime + 0.25
  );

  gain.gain.setValueAtTime(
    0.001,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.18,
    ctx.currentTime + 0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    ctx.currentTime + 0.3
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start();
  oscillator.stop(ctx.currentTime + 0.3);

}


/* =========================
   MODE
========================= */

function chooseMode(selectedMode){

  mode = selectedMode;

  startGame();

}


/* =========================
   GAME START
========================= */

function startGame(){

  homeScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  lives = 3;
  score = 0;
  stage = 1;

  usedWords = [];

  updateBestScore();
  updateInfo();

  messageElement.textContent = "";

  startMusic();

  nextWord();

}


/* =========================
   DIFFICULTY
========================= */

function getDifficulty(){

  if(stage <= 5){

    return {
      minLength:2,
      maxLength:4,
      time:30,
      points:10
    };

  }

  if(stage <= 10){

    return {
      minLength:4,
      maxLength:6,
      time:24,
      points:15
    };

  }

  return {

    minLength:6,
    maxLength:20,

    time:Math.max(
      14,
      24 - Math.floor((stage - 10) / 3)
    ),

    points:20

  };

}


/* =========================
   NEXT WORD
========================= */

function nextWord(){

  clearInterval(timerInterval);

  const difficulty = getDifficulty();

  let available = words.filter(word => {

    const length = Array.from(word.latin).length;

    return (
      length >= difficulty.minLength &&
      length <= difficulty.maxLength
    );

  });


  if(available.length === 0){

    available = words;

  }


  /* حذف کلمات تکراری تا جای ممکن */

  let notUsed = available.filter(
    word => !usedWords.includes(word.latin)
  );


  if(notUsed.length === 0){

    usedWords = [];

    notUsed = available;

  }


  currentWord =
    notUsed[
      Math.floor(Math.random() * notUsed.length)
    ];


  usedWords.push(currentWord.latin);


  if(mode === "latin"){

    wordElement.textContent =
      shuffleLatin(currentWord.latin);

  }else{

    wordElement.textContent =
      shuffleArabic(currentWord.arabic);

  }


  timer = difficulty.time;

  timerElement.textContent = timer;

  stageElement.textContent = stage;

  answerInput.value = "";
  answerInput.focus();

  messageElement.textContent = "";

  startTimer();

}


/* =========================
   SHUFFLE
========================= */

function shuffleLatin(word){

  const letters = Array.from(word);

  for(let i = letters.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [letters[i],letters[j]] =
      [letters[j],letters[i]];

  }

  return letters.join("");

}


function shuffleArabic(word){

  const letters = Array.from(word);

  for(let i = letters.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [letters[i],letters[j]] =
      [letters[j],letters[i]];

  }

  return letters.join("");

}


/* =========================
   TIMER
========================= */

function startTimer(){

  timerInterval = setInterval(() => {

    timer--;

    timerElement.textContent = timer;

    if(timer <= 0){

      clearInterval(timerInterval);

      messageElement.textContent =
        "⏰ زمان تمام شد!";

      messageElement.className =
        "message wrong";

      loseLife();

    }

  },1000);

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(){

  const answer =
    answerInput.value.trim();

  if(answer === ""){
    return;
  }


  let isCorrect = false;


  if(mode === "latin"){

    const userAnswer =
      answer.toLocaleLowerCase("az-AZ");

    const correctAnswer =
      currentWord.latin.toLocaleLowerCase("az-AZ");

    isCorrect =
      userAnswer === correctAnswer;

  }else{

    isCorrect =
      answer === currentWord.arabic;

  }


  if(isCorrect){

    clearInterval(timerInterval);

    playCorrectSound();

    messageElement.textContent =
      "✅ درست است!";

    messageElement.className =
      "message correct";

    score += getDifficulty().points;

    stage++;

    updateInfo();

    setTimeout(() => {

      nextWord();

    },500);

  }else{

    messageElement.textContent =
      "❌ اشتباه است!";

    messageElement.className =
      "message wrong";

    /* فقط loseLife صدای غلط را پخش می‌کند */
    loseLife();

  }

}


/* =========================
   LOSE LIFE
========================= */

function loseLife(){

  clearInterval(timerInterval);

  playWrongSound();

  lives--;

  updateInfo();


  if(lives <= 0){

    finishGame();

    return;

  }


  setTimeout(() => {

    nextWord();

  },650);

}


/* =========================
   HINT
========================= */

function useHint(){

  if(!currentWord){
    return;
  }

  if(score <= 5){

    messageElement.textContent =
      "❗ برای راهنما حداقل ۵ امتیاز لازم است.";

    return;

  }


  score -= 5;

  updateInfo();


  const answer =
    mode === "latin"
      ? currentWord.latin
      : currentWord.arabic;


  const letters = Array.from(answer);

  if(letters.length > 0){

    messageElement.textContent =
      "💡 راهنما: با «" +
      letters[0] +
      "» شروع می‌شود.";

  }

}


/* =========================
   INFO
========================= */

function updateInfo(){

  livesElement.textContent = lives;
  scoreElement.textContent = score;
  stageElement.textContent = stage;

  updateBestScore();

}


function updateBestScore(){

  const best =
    Number(localStorage.getItem("sozlerBest") || 0);

  bestScoreElement.textContent = best;

}


/* =========================
   FINISH
========================= */

function finishGame(){

  clearInterval(timerInterval);

  stopMusic();

  const oldBest =
    Number(localStorage.getItem("sozlerBest") || 0);


  if(score > oldBest){

    localStorage.setItem(
      "sozlerBest",
      score
    );

  }


  const best =
    Math.max(score,oldBest);


  finalScoreElement.textContent = score;
  finalBestElement.textContent = best;

  gameScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");

}


/* =========================
   RESTART
========================= */

function restartGame(){

  endScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  lives = 3;
  score = 0;
  stage = 1;

  usedWords = [];

  updateInfo();

  startMusic();

  nextWord();

}


/* =========================
   HOME
========================= */

function goHome(){

  clearInterval(timerInterval);

  stopMusic();

  gameScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  homeScreen.classList.remove("hidden");

  homeMusicStatus.textContent =
    "⏸️ موسیقی متوقف شد";

}


/* =========================
   ENTER KEY
========================= */

answerInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      checkAnswer();

    }

  }
);


/* =========================
   INITIAL
========================= */

updateMusicButtons();
updateBestScore();

</script>

</body>
</html>

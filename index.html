<!DOCTYPE html>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #dbeafe
        );

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #222;
}


.game {

    width: 95%;

    max-width: 500px;

    background: white;

    border-radius: 25px;

    padding: 22px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.15);

    text-align: center;
}


h1 {

    margin: 5px 0 3px;

    font-size: 42px;

    letter-spacing: 5px;
}


.subtitle {

    color: #666;

    margin-bottom: 18px;
}


.language {

    display: flex;

    gap: 10px;

    margin-bottom: 18px;
}


.language button {

    flex: 1;

    border: none;

    padding: 12px;

    border-radius: 12px;

    font-size: 16px;

    cursor: pointer;

    background: #e5e7eb;
}


.language button.active {

    background: #2563eb;

    color: white;
}


.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    margin-bottom: 18px;
}


.stat {

    background: #f3f4f6;

    border-radius: 12px;

    padding: 9px 4px;
}


.stat-title {

    font-size: 12px;

    color: #777;
}


.stat-value {

    font-size: 18px;

    font-weight: bold;

    margin-top: 3px;
}


.timer-container {

    margin-top: 10px;

    font-size: 15px;
}


.timer {

    font-weight: bold;

    font-size: 18px;
}


.progress-container {

    height: 10px;

    background: #e5e7eb;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 15px;
}


.progress {

    height: 100%;

    width: 0%;

    background: #2563eb;

    transition:
        width 0.3s;
}


/*
   حروف به هم ریخته
*/

#scrambled {

    min-height: 100px;

    margin: 25px 0;

    padding: 18px;

    border-radius: 18px;

    background: #f8fafc;

    border: 2px dashed #cbd5e1;

    font-size: 38px;

    font-weight: bold;

    letter-spacing: 10px;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;
}


/*
   حالت عربی
*/

#scrambled.arabic {

    direction: rtl;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    letter-spacing: 0;

    gap: 12px;
}


#answer {

    width: 100%;

    padding: 15px;

    font-size: 20px;

    border:
        2px solid #ddd;

    border-radius: 14px;

    text-align: center;

    outline: none;
}


#answer:focus {

    border-color: #2563eb;
}


#answer.arabic {

    direction: rtl;

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}


.buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 12px;
}


.buttons button,
.main-button {

    border: none;

    border-radius: 13px;

    padding: 13px;

    font-size: 17px;

    cursor: pointer;
}


.check {

    background: #2563eb;

    color: white;
}


.hint {

    background: #f59e0b;

    color: white;
}


.restart {

    background: #16a34a;

    color: white;

    width: 100%;

    margin-top: 10px;
}


.home {

    background: #6b7280;

    color: white;

    width: 100%;

    margin-top: 10px;
}


.message {

    min-height: 30px;

    margin-top: 14px;

    font-size: 17px;

    font-weight: bold;
}


#hintText {

    min-height: 25px;

    margin-top: 8px;

    color: #b45309;

    font-weight: bold;
}


.game-over {

    display: none;
}


.final-score {

    font-size: 32px;

    font-weight: bold;

    margin: 20px 0;
}


.record {

    color: #b45309;

    font-weight: bold;
}


/*
   صفحه شروع
*/

.start-screen {

    display: none;
}


.start-button {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 14px;

    background: #2563eb;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/*
   موبایل
*/

@media (max-width: 400px) {

    h1 {
        font-size: 36px;
    }

    #scrambled {
        font-size: 30px;
        letter-spacing: 6px;
    }

    .stats {
        gap: 4px;
    }

    .stat-value {
        font-size: 15px;
    }

}

<script>


/* ==========================================

];


/* ==========================================
   متغیرها
========================================== */

let currentIndex = 0;

let score = 0;

let lives = 3;

let stage = 1;

let language = "latin";

let timer = 30;

let timerInterval = null;

let hintUsed = false;


/* رکورد */

let bestScore =
    Number(
        localStorage.getItem(
            "sozlerBest"
        )
    ) || 0;


document
    .getElementById("best")
    .textContent = bestScore;


/* ==========================================
   تابع مخلوط کردن حروف
========================================== */

function shuffleLetters(text) {

    /*
       تبدیل متن به آرایه حروف
    */

    const letters =
        Array.from(text);


    /*
       اگر فقط یک حرف بود
    */

    if (letters.length <= 1) {

        return text;

    }


    /*
       Fisher-Yates
    */

    for (
        let i = letters.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            letters[i],
            letters[j]
        ] =
        [
            letters[j],
            letters[i]
        ];

    }


    /*
       اگر اتفاقاً همان کلمه اصلی شد،
       دوباره مخلوط کن.
    */

    const result =
        letters.join("");


    if (result === text) {

        return shuffleLetters(text);

    }


    return result;
}


/* ==========================================
   نمایش حروف به هم ریخته
========================================== */

function showScrambled() {


    if (
        currentIndex >=
        words.length
    ) {

        finishGame();

        return;

    }


    const word =
        words[currentIndex];


    const scrambled =
        document
            .getElementById(
                "scrambled"
            );


    if (language === "arabic") {


        /*
           فقط حروف عربی
        */

        scrambled.textContent =
            shuffleLetters(
                word.arabic
            );


        scrambled.classList.add(
            "arabic"
        );

    }


    else {


        /*
           فقط حروف لاتین
        */

        scrambled.textContent =
            shuffleLetters(
                word.latin
            );


        scrambled.classList.remove(
            "arabic"
        );

    }


    /*
       پاک کردن جواب قبلی
    */

    document
        .getElementById("answer")
        .value = "";


    document
        .getElementById("message")
        .textContent = "";


    document
        .getElementById("hintText")
        .textContent = "";


    hintUsed = false;


    /*
       حالت نوشتن
    */

    const input =
        document.getElementById(
            "answer"
        );


    if (language === "arabic") {

        input.classList.add(
            "arabic"
        );

        input.setAttribute(
            "dir",
            "rtl"
        );

        input.placeholder =
            "Cavabı yaz...";

    }

    else {

        input.classList.remove(
            "arabic"
        );

        input.setAttribute(
            "dir",
            "ltr"
        );

        input.placeholder =
            "Cavabı yaz...";

    }


    updateStage();

    updateProgress();

    startTimer();


    input.focus();

}


/* ==========================================
   دکمه لاتین
========================================== */

document
    .getElementById("latinBtn")
    .addEventListener(
        "click",
        function() {


            language = "latin";


            this.classList.add(
                "active"
            );


            document
                .getElementById(
                    "arabicBtn"
                )
                .classList.remove(
                    "active"
                );


            showScrambled();

        }
    );


/* ==========================================
   دکمه عربی
========================================== */

document
    .getElementById("arabicBtn")
    .addEventListener(
        "click",
        function() {


            language = "arabic";


            this.classList.add(
                "active"
            );


            document
                .getElementById(
                    "latinBtn"
                )
                .classList.remove(
                    "active"
                );


            showScrambled();

        }
    );


/* ==========================================
   نرمال‌سازی جواب
========================================== */

function normalizeAnswer(text) {

    return text
        .trim()
        .normalize("NFC");

}


/* ==========================================
   بررسی جواب
========================================== */

function checkAnswer() {


    const input =
        normalizeAnswer(
            document
                .getElementById(
                    "answer"
                )
                .value
        );


    if (!input) {

        return;

    }


    let correctAnswer;


    /*
       جواب حالت عربی
    */

    if (
        language === "arabic"
    ) {

        correctAnswer =
            normalizeAnswer(
                words[currentIndex]
                    .arabic
            );

    }


    /*
       جواب حالت لاتین
    */

    else {

        correctAnswer =
            normalizeAnswer(
                words[currentIndex]
                    .latin
            )
            .toLowerCase();

    }


    let userAnswer = input;


    if (
        language === "latin"
    ) {

        userAnswer =
            userAnswer.toLowerCase();

    }


    clearInterval(
        timerInterval
    );


    /*
       جواب درست
    */

    if (
        userAnswer ===
        correctAnswer
    ) {


        const points =
            hintUsed
            ? 5
            : 10;


        score += points;


        document
            .getElementById(
                "score"
            )
            .textContent =
            score;


        document
            .getElementById(
                "message"
            )
            .textContent =
            "✅ Düzdür! +" +
            points +
            " xal";


        currentIndex++;


        setTimeout(
            function() {

                showScrambled();

            },
            700
        );

    }


    /*
       جواب غلط
    */

    else {


        loseLife(
            "❌ Səhv cavab!"
        );

    }

}


/* ==========================================
   کم شدن جان
========================================== */

function loseLife(message) {


    lives--;


    updateLives();


    document
        .getElementById(
            "message"
        )
        .textContent =
        message;


    /*
       اگر جان تمام شد
    */

    if (lives <= 0) {


        setTimeout(
            function() {

                finishGame();

            },
            700
        );


        return;

    }


    /*
       رفتن به کلمه بعدی
    */

    currentIndex++;


    setTimeout(
        function() {

            showScrambled();

        },
        700
    );

}


/* ==========================================
   تایمر
========================================== */

function startTimer() {


    clearInterval(
        timerInterval
    );


    timer = 30;


    document
        .getElementById(
            "timer"
        )
        .textContent =
        timer;


    timerInterval =
        setInterval(
            function() {


                timer--;


                document
                    .getElementById(
                        "timer"
                    )
                    .textContent =
                    timer;


                if (
                    timer <= 0
                ) {


                    clearInterval(
                        timerInterval
                    );


                    loseLife(
                        "⏰ Vaxt bitdi!"
                    );

                }

            },
            1000
        );

}


/* ==========================================
   نمایش جان
========================================== */

function updateLives() {


    let hearts = "";


    for (
        let i = 0;
        i < lives;
        i++
    ) {

        hearts += "❤️";

    }


    for (
        let i = lives;
        i < 3;
        i++
    ) {

        hearts += "🖤";

    }


    document
        .getElementById(
            "lives"
        )
        .textContent =
        hearts;

}


/* ==========================================
   مرحله
========================================== */

function updateStage() {


    stage =
        Math.floor(
            currentIndex / 10
        ) + 1;


    if (stage > 5) {

        stage = 5;

    }


    document
        .getElementById(
            "stage"
        )
        .textContent =
        stage;

}


/* ==========================================
   پیشرفت
========================================== */

function updateProgress() {


    const percent =
        (
            currentIndex /
            words.length
        ) * 100;


    document
        .getElementById(
            "progress"
        )
        .style.width =
        percent + "%";

}


/* ==========================================
   راهنما
========================================== */

function showHint() {


    if (hintUsed) {

        return;

    }


    hintUsed = true;


    const word =
        words[currentIndex];


    let firstLetter;


    /*
       در حالت عربی،
       اولین حرف عربی نشان داده می‌شود.
    */

    if (
        language === "arabic"
    ) {

        firstLetter =
            Array.from(
                word.arabic
            )[0];

    }


    else {

        firstLetter =
            Array.from(
                word.latin
            )[0];

    }


    document
        .getElementById(
            "hintText"
        )
        .textContent =
        "💡 İlk hərf: " +
        firstLetter;

}


/* ==========================================
   پایان بازی
========================================== */

function finishGame() {


    clearInterval(
        timerInterval
    );


    document
        .getElementById(
            "gameScreen"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "finalScore"
        )
        .textContent =
        score + " xal";


    /*
       رکورد جدید
    */

    if (
        score > bestScore
    ) {


        bestScore = score;


        localStorage.setItem(
            "sozlerBest",
            bestScore
        );


        document
            .getElementById(
                "best"
            )
            .textContent =
            bestScore;


        document
            .getElementById(
                "recordMessage"
            )
            .textContent =
            "🏆 Yeni rekord!";

    }


    else {


        document
            .getElementById(
                "recordMessage"
            )
            .textContent =
            "Rekord: " +
            bestScore +
            " xal";

    }

}


/* ==========================================
   شروع دوباره
========================================== */

function restartGame() {


    clearInterval(
        timerInterval
    );


    currentIndex = 0;

    score = 0;

    lives = 3;

    stage = 1;


    document
        .getElementById(
            "score"
        )
        .textContent =
        "0";


    updateLives();


    document
        .getElementById(
            "gameOver"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "gameScreen"
        )
        .style.display =
        "block";


    showScrambled();

}


/* ==========================================
   خانه
========================================== */

function goHome() {

    restartGame();

}


/* ==========================================
   Enter
========================================== */

document
    .getElementById(
        "answer"
    )
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key ===
                "Enter"
            ) {

                checkAnswer();

            }

        }
    );


/* ==========================================
   شروع بازی
========================================== */

showScrambled();


</script>

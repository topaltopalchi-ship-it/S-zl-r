<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #222;
}

.container {
  width: 94%;
  max-width: 500px;
  background: white;
  border-radius: 24px;
  padding: 25px 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.15);
  text-align: center;
}

h1 {
  margin: 5px 0 8px;
  font-size: 42px;
  letter-spacing: 3px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 16px;
  margin: 8px 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.97);
}

.latin-btn {
  background: #e8f0fe;
  color: #174ea6;
}

.arabic-btn {
  background: #fff0e0;
  color: #a34b00;
}

.green-btn {
  background: #1f9d55;
  color: white;
}

.yellow-btn {
  background: #f5b700;
  color: white;
}

.gray-btn {
  background: #777;
  color: white;
}

.hidden {
  display: none;
}

.top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 18px;
  font-weight: bold;
}

.score {
  color: #1f8f4d;
}

.best {
  color: #c58a00;
}

.word-number {
  color: #666;
  margin-bottom: 15px;
}

.scrambled {
  min-height: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 15px 0;
}

.letter {
  background: #eef2f7;
  border-radius: 12px;
  padding: 12px 15px;
  font-size: 25px;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.arabic-word {
  direction: rtl;
  font-size: 38px;
  font-weight: bold;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 15px 0;
}

.hint {
  background: #fff8d9;
  border-radius: 14px;
  padding: 13px;
  margin: 15px 0;
  color: #765d00;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 14px;
  font-size: 18px;
  text-align: center;
  outline: none;
  margin-bottom: 8px;
}

input:focus {
  border-color: #4b8df8;
}

.result {
  font-size: 21px;
  font-weight: bold;
  margin: 15px 0;
  min-height: 30px;
}

.final-score {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0;
  color: #1f8f4d;
}

.small {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

  <!-- START -->
  <div id="startScreen">

    <h1>SÖZLƏR</h1>

    <div class="subtitle">
      Azərbaycan Türkcəsi söz oyunu
    </div>

    <button class="latin-btn" onclick="startGame('latin')">
      🇮🇷 Azərbaycan Türkcəsi — Latın əlifbası
    </button>

    <button class="arabic-btn" onclick="startGame('arabic')">
      🇮🇷 Azərbaycan Türkcəsi — Ərəb əlifbası
    </button>

    <p class="small">
      Sözləri tap, xal qazan və rekordunu artır!
    </p>

  </div>


  <!-- GAME -->
  <div id="gameScreen" class="hidden">

    <div class="top">
      <div class="score">
        Xal: <span id="score">0</span>
      </div>

      <div class="best">
        Rekord: <span id="bestScore">0</span>
      </div>
    </div>

    <div class="word-number">
      Söz <span id="wordNumber">1</span> / <span id="totalWords">50</span>
    </div>

    <div id="scrambled" class="scrambled"></div>

    <div id="arabicWord" class="arabic-word hidden"></div>

    <div id="hint" class="hint"></div>

    <input
      id="answer"
      type="text"
      placeholder="Cavabı yaz..."
      autocomplete="off"
      onkeydown="handleEnter(event)"
    >

    <button class="green-btn" onclick="checkAnswer()">
      Yoxla
    </button>

    <button class="yellow-btn" onclick="showHint()">
      💡 İpucu
    </button>

    <div id="result" class="result"></div>

    <button class="gray-btn" onclick="backToStart()">
      ↩️ Geri
    </button>

  </div>


  <!-- END -->
  <div id="endScreen" class="hidden">

    <h1>🎉</h1>

    <h2>Oyun bitdi!</h2>

    <div class="final-score">
      Xalın: <span id="finalScore">0</span>
    </div>

    <div class="best">
      Rekord: <span id="finalBest">0</span>
    </div>

    <p class="small">
      Yeni sözlər tap və rekordunu yenilə!
    </p>

    <button class="green-btn" onclick="playAgain()">
      🔄 Yenidən oyna
    </button>

    <button class="gray-btn" onclick="backToStart()">
      🏠 Əsas səhifə
    </button>

  </div>

</div>

let mode = "latin";
let currentIndex = 0;
let score = 0;
let hintUsed = false;
let currentWord = null;

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");

document.getElementById("totalWords").textContent = words.length;


function getBestScore() {
  return Number(localStorage.getItem("sozlerBestScore") || 0);
}


function saveBestScore() {

  const best = getBestScore();

  if (score > best) {
    localStorage.setItem("sozlerBestScore", score);
  }

}


function startGame(selectedMode) {

  mode = selectedMode;
  currentIndex = 0;
  score = 0;

  startScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  document.getElementById("score").textContent = score;
  document.getElementById("bestScore").textContent = getBestScore();

  loadWord();

}


function loadWord() {

  if (currentIndex >= words.length) {
    finishGame();
    return;
  }

  currentWord = words[currentIndex];
  hintUsed = false;

  document.getElementById("wordNumber").textContent =
    currentIndex + 1;

  document.getElementById("answer").value = "";

  document.getElementById("result").textContent = "";

  document.getElementById("hint").textContent =
    "💡 İpucu üçün düyməyə bas.";

  const scrambled = document.getElementById("scrambled");
  const arabicWord = document.getElementById("arabicWord");

  scrambled.innerHTML = "";

  if (mode === "latin") {

    scrambled.classList.remove("hidden");
    arabicWord.classList.add("hidden");

    showScrambledLetters(currentWord.latin);

  } else {

    scrambled.classList.add("hidden");
    arabicWord.classList.remove("hidden");

    arabicWord.textContent = currentWord.arabic;
  }

  document.getElementById("answer").focus();

}


function showScrambledLetters(word) {

  const letters = Array.from(word);

  for (let i = letters.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [letters[i], letters[j]] =
      [letters[j], letters[i]];

  }

  const scrambled = document.getElementById("scrambled");

  letters.forEach(letter => {

    const div = document.createElement("div");

    div.className = "letter";
    div.textContent = letter;

    scrambled.appendChild(div);

  });

}


function showHint() {

  if (!currentWord) return;

  document.getElementById("hint").textContent =
    "💡 " + currentWord.hint;

  if (!hintUsed) {
    hintUsed = true;
  }

}


function normalize(text) {

  return text
    .trim()
    .toLocaleLowerCase("az-AZ")
    .normalize("NFC");

}


function checkAnswer() {

  if (!currentWord) return;

  const input =
    document.getElementById("answer").value;

  const answer = normalize(input);
  const correct = normalize(currentWord.latin);

  const result = document.getElementById("result");

  if (!answer) {

    result.textContent = "✍️ Əvvəl cavabı yaz.";
    return;

  }


  if (answer === correct) {

    let points = 10;

    if (!hintUsed) {
      points = 10;
    } else {
      points = 5;
    }

    score += points;

    result.textContent =
      "✅ Doğrudur! +" + points + " xal";

    document.getElementById("score").textContent =
      score;

    saveBestScore();

    document.getElementById("bestScore").textContent =
      getBestScore();

    setTimeout(() => {

      currentIndex++;
      loadWord();

    }, 900);

  } else {

    result.textContent =
      "❌ Yanlışdır. Yenidən cəhd et.";

  }

}


function handleEnter(event) {

  if (event.key === "Enter") {
    checkAnswer();
  }

}


function finishGame() {

  saveBestScore();

  document.getElementById("finalScore").textContent =
    score;

  document.getElementById("finalBest").textContent =
    getBestScore();

  gameScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");

}


function playAgain() {

  endScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  currentIndex = 0;
  score = 0;

  document.getElementById("score").textContent = score;

  loadWord();

}


function backToStart() {

  gameScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");

}

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8f5e9, #ffffff);
  text-align: center;
  color: #222;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 42px;
  margin: 10px 0;
  color: #00897b;
}

.subtitle {
  color: #555;
  margin-bottom: 20px;
}

.mode-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}

.mode-buttons button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 17px;
  cursor: pointer;
  background: #eeeeee;
}

.mode-buttons button.active {
  background: #00897b;
  color: white;
}

.info {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.info-box {
  background: white;
  border-radius: 12px;
  padding: 10px 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  min-width: 100px;
}

#scrambled {
  min-height: 90px;
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin: 20px 0;
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 8px;
  direction: ltr;
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

#scrambled.arabic {
  direction: rtl;
  letter-spacing: 3px;
}

input {
  width: 90%;
  max-width: 450px;
  padding: 15px;
  border: 2px solid #00897b;
  border-radius: 12px;
  font-size: 22px;
  text-align: center;
  outline: none;
}

input.arabic-input {
  direction: rtl;
}

.buttons {
  margin-top: 15px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.buttons button {
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 17px;
  cursor: pointer;
}

#checkBtn {
  background: #00897b;
  color: white;
}

#hintBtn {
  background: #ffb300;
  color: white;
}

#restartBtn {
  background: #546e7a;
  color: white;
}

#message {
  min-height: 35px;
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

#gameOver {
  display: none;
  background: white;
  padding: 25px;
  border-radius: 18px;
  margin-top: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

#gameOver h2 {
  color: #00897b;
}

.small {
  color: #666;
  font-size: 14px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <h1>SÖZLƏR</h1>
  <div class="subtitle">Sözləri qarışıq hərflərdən tap!</div>

  <div class="mode-buttons">
    <button id="latinBtn" class="active">🇮🇷 Latin</button>
    <button id="arabicBtn">🇮🇷 Ərəb</button>
  </div>

  <div class="info">
    <div class="info-box">
      Mərhələ<br>
      <strong id="stage">1</strong>
    </div>

    <div class="info-box">
      Can ❤️<br>
      <strong id="lives">3</strong>
    </div>

    <div class="info-box">
      Vaxt ⏱️<br>
      <strong id="timer">30</strong>
    </div>

    <div class="info-box">
      Xal ⭐<br>
      <strong id="score">0</strong>
    </div>
  </div>

  <div id="scrambled"></div>

  <input
    id="answer"
    type="text"
    autocomplete="off"
    placeholder="Cavabını yaz..."
  >

  <div class="buttons">
    <button id="checkBtn">Yoxla</button>
    <button id="hintBtn">💡 İpucu</button>
    <button id="restartBtn">🔄 Yenidən</button>
  </div>

  <div id="message"></div>

  <div id="gameOver">
    <h2>🎉 Oyun bitdi!</h2>
    <p>Sənin xalın:</p>
    <h2 id="finalScore">0</h2>

    <p>Ən yaxşı xal:</p>
    <h3 id="bestScore">0</h3>

    <button id="playAgainBtn" class="buttons"
      style="background:#00897b;color:white;border:none;border-radius:12px;padding:12px 20px;font-size:17px;cursor:pointer;">
      🔄 Yenidən oyna
    </button>
  </div>

  <div class="small">
    Düzgün cavab üçün +10 xal ⭐
  </div>

</div>

<script>

/* =========================
   SÖZLƏR
========================= */

const words = [

  { latin: "Günəş", arabic: "گونش" },
  { latin: "Çörək", arabic: "چورک" },
  { latin: "Göy", arabic: "گوی" },
  { latin: "Ev", arabic: "ائو" },
  { latin: "Ğələm", arabic: "غلم" },
  { latin: "Ana", arabic: "آنا" },
  { latin: "Ata", arabic: "آتا" },
  { latin: "Su", arabic: "سو" },
  { latin: "Kitab", arabic: "کیتاب" },
  { latin: "Qələm", arabic: "قلم" },
  { latin: "Məktəb", arabic: "مکتب" },
  { latin: "Uşaq", arabic: "اوشاق" },
  { latin: "Dost", arabic: "دوست" },
  { latin: "Dağ", arabic: "داغ" },
  { latin: "Dəniz", arabic: "دنیز" },
  { latin: "Torpaq", arabic: "تورپاق" },
  { latin: "Bulud", arabic: "بولود" },
  { latin: "Yağış", arabic: "یاغیش" },
  { latin: "Külək", arabic: "کولک" },
  { latin: "Ulduz", arabic: "اولدوز" },
  { latin: "Ay", arabic: "آی" },
  { latin: "Gecə", arabic: "گجه" },
  { latin: "Səhər", arabic: "سحر" },
  { latin: "Axşam", arabic: "آخشام" },
  { latin: "Yol", arabic: "یول" },
  { latin: "Maşın", arabic: "ماشین" },
  { latin: "Çiçək", arabic: "چیچک" },
  { latin: "Ağac", arabic: "آغاج" },
  { latin: "Yarpaq", arabic: "یارپاق" },
  { latin: "Meyvə", arabic: "میوه" },
  { latin: "Alma", arabic: "آلما" },
  { latin: "Armud", arabic: "آرمود" },
  { latin: "Nar", arabic: "نار" },
  { latin: "Üzüm", arabic: "اوزوم" },
  { latin: "Balıq", arabic: "بالق" },
  { latin: "Quş", arabic: "قوش" },
  { latin: "At", arabic: "آت" },
  { latin: "İt", arabic: "ایت" },
  { latin: "Pişik", arabic: "پیشیک" },
  { latin: "Süd", arabic: "سود" },
  { latin: "Qəhvə", arabic: "قهوه" },
  { latin: "Çay", arabic: "چای" },
  { latin: "Şəkər", arabic: "شکر" },
  { latin: "Duz", arabic: "دوز" },
  { latin: "Ürək", arabic: "اورک" },
  { latin: "Əl", arabic: "ال" },
  { latin: "Göz", arabic: "گوز" },
  { latin: "Baş", arabic: "باش" },
  { latin: "Ayaq", arabic: "آیاق" }

];


/* =========================
   DƏYİŞƏNLƏR
========================= */

let currentWord = null;
let stage = 1;
let lives = 3;
let score = 0;
let timeLeft = 30;
let timerInterval = null;
let hintUsed = false;
let currentMode = "latin";


/* =========================
   ELEMENTLƏR
========================= */

const scrambledEl = document.getElementById("scrambled");
const answerEl = document.getElementById("answer");
const stageEl = document.getElementById("stage");
const livesEl = document.getElementById("lives");
const timerEl = document.getElementById("timer");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");

const latinBtn = document.getElementById("latinBtn");
const arabicBtn = document.getElementById("arabicBtn");

const checkBtn = document.getElementById("checkBtn");
const hintBtn = document.getElementById("hintBtn");
const restartBtn = document.getElementById("restartBtn");

const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");
const bestScoreEl = document.getElementById("bestScore");
const playAgainBtn = document.getElementById("playAgainBtn");


/* =========================
   صدا
========================= */

let audioContext = null;

function getAudioContext() {

  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}


/* صدای جواب درست */

function playCorrectSound() {

  const ctx = getAudioContext();
  const now = ctx.currentTime;

  const oscillator1 = ctx.createOscillator();
  const gain1 = ctx.createGain();

  oscillator1.type = "sine";
  oscillator1.frequency.setValueAtTime(523.25, now);
  oscillator1.frequency.setValueAtTime(659.25, now + 0.12);

  gain1.gain.setValueAtTime(0.001, now);
  gain1.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
  gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

  oscillator1.connect(gain1);
  gain1.connect(ctx.destination);

  oscillator1.start(now);
  oscillator1.stop(now + 0.3);
}


/* صدای جواب غلط */

function playWrongSound() {

  const ctx = getAudioContext();
  const now = ctx.currentTime;

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = "sawtooth";

  oscillator.frequency.setValueAtTime(260, now);
  oscillator.frequency.setValueAtTime(180, now + 0.12);
  oscillator.frequency.setValueAtTime(120, now + 0.24);

  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(now);
  oscillator.stop(now + 0.37);
}


/* =========================
   مخلوط کردن حروف
========================= */

function shuffleLetters(text) {

  const letters = Array.from(text);

  let shuffled;

  do {

    shuffled = [...letters];

    for (let i = shuffled.length - 1; i > 0; i--) {

      const j = Math.floor(Math.random() * (i + 1));

      [shuffled[i], shuffled[j]] =
      [shuffled[j], shuffled[i]];
    }

  } while (
    shuffled.join("") === text &&
    text.length > 1
  );

  return shuffled.join("");
}


/* =========================
   نمایش کلمه جدید
========================= */

function showScrambled() {

  currentWord =
    words[Math.floor(Math.random() * words.length)];

  const text =
    currentMode === "latin"
      ? currentWord.latin
      : currentWord.arabic;

  scrambledEl.textContent =
    shuffleLetters(text);

  if (currentMode === "arabic") {

    scrambledEl.classList.add("arabic");
    answerEl.classList.add("arabic-input");

  } else {

    scrambledEl.classList.remove("arabic");
    answerEl.classList.remove("arabic-input");

  }

  answerEl.value = "";
  answerEl.focus();

  hintUsed = false;

  messageEl.textContent = "";

  timeLeft = 30;
  timerEl.textContent = timeLeft;

  startTimer();
}


/* =========================
   تایمر
========================= */

function startTimer() {

  clearInterval(timerInterval);

  timerInterval = setInterval(() => {

    timeLeft--;

    timerEl.textContent = timeLeft;

    if (timeLeft <= 0) {

      clearInterval(timerInterval);

      messageEl.textContent = "⏰ Vaxt bitdi!";

      loseLife();

    }

  }, 1000);
}


/* =========================
   بررسی جواب
========================= */

function checkAnswer() {

  getAudioContext();

  const userAnswer =
    answerEl.value.trim();

  if (!userAnswer) return;

  const correctAnswer =
    currentMode === "latin"
      ? currentWord.latin
      : currentWord.arabic;

  if (userAnswer === correctAnswer) {

    clearInterval(timerInterval);

    playCorrectSound();

    let points = 10;

    if (hintUsed) {
      points = 5;
    }

    score += points;

    scoreEl.textContent = score;

    messageEl.textContent =
      "✅ Düzdür! +" + points + " xal";

    setTimeout(() => {

      stage++;

      stageEl.textContent = stage;

      showScrambled();

    }, 700);

  } else {

    messageEl.textContent =
      "❌ Səhv cavab!";

    loseLife();

  }
}


/* =========================
   کم شدن جان
========================= */

function loseLife() {

  playWrongSound();

  lives--;

  livesEl.textContent = lives;

  answerEl.value = "";

  if (lives <= 0) {

    clearInterval(timerInterval);

    setTimeout(() => {
      finishGame();
    }, 500);

    return;
  }

  setTimeout(() => {

    showScrambled();

  }, 700);
}


/* =========================
   راهنمایی
========================= */

function showHint() {

  if (hintUsed || !currentWord) return;

  hintUsed = true;

  const answer =
    currentMode === "latin"
      ? currentWord.latin
      : currentWord.arabic;

  const firstLetter =
    Array.from(answer)[0];

  messageEl.textContent =
    "💡 İlk hərf: " + firstLetter;

}


/* =========================
   پایان بازی
========================= */

function finishGame() {

  clearInterval(timerInterval);

  finalScoreEl.textContent = score;

  const oldBest =
    Number(localStorage.getItem("sozlerBest") || 0);

  if (score > oldBest) {

    localStorage.setItem(
      "sozlerBest",
      score
    );

  }

  bestScoreEl.textContent =
    localStorage.getItem("sozlerBest") || 0;

  gameOverEl.style.display = "block";

  scrambledEl.style.display = "none";
  answerEl.style.display = "none";

  checkBtn.style.display = "none";
  hintBtn.style.display = "none";
}


/* =========================
   شروع دوباره
========================= */

function restartGame() {

  clearInterval(timerInterval);

  stage = 1;
  lives = 3;
  score = 0;

  stageEl.textContent = stage;
  livesEl.textContent = lives;
  scoreEl.textContent = score;

  gameOverEl.style.display = "none";

  scrambledEl.style.display = "block";
  answerEl.style.display = "block";

  checkBtn.style.display = "inline-block";
  hintBtn.style.display = "inline-block";

  showScrambled();
}


/* =========================
   تغییر حالت Latin
========================= */

latinBtn.addEventListener("click", () => {

  currentMode = "latin";

  latinBtn.classList.add("active");
  arabicBtn.classList.remove("active");

  showScrambled();
});


/* =========================
   تغییر حالت عربی
========================= */

arabicBtn.addEventListener("click", () => {

  currentMode = "arabic";

  arabicBtn.classList.add("active");
  latinBtn.classList.remove("active");

  showScrambled();
});


/* =========================
   دکمه‌ها
========================= */

checkBtn.addEventListener(
  "click",
  checkAnswer
);

hintBtn.addEventListener(
  "click",
  showHint
);

restartBtn.addEventListener(
  "click",
  restartGame
);

playAgainBtn.addEventListener(
  "click",
  restartGame
);


/* =========================
   Enter
========================= */

answerEl.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {

    checkAnswer();

  }

});


/* =========================
   شروع بازی
========================= */

showScrambled();

</script>

</body>
</html>

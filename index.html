<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:95%;
  max-width:600px;
  background:rgba(255,255,255,0.10);
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.35);
  backdrop-filter:blur(10px);
}

h1{
  font-size:42px;
  margin:5px 0 10px;
  letter-spacing:3px;
}

.subtitle{
  opacity:.85;
  margin-bottom:25px;
}

button{
  border:none;
  border-radius:14px;
  padding:13px 20px;
  margin:6px;
  font-size:17px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:scale(1.04);
}

.mode-btn{
  background:white;
  color:#222;
  min-width:130px;
}

.mode-btn.active{
  background:#ffd54a;
  font-weight:bold;
}

.start-btn{
  background:#22c55e;
  color:white;
  font-size:20px;
  padding:15px 35px;
  margin-top:20px;
}

.music-btn{
  background:#374151;
  color:white;
}

.game{
  display:none;
}

.topbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}

.stat{
  background:rgba(255,255,255,.10);
  padding:10px;
  border-radius:12px;
  font-size:14px;
}

.stat strong{
  display:block;
  font-size:20px;
  margin-top:3px;
}

.lives{
  color:#ff6b6b;
  letter-spacing:3px;
}

.timer{
  margin:15px 0;
  font-size:20px;
  font-weight:bold;
}

.timer-bar{
  height:8px;
  background:rgba(255,255,255,.15);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:25px;
}

.timer-progress{
  height:100%;
  width:100%;
  background:#22c55e;
  transition:width 1s linear;
}

.word-label{
  font-size:15px;
  opacity:.8;
  margin-bottom:10px;
}

.scrambled{
  min-height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  font-weight:bold;
  letter-spacing:7px;
  margin:15px 0 25px;
  direction:ltr;
  word-break:break-all;
}

.scrambled.arabic{
  direction:rtl;
  letter-spacing:0;
}

input{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  font-size:23px;
  text-align:center;
  outline:none;
  margin-bottom:12px;
}

input.arabic-input{
  direction:rtl;
  text-align:center;
}

.check-btn{
  width:100%;
  background:#3b82f6;
  color:white;
  font-size:20px;
}

.hint-btn{
  background:#f59e0b;
  color:white;
}

.home-btn{
  background:#6b7280;
  color:white;
}

.message{
  min-height:35px;
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.correct{
  animation:correctAnim .4s;
}

.wrong{
  animation:wrongAnim .4s;
}

@keyframes correctAnim{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

@keyframes wrongAnim{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

.result{
  display:none;
}

.final-score{
  font-size:35px;
  font-weight:bold;
  margin:20px 0;
}

.best-score{
  opacity:.85;
}

.small-note{
  font-size:13px;
  opacity:.7;
  margin-top:15px;
  line-height:1.6;
}

@media(max-width:500px){
  .container{
    padding:18px;
  }

  h1{
    font-size:34px;
  }

  .scrambled{
    font-size:34px;
    letter-spacing:4px;
  }

  input{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- START SCREEN -->
  <div id="startScreen">

    <h1>SÖZLƏR</h1>

    <div class="subtitle">
      Sözləri qarışıq hərflərdən tap!
    </div>

    <div>
      <button
        id="latinModeBtn"
        class="mode-btn active"
        onclick="selectMode('latin')">
        🇮🇷 LATİN
      </button>

      <button
        id="arabicModeBtn"
        class="mode-btn"
        onclick="selectMode('arabic')">
        🇮🇷 ƏRƏB
      </button>
    </div>

    <button class="start-btn" onclick="startGame()">
      ▶️ Oyuna başla
    </button>

    <button
      id="musicStartBtn"
      class="music-btn"
      onclick="toggleMusic()">
      🔊 Musiqi: Açıq
    </button>

    <div class="small-note">
      Latın rejimində böyük və kiçik hərflər fərq etmir.
    </div>

  </div>


  <!-- GAME -->
  <div id="gameScreen" class="game">

    <h1>SÖZLƏR</h1>

    <div class="topbar">

      <div class="stat">
        Mərhələ
        <strong id="stage">1</strong>
      </div>

      <div class="stat">
        Xal
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        Can
        <strong id="lives" class="lives">❤️❤️❤️</strong>
      </div>

    </div>

    <div class="timer">
      ⏱️ <span id="time">30</span>
    </div>

    <div class="timer-bar">
      <div id="timerProgress" class="timer-progress"></div>
    </div>

    <div class="word-label">
      Qarışıq hərfləri düzgün sözə çevir:
    </div>

    <div id="scrambledWord" class="scrambled">
      ---
    </div>

    <input
      id="answerInput"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Cavabını yaz..."
      onkeydown="handleEnter(event)"
    >

    <button class="check-btn" onclick="checkAnswer()">
      ✅ Yoxla
    </button>

    <button class="hint-btn" onclick="useHint()">
      💡 İpucu
    </button>

    <button
      id="musicBtn"
      class="music-btn"
      onclick="toggleMusic()">
      🔊 Musiqi: Açıq
    </button>

    <button class="home-btn" onclick="goHome()">
      🏠 Ana səhifə
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- RESULT -->
  <div id="resultScreen" class="result">

    <h1>OYUN BİTDİ</h1>

    <div class="final-score">
      <span id="finalScore">0</span> xal
    </div>

    <div class="best-score">
      🏆 Rekord: <span id="bestScore">0</span>
    </div>

    <button class="start-btn" onclick="restartGame()">
      🔄 Yenidən oyna
    </button>

    <button class="home-btn" onclick="goHome()">
      🏠 Ana səhifə
    </button>

  </div>

</div>


<!-- BACKGROUND MUSIC -->
<audio
  id="bgMusic"
  src="aysal.mp3"
  loop
  preload="auto">
</audio>


<script>

/* =====================================================
   SÖZLƏR
===================================================== */

const words = [

  {latin:"Ana", arabic:"آنا"},
  {latin:"Ata", arabic:"آتا"},
  {latin:"Su", arabic:"سو"},
  {latin:"Ay", arabic:"آی"},
  {latin:"At", arabic:"آت"},
  {latin:"İt", arabic:"ایت"},
  {latin:"Əl", arabic:"ال"},
  {latin:"Nar", arabic:"نار"},
  {latin:"Yol", arabic:"یول"},
  {latin:"Çay", arabic:"چای"},
  {latin:"Duz", arabic:"دوز"},
  {latin:"Göy", arabic:"گوی"},
  {latin:"Ev", arabic:"ائو"},
  {latin:"Dağ", arabic:"داغ"},
  {latin:"Quş", arabic:"قوش"},
  {latin:"Göz", arabic:"گوز"},
  {latin:"Baş", arabic:"باش"},
  {latin:"Süd", arabic:"سود"},
  {latin:"Alma", arabic:"آلما"},
  {latin:"Dost", arabic:"دوست"},
  {latin:"Uşaq", arabic:"اوشاق"},
  {latin:"Kitab", arabic:"کیتاب"},
  {latin:"Qələm", arabic:"قلم"},
  {latin:"Meyvə", arabic:"میوه"},
  {latin:"Üzüm", arabic:"اوزوم"},
  {latin:"Günəş", arabic:"گونش"},
  {latin:"Çörək", arabic:"چورک"},
  {latin:"Məktəb", arabic:"مکتب"},
  {latin:"Dəniz", arabic:"دنیز"},
  {latin:"Torpaq", arabic:"تورپاق"},
  {latin:"Bulud", arabic:"بولود"},
  {latin:"Yağış", arabic:"یاغیش"},
  {latin:"Külək", arabic:"کولک"},
  {latin:"Ulduz", arabic:"اولدوز"},
  {latin:"Gecə", arabic:"گجه"},
  {latin:"Səhər", arabic:"سحر"},
  {latin:"Axşam", arabic:"آخشام"},
  {latin:"Maşın", arabic:"ماشین"},
  {latin:"Çiçək", arabic:"چیچک"},
  {latin:"Ağac", arabic:"آغاج"},
  {latin:"Yarpaq", arabic:"یارپاق"},
  {latin:"Armud", arabic:"آرمود"},
  {latin:"Balıq", arabic:"بالق"},
  {latin:"Pişik", arabic:"پیشیک"},
  {latin:"Qəhvə", arabic:"قهوه"},
  {latin:"Şəkər", arabic:"شکر"},
  {latin:"Ürək", arabic:"اورک"},
  {latin:"Ayaq", arabic:"آیاق"},
  {latin:"Ğələm", arabic:"غلم"}

];


/* =====================================================
   GAME VARIABLES
===================================================== */

let mode = "latin";
let stage = 1;
let score = 0;
let lives = 3;
let currentWord = null;
let timeLeft = 30;
let timer = null;
let musicOn = true;
let audioContext = null;


/* =====================================================
   MODE
===================================================== */

function selectMode(selectedMode){

  mode = selectedMode;

  document
    .getElementById("latinModeBtn")
    .classList.toggle("active", mode === "latin");

  document
    .getElementById("arabicModeBtn")
    .classList.toggle("active", mode === "arabic");
}


/* =====================================================
   AUDIO
===================================================== */

function getAudioContext(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext || window.webkitAudioContext)();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  return audioContext;
}


/* صدای جواب درست */

function playCorrectSound(){

  try{

    const ctx = getAudioContext();

    const now = ctx.currentTime;

    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();

    osc1.type = "sine";
    osc1.frequency.setValueAtTime(523.25, now);

    gain1.gain.setValueAtTime(0.0001, now);
    gain1.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
    gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.20);

    osc1.connect(gain1);
    gain1.connect(ctx.destination);

    osc1.start(now);
    osc1.stop(now + 0.21);


    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();

    osc2.type = "sine";
    osc2.frequency.setValueAtTime(659.25, now + 0.12);

    gain2.gain.setValueAtTime(0.0001, now + 0.12);
    gain2.gain.exponentialRampToValueAtTime(0.25, now + 0.14);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);

    osc2.connect(gain2);
    gain2.connect(ctx.destination);

    osc2.start(now + 0.12);
    osc2.stop(now + 0.37);

  }catch(e){

    console.log("Correct sound error:", e);

  }
}


/* صدای جواب غلط */

function playWrongSound(){

  try{

    const ctx = getAudioContext();

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.30);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + 0.33);

  }catch(e){

    console.log("Wrong sound error:", e);

  }
}


/* =====================================================
   BACKGROUND MUSIC
===================================================== */

const bgMusic = document.getElementById("bgMusic");

bgMusic.volume = 0.35;


/* شروع موسیقی */

function startMusic(){

  if(!musicOn){
    return;
  }

  bgMusic.volume = 0.35;

  const promise = bgMusic.play();

  if(promise !== undefined){

    promise
      .then(() => {

        updateMusicButtons();

      })
      .catch(() => {

        updateMusicButtons();

      });

  }

}


/* توقف موسیقی */

function stopMusic(){

  bgMusic.pause();

}


/* روشن/خاموش کردن موسیقی */

function toggleMusic(){

  musicOn = !musicOn;

  if(musicOn){

    startMusic();

  }else{

    stopMusic();

  }

  updateMusicButtons();

}


/* متن دکمه موسیقی */

function updateMusicButtons(){

  const text =
    musicOn
      ? "🔊 Musiqi: Açıq"
      : "🔇 Musiqi: Bağlı";

  const startBtn =
    document.getElementById("musicStartBtn");

  const gameBtn =
    document.getElementById("musicBtn");

  if(startBtn){
    startBtn.textContent = text;
  }

  if(gameBtn){
    gameBtn.textContent = text;
  }

}


/* =====================================================
   DIFFICULTY
===================================================== */

function getDifficulty(){

  if(stage <= 5){

    return {
      min:2,
      max:4,
      time:30,
      points:10
    };

  }

  if(stage <= 10){

    return {
      min:4,
      max:6,
      time:24,
      points:15
    };

  }

  return {

    min:6,
    max:20,

    time:Math.max(
      14,
      24 - Math.floor((stage - 10) / 3)
    ),

    points:20

  };

}


/* =====================================================
   WORD SELECTION
===================================================== */

function getWord(){

  const difficulty = getDifficulty();

  let available = words.filter(word => {

    const length =
      word.latin.length;

    return (
      length >= difficulty.min &&
      length <= difficulty.max
    );

  });

  if(available.length === 0){
    available = words;
  }

  return available[
    Math.floor(Math.random() * available.length)
  ];

}


/* =====================================================
   SHUFFLE LATIN
===================================================== */

function shuffleLatin(text){

  const chars = Array.from(text);

  for(let i = chars.length - 1; i > 0; i--){

    const j =
      Math.floor(Math.random() * (i + 1));

    [chars[i], chars[j]] =
      [chars[j], chars[i]];

  }

  return chars.join("");
}


/* =====================================================
   SHUFFLE ARABIC
===================================================== */

function shuffleArabic(text){

  const chars = Array.from(text);

  for(let i = chars.length - 1; i > 0; i--){

    const j =
      Math.floor(Math.random() * (i + 1));

    [chars[i], chars[j]] =
      [chars[j], chars[i]];

  }

  return chars.join("");

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  clearInterval(timer);

  stage = 1;
  score = 0;
  lives = 3;

  document
    .getElementById("startScreen")
    .style.display = "none";

  document
    .getElementById("resultScreen")
    .style.display = "none";

  document
    .getElementById("gameScreen")
    .style.display = "block";

  updateStats();

  /* شروع موسیقی بعد از کلیک کاربر */
  startMusic();

  nextWord();

}


/* =====================================================
   NEXT WORD
===================================================== */

function nextWord(){

  clearInterval(timer);

  currentWord = getWord();

  const scrambled =
    mode === "latin"
      ? shuffleLatin(currentWord.latin)
      : shuffleArabic(currentWord.arabic);

  const scrambledElement =
    document.getElementById("scrambledWord");

  scrambledElement.textContent = scrambled;

  scrambledElement.className =
    mode === "arabic"
      ? "scrambled arabic"
      : "scrambled";

  const input =
    document.getElementById("answerInput");

  input.value = "";

  input.className =
    mode === "arabic"
      ? "arabic-input"
      : "";

  input.placeholder =
    mode === "arabic"
      ? "جوابتان را بنویس..."
      : "Cavabını yaz...";

  input.focus();

  const difficulty = getDifficulty();

  timeLeft = difficulty.time;

  updateTimer();

  timer = setInterval(() => {

    timeLeft--;

    updateTimer();

    if(timeLeft <= 0){

      clearInterval(timer);

      loseLife();

    }

  },1000);

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

  document
    .getElementById("time")
    .textContent = timeLeft;

  const difficulty =
    getDifficulty();

  const percent =
    Math.max(
      0,
      Math.min(
        100,
        (timeLeft / difficulty.time) * 100
      )
    );

  document
    .getElementById("timerProgress")
    .style.width = percent + "%";

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(){

  if(!currentWord){
    return;
  }

  const input =
    document.getElementById("answerInput");

  const answer =
    input.value.trim();

  if(answer === ""){
    return;
  }


  /*
    مهم:
    در حالت لاتین، حروف بزرگ و کوچک
    اصلاً مهم نیستند.

    مثال:
    Günəş
    günəş
    GÜNƏŞ

    هر سه درست هستند.
  */

  let isCorrect = false;


  if(mode === "latin"){

    const userAnswer =
      answer.toLocaleLowerCase("az-AZ");

    const correctAnswer =
      currentWord.latin
        .toLocaleLowerCase("az-AZ");

    isCorrect =
      userAnswer === correctAnswer;

  }else{

    /*
      در حالت عربی، دقیقاً خود متن عربی
      بررسی می‌شود.
    */

    isCorrect =
      answer === currentWord.arabic;

  }


  /* =================================================
     CORRECT
  ================================================= */

  if(isCorrect){

    clearInterval(timer);

    playCorrectSound();

    const difficulty =
      getDifficulty();

    score += difficulty.points;

    const message =
      document.getElementById("message");

    message.textContent =
      "✅ Düzdür!";

    message.style.color =
      "#4ade80";

    message.classList.remove("wrong");
    message.classList.add("correct");

    updateStats();

    setTimeout(() => {

      message.classList.remove("correct");

      stage++;

      updateStats();

      nextWord();

    },500);


    return;
  }


  /* =================================================
     WRONG
  ================================================= */

  playWrongSound();

  const message =
    document.getElementById("message");

  message.textContent =
    "❌ Səhvdir!";

  message.style.color =
    "#ff6b6b";

  message.classList.remove("correct");
  message.classList.add("wrong");

  input.classList.remove("wrong");

  void input.offsetWidth;

  input.classList.add("wrong");

  loseLife();

}


/* =====================================================
   LOSE LIFE
===================================================== */

function loseLife(){

  clearInterval(timer);

  playWrongSound();

  lives--;

  updateStats();

  if(lives <= 0){

    finishGame();

    return;

  }


  const message =
    document.getElementById("message");

  message.textContent =
    "❌ Bir can itirdin!";

  message.style.color =
    "#ff6b6b";


  setTimeout(() => {

    message.textContent = "";

    nextWord();

  },600);

}


/* =====================================================
   HINT
===================================================== */

function useHint(){

  if(!currentWord){
    return;
  }

  if(score > 5){
    score -= 5;
  }else{
    score = 5;
  }

  updateStats();

  const correct =
    mode === "latin"
      ? currentWord.latin
      : currentWord.arabic;

  const firstLetter =
    Array.from(correct)[0];

  const message =
    document.getElementById("message");

  message.textContent =
    "💡 İlk hərf: " + firstLetter;

  message.style.color =
    "#fbbf24";

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

  document
    .getElementById("stage")
    .textContent = stage;

  document
    .getElementById("score")
    .textContent = score;

  document
    .getElementById("lives")
    .textContent =
      "❤️".repeat(Math.max(0,lives));

}


/* =====================================================
   ENTER KEY
===================================================== */

function handleEnter(event){

  if(event.key === "Enter"){

    event.preventDefault();

    checkAnswer();

  }

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame(){

  clearInterval(timer);

  stopMusic();

  document
    .getElementById("gameScreen")
    .style.display = "none";

  document
    .getElementById("resultScreen")
    .style.display = "block";

  document
    .getElementById("finalScore")
    .textContent = score;


  const oldBest =
    Number(
      localStorage.getItem("sozlerBest") || 0
    );


  if(score > oldBest){

    localStorage.setItem(
      "sozlerBest",
      score
    );

  }


  document
    .getElementById("bestScore")
    .textContent =
      localStorage.getItem("sozlerBest") || score;

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

  startGame();

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  clearInterval(timer);

  stopMusic();

  document
    .getElementById("gameScreen")
    .style.display = "none";

  document
    .getElementById("resultScreen")
    .style.display = "none";

  document
    .getElementById("startScreen")
    .style.display = "block";

}


/* =====================================================
   INITIAL MUSIC BUTTON
===================================================== */

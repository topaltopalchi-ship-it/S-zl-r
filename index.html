<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#07111f;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  direction:rtl;
}

body::before,
body::after{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(70px);
  opacity:.22;
  z-index:-2;
}

body::before{
  top:-80px;
  left:-80px;
  background:#e5a93f;
}

body::after{
  right:-100px;
  bottom:-80px;
  background:#3979d8;
}

button{
  font:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:16px 14px 30px;
}

.screen{display:none}

.screen.active{
  display:block;
  animation:screenIn .45s ease both;
}

@keyframes screenIn{
  from{opacity:0;transform:translateY(15px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:8px 0 18px;
  text-shadow:0 4px 20px rgba(0,0,0,.45);
}

.glass{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.14),
    rgba(255,255,255,.035)
  );
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  box-shadow:
    0 25px 60px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
}

.home-card{
  padding:20px;
}

.mode-title{
  text-align:center;
  margin-bottom:12px;
  opacity:.82;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode-btn{
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:14px;
  color:#fff;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.11),
    rgba(255,255,255,.045)
  );
  font-weight:800;
  touch-action:manipulation;
}

.mode-btn:active{
  transform:scale(.95);
}

.mode-btn.selected{
  background:linear-gradient(
    145deg,
    rgba(226,173,78,.62),
    rgba(170,105,20,.32)
  );
  border-color:#efbd5a;
  box-shadow:0 0 22px rgba(210,145,40,.18);
}

.start-btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:20px;
  color:#fff;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(135deg,#efbd58,#b97618);
  box-shadow:0 12px 28px rgba(190,125,25,.30);
}

.start-btn:active{
  transform:scale(.97);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  text-align:center;
  padding:10px 5px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
}

.stat small{
  display:block;
  opacity:.6;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:18px;
}

.stage-title{
  text-align:center;
  font-weight:900;
  margin:22px 0 12px;
}

.stage-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.stage-btn{
  min-height:52px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:17px;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.035)
  );
  color:#fff;
  font-weight:900;
}

.stage-btn.current{
  border:2px solid #efbd5a;
  box-shadow:0 0 18px rgba(235,177,70,.22);
}

.stage-btn.locked{
  opacity:.32;
}

.stage-info{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  opacity:.65;
}

.game-top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.top-box{
  text-align:center;
  padding:10px 4px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
}

.top-box small{
  display:block;
  opacity:.55;
  font-size:10px;
}

.top-box strong{
  display:block;
  margin-top:3px;
}

.game-card{
  padding:16px;
}

.word-slots{
  min-height:78px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.answer-word{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
}

.answer-word.arabic{
  direction:ltr;
  flex-direction:row-reverse;
}

.answer-slot{
  width:36px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  font-size:20px;
  font-weight:900;
}

.answer-slot.found{
  background:linear-gradient(
    145deg,
    rgba(74,190,118,.48),
    rgba(40,125,75,.22)
  );
  border-color:rgba(110,230,150,.70);
}

.current-word{
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:5px 0 14px;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}

.letters-area{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letter{
  aspect-ratio:1;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:22px;
  color:#fff;
  font-size:25px;
  font-weight:900;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.18),
    rgba(255,255,255,.055)
  );
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    0 9px 20px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.10);
  touch-action:none;
  user-select:none;
}

.letter.selected{
  transform:scale(.88) translateY(-2px);
  background:linear-gradient(
    145deg,
    rgba(236,181,72,.90),
    rgba(178,112,20,.68)
  );
  border-color:#ffd978;
}

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.action-btn{
  border:0;
  border-radius:19px;
  padding:14px 5px;
  color:#fff;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.10),
    rgba(255,255,255,.045)
  );
  font-weight:900;
}

.action-btn:active{
  transform:scale(.94);
}

.check-btn{
  background:linear-gradient(135deg,#efbd58,#b97618);
}

.hint-btn{
  background:rgba(214,155,50,.22);
}

.message{
  min-height:28px;
  margin-top:12px;
  text-align:center;
  font-weight:800;
}

.correct{color:#9cf0b9}
.wrong{color:#ffaaa0}

.shake{
  animation:shake .38s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(4px)}
}

.music-btn{
  position:fixed;
  right:14px;
  bottom:14px;
  width:50px;
  height:50px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:rgba(255,255,255,.10);
  color:#fff;
  font-size:20px;
  z-index:20;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.68);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:390px;
  padding:25px;
  text-align:center;
  border-radius:28px;
  background:linear-gradient(
    145deg,
    #20384d,
    #122333
  );
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.modal-card h2{
  margin-top:0;
}

.modal-card p{
  line-height:1.8;
  opacity:.8;
}

.modal-card button{
  width:100%;
  border:0;
  border-radius:17px;
  padding:14px;
  margin-top:8px;
  color:#fff;
  background:linear-gradient(135deg,#e0a53d,#b87818);
  font-weight:900;
}

@media(max-width:360px){
  .letter{
    font-size:21px;
    border-radius:17px;
  }

  .answer-slot{
    width:32px;
    height:39px;
    font-size:18px;
  }
}
</style>
</head>

<body>

<audio id="music" loop preload="auto">
  <source src="./ays%C9%99l.mp3" type="audio/mpeg">
</audio>

<div class="app">

<section id="homeScreen" class="screen active">

  <div class="logo">حیدربابا</div>

  <div class="glass home-card">

    <div class="mode-title">
      الفبا را انتخاب کنید
    </div>

    <div class="mode-buttons">

      <button id="latinBtn" class="mode-btn selected">
        🇮🇷 لاتین
      </button>

      <button id="arabicBtn" class="mode-btn">
        🇮🇷 فارسی
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <small>مرحله</small>
        <strong id="homeStage">1</strong>
      </div>

      <div class="stat">
        <small>سکه</small>
        <strong id="homeCoins">0</strong>
      </div>

      <div class="stat">
        <small>امتیاز</small>
        <strong id="homeScore">0</strong>
      </div>

    </div>

    <button id="continueBtn" class="start-btn">
      شروع بازی
    </button>

    <div class="stage-title">
      مراحل
    </div>

    <div id="stageGrid" class="stage-grid"></div>

    <div id="stageInfo" class="stage-info"></div>

  </div>

</section>

<section id="gameScreen" class="screen">

  <div class="logo" style="font-size:30px;">
    حیدربابا
  </div>

  <div class="game-top">

    <div class="top-box">
      <small>مرحله</small>
      <strong id="gameStage">1</strong>
    </div>

    <div class="top-box">
      <small>سکه</small>
      <strong id="gameCoins">0</strong>
    </div>

    <div class="top-box">
      <small>جان</small>
      <strong id="gameLives">❤️❤️❤️</strong>
    </div>

  </div>

  <div class="glass game-card">

    <div id="wordSlots" class="word-slots"></div>

    <div id="currentWord" class="current-word"></div>

    <div id="lettersArea" class="letters-area"></div>

    <div class="game-actions">

      <button id="clearBtn" class="action-btn">
        پاک کردن
      </button>

      <button id="checkBtn" class="action-btn check-btn">
        بررسی
      </button>

      <button id="shuffleBtn" class="action-btn">
        درهم‌ریختن
      </button>

    </div>

    <div id="message" class="message"></div>

    <button
      id="hintBtn"
      class="action-btn hint-btn"
      style="width:100%;margin-top:10px;"
    >
      💡 راهنما
    </button>

  </div>

</section>

</div>

<button id="musicBtn" class="music-btn">
  🔊
</button>

<div id="modal" class="modal">

  <div class="modal-card">

    <h2 id="modalTitle"></h2>

    <p id="modalText"></p>

    <button id="modalAction"></button>

  </div>

</div>

<script>

const stages = [

{
latinLetters:["a","t","a","n"],
arabicLetters:["ا","ت","ا","ن"],
latinAnswers:["ata","ana"],
arabicAnswers:["اتا","انا"]
},

{
latinLetters:["a","l","m","a"],
arabicLetters:["ا","ل","م","ا"],
latinAnswers:["alma","al"],
arabicAnswers:["الما","ال"]
},

{
latinLetters:["g","ü","n"],
arabicLetters:["گ","و","ن"],
latinAnswers:["gün"],
arabicAnswers:["گون"]
},

{
latinLetters:["g","ü","n","ə","ş"],
arabicLetters:["گ","و","ن","ش"],
latinAnswers:["gün","günəş"],
arabicAnswers:["گون","گونش"]
},

{
latinLetters:["ç","ö","r","ə","k"],
arabicLetters:["چ","و","ر","ک"],
latinAnswers:["çörək"],
arabicAnswers:["چورک"]
},

{
latinLetters:["g","ü","l"],
arabicLetters:["گ","و","ل"],
latinAnswers:["gül"],
arabicAnswers:["گول"]
},

{
latinLetters:["a","ğ","a","c"],
arabicLetters:["ا","غ","ا","ج"],
latinAnswers:["ağac","ağ"],
arabicAnswers:["اغاج","اغ"]
},

{
latinLetters:["g","ö","z","a"],
arabicLetters:["گ","و","ز","ا"],
latinAnswers:["göz","öz"],
arabicAnswers:["گوز","اوز"]
},

{
latinLetters:["q","a","r","a"],
arabicLetters:["ق","ا","ر","ا"],
latinAnswers:["qara","qar","ara"],
arabicAnswers:["قارا","قار","ارا"]
},

{
latinLetters:["d","a","ş"],
arabicLetters:["د","ا","ش"],
latinAnswers:["daş","aş"],
arabicAnswers:["داش","اش"]
},

{
latinLetters:["s","u"],
arabicLetters:["س","و"],
latinAnswers:["su"],
arabicAnswers:["سو"]
},

{
latinLetters:["a","y"],
arabicLetters:["آ","ی"],
latinAnswers:["ay"],
arabicAnswers:["آی"]
},

{
latinLetters:["d","o","s","t"],
arabicLetters:["د","و","س","ت"],
latinAnswers:["dost"],
arabicAnswers:["دوست"]
},

{
latinLetters:["g","e","c","ə"],
arabicLetters:["گ","ئ","ج","ه"],
latinAnswers:["gecə"],
arabicAnswers:["گئجه"]
},

{
latinLetters:["s","e","v"],
arabicLetters:["س","ئ","و"],
latinAnswers:["sev"],
arabicAnswers:["سئو"]
},

{
latinLetters:["s","e","v","g","i"],
arabicLetters:["س","ئ","و","گ","ی"],
latinAnswers:["sevgi"],
arabicAnswers:["سئوگی"]
},

{
latinLetters:["b","a","l"],
arabicLetters:["ب","ا","ل"],
latinAnswers:["bal"],
arabicAnswers:["بال"]
},

{
latinLetters:["d","a","ğ"],
arabicLetters:["د","ا","غ"],
latinAnswers:["dağ"],
arabicAnswers:["داغ"]
},

{
latinLetters:["y","o","l"],
arabicLetters:["ی","و","ل"],
latinAnswers:["yol"],
arabicAnswers:["یول"]
},

{
latinLetters:["e","l"],
arabicLetters:["ا","ئ","ل"],
latinAnswers:["el"],
arabicAnswers:["ائل"]
}

];

let mode=localStorage.getItem("hb_mode")||"latin";
let coins=Number(localStorage.getItem("hb_coins")||0);
let score=Number(localStorage.getItem("hb_score")||0);
let unlockedStage=Number(localStorage.getItem("hb_unlockedStage")||1);
let selectedStage=Number(localStorage.getItem("hb_selectedStage")||1);

let lives=3;
let currentLetters=[];
let currentWord="";
let selectedIndexes=[];
let foundWords=[];
let dragging=false;
let activePointerId=null;
let gameOver=false;
let modalActionType="";

if(unlockedStage<1) unlockedStage=1;
if(unlockedStage>stages.length) unlockedStage=stages.length;
if(selectedStage<1) selectedStage=1;
if(selectedStage>unlockedStage) selectedStage=unlockedStage;

const music=document.getElementById("music");
const homeScreen=document.getElementById("homeScreen");
const gameScreen=document.getElementById("gameScreen");
const latinBtn=document.getElementById("latinBtn");
const arabicBtn=document.getElementById("arabicBtn");
const continueBtn=document.getElementById("continueBtn");
const stageGrid=document.getElementById("stageGrid");
const stageInfo=document.getElementById("stageInfo");
const homeStage=document.getElementById("homeStage");
const homeCoins=document.getElementById("homeCoins");
const homeScore=document.getElementById("homeScore");
const gameStage=document.getElementById("gameStage");
const gameCoins=document.getElementById("gameCoins");
const gameLives=document.getElementById("gameLives");
const wordSlots=document.getElementById("wordSlots");
const currentWordEl=document.getElementById("currentWord");
const lettersArea=document.getElementById("lettersArea");
const message=document.getElementById("message");
const clearBtn=document.getElementById("clearBtn");
const checkBtn=document.getElementById("checkBtn");
const shuffleBtn=document.getElementById("shuffleBtn");
const hintBtn=document.getElementById("hintBtn");
const modal=document.getElementById("modal");
const modalTitle=document.getElementById("modalTitle");
const modalText=document.getElementById("modalText");
const modalAction=document.getElementById("modalAction");
const musicBtn=document.getElementById("musicBtn");

function save(){
  localStorage.setItem("hb_mode",mode);
  localStorage.setItem("hb_coins",coins);
  localStorage.setItem("hb_score",score);
  localStorage.setItem("hb_unlockedStage",unlockedStage);
  localStorage.setItem("hb_selectedStage",selectedStage);
}

function setMode(newMode){
  mode=newMode;
  latinBtn.classList.toggle("selected",mode==="latin");
  arabicBtn.classList.toggle("selected",mode==="arabic");
  save();
}

latinBtn.onclick=()=>setMode("latin");
arabicBtn.onclick=()=>setMode("arabic");

function updateHome(){
  homeStage.textContent=selectedStage;
  homeCoins.textContent=coins;
  homeScore.textContent=score;
}

function renderStages(){

  stageGrid.innerHTML="";

  for(let i=0;i<stages.length;i++){

    const number=i+1;
    const btn=document.createElement("button");

    btn.className="stage-btn";

    if(number<=unlockedStage){

      btn.textContent=number;

      if(number===selectedStage){
        btn.classList.add("current");
      }

      btn.onclick=()=>{
        selectedStage=number;
        save();
        updateHome();
        renderStages();
      };

    }else{

      btn.classList.add("locked");
      btn.textContent="🔒";

    }

    stageGrid.appendChild(btn);
  }

  stageInfo.textContent=
    `${unlockedStage} / ${stages.length} مرحله باز است`;
}

continueBtn.onclick=()=>{
  startGame(selectedStage);
};

function startGame(stageNumber){

  if(stageNumber<1||stageNumber>unlockedStage)return;

  selectedStage=stageNumber;
  lives=3;
  foundWords=[];
  currentWord="";
  selectedIndexes=[];
  dragging=false;
  activePointerId=null;
  gameOver=false;

  message.textContent="";
  message.className="message";

  homeScreen.classList.remove("active");
  gameScreen.classList.add("active");

  loadStage();
  startMusic();
  save();
}

function loadStage(){

  const stage=stages[selectedStage-1];

  currentLetters=
    mode==="latin"
    ? [...stage.latinLetters]
    : [...stage.arabicLetters];

  shuffleArray(currentLetters);

  gameStage.textContent=selectedStage;
  gameCoins.textContent=coins;

  updateLives();
  renderSlots();
  renderLetters();
  clearCurrentWord();
}

function getAnswers(){

  const stage=stages[selectedStage-1];

  return mode==="latin"
    ? stage.latinAnswers
    : stage.arabicAnswers;
}

function renderSlots(){

  wordSlots.innerHTML="";

  getAnswers().forEach(answer=>{

    const word=document.createElement("div");
    word.className="answer-word";

    if(mode==="arabic"){
      word.classList.add("arabic");
    }

    [...answer].forEach(letter=>{

      const slot=document.createElement("div");

      slot.className=
        foundWords.includes(answer)
        ?"answer-slot found"
        :"answer-slot";

      if(foundWords.includes(answer)){
        slot.textContent=letter;
      }

      word.appendChild(slot);
    });

    wordSlots.appendChild(word);
  });
}

function renderLetters(){

  lettersArea.innerHTML="";

  currentLetters.forEach((letter,index)=>{

    const el=document.createElement("div");

    el.className="letter";
    el.dataset.index=index;
    el.textContent=letter;

    lettersArea.appendChild(el);
  });
}

lettersArea.addEventListener("pointerdown",e=>{

  if(gameOver)return;

  const letter=e.target.closest(".letter");
  if(!letter)return;

  e.preventDefault();

  dragging=true;
  activePointerId=e.pointerId;

  clearCurrentWord();

  try{
    lettersArea.setPointerCapture(e.pointerId);
  }catch(err){}

  addLetter(Number(letter.dataset.index));

},{passive:false});

lettersArea.addEventListener("pointermove",e=>{

  if(!dragging)return;
  if(activePointerId!==e.pointerId)return;

  e.preventDefault();

  const element=document.elementFromPoint(
    e.clientX,
    e.clientY
  );

  if(!element)return;

  const letter=element.closest(".letter");
  if(!letter)return;

  addLetter(Number(letter.dataset.index));

},{passive:false});

lettersArea.addEventListener("pointerup",e=>{

  if(activePointerId!==e.pointerId)return;

  e.preventDefault();

  dragging=false;

  try{
    if(lettersArea.hasPointerCapture(e.pointerId)){
      lettersArea.releasePointerCapture(e.pointerId);
    }
  }catch(err){}

  activePointerId=null;

},{passive:false});

lettersArea.addEventListener("pointercancel",e=>{

  dragging=false;
  activePointerId=null;

},{passive:false});

function addLetter(index){

  if(selectedIndexes.includes(index))return;

  selectedIndexes.push(index);

  currentWord+=currentLetters[index];

  currentWordEl.textContent=currentWord;

  const elements=lettersArea.querySelectorAll(".letter");

  if(elements[index]){
    elements[index].classList.add("selected");
  }
}

function clearCurrentWord(){

  currentWord="";
  selectedIndexes=[];
  currentWordEl.textContent="";

  lettersArea.querySelectorAll(".letter")
    .forEach(el=>{
      el.classList.remove("selected");
    });
}

checkBtn.onclick=checkWord;

function checkWord(){

  if(!currentWord){

    message.textContent="ابتدا حروف را انتخاب کنید.";
    message.className="message wrong";

    return;
  }

  const answers=getAnswers();

  if(
    answers.includes(currentWord)&&
    !foundWords.includes(currentWord)
  ){

    foundWords.push(currentWord);

    score+=10;
    coins+=1;

    playCorrectSound();

    message.textContent="درست است! 👏";
    message.className="message correct";

    renderSlots();
    updateGameStats();
    clearCurrentWord();

    if(foundWords.length===answers.length){

      setTimeout(finishStage,500);
    }

  }else{

    playWrongSound();

    message.textContent="این کلمه درست نیست.";
    message.className="message wrong";

    lettersArea.classList.remove("shake");
    void lettersArea.offsetWidth;
    lettersArea.classList.add("shake");

    clearCurrentWord();

    loseLife();
  }
}

function loseLife(){

  lives--;

  updateLives();

  if(lives<=0){
    setTimeout(showGameOver,300);
  }
}

function updateLives(){

  gameLives.textContent=
    "❤️".repeat(lives)+
    "🖤".repeat(3-lives);
}

function updateGameStats(){

  gameCoins.textContent=coins;
  save();
}

function finishStage(){

  score+=10;
  coins+=5;

  if(
    selectedStage===unlockedStage&&
    unlockedStage<stages.length
  ){
    unlockedStage++;
  }

  save();
  updateHome();
  renderStages();

  if(selectedStage<stages.length){

    showModal(
      "عالی! 🎉",
      `مرحله ${selectedStage} کامل شد.<br>
       ۵ سکه دریافت کردید.<br>
       مرحله بعد باز شد.`,
      "مرحله بعد",
      "next"
    );

  }else{

    showModal(
      "تبریک! 🎉",
      `همه ${stages.length} مرحله را کامل کردید.<br>
       🏆 بازی را کامل کردید!<br>
       اگر بخواهید می‌توانید مرحله ۲۰ را دوباره بازی کنید.`,
      "مرحله ۲۰",
      "final"
    );
  }
}

function showGameOver(){

  gameOver=true;

  showModal(
    "جان‌ها تمام شد ❤️",
    "می‌توانید این مرحله را دوباره امتحان کنید.",
    "تلاش دوباره",
    "retry"
  );
}

function showModal(
  title,
  text,
  buttonText,
  actionType
){

  modalTitle.textContent=title;
  modalText.innerHTML=text;
  modalAction.textContent=buttonText;
  modalActionType=actionType;

  modal.classList.add("show");
}

modalAction.onclick=()=>{

  modal.classList.remove("show");

  if(modalActionType==="next"){

    selectedStage++;
    save();
    startGame(selectedStage);

  }else if(modalActionType==="retry"){

    startGame(selectedStage);

  }else if(modalActionType==="final"){

    selectedStage=stages.length;
    save();
    startGame(stages.length);
  }
};

clearBtn.onclick=clearCurrentWord;

shuffleBtn.onclick=()=>{

  shuffleArray(currentLetters);
  clearCurrentWord();
  renderLetters();
};

function shuffleArray(array){

  for(let i=array.length-1;i>0;i--){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [array[i],array[j]]=
      [array[j],array[i]];
  }
}

hintBtn.onclick=()=>{

  if(coins<10){

    message.textContent=
      "برای راهنما ۱۰ سکه لازم است.";

    message.className="message wrong";

    return;
  }

  const remaining=getAnswers().filter(
    word=>!foundWords.includes(word)
  );

  if(!remaining.length)return;

  coins-=10;

  gameCoins.textContent=coins;

  save();

  message.textContent=
    `راهنما: ${remaining[0].charAt(0)}...`;

  message.className="message";
};

async function startMusic(){

  try{

    music.volume=.75;
    await music.play();
    musicBtn.textContent="🔊";

  }catch(err){

    musicBtn.textContent="🔇";
  }
}

musicBtn.onclick=async()=>{

  if(music.paused){

    try{

      await music.play();
      musicBtn.textContent="🔊";

    }catch(err){

      musicBtn.textContent="🔇";
    }

  }else{

    music.pause();
    musicBtn.textContent="🔇";
  }
};

function playCorrectSound(){

  try{

    const AudioContext=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioContext)return;

    const ctx=new AudioContext();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.frequency.value=720;

    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .18,
      ctx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+.22
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime+.23);

  }catch(err){}
}

function playWrongSound(){

  try{

    const AudioContext=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioContext)return;

    const ctx=new AudioContext();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.frequency.value=180;

    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .13,
      ctx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+.18
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime+.19);

  }catch(err){}
}

setMode(mode);
updateHome();
renderStages();

</script>

</body>
</html>

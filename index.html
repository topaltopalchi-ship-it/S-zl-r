<!DOCTYPE html>
<html lang="az" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#172033">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,"Noto Sans",sans-serif;
  background:
    radial-gradient(circle at top,#354866 0,#182236 42%,#0d1422 100%);
  color:#fff;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.hidden{
  display:none!important;
}

/* ---------- HOME ---------- */

#home{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.home-card{
  width:min(430px,100%);
  padding:30px 22px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:30px;
  background:rgba(255,255,255,.09);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(0,0,0,.35);
  text-align:center;
}

.logo{
  font-size:46px;
  font-weight:900;
  margin-bottom:8px;
  text-shadow:0 5px 20px rgba(0,0,0,.4);
}

.subtitle{
  opacity:.8;
  margin-bottom:28px;
}

.mode-title{
  font-size:14px;
  opacity:.75;
  margin-bottom:12px;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode-btn,
.start-btn{
  border:0;
  border-radius:18px;
  padding:15px;
  color:#fff;
  cursor:pointer;
  font-weight:800;
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 1px rgba(255,255,255,.15);
}

.mode-btn.active{
  background:linear-gradient(135deg,#b98536,#e0b15e);
}

.start-btn{
  width:100%;
  margin-top:18px;
  background:linear-gradient(135deg,#c58b36,#e4b75f);
  font-size:18px;
}

.music-home{
  margin-top:18px;
  opacity:.85;
  font-size:14px;
}

/* ---------- GAME ---------- */

#game{
  min-height:100vh;
  padding:12px;
}

.game-shell{
  width:min(520px,100%);
  margin:auto;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.top-box{
  min-height:48px;
  padding:8px 10px;
  border-radius:16px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:800;
}

.top-box:first-child{
  justify-content:flex-start;
}

.top-box:last-child{
  justify-content:flex-end;
}

.stage-number{
  font-size:18px;
}

.small-btn{
  border:0;
  background:rgba(255,255,255,.1);
  color:#fff;
  width:42px;
  height:42px;
  border-radius:14px;
  cursor:pointer;
}

/* ---------- STAGE IMAGE ---------- */

.stage-card{
  position:relative;
  height:145px;
  overflow:hidden;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.15);
  background:
    linear-gradient(135deg,#425675,#1c283b);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
  margin-bottom:12px;
}

.stage-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(5,10,20,.12),
      rgba(5,10,20,.68)
    );
  pointer-events:none;
}

.stage-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  opacity:.95;
}

.stage-image-label{
  position:absolute;
  z-index:2;
  left:16px;
  right:16px;
  bottom:13px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  text-shadow:0 3px 12px rgba(0,0,0,.8);
}

/* ---------- ANSWERS ---------- */

.answers-card{
  padding:13px;
  border-radius:22px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.12);
  margin-bottom:12px;
}

.answers{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  min-height:38px;
}

.answer{
  min-width:62px;
  padding:8px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.48);
  font-size:15px;
  font-weight:800;
  text-align:center;
}

.answer.found{
  color:#fff;
  background:rgba(211,164,75,.28);
  border:1px solid rgba(232,190,105,.5);
}

/* ---------- CURRENT WORD ---------- */

.current-word{
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:8px 0 10px;
  border-radius:16px;
  background:rgba(0,0,0,.18);
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

/* ---------- LETTERS ---------- */

.letters-card{
  padding:18px 12px;
  border-radius:28px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.2);
  touch-action:none;
}

.letters{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letter{
  width:62px;
  height:62px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:900;
  color:#fff;
  background:
    linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));
  border:1px solid rgba(255,255,255,.2);
  box-shadow:
    0 8px 20px rgba(0,0,0,.2),
    inset 0 1px rgba(255,255,255,.2);
  transition:.12s;
  touch-action:none;
}

.letter.selected{
  transform:translateY(-5px) scale(1.05);
  background:linear-gradient(145deg,#d2a34f,#9d6e25);
  box-shadow:0 12px 25px rgba(0,0,0,.35);
}

.letter.wrong{
  animation:shake .35s;
}

.letter.correct{
  animation:pop .35s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

@keyframes pop{
  50%{transform:scale(1.16)}
}

/* ---------- CONTROLS ---------- */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.control{
  min-height:48px;
  border:0;
  border-radius:16px;
  color:#fff;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  cursor:pointer;
}

.control.primary{
  background:linear-gradient(135deg,#bd8737,#dfb05e);
}

.control:active,
.small-btn:active,
.mode-btn:active,
.start-btn:active{
  transform:scale(.97);
}

/* ---------- STATUS ---------- */

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
  padding:10px 13px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  font-size:14px;
}

.lives{
  letter-spacing:3px;
}

.coins{
  font-weight:800;
}

/* ---------- MODAL ---------- */

.modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(3,7,14,.72);
  backdrop-filter:blur(8px);
}

.modal-card{
  width:min(380px,100%);
  padding:28px 22px;
  border-radius:28px;
  background:#1d283b;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  text-align:center;
}

.modal-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
}

.modal-text{
  opacity:.8;
  line-height:1.7;
}

.modal-buttons{
  display:grid;
  gap:9px;
  margin-top:20px;
}

.modal-buttons button{
  border:0;
  border-radius:16px;
  padding:14px;
  color:#fff;
  font-weight:800;
  background:rgba(255,255,255,.1);
}

.modal-buttons .primary{
  background:linear-gradient(135deg,#bd8737,#dfb05e);
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:380px){
  .letter{
    width:55px;
    height:55px;
    font-size:25px;
    border-radius:17px;
  }

  .letters{
    gap:8px;
  }

  .stage-card{
    height:125px;
  }

  .logo{
    font-size:40px;
  }
}

@media(min-width:700px){
  #game{
    padding-top:25px;
  }

  .stage-card{
    height:170px;
  }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="home">
  <div class="home-card">

    <div class="logo">حیدربابا</div>

    <div class="subtitle">
      Azərbaycan söz oyunu
    </div>

    <div class="mode-title">
      Əlifba seç
    </div>

    <div class="mode-buttons">
      <button class="mode-btn active" id="latinMode">
        🇮🇷 Latin
      </button>

      <button class="mode-btn" id="arabicMode">
        🇮🇷 Ərəb
      </button>
    </div>

    <button class="start-btn" id="startBtn">
      Oyuna başla
    </button>

    <div class="music-home">
      🎵 Musiqi: Aysəl
    </div>

  </div>
</section>


<!-- ================= GAME ================= -->

<section id="game" class="hidden">

  <div class="game-shell">

    <div class="topbar">

      <div class="top-box">
        <span>🪙</span>
        <span id="coinTop">0</span>
      </div>

      <div class="top-box stage-number">
        <span>مراحل</span>
        <span id="stageTop">1</span>
      </div>

      <div class="top-box">
        <button class="small-btn" id="musicBtn">🔊</button>
      </div>

    </div>


    <!-- IMAGE AREA -->

    <div class="stage-card">

      <img
        id="stageImage"
        class="stage-image"
        alt="Şəkil"
      >

      <div id="stageImageLabel" class="stage-image-label">
        Hər mərhələnin öz hekayəsi
      </div>

    </div>


    <!-- ANSWERS -->

    <div class="answers-card">

      <div id="answers" class="answers"></div>

      <div id="currentWord" class="current-word"></div>

    </div>


    <!-- LETTERS -->

    <div class="letters-card">

      <div id="letters" class="letters"></div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

      <button class="control" id="clearBtn">
        Təmizlə
      </button>

      <button class="control primary" id="submitBtn">
        Yoxla
      </button>

      <button class="control" id="shuffleBtn">
        Qarışdır
      </button>

    </div>


    <!-- STATUS -->

    <div class="status">

      <div class="lives" id="lives">
        ❤️❤️❤️
      </div>

      <div class="coins">
        🪙 <span id="coinBottom">0</span>
      </div>

      <button class="control" id="hintBtn" style="min-height:38px;padding:7px 12px;">
        💡 İpucu
      </button>

    </div>

  </div>

</section>


<!-- ================= MODAL ================= -->

<div id="modal" class="modal hidden">

  <div class="modal-card">

    <div id="modalTitle" class="modal-title">
      Təbriklər!
    </div>

    <div id="modalText" class="modal-text">
      Mərhələ tamamlandı.
    </div>

    <div class="modal-buttons">

      <button class="primary" id="nextBtn">
        Növbəti mərhələ
      </button>

      <button id="restartBtn">
        Yenidən oyna
      </button>

      <button id="homeBtn">
        Əsas menyu
      </button>

    </div>

  </div>

</div>


<!-- ================= MUSIC ================= -->

<audio
  id="music"
  preload="auto"
  loop
  playsinline
  src="ays%C9%99l.mp3">
</audio>


<script>

/* =========================================================
   GAME DATA
   ========================================================= */

const stages = [

  {
    latinLetters:["a","t","a","n"],
    arabicLetters:["ا","ت","ا","ن"],

    latinAnswers:["ata","ana","an"],
    arabicAnswers:["اتا","انا","ان"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage1.jpg",
    title:"Köhnə kənd"
  },

  {
    latinLetters:["a","l","s"],
    arabicLetters:["ا","ل","س"],

    latinAnswers:["al","sal","as"],
    arabicAnswers:["ال","سال","اس"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage2.jpg",
    title:"Azərbaycan həyəti"
  },

  {
    latinLetters:["g","ü","n","ə","ş"],
    arabicLetters:["گ","و","ن","ش","ا"],

    latinAnswers:["gün","günəş","şən"],
    arabicAnswers:["گون","گونش","شن"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage3.jpg",
    title:"Günəşli dağlar"
  },

  {
    latinLetters:["ç","ö","r","ə","k"],
    arabicLetters:["چ","و","ر","ک"],

    latinAnswers:["çörək","kör"],
    arabicAnswers:["چورک","کور"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage4.jpg",
    title:"Ənənəvi çörək"
  },

  {
    latinLetters:["g","ü","l","ə"],
    arabicLetters:["گ","و","ل","ا"],

    latinAnswers:["gül","gəl","əl"],
    arabicAnswers:["گول","گل","ال"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage5.jpg",
    title:"Güllü bağ"
  },

  {
    latinLetters:["a","ğ","a","c"],
    arabicLetters:["ا","غ","ا","ج"],

    latinAnswers:["ağac","ağ","ac"],
    arabicAnswers:["اغاج","اغ","اج"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage6.jpg",
    title:"Qədim yol"
  },

  {
    latinLetters:["g","ö","z"],
    arabicLetters:["گ","و","ز"],

    latinAnswers:["göz","öz"],
    arabicAnswers:["گوز","اوز"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage7.jpg",
    title:"Qədim şəhər"
  },

  {
    latinLetters:["q","a","r","a"],
    arabicLetters:["ق","ا","ر","ا"],

    latinAnswers:["qar","qara","ara"],
    arabicAnswers:["قار","قارا","ارا"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage8.jpg",
    title:"Qala yolu"
  },

  {
    latinLetters:["d","a","ş"],
    arabicLetters:["د","ا","ش"],

    latinAnswers:["daş","aş"],
    arabicAnswers:["داش","اش"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage9.jpg",
    title:"Dağ kəndi"
  },

  {
    latinLetters:["s","e","v","i"],
    arabicLetters:["س","ئ","و","ی"],

    latinAnswers:["sev","sevi"],
    arabicAnswers:["سئو","سئوی"],

    latinBonus:[],
    arabicBonus:[],

    image:"images/stage10.jpg",
    title:"Mərhələ 10"
  }

];


/* =========================================================
   STATE
   ========================================================= */

let mode = localStorage.getItem("mode") || "latin";

let stageIndex =
  Number(localStorage.getItem("stageIndex") || 0);

let coins =
  Number(localStorage.getItem("coins") || 0);

let score =
  Number(localStorage.getItem("score") || 0);

let lives = 3;

let selected = [];

let found = [];

let dragging = false;

let pointerId = null;

let lastCompletedStage = 0;


/* =========================================================
   ELEMENTS
   ========================================================= */

const home = document.getElementById("home");
const game = document.getElementById("game");

const startBtn = document.getElementById("startBtn");

const latinMode = document.getElementById("latinMode");
const arabicMode = document.getElementById("arabicMode");

const lettersEl = document.getElementById("letters");
const answersEl = document.getElementById("answers");

const currentWordEl =
  document.getElementById("currentWord");

const coinTop =
  document.getElementById("coinTop");

const coinBottom =
  document.getElementById("coinBottom");

const stageTop =
  document.getElementById("stageTop");

const livesEl =
  document.getElementById("lives");

const stageImage =
  document.getElementById("stageImage");

const stageImageLabel =
  document.getElementById("stageImageLabel");

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

const clearBtn =
  document.getElementById("clearBtn");

const submitBtn =
  document.getElementById("submitBtn");

const shuffleBtn =
  document.getElementById("shuffleBtn");

const hintBtn =
  document.getElementById("hintBtn");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const nextBtn =
  document.getElementById("nextBtn");

const restartBtn =
  document.getElementById("restartBtn");

const homeBtn =
  document.getElementById("homeBtn");


/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;

function playTone(type){

  try{

    if(!audioContext){
      audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.connect(gain);
    gain.connect(audioContext.destination);

    if(type === "correct"){
      osc.frequency.value = 660;
      gain.gain.value = .06;
    }else{
      osc.frequency.value = 170;
      gain.gain.value = .05;
    }

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .18
    );

    osc.stop(
      audioContext.currentTime + .18
    );

  }catch(e){}

}


/* =========================================================
   MUSIC
   ========================================================= */

function startMusic(){

  music.volume = .32;

  music.play()
    .then(()=>{
      musicBtn.textContent="🔊";
      localStorage.setItem("music","on");
    })
    .catch(()=>{
      musicBtn.textContent="🔇";
    });

}

function toggleMusic(){

  if(music.paused){

    startMusic();

  }else{

    music.pause();

    musicBtn.textContent="🔇";

    localStorage.setItem("music","off");
  }

}

musicBtn.addEventListener("click",toggleMusic);


/* =========================================================
   MODE
   ========================================================= */

function setMode(newMode){

  mode = newMode;

  latinMode.classList.toggle(
    "active",
    mode === "latin"
  );

  arabicMode.classList.toggle(
    "active",
    mode === "arabic"
  );

  document.documentElement.dir =
    mode === "arabic" ? "rtl" : "ltr";

  localStorage.setItem("mode",mode);

  if(!game.classList.contains("hidden")){
    loadStage();
  }

}

latinMode.addEventListener(
  "click",
  ()=>setMode("latin")
);

arabicMode.addEventListener(
  "click",
  ()=>setMode("arabic")
);


/* =========================================================
   HELPERS
   ========================================================= */

function getLetters(){

  return mode === "latin"
    ? stages[stageIndex].latinLetters
    : stages[stageIndex].arabicLetters;

}

function getAnswers(){

  return mode === "latin"
    ? stages[stageIndex].latinAnswers
    : stages[stageIndex].arabicAnswers;

}

function getBonus(){

  return mode === "latin"
    ? stages[stageIndex].latinBonus
    : stages[stageIndex].arabicBonus;

}

function save(){

  localStorage.setItem(
    "stageIndex",
    stageIndex
  );

  localStorage.setItem(
    "coins",
    coins
  );

  localStorage.setItem(
    "score",
    score
  );

  localStorage.setItem(
    "mode",
    mode
  );

}

function updateStatus(){

  coinTop.textContent = coins;
  coinBottom.textContent = coins;

  stageTop.textContent =
    stageIndex + 1;

  livesEl.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3-lives);

}

function currentWord(){

  return selected
    .map(i => lettersEl.children[i]?.dataset.letter || "")
    .join("");

}

function clearSelection(){

  selected = [];

  [...lettersEl.children].forEach(
    el => el.classList.remove("selected")
  );

  currentWordEl.textContent = "";

}

function renderAnswers(){

  answersEl.innerHTML = "";

  const answers = getAnswers();

  answers.forEach(word=>{

    const div =
      document.createElement("div");

    div.className = "answer";

    if(found.includes(word)){
      div.classList.add("found");
    }

    div.textContent = word;

    answersEl.appendChild(div);

  });

}


/* =========================================================
   IMAGE
   ========================================================= */

function loadStageImage(){

  const stage = stages[stageIndex];

  stageImageLabel.textContent =
    stage.title;

  stageImage.style.display = "block";

  stageImage.src = stage.image;

  /*
    اگر هنوز تصویر در پوشه images وجود نداشته باشد،
    قاب تصویری باقی می‌ماند و بازی خراب نمی‌شود.
  */

  stageImage.onerror = function(){

    stageImage.style.display = "none";

  };

}


/* =========================================================
   RENDER LETTERS
   ========================================================= */

function renderLetters(){

  lettersEl.innerHTML = "";

  const letters = getLetters();

  letters.forEach((letter,index)=>{

    const div =
      document.createElement("div");

    div.className = "letter";

    div.textContent = letter;

    div.dataset.index = index;
    div.dataset.letter = letter;

    lettersEl.appendChild(div);

  });

}


/* =========================================================
   LOAD STAGE
   ========================================================= */

function loadStage(){

  if(stageIndex >= stages.length){
    stageIndex = stages.length - 1;
  }

  lives = 3;

  selected = [];

  found = [];

  renderLetters();

  renderAnswers();

  currentWordEl.textContent = "";

  loadStageImage();

  updateStatus();

  save();

}


/* =========================================================
   SELECT LETTER
   ========================================================= */

function selectLetter(el){

  if(!el) return;

  const index =
    Number(el.dataset.index);

  if(selected.includes(index)){
    return;
  }

  selected.push(index);

  el.classList.add("selected");

  currentWordEl.textContent =
    currentWord();

}


/* =========================================================
   POINTER DRAG
   ========================================================= */

lettersEl.addEventListener(
  "pointerdown",
  function(e){

    const letter =
      e.target.closest(".letter");

    if(!letter) return;

    e.preventDefault();

    dragging = true;
    pointerId = e.pointerId;

    try{
      lettersEl.setPointerCapture(pointerId);
    }catch(err){}

    clearSelection();

    selectLetter(letter);

  },
  {passive:false}
);


lettersEl.addEventListener(
  "pointermove",
  function(e){

    if(!dragging) return;

    e.preventDefault();

    const element =
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    if(!element) return;

    const letter =
      element.closest(".letter");

    if(
      letter &&
      lettersEl.contains(letter)
    ){

      selectLetter(letter);

    }

  },
  {passive:false}
);


function stopDragging(){

  dragging = false;
  pointerId = null;

}


lettersEl.addEventListener(
  "pointerup",
  stopDragging
);

lettersEl.addEventListener(
  "pointercancel",
  stopDragging
);

document.addEventListener(
  "touchmove",
  function(e){

    if(dragging){
      e.preventDefault();
    }

  },
  {passive:false}
);


/* =========================================================
   SUBMIT
   ========================================================= */

function submitWord(){

  const word =
    currentWord();

  if(!word){
    return;
  }

  const answers = getAnswers();

  const bonus = getBonus();

  if(
    answers.includes(word) &&
    !found.includes(word)
  ){

    found.push(word);

    score += word.length;

    coins += 2;

    playTone("correct");

    [...lettersEl.children].forEach(el=>{

      if(selected.includes(
        Number(el.dataset.index)
      )){
        el.classList.add("correct");
      }

    });

    renderAnswers();

    clearSelection();

    save();

    updateStatus();

    if(found.length === answers.length){

      setTimeout(
        finishStage,
        350
      );

    }

    return;
  }


  if(
    bonus.includes(word)
  ){

    coins += 5;

    score += 5;

    playTone("correct");

    clearSelection();

    save();

    updateStatus();

    return;

  }


  /* wrong */

  lives--;

  playTone("wrong");

  [...lettersEl.children].forEach(el=>{

    if(selected.includes(
      Number(el.dataset.index)
    )){
      el.classList.add("wrong");
    }

  });

  clearSelection();

  updateStatus();

  if(lives <= 0){

    setTimeout(
      gameOver,
      350
    );

  }

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(){

  const children =
    [...lettersEl.children];

  children.sort(
    ()=>Math.random()-.5
  );

  children.forEach(
    child=>lettersEl.appendChild(child)
  );

  clearSelection();

}


/* =========================================================
   HINT
   ========================================================= */

function hint(){

  if(coins < 10){

    alert("İpucu üçün 10 sikkə lazımdır.");

    return;
  }

  const answers = getAnswers();

  const remaining =
    answers.filter(
      word=>!found.includes(word)
    );

  if(!remaining.length) return;

  const word =
    remaining[0];

  coins -= 10;

  score += 1;

  const index =
    answers.indexOf(word);

  const answerElements =
    answersEl.children;

  if(answerElements[index]){

    answerElements[index].style.boxShadow =
      "0 0 0 2px rgba(232,190,105,.75)";

    setTimeout(()=>{

      if(answerElements[index]){
        answerElements[index].style.boxShadow="";
      }

    },1500);

  }

  save();

  updateStatus();

}


/* =========================================================
   FINISH
   ========================================================= */

function finishStage(){

  lastCompletedStage = stageIndex;

  score += 10;

  coins += 5;

  save();

  updateStatus();

  modalTitle.textContent =
    "Təbriklər! 🎉";

  modalText.textContent =
    `Mərhələ ${stageIndex+1} tamamlandı. +5 🪙`;

  modal.classList.remove("hidden");

  if(stageIndex >= stages.length-1){

    nextBtn.textContent =
      "شروع دوباره";

  }else{

    nextBtn.textContent =
      "Növbəti mərhələ";

  }

}


/* =========================================================
   NEXT
   ========================================================= */

nextBtn.addEventListener(
  "click",
  function(){

    modal.classList.add("hidden");

    if(
      lastCompletedStage >=
      stages.length-1
    ){

      stageIndex = 0;
      score = 0;

    }else{

      stageIndex++;

    }

    save();

    loadStage();

  }
);


/* =========================================================
   RESTART
   ========================================================= */

restartBtn.addEventListener(
  "click",
  function(){

    modal.classList.add("hidden");

    stageIndex =
      lastCompletedStage;

    loadStage();

  }
);


/* =========================================================
   HOME
   ========================================================= */

homeBtn.addEventListener(
  "click",
  function(){

    modal.classList.add("hidden");

    game.classList.add("hidden");

    home.classList.remove("hidden");

  }
);


/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver(){

  modalTitle.textContent =
    "جان‌ها تمام شد ❤️‍🩹";

  modalText.textContent =
    "این مرحله را دوباره امتحان کن.";

  nextBtn.textContent =
    "دوباره تلاش کن";

  modal.classList.remove("hidden");

}


/* =========================================================
   BUTTONS
   ========================================================= */

clearBtn.addEventListener(
  "click",
  clearSelection
);

submitBtn.addEventListener(
  "click",
  submitWord
);

shuffleBtn.addEventListener(
  "click",
  shuffle
);

hintBtn.addEventListener(
  "click",
  hint
);


/* =========================================================
   START
   ========================================================= */

startBtn.addEventListener(
  "click",
  function(){

    home.classList.add("hidden");

    game.classList.remove("hidden");

    loadStage();

    /*
      مرورگرهای موبایل اجازه پخش خودکار موسیقی
      بدون تعامل کاربر را نمی‌دهند؛ بنابراین
      همین کلیک شروع بازی بهترین زمان برای
      تلاش جهت پخش موسیقی است.
    */

    startMusic();

  }
);


/* =========================================================
   INIT
   ========================================================= */

setMode(mode);

updateStatus();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f7f3e8, #e8f0ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #222;
}

.container {
  width: 92%;
  max-width: 520px;
  background: white;
  padding: 25px;
  border-radius: 24px;
  box-shadow: 0 10px 35px rgba(0,0,0,.15);
  text-align: center;
}

h1 {
  margin-top: 0;
  font-size: 42px;
  letter-spacing: 3px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: 0;
  border-radius: 14px;
  font-size: 18px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:hover {
  opacity: .9;
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
  font-weight: bold;
}

.scrambled {
  font-size: 35px;
  letter-spacing: 10px;
  margin: 25px 0;
  direction: ltr;
}

.hint {
  background: #f1f1f1;
  padding: 14px;
  border-radius: 12px;
  margin: 15px 0;
}

input {
  width: 100%;
  padding: 15px;
  font-size: 20px;
  border: 2px solid #ddd;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 10px;
}

.message {
  min-height: 28px;
  font-weight: bold;
  margin: 10px 0;
}

.back {
  background: #777;
}

.hidden {
  display: none;
}

/* نمایش حروف عربی */
.arabic-word {
  direction: rtl;
  font-size: 34px;
}

/* حرف Ü: و با علامت ۷ کوچک بالا */
.special-u {
  position: relative;
  display: inline-block;
  padding-top: 8px;
}

.special-u::before {
  content: "۷";
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%) scale(.45);
  font-weight: bold;
}

/* حرف Ö: و با همزه کوچک بالا */
.special-o {
  position: relative;
  display: inline-block;
  padding-top: 8px;
}

.special-o::before {
  content: "ء";
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translateX(-50%) scale(.55);
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <!-- صفحه انتخاب الفبا -->
  <div id="menu">
    <h1>SÖZLƏR</h1>
    <div class="subtitle">Türkçe söz oyunu</div>

    <button onclick="startGame('latin')">
      🇹🇷 Türkçe — Latin əlifbası
    </button>

    <button onclick="startGame('arabic')">
      ☪️ Türkçe — Ərəb əlifbası
    </button>
  </div>

  <!-- بازی -->
  <div id="game" class="hidden">

    <div class="stats">
      <span>⭐ Xal: <span id="score">0</span></span>
      <span>Söz: <span id="number">1</span></span>
    </div>

    <h2 id="wordTitle">Sözü tap</h2>

    <div id="scrambled" class="scrambled"></div>

    <div id="hint" class="hint"></div>

    <input
      id="answer"
      type="text"
      autocomplete="off"
      placeholder="Cavabınızı yazın..."
    >

    <button onclick="checkAnswer()">Yoxla</button>

    <button onclick="showHint()">💡 İpucu</button>

    <div id="message" class="message"></div>

    <button onclick="nextWord()">➡️ Növbəti söz</button>

    <button class="back" onclick="backToMenu()">↩️ Geri</button>

  </div>

</div>

<script>

const words = [

  {
    latin: "günəş",
    arabic: "گۈنەش",
    hint: "Yerə işıq və istilik verir."
  },

  {
    latin: "çörək",
    arabic: "چۆرەک",
    hint: "Süfrədə ən çox istifadə olunan qidalardan biridir."
  },

  {
    latin: "kitab",
    arabic: "کیتاب",
    hint: "Oxumaq üçün istifadə olunur."
  },

  {
    latin: "mektep",
    arabic: "مەکتەپ",
    hint: "Şagirdlərin oxuduğu yer."
  },

  {
    latin: "bulud",
    arabic: "بۇلۇد",
    hint: "Göydə görünür."
  },

  {
    latin: "su",
    arabic: "سۇ",
    hint: "İçmək üçün lazımdır."
  },

  {
    latin: "ev",
    arabic: "ئەۋ",
    hint: "İnsanların yaşadığı yer."
  },

  {
    latin: "qapı",
    arabic: "قاپى",
    hint: "Evə giriş üçün istifadə olunur."
  },

  {
    latin: "çiçək",
    arabic: "چیچەک",
    hint: "Bağlarda və təbiətdə bitir."
  },

  {
    latin: "dəniz",
    arabic: "دەنیز",
    hint: "Çox böyük su sahəsidir."
  }

];

let alphabet = "latin";
let current = 0;
let score = 0;
let hintUsed = false;

function startGame(type) {

  alphabet = type;
  current = 0;
  score = 0;
  hintUsed = false;

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.body.dir = type === "arabic" ? "rtl" : "ltr";

  showWord();
}

function showWord() {

  const item = words[current];

  document.getElementById("score").textContent = score;
  document.getElementById("number").textContent = current + 1;

  document.getElementById("message").textContent = "";

  document.getElementById("answer").value = "";

  hintUsed = false;

  const word = alphabet === "latin"
    ? item.latin
    : item.arabic;

  document.getElementById("scrambled").innerHTML =
    scrambleWord(word);

  document.getElementById("hint").textContent =
    "💡 İpucu üçün düyməyə basın.";

  if (alphabet === "arabic") {
    document.getElementById("scrambled").classList.add("arabic-word");
  } else {
    document.getElementById("scrambled").classList.remove("arabic-word");
  }
}

function scrambleWord(word) {

  /*
   * در حالت عربی، برای اینکه حروف ویژه
   * به شکل جداگانه دیده شوند، فعلاً کلمه
   * به صورت متن عربی نمایش داده می‌شود.
   */

  if (alphabet === "arabic") {
    return word;
  }

  let arr = word.split("");

  for (let i = arr.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr.join(" ");
}

function normalize(text) {

  return text
    .toLowerCase()
    .trim()
    .replace(/ə/g, "ə")
    .replace(/Ə/g, "ə");
}

function checkAnswer() {

  const input = normalize(
    document.getElementById("answer").value
  );

  const correct = normalize(
    alphabet === "latin"
      ? words[current].latin
      : words[current].arabic
  );

  const message = document.getElementById("message");

  if (input === correct) {

    let points = hintUsed ? 5 : 10;

    score += points;

    message.textContent =
      "🎉 Düzdür! +" + points + " xal";

    document.getElementById("score").textContent = score;

  } else {

    message.textContent =
      "❌ Düz deyil. Yenidən cəhd edin.";
  }
}

function showHint() {

  document.getElementById("hint").textContent =
    "💡 " + words[current].hint;

  hintUsed = true;
}

function nextWord() {

  current++;

  if (current >= words.length) {
    current = 0;
  }

  showWord();
}

function backToMenu() {

  document.getElementById("game").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");

  document.body.dir = "ltr";
}

</script>

</body>
</html>

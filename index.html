<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#315f70 0,#102e40 42%,#06131d 100%);
  overflow-x:hidden;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:14px;
}

.screen{
  display:none;
  min-height:calc(100vh - 28px);
}

.screen.active{
  display:flex;
  flex-direction:column;
}


/* =========================
   HOME
========================= */

.logo{
  text-align:center;
  padding:30px 0 20px;
}

.logo .stars{
  color:#ffd166;
  font-size:25px;
}

.logo h1{
  margin:8px 0;
  font-size:52px;
  color:#ffd166;
  text-shadow:0 4px 0 #8d5e00;
}

.logo p{
  margin:0;
  color:#c5d9df;
  font-size:14px;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:27px;
  padding:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
}

.title{
  text-align:center;
  margin-bottom:15px;
  color:#d9e9ee;
}

.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode{
  height:78px;
  border-radius:19px;
  background:rgba(255,255,255,.08);
  color:white;
  border:1px solid rgba(255,255,255,.12);
  font-size:17px;
  font-weight:bold;
}

.mode small{
  display:block;
  margin-top:5px;
  font-size:10px;
  color:#bdd0d7;
}

.mode.selected{
  background:linear-gradient(135deg,#ffd166,#efa900);
  color:#18222b;
}

.mode.selected small{
  color:#263038;
}

.start{
  width:100%;
  height:60px;
  margin-top:16px;
  border-radius:19px;
  background:linear-gradient(135deg,#ffd166,#eea900);
  color:#17212a;
  font-size:21px;
  font-weight:bold;
}

.homeStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.stat{
  text-align:center;
  background:rgba(0,0,0,.15);
  border-radius:17px;
  padding:12px;
}

.stat b{
  display:block;
  color:#ffd166;
  font-size:21px;
}

.stat span{
  color:#b8ccd3;
  font-size:11px;
}

.music{
  margin-top:13px;
  padding:12px;
  border-radius:16px;
  background:rgba(0,0,0,.15);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.musicText{
  color:#bfd2d9;
  font-size:12px;
}

.musicButton{
  width:48px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:18px;
}


/* =========================
   GAME TOP
========================= */

.top{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon{
  width:43px;
  height:43px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:19px;
}

.stage{
  flex:1;
  text-align:center;
}

.stage b{
  display:block;
  color:#ffd166;
  font-size:17px;
}

.stage span{
  color:#a9c0c8;
  font-size:10px;
}

.coins{
  min-width:76px;
  height:43px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:#ffd166;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-weight:bold;
}

.progressBox{
  height:7px;
  background:rgba(255,255,255,.1);
  border-radius:99px;
  margin-top:12px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#ffb703,#ffe08a);
  border-radius:99px;
  transition:.3s;
}

.message{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#bed0d7;
  font-size:13px;
  text-align:center;
}


/* =========================
   ANSWERS
========================= */

.answers{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:23px;
  padding:15px;
}

.answersHeader{
  display:flex;
  justify-content:space-between;
  color:#a9c0c8;
  font-size:11px;
  margin-bottom:11px;
}

.answerList{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
}

.answer{
  min-width:55px;
  height:40px;
  padding:0 9px;
  border-radius:12px;
  background:rgba(0,0,0,.15);
  border:1px dashed rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#829aa4;
  font-size:15px;
  font-weight:bold;
}

.answer.done{
  color:#092016;
  background:#55d68a;
  border-color:#55d68a;
}


/* =========================
   CURRENT WORD
========================= */

.current{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin:8px 0;
}

.currentLetter{
  min-width:41px;
  height:51px;
  padding:0 5px;
  border-bottom:3px solid #ffd166;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}


/* =========================
   LETTERS
========================= */

.board{
  position:relative;
  margin-top:auto;
  padding-top:8px;
}

.lineLayer{
  position:absolute;
  left:0;
  right:0;
  top:8px;
  height:190px;
  pointer-events:none;
  z-index:1;
}

.lineLayer line{
  stroke:#ffd166;
  stroke-width:7;
  stroke-linecap:round;
  opacity:.8;
}

.letters{
  position:relative;
  z-index:2;
  min-height:190px;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;
  gap:13px;
  touch-action:none;
}

.letter{
  width:63px;
  height:63px;
  border-radius:50%;
  color:white;
  font-size:25px;
  font-weight:bold;

  background:
    radial-gradient(
      circle at 30% 25%,
      rgba(255,255,255,.25),
      rgba(255,255,255,.06)
    );

  border:2px solid rgba(255,255,255,.18);

  box-shadow:
    0 8px 18px rgba(0,0,0,.25);

  user-select:none;
  touch-action:none;

  transition:.1s;
}

.letter.selected{
  color:#17212a;

  background:
    linear-gradient(
      145deg,
      #ffe18b,
      #efa900
    );

  border-color:#ffe7a8;

  transform:scale(1.09);
}


/* =========================
   CONTROLS
========================= */

.controls{
  display:grid;
  grid-template-columns:1fr 1.25fr 1fr;
  gap:8px;
  margin-top:8px;
}

.control{
  height:50px;
  border-radius:16px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.1);
  color:white;
  font-size:12px;
  font-weight:bold;
}

.control.primary{
  background:linear-gradient(135deg,#ffd166,#eda800);
  color:#17212a;
}

.bonus{
  margin-top:8px;
  text-align:center;
  padding:9px;
  border-radius:15px;
  background:rgba(0,0,0,.14);
  color:#a9c0c8;
  font-size:11px;
}

.bonus b{
  color:#ffd166;
}


/* =========================
   END
========================= */

.end{
  align-items:center;
  justify-content:center;
}

.endCard{
  width:100%;
  text-align:center;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:29px;
  padding:27px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.endIcon{
  font-size:58px;
}

.endCard h2{
  color:#ffd166;
  margin:8px 0;
  font-size:29px;
}

.endScore{
  font-size:40px;
  font-weight:bold;
  margin:15px;
}

.endStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:15px 0 20px;
}

.endStat{
  background:rgba(0,0,0,.14);
  border-radius:14px;
  padding:10px 4px;
}

.endStat b{
  display:block;
  color:#ffd166;
  font-size:18px;
}

.endStat span{
  color:#9fb7c0;
  font-size:10px;
}

.endButton{
  width:100%;
  height:54px;
  margin-top:8px;
  border-radius:17px;
  font-size:16px;
  font-weight:bold;
}

.next{
  background:linear-gradient(135deg,#ffd166,#eea900);
  color:#17212a;
}

.home{
  background:rgba(255,255,255,.09);
  color:white;
}


/* EFFECT */

.shake{
  animation:shake .3s;
}

@keyframes shake{
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

.good{
  animation:good .35s;
}

@keyframes good{
  50%{filter:brightness(1.3)}
}

@media(max-width:370px){

  .letter{
    width:55px;
    height:55px;
  }

  .logo h1{
    font-size:46px;
  }
}
</style>
</head>

<div id="app">


<!-- =========================
     HOME

const musicBtn =
  document.getElementById("musicBtn");

const musicStatus =
  document.getElementById("musicStatus");

const bgMusic =
  document.getElementById("bgMusic");

const stageTitle =
  document.getElementById("stageTitle");

const foundText =
  document.getElementById("foundText");

const coinCount =
  document.getElementById("coinCount");

const progress =
  document.getElementById("progress");

const message =
  document.getElementById("message");

const answerList =
  document.getElementById("answerList");

const current =
  document.getElementById("current");

const lettersBox =
  document.getElementById("letters");

const lineLayer =
  document.getElementById("lineLayer");

const livesBox =
  document.getElementById("lives");

const bonusCount =
  document.getElementById("bonusCount");


/* =========================
   NUMBER
========================= */

function faNumber(value){

  return String(value).replace(
    /\d/g,
    d => "۰۱۲۳۴۵۶۷۸۹"[d]
  );

}


/* =========================
   SCREEN
========================= */

function show(screen){

  home.classList.remove("active");
  game.classList.remove("active");
  end.classList.remove("active");

  screen.classList.add("active");

}


/* =========================
   MODE
========================= */

function setMode(newMode){

  mode = newMode;

  localStorage.setItem(
    KEY_MODE,
    mode
  );

  latinBtn.classList.toggle(
    "selected",
    mode === "latin"
  );

  arabicBtn.classList.toggle(
    "selected",
    mode === "arabic"
  );

}


latinBtn.onclick = function(){

  setMode("latin");

};


arabicBtn.onclick = function(){

  setMode("arabic");

};


/* =========================
   GET CURRENT STAGE
========================= */

function getStage(){

  return stages[
    (stageNumber - 1) %
    stages.length
  ];

}


function getLetters(){

  const stage =
    getStage();

  if(mode === "latin"){

    return stage.latinLetters;

  }

  return stage.arabicLetters;

}


function getAnswers(){

  const stage =
    getStage();

  if(mode === "latin"){

    return stage.latinAnswers;

  }

  return stage.arabicAnswers;

}


function getBonus(){

  const stage =
    getStage();

  if(mode === "latin"){

    return stage.latinBonus;

  }

  return stage.arabicBonus;

}


/* =========================
   HOME
========================= */

function updateHome(){

  homeStage.textContent =
    faNumber(stageNumber);

  homeCoins.textContent =
    faNumber(coins);

  musicBtn.textContent =
    bgMusic.paused
      ? "🔇"
      : "🔊";

}

updateHome();


/* =========================
   MUSIC
========================= */

async function startMusic(){

  if(!musicOn)
    return;

  try{

    bgMusic.volume = .45;

    await bgMusic.play();

    musicStatus.textContent =
      "موسیقی روشن است";

    musicBtn.textContent =
      "🔊";

  }catch(error){

    musicStatus.textContent =
      "برای پخش موسیقی دوباره بزنید";

  }

}


function toggleMusic(){

  if(bgMusic.paused){

    musicOn = true;

    localStorage.setItem(
      KEY_MUSIC,
      "on"
    );

    startMusic();

  }else{

    musicOn = false;

    localStorage.setItem(
      KEY_MUSIC,
      "off"
    );

    bgMusic.pause();

    musicStatus.textContent =
      "موسیقی خاموش است";

    musicBtn.textContent =
      "🔇";

  }

}

musicBtn.onclick =
  toggleMusic;


/* =========================
   START GAME
========================= */

function startGame(){

  startMusic();

  lives = 3;

  selected = [];

  currentWord = "";

  found = [];

  bonusFound = [];

  loadStage();

  show(game);

}


/* =========================
   LOAD STAGE
========================= */

function loadStage(){

  stageTitle.textContent =
    "مرحله " +
    faNumber(stageNumber);

  selected = [];

  currentWord = "";

  renderAnswers();

  renderLetters();

  renderCurrent();

  updateStats();

  drawLines();

  message.textContent =
    "حروف را به هم وصل کن";

}


/* =========================
   ANSWER GRID
========================= */

function renderAnswers(){

  answerList.innerHTML = "";

  const answers =
    getAnswers();

  answers.forEach(word => {

    const box =
      document.createElement("div");

    box.className =
      "answer";

    if(found.includes(word)){

      box.classList.add("done");

      box.textContent =
        word;

    }else{

      box.textContent =
        "•".repeat(
          Array.from(word).length
        );

    }

    answerList.appendChild(box);

  });

}


/* =========================
   LETTER BUTTONS
========================= */

function createLetterButton(
  char,
  originalIndex
){

  const btn =
    document.createElement("button");

  btn.className =
    "letter";

  btn.textContent =
    char;

  btn.dataset.index =
    originalIndex;

  /*
    مهم:
    index مربوط به آرایهٔ اصلی است.
    بنابراین حتی بعد از Shuffle
    کلمه درست ساخته می‌شود.
  */

  btn.addEventListener(
    "pointerdown",
    function(event){

      event.preventDefault();

      selectFirst(
        originalIndex
      );

    }
  );


  btn.addEventListener(
    "pointerenter",
    function(event){

      if(event.buttons === 1){

        selectNext(
          originalIndex
        );

      }

    }
  );


  btn.addEventListener(
    "pointerup",
    function(event){

      event.preventDefault();

      currentWord =
        makeWord();

      renderCurrent();

    }
  );


  return btn;

}


/* =========================
   RENDER LETTERS
========================= */

function renderLetters(){

  lettersBox.innerHTML = "";

  const letters =
    getLetters();

  letters.forEach(
    (char,index) => {

      lettersBox.appendChild(
        createLetterButton(
          char,
          index
        )
      );

    }
  );

}


/* =========================
   SELECT FIRST
========================= */

function selectFirst(index){

  selected = [index];

  currentWord =
    makeWord();

  updateSelected();

  renderCurrent();

  drawLines();

}


/* =========================
   SELECT NEXT
========================= */

function selectNext(index){

  if(selected.length === 0)
    return;

  if(selected.includes(index))
    return;

  selected.push(index);

  currentWord =
    makeWord();

  updateSelected();

  renderCurrent();

  drawLines();

}


/* =========================
   MAKE WORD
========================= */

function makeWord(){

  const letters =
    getLetters();

  return selected
    .map(index =>
      letters[index]
    )
    .join("");

}


/* =========================
   SELECTED UI
========================= */

function updateSelected(){

  document
    .querySelectorAll(".letter")
    .forEach(btn => {

      const index =
        Number(
          btn.dataset.index
        );

      btn.classList.toggle(
        "selected",
        selected.includes(index)
      );

    });

}


/* =========================
   CURRENT WORD
========================= */

function renderCurrent(){

  current.innerHTML = "";

  Array.from(currentWord)
    .forEach(char => {

      const box =
        document.createElement("div");

      box.className =
        "currentLetter";

      box.textContent =
        char;

      current.appendChild(box);

    });

}


/* =========================
   DRAW CONNECTION
========================= */

function drawLines(){

  lineLayer.innerHTML = "";

  if(selected.length < 2)
    return;

  const board =
    document.querySelector(
      ".board"
    );

  const boardRect =
    board.getBoundingClientRect();

  const buttons =
    [
      ...document.querySelectorAll(
        ".letter"
      )
    ];

  for(
    let i = 0;
    i < selected.length - 1;
    i++
  ){

    const a =
      buttons.find(
        button =>
          Number(
            button.dataset.index
          ) === selected[i]
      );

    const b =
      buttons.find(
        button =>
          Number(
            button.dataset.index
          ) === selected[i + 1]
      );

    if(!a || !b)
      continue;

    const ra =
      a.getBoundingClientRect();

    const rb =
      b.getBoundingClientRect();

    const x1 =
      ra.left +
      ra.width / 2 -
      boardRect.left;

    const y1 =
      ra.top +
      ra.height / 2 -
      boardRect.top;

    const x2 =
      rb.left +
      rb.width / 2 -
      boardRect.left;

    const y2 =
      rb.top +
      rb.height / 2 -
      boardRect.top;

    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    line.setAttribute(
      "x1",
      x1
    );

    line.setAttribute(
      "y1",
      y1
    );

    line.setAttribute(
      "x2",
      x2
    );

    line.setAttribute(
      "y2",
      y2
    );

    lineLayer.appendChild(line);

  }

}


/* =========================
   CLEAR
========================= */

function clearSelection(){

  selected = [];

  currentWord = "";

  updateSelected();

  renderCurrent();

  drawLines();

}


/* =========================
   SUBMIT
========================= */

function submitWord(){

  /*
    تا این لحظه هیچ صدای غلطی نداریم.
    فقط همین تابع کلمه را بررسی می‌کند.
  */

  const word =
    makeWord();

  if(!word){

    message.textContent =
      "اول چند حرف را انتخاب کن";

    return;

  }


  const answers =
    getAnswers();

  const bonuses =
    getBonus();


  /* درست */

  if(
    answers.includes(word)
  ){

    if(
      found.includes(word)
    ){

      message.textContent =
        "این کلمه را قبلاً پیدا کردی";

      clearSelection();

      return;

    }


    found.push(word);

    score +=
      10 +
      Array.from(word).length * 2;


    playCorrect();


    message.textContent =
      "✨ آفرین! کلمه درست است";


    game.classList.add(
      "good"
    );

    setTimeout(
      () =>
        game.classList.remove(
          "good"
        ),
      350
    );


    clearSelection();

    renderAnswers();

    updateStats();

    save();


    if(
      found.length ===
      answers.length
    ){

      setTimeout(
        finishStage,
        550
      );

    }

    return;

  }


  /* کلمه پنهان */

  if(
    bonuses.includes(word)
  ){

    if(
      bonusFound.includes(word)
    ){

      message.textContent =
        "این کلمه پنهان قبلاً پیدا شده";

      clearSelection();

      return;

    }


    bonusFound.push(word);

    coins += 5;

    score += 5;

    playCorrect();

    message.textContent =
      "🌟 کلمه پنهان! +۵ سکه";


    clearSelection();

    updateStats();

    save();

    return;

  }


  /* غلط */

  playWrong();

  lives--;

  updateLives();

  message.textContent =
    "❌ کلمه درست نیست";


  game.classList.add(
    "shake"
  );

  setTimeout(
    () =>
      game.classList.remove(
        "shake"
      ),
    300
  );


  clearSelection();


  if(lives <= 0){

    setTimeout(
      restartStage,
      800
    );

  }

}


/* =========================
   SHUFFLE
========================= */

function shuffle(){

  const letters =
    getLetters();


  const items =
    letters.map(
      (char,index) => ({
        char:char,
        index:index
      })
    );


  for(
    let i = items.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      items[i],
      items[j]
    ] =
    [
      items[j],
      items[i]
    ];

  }


  lettersBox.innerHTML = "";


  items.forEach(item => {

    lettersBox.appendChild(
      createLetterButton(
        item.char,
        item.index
      )
    );

  });


  clearSelection();


  message.textContent =
    "🔀 حروف جابه‌جا شدند";

}


/* =========================
   HINT
========================= */

function hint(){

  const remaining =
    getAnswers().filter(
      word =>
        !found.includes(word)
    );


  if(
    remaining.length === 0
  ){

    message.textContent =
      "همهٔ کلمات پیدا شده‌اند";

    return;

  }


  if(coins < 10){

    message.textContent =
      "🪙 برای راهنما ۱۰ سکه لازم است";

    return;

  }


  const word =
    remaining[0];


  coins -= 10;

  save();

  updateStats();


  message.textContent =
    "💡 یکی از کلمات با «" +
    Array.from(word)[0] +
    "» شروع می‌شود";

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    getAnswers().length;


  foundText.textContent =
    faNumber(found.length)
    +
    " از "
    +
    faNumber(total);


  coinCount.textContent =
    faNumber(coins);


  bonusCount.textContent =
    faNumber(
      bonusFound.length
    );


  progress.style.width =
    (
      found.length /
      total *
      100
    ) +
    "%";


  updateLives();

}


/* =========================
   LIVES
========================= */

function updateLives(){

  livesBox.textContent =
    "❤️".repeat(lives)
    +
    "🖤".repeat(
      3 - lives
    );

}


/* =========================
   FINISH
========================= */

function finishStage(){

  const reward =
    10 +
    found.length * 3;


  coins += reward;

  score += 25;


  document.getElementById(
    "endScore"
  ).textContent =
    faNumber(score);


  document.getElementById(
    "endWords"
  ).textContent =
    faNumber(
      found.length
    );


  document.getElementById(
    "endBonus"
  ).textContent =
    faNumber(
      bonusFound.length
    );


  document.getElementById(
    "endCoins"
  ).textContent =
    faNumber(reward);


  document.getElementById(
    "endTitle"
  ).textContent =
    "آفرین قهرمان!";


  stageNumber++;


  save();

  updateHome();

  show(end);

}


/* =========================
   RESTART
========================= */

function restartStage(){

  lives = 3;

  selected = [];

  currentWord = "";

  found = [];

  bonusFound = [];

  loadStage();

  show(game);

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    KEY_STAGE,
    stageNumber
  );

  localStorage.setItem(
    KEY_COINS,
    coins
  );

  localStorage.setItem(
    KEY_SCORE,
    score
  );

  localStorage.setItem(
    KEY_MODE,
    mode
  );

}


/* =========================
   AUDIO
========================= */

let audioContext = null;


function getAudio(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  return audioContext;

}


/* درست */

function playCorrect(){

  try{

    const ctx =
      getAudio();

    if(
      ctx.state ===
      "suspended"
    ){

      ctx.resume();

    }


    const now =
      ctx.currentTime;


    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();


    osc.type =
      "sine";


    osc.frequency.setValueAtTime(
      523.25,
      now
    );


    osc.frequency.exponentialRampToValueAtTime(
      659.25,
      now + .15
    );


    gain.gain.setValueAtTime(
      .001,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      .14,
      now + .02
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      now + .28
    );


    osc.connect(gain);

    gain.connect(
      ctx.destination
    );


    osc.start(now);

    osc.stop(
      now + .28
    );

  }catch(e){}

}


/* غلط */

function playWrong(){

  try{

    const ctx =
      getAudio();

    if(
      ctx.state ===
      "suspended"
    ){

      ctx.resume();

    }


    const now =
      ctx.currentTime;


    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();


    osc.type =
      "sawtooth";


    osc.frequency.setValueAtTime(
      220,
      now
    );


    osc.frequency.exponentialRampToValueAtTime(
      110,
      now + .18
    );


    gain.gain.setValueAtTime(
      .001,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      .11,
      now + .01
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      now + .22
    );


    osc.connect(gain);

    gain.connect(
      ctx.destination
    );


    osc.start(now);

    osc.stop(
      now + .22
    );

  }catch(e){}

}


/* =========================
   BUTTONS
========================= */

startBtn.onclick =
  function(){

    getAudio();

    startGame();

  };


document.getElementById(
  "submit"
).onclick =
  submitWord;


document.getElementById(
  "shuffle"
).onclick =
  shuffle;


document.getElementById(
  "hint"
).onclick =
  hint;


document.getElementById(
  "homeBtn"
).onclick =
  function(){

    save();

    updateHome();

    show(home);

  };


document.getElementById(
  "nextBtn"
).onclick =
  function(){

    startGame();

  };


document.getElementById(
  "againBtn"
).onclick =
  function(){

    restartStage();

  };


document.getElementById(
  "endHomeBtn"
).onclick =
  function(){

    updateHome();

    show(home);

  };


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function(){

    if(
      game.classList.contains(
        "active"
      )
    ){

      setTimeout(
        drawLines,
        50
      );

    }

  }
);


/* =========================
   INITIAL
========================= */

setMode(mode);

updateHome();

if(!musicOn){

  musicBtn.textContent =
    "🔇";

  musicStatus.textContent =
    "موسیقی خاموش است";

}

</script>

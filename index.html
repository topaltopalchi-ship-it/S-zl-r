<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SÖZLƏR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7ff, #e8ecff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #222;
}

.game {
  width: 92%;
  max-width: 500px;
  background: white;
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 42px;
  letter-spacing: 4px;
}

.subtitle {
  color: #666;
  margin: 6px 0 25px;
}

.selection {
  display: block;
}

.selection h2 {
  margin-bottom: 20px;
}

.choice {
  width: 100%;
  padding: 20px;
  margin: 10px 0;
  border: none;
  border-radius: 16px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.latin {
  background: #3949ab;
  color: white;
}

.arabic {
  background: #2e7d32;
  color: white;
}

.gameScreen {
  display: none;
}

.top {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.box {
  flex: 1;
  background: #f1f3ff;
  border-radius: 14px;
  padding: 12px;
}

.label {
  color: #777;
  font-size: 13px;
}

.box strong {
  display: block;
  font-size: 22px;
  margin-top: 4px;
}

.scrambled {
  margin: 25px 0;
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 7px;
  color: #3949ab;
  min-height: 45px;
}

.hint {
  background: #fff8df;
  border-radius: 14px;
  padding: 13px;
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 16px;
  border: 2px solid #ddd;
  border-radius: 14px;
  font-size: 20px;
  text-align: center;
  outline: none;
  margin-bottom: 12px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}

.check {
  background: #3949ab;
  color: white;
  width: 90%;
}

.next {
  background: #2e7d32;
  color: white;
  width: 90%;
  display: none;
}

.hint-btn {
  background: #ffca28;
}

.back {
  background: #eee;
  width: 90%;
  margin-top: 12px;
}

.message {
  min-height: 30px;
  margin: 12px 0;
  font-weight: bold;
}

.correct {
  color: #2e7d32;
}

.wrong {
  color: #c62828;
}

.footer {
  margin-top: 18px;
  color: #999;
  font-size: 12px;
}

.rtl {
  direction: rtl;
}

.rtl .scrambled {
  letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="game">

  <h1>SÖZLƏR</h1>

  <div class="subtitle">
    Türkçe söz oyunu
  </div>

  <!-- SEÇİM EKRANI -->

  <div class="selection" id="selection">

    <h2>Əlifbanı seçin</h2>

    <button class="choice latin" onclick="startGame('latin')">
      🇹🇷 Türkçe — Latin əlifbası
    </button>

    <button class="choice arabic" onclick="startGame('arabic')">
      ☪️ Türkçe — Ərəb əlifbası
    </button>

  </div>


  <!-- OYUN -->

  <div class="gameScreen" id="gameScreen">

    <div class="top">

      <div class="box">
        <div class="label">Xal</div>
        <strong id="score">0</strong>
      </div>

      <div class="box">
        <div class="label">Söz</div>
        <strong id="number">1</strong>
      </div>

    </div>

    <div class="scrambled" id="scrambled"></div>

    <div class="hint">
      💡 <span id="hint"></span>
    </div>

    <input
      id="answer"
      type="text"
      placeholder="Cavabınızı yazın"
      autocomplete="off"
    >

    <button class="check" onclick="checkAnswer()">
      Yoxla
    </button>

    <button class="hint-btn" id="hintBtn" onclick="showHint()">
      💡 İpucu
    </button>

    <button class="next" id="nextBtn" onclick="nextWord()">
      Növbəti söz ➜
    </button>

    <div class="message" id="message"></div>

    <button class="back" onclick="backToSelection()">
      ← Əlifbanı dəyiş
    </button>

    <div class="footer">
      SÖZLƏR • Türkçe söz oyunu
    </div>

  </div>

</div>


<script>

const words = [

  {
    latin: "kitap",
    arabic: "کیتاپ",
    hint: "Oxumaq üçün istifadə olunur."
  },

  {
    latin: "mektep",
    arabic: "مکتپ",
    hint: "Şagirdlərin dərs oxuduğu yer."
  },

  {
    latin: "çiçek",
    arabic: "چیچک",
    hint: "Bağlarda bitən gözəl bitki."
  },

  {
    latin: "deniz",
    arabic: "دنیز",
    hint: "Böyük su hövzəsi."
  },

  {
    latin: "güneş",
    arabic: "گونش",
    hint: "Yerə işıq və istilik verir."
  },

  {
    latin: "yıldız",
    arabic: "ییلدیز",
    hint: "Gecə səmasında görünür."
  },

  {
    latin: "kalem",
    arabic: "قالم",
    hint: "Yazmaq üçün istifadə olunur."
  },

  {
    latin: "dost",
    arabic: "دوست",
    hint: "Yaxın və etibar etdiyimiz insan."
  },

  {
    latin: "aile",
    arabic: "آیله",
    hint: "Ana, ata və övladlardan ibarət ola bilər."
  },

  {
    latin: "şehir",
    arabic: "شهر",
    hint: "İnsanların çox yaşadığı yaşayış yeri."
  },

  {
    latin: "bahar",
    arabic: "بهار",
    hint: "Təbiətin canlandığı fəsil."
  },

  {
    latin: "yağmur",
    arabic: "یاغمور",
    hint: "Göydən su damcıları şəklində yağır."
  }

];


let mode = "latin";
let current = 0;
let score = 0;
let hintUsed = false;


function shuffleWord(word) {

  const letters = [...word];

  for (let i = letters.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [letters[i], letters[j]] =
    [letters[j], letters[i]];

  }

  let result = letters.join("");

  if (result === word && word.length > 1) {
    return shuffleWord(word);
  }

  return result;
}


function startGame(selectedMode) {

  mode = selectedMode;

  current = 0;

  score = 0;

  document.getElementById("score").textContent = "0";

  document.getElementById("selection").style.display = "none";

  document.getElementById("gameScreen").style.display = "block";

  if (mode === "arabic") {

    document.body.classList.add("rtl");

  } else {

    document.body.classList.remove("rtl");

  }

  loadWord();
}


function loadWord() {

  const item = words[current];

  const word =
    mode === "latin"
      ? item.latin
      : item.arabic;

  document.getElementById("scrambled").textContent =
    shuffleWord(word);

  document.getElementById("hint").textContent =
    item.hint;

  document.getElementById("answer").value = "";

  document.getElementById("message").textContent = "";

  document.getElementById("number").textContent =
    current + 1;

  document.getElementById("nextBtn").style.display =
    "none";

  document.querySelector(".check").style.display =
    "inline-block";

  document.getElementById("hintBtn").style.display =
    "inline-block";

  document.getElementById("answer").disabled = false;

  hintUsed = false;
}


function checkAnswer() {

  const answer =
    document.getElementById("answer")
      .value
      .trim()
      .toLowerCase();

  const correct =
    mode === "latin"
      ? words[current].latin.toLowerCase()
      : words[current].arabic;

  if (!answer) {

    showMessage(
      "Əvvəlcə cavabı yazın.",
      "wrong"
    );

    return;
  }

  if (answer === correct) {

    let points = hintUsed ? 5 : 10;

    score += points;

    document.getElementById("score").textContent =
      score;

    showMessage(
      "🎉 Düzdür! +" + points + " xal",
      "correct"
    );

    document.getElementById("answer").disabled = true;

    document.querySelector(".check").style.display =
      "none";

    document.getElementById("hintBtn").style.display =
      "none";

    document.getElementById("nextBtn").style.display =
      "inline-block";

  } else {

    showMessage(
      "❌ Səhvdir. Yenidən cəhd edin.",
      "wrong"
    );

  }
}


function showHint() {

  hintUsed = true;

  showMessage(
    "💡 İpucu istifadə edildi. Bu söz 5 xal dəyərindədir.",
    ""
  );

  document.getElementById("hintBtn").style.display =
    "none";
}


function nextWord() {

  current++;

  if (current >= words.length) {

    document.getElementById("scrambled").textContent =
      "🏆";

    document.getElementById("hint").textContent =
      "Bütün sözləri tamamladınız!";

    document.getElementById("answer").style.display =
      "none";

    document.querySelector(".check").style.display =
      "none";

    document.getElementById("nextBtn").style.display =
      "none";

    document.getElementById("hintBtn").style.display =
      "none";

    showMessage(
      "Təbriklər! Yekun xalınız: " + score,
      "correct"
    );

    return;
  }

  loadWord();
}


function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;
}


function backToSelection() {

  document.getElementById("gameScreen").style.display =
    "none";

  document.getElementById("selection").style.display =
    "block";

  document.body.classList.remove("rtl");

}


document.getElementById("answer")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      checkAnswer();
    }

  });

</script>

</body>
</html>

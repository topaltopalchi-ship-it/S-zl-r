<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>حیدربابا</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,"Noto Sans",sans-serif;
    background:
        radial-gradient(circle at top,#5b4635 0%,#2d2119 48%,#17100c 100%);
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

#app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:18px 14px 25px;
    position:relative;
}

.glass{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
        0 15px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:15px;
}

.brand{
    font-size:27px;
    font-weight:900;
    letter-spacing:.5px;
}

.stats{
    display:flex;
    gap:7px;
}

.stat{
    padding:8px 10px;
    border-radius:14px;
    font-size:14px;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.12);
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.home{
    text-align:center;
    padding-top:70px;
}

.logo{
    font-size:48px;
    font-weight:900;
    margin-bottom:10px;
    text-shadow:0 8px 25px rgba(0,0,0,.4);
}

.subtitle{
    opacity:.78;
    margin-bottom:30px;
}

.bigBtn{
    width:100%;
    border:0;
    border-radius:20px;
    padding:17px;
    margin:7px 0;
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#b98246,#79502e);
    box-shadow:0 9px 20px rgba(0,0,0,.25);
}

.bigBtn:active{
    transform:scale(.97);
}

.modeBox{
    margin-top:22px;
    padding:16px;
    border-radius:20px;
}

.modeTitle{
    font-weight:800;
    margin-bottom:12px;
}

.modeButtons{
    display:flex;
    gap:10px;
}

.modeBtn{
    flex:1;
    border:0;
    padding:13px 8px;
    border-radius:16px;
    background:rgba(255,255,255,.09);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.modeBtn.selected{
    background:linear-gradient(135deg,#c38a4b,#80542f);
    box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.gameHeader{
    padding:13px;
    border-radius:18px;
    margin-bottom:12px;
}

.progressRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.stage{
    font-weight:900;
    font-size:18px;
}

.lives{
    letter-spacing:3px;
}

.progress{
    height:7px;
    margin-top:10px;
    background:rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    border-radius:20px;
    background:#e0ad6b;
    transition:.3s;
}

.answers{
    min-height:190px;
    padding:16px;
    border-radius:22px;
    margin-bottom:15px;
}

.answerRow{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:8px 0;
    direction:ltr;
}

.answerDot{
    width:35px;
    height:39px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:3px solid rgba(255,255,255,.55);
    font-size:22px;
    font-weight:900;
}

.answerDot.found{
    border-bottom-color:#e2ad68;
    color:#ffd28e;
}

.selectedWord{
    min-height:48px;
    text-align:center;
    font-size:29px;
    font-weight:900;
    letter-spacing:2px;
    padding:5px 10px;
    margin-bottom:8px;
    color:#ffe0ad;
}

.lettersArea{
    padding:18px 10px;
    border-radius:25px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.letters{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    min-height:190px;
    touch-action:none;
}

.letter{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
    color:#fff;
    background:
        radial-gradient(circle at 30% 25%,
        rgba(255,255,255,.25),
        rgba(255,255,255,.06) 40%,
        rgba(0,0,0,.18) 100%);
    border:2px solid rgba(255,255,255,.22);
    box-shadow:
        0 8px 18px rgba(0,0,0,.30),
        inset 0 1px 3px rgba(255,255,255,.15);
    transition:
        transform .12s,
        background .12s,
        box-shadow .12s,
        border-color .12s;
    touch-action:none;
    cursor:pointer;
}

.letter.selected{
    transform:scale(1.10);
    background:
        radial-gradient(circle at 30% 25%,
        rgba(255,255,255,.45),
        rgba(225,170,95,.85) 55%,
        rgba(116,70,31,.95));
    border-color:#ffe0a5;
    box-shadow:
        0 0 0 5px rgba(226,173,104,.18),
        0 0 25px rgba(226,173,104,.65);
}

.letter.disabled{
    opacity:.35;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.controlBtn{
    border:0;
    border-radius:15px;
    padding:12px 7px;
    color:#fff;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    font-weight:800;
    font-size:13px;
    cursor:pointer;
}

.controlBtn:active{
    transform:scale(.96);
}

.hintBtn{
    background:rgba(189,137,72,.28);
}

.message{
    height:28px;
    text-align:center;
    font-size:15px;
    font-weight:800;
    margin-top:10px;
}

.correct{
    animation:correct .35s ease;
}

.wrong{
    animation:wrong .35s ease;
}

@keyframes correct{
    0%{transform:scale(1)}
    50%{transform:scale(1.03)}
    100%{transform:scale(1)}
}

@keyframes wrong{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    75%{transform:translateX(8px)}
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;
    padding:25px;
    border-radius:25px;
    text-align:center;
}

.modal h2{
    margin-top:0;
    font-size:28px;
}

.modal p{
    opacity:.85;
    line-height:1.8;
}

.modal button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:16px;
    color:#fff;
    background:linear-gradient(135deg,#b98246,#79502e);
    font-size:17px;
    font-weight:900;
    margin-top:8px;
}

.hidden{
    display:none!important;
}

.rtl{
    direction:rtl;
}

.small{
    font-size:13px;
    opacity:.7;
    line-height:1.7;
}

@media(max-width:380px){
    .letter{
        width:57px;
        height:57px;
        font-size:25px;
    }

    .logo{
        font-size:41px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- HOME -->
    <section id="homeScreen" class="screen active">

        <div class="home">

            <div class="logo">حیدربابا</div>

            <div class="subtitle">
                بازی واژه‌یابی آذربایجانی
            </div>

            <button id="startBtn" class="bigBtn">
                شروع بازی
            </button>

            <div class="modeBox glass">

                <div class="modeTitle">
                    زبان بازی
                </div>

                <div class="modeButtons">

                    <button id="latinModeBtn" class="modeBtn selected">
                        🇮🇷 لاتین
                    </button>

                    <button id="arabicModeBtn" class="modeBtn">
                        🇮🇷 عربی
                    </button>

                </div>

                <div class="small" style="margin-top:12px">
                    در حالت عربی، حروف با خط عربی نمایش داده می‌شوند.
                </div>

            </div>

        </div>

    </section>


    <!-- GAME -->
    <section id="gameScreen" class="screen">

        <div class="topbar">

            <div class="brand">
                حیدربابا
            </div>

            <div class="stats">

                <div class="stat">
                    🪙 <span id="coinText">20</span>
                </div>

                <div class="stat">
                    ⭐ <span id="scoreText">0</span>
                </div>

            </div>

        </div>


        <div class="gameHeader glass">

            <div class="progressRow">

                <div class="stage">
                    مرحله <span id="stageText">1</span>
                </div>

                <div id="livesText" class="lives">
                    ❤️❤️❤️
                </div>

            </div>

            <div class="progress">
                <div id="progressBar" class="progressBar"></div>
            </div>

        </div>


        <div id="answersBox" class="answers glass">
        </div>


        <div id="selectedWord" class="selectedWord">
        </div>


        <div id="lettersArea" class="lettersArea glass">

            <div id="letters" class="letters">
            </div>

        </div>


        <div class="controls">

            <button id="hintBtn" class="controlBtn hintBtn">
                💡 راهنما
            </button>

            <button id="shuffleBtn" class="controlBtn">
                🔀 جابه‌جایی
            </button>

            <button id="musicBtn" class="controlBtn">
                🎵 موسیقی
            </button>

        </div>


        <div id="message" class="message">
        </div>

    </section>

</div>


<!-- END MODAL -->
<div id="endOverlay" class="overlay">

    <div class="modal glass">

        <h2 id="endTitle">
            مرحله کامل شد!
        </h2>

        <p id="endText">
        </p>

        <button id="nextBtn">
            مرحله بعد
        </button>

        <button id="restartBtn">
            دوباره بازی کن
        </button>

    </div>

</div>


<!-- AUDIO -->
<audio id="music" loop preload="auto">
    <source src="ays%C9%99l.mp3" type="audio/mpeg">
</audio>


<script>

/* =========================================================
   DATA
========================================================= */

const stages = [

    {
        latinLetters:["g","ü","n","ə","ş"],
        arabicLetters:["گ","و","ن","ش","ا"],

        latinAnswers:["gün","günəş","şən","günə","şə"],
        arabicAnswers:["گون","گونش","شن","گونا","ش"],

        latinBonus:["gən","şən"],
        arabicBonus:["گن","ش"]
    },

    {
        latinLetters:["s","u","l","a"],
        arabicLetters:["س","و","ل","ا"],

        latinAnswers:["su","sul","sal","sala"],
        arabicAnswers:["سو","سول","سال","سالا"],

        latinBonus:["ula","sula"],
        arabicBonus:["اولا","سولا"]
    },

    {
        latinLetters:["ç","ö","r","ə","k"],
        arabicLetters:["چ","و","ر","ک"],

        latinAnswers:["çörək","çör","kör","örək"],
        arabicAnswers:["چورک","چور","کور","ورک"],

        latinBonus:["çək","kər"],
        arabicBonus:["چک","کر"]
    },

    {
        latinLetters:["e","v"],
        arabicLetters:["ا","ئ","و"],

        latinAnswers:["ev","ve"],
        arabicAnswers:["ائو","ئو"],

        latinBonus:[],
        arabicBonus:[]
    },

    {
        latinLetters:["g","ü","l","ə"],
        arabicLetters:["گ","و","ل","ا"],

        latinAnswers:["gül","gəl","əl"],
        arabicAnswers:["گول","گل","ال"],

        latinBonus:["gülə","gələ"],
        arabicBonus:["گولا","گلا"]
    },

    {
        latinLetters:["a","n","a","s"],
        arabicLetters:["ا","ن","ا","س"],

        latinAnswers:["ana","asan","san"],
        arabicAnswers:["انا","اسان","سان"],

        latinBonus:["asa"],
        arabicBonus:["اسا"]
    },

    {
        latinLetters:["y","a","x","ş","ı"],
        arabicLetters:["ی","ا","خ","ش","ی"],

        latinAnswers:["yaxşı","yax","şay"],
        arabicAnswers:["یاخشی","یاخ","شای"],

        latinBonus:["yaş"],
        arabicBonus:["یاش"]
    },

    {
        latinLetters:["b","a","h","a","r"],
        arabicLetters:["ب","ا","ه","ا","ر"],

        latinAnswers:["bahar","bar","hara"],
        arabicAnswers:["بهار","بار","هارا"],

        latinBonus:["har","aha"],
        arabicBonus:["هر","اها"]
    },

    {
        latinLetters:["a","ğ","a","c"],
        arabicLetters:["ا","غ","ا","ج"],

        latinAnswers:["ağac","ağa","aca"],
        arabicAnswers:["اغاج","اغا","اجا"],

        latinBonus:["ağ","aca"],
        arabicBonus:["اغ","اجا"]
    },

    {
        latinLetters:["s","e","v","i"],
        arabicLetters:["س","ئ","و","ی"],

        latinAnswers:["sev","sevi","səvi"],
        arabicAnswers:["سو","سئوی","سیوی"],

        latinBonus:["ev","sev"],
        arabicBonus:["ئو","سوی"]
    }

];


/* =========================================================
   STATE
========================================================= */

let mode = localStorage.getItem("hd_mode") || "latin";

let stageNumber = Number(localStorage.getItem("hd_stage") || 1);

let coins = Number(localStorage.getItem("hd_coins") || 20);

let score = Number(localStorage.getItem("hd_score") || 0);

let lives = 3;

let currentStage = null;

let selectedIndexes = [];

let selectedLetters = [];

let foundAnswers = [];

let isDragging = false;

let pointerId = null;

let musicEnabled =
    localStorage.getItem("hd_music") !== "off";

let lastCompletedStage = stageNumber;


/* =========================================================
   ELEMENTS
========================================================= */

const homeScreen =
    document.getElementById("homeScreen");

const gameScreen =
    document.getElementById("gameScreen");

const startBtn =
    document.getElementById("startBtn");

const latinModeBtn =
    document.getElementById("latinModeBtn");

const arabicModeBtn =
    document.getElementById("arabicModeBtn");

const stageText =
    document.getElementById("stageText");

const coinText =
    document.getElementById("coinText");

const scoreText =
    document.getElementById("scoreText");

const livesText =
    document.getElementById("livesText");

const progressBar =
    document.getElementById("progressBar");

const answersBox =
    document.getElementById("answersBox");

const letters =
    document.getElementById("letters");

const selectedWord =
    document.getElementById("selectedWord");

const message =
    document.getElementById("message");

const hintBtn =
    document.getElementById("hintBtn");

const shuffleBtn =
    document.getElementById("shuffleBtn");

const musicBtn =
    document.getElementById("musicBtn");

const music =
    document.getElementById("music");

const endOverlay =
    document.getElementById("endOverlay");

const endTitle =
    document.getElementById("endTitle");

const endText =
    document.getElementById("endText");

const nextBtn =
    document.getElementById("nextBtn");

const restartBtn =
    document.getElementById("restartBtn");


/* =========================================================
   MODE
========================================================= */

function setMode(newMode){

    mode = newMode;

    localStorage.setItem("hd_mode", mode);

    latinModeBtn.classList.toggle(
        "selected",
        mode === "latin"
    );

    arabicModeBtn.classList.toggle(
        "selected",
        mode === "arabic"
    );

    if(gameScreen.classList.contains("active")){
        loadStage();
    }
}


latinModeBtn.addEventListener(
    "click",
    () => setMode("latin")
);

arabicModeBtn.addEventListener(
    "click",
    () => setMode("arabic")
);


/* =========================================================
   START GAME
========================================================= */

startBtn.addEventListener("click", () => {

    startMusic();

    homeScreen.classList.remove("active");

    gameScreen.classList.add("active");

    lives = 3;

    loadStage();

});


function startMusic(){

    if(!musicEnabled) return;

    music.volume = .42;

    music.play().catch(() => {
        /*
          بعضی مرورگرها پخش خودکار را محدود می‌کنند.
          چون این تابع از کلیک دکمه شروع اجرا شده،
          معمولاً روی موبایل اجازه پخش داده می‌شود.
        */
    });

    updateMusicButton();
}


function updateMusicButton(){

    musicBtn.textContent =
        musicEnabled ? "🎵 موسیقی" : "🔇 موسیقی خاموش";
}


/* =========================================================
   LOAD STAGE
========================================================= */

function loadStage(){

    if(stageNumber < 1){
        stageNumber = 1;
    }

    if(stageNumber > stages.length){
        stageNumber = stages.length;
    }

    currentStage =
        stages[stageNumber - 1];

    foundAnswers = [];

    selectedIndexes = [];

    selectedLetters = [];

    lives = 3;

    stageText.textContent =
        stageNumber;

    coinText.textContent =
        coins;

    scoreText.textContent =
        score;

    updateLives();

    renderAnswers();

    renderLetters();

    updateSelectedWord();

    message.textContent = "";

    updateProgress();

    document.documentElement.dir =
        mode === "arabic" ? "rtl" : "ltr";

}


/* =========================================================
   GET CURRENT DATA
========================================================= */

function getLetters(){

    return mode === "latin"
        ? currentStage.latinLetters
        : currentStage.arabicLetters;
}


function getAnswers(){

    return mode === "latin"
        ? currentStage.latinAnswers
        : currentStage.arabicAnswers;
}


function getBonus(){

    return mode === "latin"
        ? currentStage.latinBonus
        : currentStage.arabicBonus;
}


/* =========================================================
   RENDER LETTERS
========================================================= */

function renderLetters(){

    letters.innerHTML = "";

    const arr = getLetters();

    arr.forEach((letter,index) => {

        const btn =
            document.createElement("div");

        btn.className = "letter";

        btn.textContent = letter;

        btn.dataset.index = index;

        /*
          جلوگیری از رفتار پیش‌فرض لمس گوشی
        */
        btn.style.touchAction = "none";

        /*
          لمس شروع می‌شود
        */
        btn.addEventListener(
            "pointerdown",
            handlePointerDown
        );

        /*
          روی موس هم کار می‌کند
        */
        btn.addEventListener(
            "click",
            handleClick
        );

        letters.appendChild(btn);
    });

}


/* =========================================================
   POINTER DOWN
========================================================= */

function handlePointerDown(e){

    e.preventDefault();

    if(isDragging){
        return;
    }

    isDragging = true;

    pointerId = e.pointerId;

    const index =
        Number(e.currentTarget.dataset.index);

    selectLetter(index);

    /*
      capture روی خود container انجام می‌شود.
      سپس pointermove را روی container می‌گیریم.
    */
    try{
        letters.setPointerCapture(pointerId);
    }catch(err){}

}


/* =========================================================
   POINTER MOVE
========================================================= */

letters.addEventListener(
    "pointermove",
    function(e){

        if(!isDragging){
            return;
        }

        if(
            pointerId !== null &&
            e.pointerId !== pointerId
        ){
            return;
        }

        e.preventDefault();

        /*
          مهم‌ترین قسمت:
          به جای pointerenter،
          موقعیت انگشت را می‌گیریم
          و می‌بینیم روی کدام حرف قرار گرفته.
        */

        const element =
            document.elementFromPoint(
                e.clientX,
                e.clientY
            );

        if(!element){
            return;
        }

        const letter =
            element.closest(".letter");

        if(
            !letter ||
            !letters.contains(letter)
        ){
            return;
        }

        const index =
            Number(letter.dataset.index);

        selectLetter(index);

    },
    {passive:false}
);


/* =========================================================
   POINTER UP
========================================================= */

function stopDragging(e){

    if(!isDragging){
        return;
    }

    if(
        pointerId !== null &&
        e.pointerId !== pointerId
    ){
        return;
    }

    e.preventDefault();

    isDragging = false;

    try{
        if(
            pointerId !== null &&
            letters.hasPointerCapture(pointerId)
        ){
            letters.releasePointerCapture(pointerId);
        }
    }catch(err){}

    pointerId = null;

    submitWord();

}


letters.addEventListener(
    "pointerup",
    stopDragging,
    {passive:false}
);


letters.addEventListener(
    "pointercancel",
    stopDragging,
    {passive:false}
);


/* =========================================================
   SELECT LETTER
========================================================= */

function selectLetter(index){

    /*
      اگر همین حرف آخرین حرف انتخاب شده است،
      دوباره انتخاب نشود.
    */

    if(
        selectedIndexes.length > 0 &&
        selectedIndexes[
            selectedIndexes.length - 1
        ] === index
    ){
        return;
    }

    /*
      اگر قبلاً انتخاب شده،
      دوباره انتخاب نشود.
    */
    if(selectedIndexes.includes(index)){
        return;
    }

    selectedIndexes.push(index);

    const arr = getLetters();

    selectedLetters.push(
        arr[index]
    );

    updateSelectedWord();

    highlightLetters();

}


/* =========================================================
   HIGHLIGHT LETTERS
========================================================= */

function highlightLetters(){

    const all =
        document.querySelectorAll(".letter");

    all.forEach(el => {

        const index =
            Number(el.dataset.index);

        el.classList.toggle(
            "selected",
            selectedIndexes.includes(index)
        );

    });

}


/* =========================================================
   CLICK SUPPORT
========================================================= */

function handleClick(e){

    /*
      روی دسکتاپ با کلیک هم قابل استفاده است.
      روی موبایل، pointerdown + pointerup قبلاً
      submit را انجام داده‌اند؛ بنابراین اینجا
      فقط برای کلیک ساده استفاده می‌شود.
    */

    if(
        window.matchMedia("(pointer:fine)").matches
    ){

        const index =
            Number(e.currentTarget.dataset.index);

        selectLetter(index);
    }

}


/* =========================================================
   SELECTED WORD
========================================================= */

function updateSelectedWord(){

    selectedWord.textContent =
        selectedLetters.join("");

    if(mode === "arabic"){
        selectedWord.classList.add("rtl");
    }else{
        selectedWord.classList.remove("rtl");
    }

}


/* =========================================================
   SUBMIT WORD
========================================================= */

function submitWord(){

    if(selectedLetters.length === 0){
        return;
    }

    const word =
        selectedLetters.join("");

    const answers =
        getAnswers();

    const bonus =
        getBonus();

    /*
      کلمه اصلی
    */

    if(
        answers.includes(word) &&
        !foundAnswers.includes(word)
    ){

        foundAnswers.push(word);

        score += 10;

        coins += 2;

        save();

        showMessage(
            "✓ درست!",
            true
        );

        playCorrect();

        renderAnswers();

        updateProgress();

        clearSelection();

        if(
            foundAnswers.length ===
            answers.length
        ){

            setTimeout(
                finishStage,
                500
            );
        }

        return;
    }


    /*
      کلمه اضافه
    */

    if(
        bonus.includes(word) &&
        !foundAnswers.includes(
            "__bonus__" + word
        )
    ){

        foundAnswers.push(
            "__bonus__" + word
        );

        coins += 5;

        score += 5;

        save();

        showMessage(
            "⭐ کلمه اضافه! +۵ سکه",
            true
        );

        playCorrect();

        clearSelection();

        return;
    }


    /*
      کلمه اشتباه
    */

    lives--;

    updateLives();

    showMessage(
        "✕ کلمه درست نیست",
        false
    );

    playWrong();

    wrongAnimation();

    clearSelection();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );

    }

}


/* =========================================================
   CLEAR SELECTION
========================================================= */

function clearSelection(){

    selectedIndexes = [];

    selectedLetters = [];

    updateSelectedWord();

    highlightLetters();

}


/* =========================================================
   ANSWERS
========================================================= */

function renderAnswers(){

    answersBox.innerHTML = "";

    const answers =
        getAnswers();

    answers.forEach(word => {

        const row =
            document.createElement("div");

        row.className =
            "answerRow";

        if(mode === "arabic"){
            row.classList.add("rtl");
        }

        const isFound =
            foundAnswers.includes(word);

        const chars =
            Array.from(word);

        chars.forEach(char => {

            const dot =
                document.createElement("div");

            dot.className =
                "answerDot";

            if(isFound){

                dot.classList.add("found");

                dot.textContent =
                    char;

            }else{

                dot.textContent =
                    "";

            }

            row.appendChild(dot);

        });

        answersBox.appendChild(row);

    });

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(){

    const total =
        getAnswers().length;

    const found =
        foundAnswers.filter(
            x => !x.startsWith("__bonus__")
        ).length;

    const percent =
        total === 0
        ? 0
        : (found / total) * 100;

    progressBar.style.width =
        percent + "%";

}


/* =========================================================
   LIVES
========================================================= */

function updateLives(){

    livesText.textContent =
        "❤️".repeat(lives) +
        "🖤".repeat(3 - lives);

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,isCorrect){

    message.textContent =
        text;

    message.style.color =
        isCorrect
        ? "#ffd58f"
        : "#ff9d9d";

}


/* =========================================================
   WRONG ANIMATION
========================================================= */

function wrongAnimation(){

    letters.classList.remove("wrong");

    void letters.offsetWidth;

    letters.classList.add("wrong");

}


/* =========================================================
   CORRECT SOUND
========================================================= */

function playCorrect(){

    try{

        const ctx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "sine";

        osc.frequency.value = 660;

        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .12,
            ctx.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .18
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + .18
        );

    }catch(err){}

}


/* =========================================================
   WRONG SOUND
========================================================= */

function playWrong(){

    try{

        const ctx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = "triangle";

        osc.frequency.value = 150;

        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .10,
            ctx.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .20
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + .20
        );

    }catch(err){}

}


/* =========================================================
   SHUFFLE
========================================================= */

shuffleBtn.addEventListener(
    "click",
    shuffleLetters
);


function shuffleLetters(){

    const items =
        Array.from(
            letters.children
        );

    for(
        let i = items.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            items[i],
            items[j]
        ] =
        [
            items[j],
            items[i]
        ];

    }

    items.forEach(item =>
        letters.appendChild(item)
    );

}


/* =========================================================
   HINT
========================================================= */

hintBtn.addEventListener(
    "click",
    useHint
);


function useHint(){

    if(coins < 10){

        showMessage(
            "سکه کافی نیست",
            false
        );

        return;
    }

    const answers =
        getAnswers();

    const hidden =
        answers.find(
            word =>
                !foundAnswers.includes(word)
        );

    if(!hidden){
        return;
    }

    coins -= 10;

    save();

    const chars =
        Array.from(hidden);

    /*
      یک حرف از جواب را روشن می‌کنیم
    */

    const needed =
        chars[0];

    const arr =
        getLetters();

    const index =
        arr.indexOf(needed);

    if(index >= 0){

        selectedIndexes = [index];

        selectedLetters = [needed];

        updateSelectedWord();

        highlightLetters();

        showMessage(
            "💡 اولین حرف را نشان دادم",
            true
        );

    }

}


/* =========================================================
   MUSIC
========================================================= */

musicBtn.addEventListener(
    "click",
    () => {

        if(music.paused){

            musicEnabled = true;

            localStorage.setItem(
                "hd_music",
                "on"
            );

            music.volume = .42;

            music.play().catch(() => {});

        }else{

            musicEnabled = false;

            localStorage.setItem(
                "hd_music",
                "off"
            );

            music.pause();

        }

        updateMusicButton();

    }
);

updateMusicButton();


/* =========================================================
   FINISH STAGE
========================================================= */

function finishStage(){

    lastCompletedStage =
        stageNumber;

    if(stageNumber < stages.length){

        endTitle.textContent =
            "🎉 مرحله کامل شد!";

        endText.textContent =
            "آفرین! همه کلمات مرحله را پیدا کردی.";

        nextBtn.textContent =
            "مرحله بعد";

    }else{

        endTitle.textContent =
            "🏆 تبریک!";

        endText.textContent =
            "همه مراحل فعلی را کامل کردی.";

        nextBtn.textContent =
            "شروع دوباره";

    }

    endOverlay.classList.add("show");

}


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        endOverlay.classList.remove("show");

        if(stageNumber < stages.length){

            stageNumber++;

        }else{

            stageNumber = 1;

        }

        lastCompletedStage =
            stageNumber;

        save();

        loadStage();

    }
);


/* =========================================================
   RESTART CURRENT COMPLETED STAGE
========================================================= */

restartBtn.addEventListener(
    "click",
    () => {

        endOverlay.classList.remove("show");

        /*
          مرحله‌ای که تمام شده دوباره شروع می‌شود.
        */

        stageNumber =
            lastCompletedStage;

        foundAnswers = [];

        lives = 3;

        loadStage();

    }
);


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    endTitle.textContent =
        "💔 باختی";

    endText.textContent =
        "جان‌ها تمام شد. دوباره امتحان کن.";

    nextBtn.textContent =
        "تلاش دوباره";

    endOverlay.classList.add("show");

}


/* =========================================================
   SAVE
========================================================= */

function save(){

    localStorage.setItem(
        "hd_stage",
        stageNumber
    );

    localStorage.setItem(
        "hd_coins",
        coins
    );

    localStorage.setItem(
        "hd_score",
        score
    );

    localStorage.setItem(
        "hd_mode",
        mode
    );

    coinText.textContent =
        coins;

    scoreText.textContent =
        score;

}


/* =========================================================
   PREVENT PAGE SCROLL WHILE DRAGGING LETTERS
========================================================= */

document.addEventListener(
    "touchmove",
    function(e){

        if(isDragging){
            e.preventDefault();
        }

    },
    {passive:false}
);


/* =========================================================
   INITIAL
========================================================= */

latinModeBtn.classList.toggle(
    "selected",
    mode === "latin"
);

arabicModeBtn.classList.toggle(
    "selected",
    mode === "arabic"
);

updateMusicButton();

</script>

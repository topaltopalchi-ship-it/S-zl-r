<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#07111f;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

body::before,
body::after{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(70px);
  opacity:.22;
  z-index:-2;
  animation:floatGlow 9s ease-in-out infinite alternate;
}

body::before{
  top:-80px;
  left:-80px;
  background:#e5a93f;
}

body::after{
  right:-100px;
  bottom:-80px;
  background:#3979d8;
  animation-delay:-4s;
}

@keyframes floatGlow{
  from{
    transform:translate3d(0,0,scale(1));
  }
  to{
    transform:translate3d(30px,20px,scale(1.18));
  }
}

button{
  font:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:16px 14px 30px;
}

/* SCREEN */

.screen{
  display:none;
}

.screen.active{
  display:block;
  animation:screenIn .45s ease both;
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.985);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* LOGO */

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin:8px 0 18px;
  text-shadow:
    0 4px 20px rgba(0,0,0,.45),
    0 0 25px rgba(235,181,70,.18);
  animation:logoFloat 3.5s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-3px);
  }
}

/* GLASS */

.glass{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.035)
    );
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  box-shadow:
    0 25px 60px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
}

.glass::before{
  content:"";
  position:absolute;
  top:-100%;
  left:-60%;
  width:50%;
  height:300%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.07),
    transparent
  );
  transform:rotate(18deg);
  animation:glassShine 8s ease-in-out infinite;
  pointer-events:none;
}

@keyframes glassShine{
  0%,65%{
    left:-70%;
  }
  100%{
    left:140%;
  }
}

.home-card{
  padding:20px;
}

/* MODE */

.mode-title{
  text-align:center;
  margin-bottom:12px;
  opacity:.82;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode-btn{
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:14px;
  color:#fff;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.045)
    );
  font-weight:800;
  touch-action:manipulation;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 8px 18px rgba(0,0,0,.12);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.mode-btn:active{
  transform:scale(.95);
}

.mode-btn.selected{
  background:
    linear-gradient(
      145deg,
      rgba(226,173,78,.62),
      rgba(170,105,20,.32)
    );
  border-color:#efbd5a;
  box-shadow:
    0 0 22px rgba(210,145,40,.18),
    inset 0 1px 0 rgba(255,255,255,.18);
}

/* START */

.start-btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:20px;
  color:#fff;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(135deg,#efbd58,#b97618);
  box-shadow:
    0 12px 28px rgba(190,125,25,.30),
    inset 0 1px 0 rgba(255,255,255,.28);
  touch-action:manipulation;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.start-btn:active{
  transform:scale(.97);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  text-align:center;
  padding:10px 5px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.05);
}

.stat small{
  display:block;
  opacity:.6;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:18px;
}

/* STAGES */

.stage-title{
  text-align:center;
  font-weight:900;
  margin:22px 0 12px;
}

.stage-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.stage-btn{
  min-height:52px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:17px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );
  color:#fff;
  font-weight:900;
  touch-action:manipulation;
  transition:
    transform .16s ease,
    box-shadow .16s ease,
    border-color .16s ease;
}

.stage-btn:active{
  transform:scale(.91);
}

.stage-btn.current{
  border:2px solid #efbd5a;
  box-shadow:
    0 0 18px rgba(235,177,70,.22),
    inset 0 0 15px rgba(235,177,70,.06);
  animation:stagePulse 2s ease-in-out infinite;
}

.stage-btn.locked{
  opacity:.32;
}

@keyframes stagePulse{
  0%,100%{
    box-shadow:0 0 12px rgba(235,177,70,.15);
  }
  50%{
    box-shadow:0 0 25px rgba(235,177,70,.35);
  }
}

.stage-info{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  opacity:.65;
}

/* GAME TOP */

.game-top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.top-box{
  text-align:center;
  padding:10px 4px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06);
}

.top-box small{
  display:block;
  opacity:.55;
  font-size:10px;
}

.top-box strong{
  display:block;
  margin-top:3px;
}

.game-card{
  padding:16px;
}

/* ANSWER SLOTS */

.word-slots{
  min-height:78px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.answer-word{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  min-height:48px;
}

.answer-word.arabic{
  direction:ltr;
  flex-direction:row-reverse;
}

.answer-slot{
  width:36px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:12px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06);
  font-size:20px;
  font-weight:900;
}

.answer-slot.found{
  background:
    linear-gradient(
      145deg,
      rgba(74,190,118,.48),
      rgba(40,125,75,.22)
    );
  border-color:rgba(110,230,150,.70);
  box-shadow:
    0 0 18px rgba(70,190,110,.16);
  animation:slotFound .4s ease both;
}

@keyframes slotFound{
  0%{
    transform:scale(.65);
    opacity:.2;
  }
  65%{
    transform:scale(1.12);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* CURRENT WORD */

.current-word{
  height:55px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:5px 0 14px;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 15px rgba(0,0,0,.3);
}

.pop{
  animation:pop .3s ease;
}

@keyframes pop{
  0%{transform:scale(1)}
  50%{transform:scale(1.04)}
  100%{transform:scale(1)}
}

/* LETTER AREA */

.letters-area{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
}

.letter{
  aspect-ratio:1;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:22px;
  color:#fff;
  font-size:25px;
  font-weight:900;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.18),
      rgba(255,255,255,.055)
    );
  border:1px solid rgba(255,255,255,.20);
  box-shadow:
    0 9px 20px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.10);
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  transition:
    transform .13s cubic-bezier(.2,.8,.2,1),
    background .13s ease,
    box-shadow .13s ease;
  animation:letterAppear .35s ease both;
}

.letter:nth-child(1){animation-delay:.02s}
.letter:nth-child(2){animation-delay:.04s}
.letter:nth-child(3){animation-delay:.06s}
.letter:nth-child(4){animation-delay:.08s}
.letter:nth-child(5){animation-delay:.10s}
.letter:nth-child(6){animation-delay:.12s}
.letter:nth-child(7){animation-delay:.14s}
.letter:nth-child(8){animation-delay:.16s}
.letter:nth-child(9){animation-delay:.18s}
.letter:nth-child(10){animation-delay:.20s}

@keyframes letterAppear{
  from{
    opacity:0;
    transform:translateY(12px) scale(.86);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.letter.selected{
  transform:scale(.88) translateY(-2px);
  background:
    linear-gradient(
      145deg,
      rgba(236,181,72,.90),
      rgba(178,112,20,.68)
    );
  border-color:#ffd978;
  box-shadow:
    0 0 25px rgba(235,178,68,.34),
    inset 0 1px 0 rgba(255,255,255,.28);
}

/* ACTIONS */

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.action-btn{
  border:0;
  border-radius:19px;
  padding:14px 5px;
  color:#fff;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.045)
    );
  font-weight:900;
  touch-action:manipulation;
}

.action-btn:active{
  transform:scale(.94);
}

.check-btn{
  background:linear-gradient(135deg,#efbd58,#b97618);
}

.hint-btn{
  background:rgba(214,155,50,.22);
}

/* MESSAGE */

.message{
  min-height:28px;
  margin-top:12px;
  text-align:center;
  font-weight:800;
}

.correct{
  color:#9cf0b9;
  animation:messagePop .35s ease;
}

.wrong{
  color:#ffaaa0;
  animation:messagePop .35s ease;
}

@keyframes messagePop{
  0%{
    opacity:0;
    transform:scale(.8);
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

/* SHAKE */

.shake{
  animation:shake .38s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(4px)}
}

/* MUSIC */

.music-btn{
  position:fixed;
  right:14px;
  bottom:14px;
  width:50px;
  height:50px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.06)
    );
  color:#fff;
  font-size:20px;
  z-index:20;
  box-shadow:
    0 8px 25px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.music-btn:active{
  transform:scale(.90);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.68);
  z-index:100;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
  animation:modalBg .25s ease;
}

@keyframes modalBg{
  from{opacity:0}
  to{opacity:1}
}

.modal-card{
  width:100%;
  max-width:390px;
  padding:25px;
  text-align:center;
  border-radius:28px;
  background:
    linear-gradient(
      145deg,
      #20384d,
      #122333
    );
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.10);
  animation:modalCardIn .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalCardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.90);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.modal-card h2{
  margin-top:0;
}

.modal-card p{
  line-height:1.7;
  opacity:.8;
}

.modal-card button{
  width:100%;
  border:0;
  border-radius:17px;
  padding:14px;
  margin-top:8px;
  color:#fff;
  background:linear-gradient(135deg,#e0a53d,#b87818);
  font-weight:900;
}

/* MOBILE */

@media(max-width:360px){

  .letter{
    font-size:21px;
    border-radius:17px;
  }

  .answer-slot{
    width:32px;
    height:39px;
    font-size:18px;
  }

  .game-card{
    padding:13px;
  }

}
</style>
</head>

<body>

<audio id="music" loop preload="auto">
  <source src="./ays%C9%99l.mp3" type="audio/mpeg">
</audio>

<div class="app">

<section id="homeScreen" class="screen active">

  <div class="logo">حیدربابا</div>

  <div class="glass home-card">

    <div class="mode-title">Əlifbanı seç</div>

    <div class="mode-buttons">

      <button id="latinBtn" class="mode-btn selected">
        🇮🇷 Latin
      </button>

      <button id="arabicBtn" class="mode-btn">
        🇮🇷 Ərəb
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <small>Mərhələ</small>
        <strong id="homeStage">1</strong>
      </div>

      <div class="stat">
        <small>Sikkə</small>
        <strong id="homeCoins">0</strong>
      </div>

      <div class="stat">
        <small>Xal</small>
        <strong id="homeScore">0</strong>
      </div>

    </div>

    <button id="continueBtn" class="start-btn">
      Oyuna başla
    </button>

    <div class="stage-title">
      Mərhələlər
    </div>

    <div id="stageGrid" class="stage-grid"></div>

    <div id="stageInfo" class="stage-info"></div>

  </div>

</section>

<section id="gameScreen" class="screen">

  <div class="logo" style="font-size:30px;">
    حیدربابا
  </div>

  <div class="game-top">

    <div class="top-box">
      <small>Mərhələ</small>
      <strong id="gameStage">1</strong>
    </div>

    <div class="top-box">
      <small>Sikkə</small>
      <strong id="gameCoins">0</strong>
    </div>

    <div class="top-box">
      <small>Can</small>
      <strong id="gameLives">❤️❤️❤️</strong>
    </div>

  </div>

  <div class="glass game-card">

    <div id="wordSlots" class="word-slots"></div>

    <div id="currentWord" class="current-word"></div>

    <div id="lettersArea" class="letters-area"></div>

    <div class="game-actions">

      <button id="clearBtn" class="action-btn">
        Təmizlə
      </button>

      <button id="checkBtn" class="action-btn check-btn">
        Yoxla
      </button>

      <button id="shuffleBtn" class="action-btn">
        Qarışdır
      </button>

    </div>

    <div id="message" class="message"></div>

    <button
      id="hintBtn"
      class="action-btn hint-btn"
      style="width:100%;margin-top:10px;"
    >
      💡 İpucu
    </button>

  </div>

</section>

</div>

<button id="musicBtn" class="music-btn">
  🔊
</button>

<div id="modal" class="modal">

  <div class="modal-card">

    <h2 id="modalTitle"></h2>

    <p id="modalText"></p>

    <button id="modalAction"></button>

  </div>

</div>

<script>

const stages = [

  /* 1 */
  {
    latinLetters:["a","t","a","n"],
    arabicLetters:["ا","ت","ا","ن"],
    latinAnswers:["ata","ana"],
    arabicAnswers:["اتا","انا"]
  },

  /* 2 */
  {
    latinLetters:["a","l","m","a"],
    arabicLetters:["ا","ل","م","ا"],
    latinAnswers:["alma","al"],
    arabicAnswers:["الما","ال"]
  },

  /* 3 */
  {
    latinLetters:["g","ü","n"],
    arabicLetters:["گ","و","ن"],
    latinAnswers:["gün"],
    arabicAnswers:["گون"]
  },

  /* 4 */
  {
    latinLetters:["g","ü","n","ə","ş"],
    arabicLetters:["گ","و","ن","ش"],
    latinAnswers:["gün","günəş"],
    arabicAnswers:["گون","گونش"]
  },

  /* 5 */
  {
    latinLetters:["ç","ö","r","ə","k"],
    arabicLetters:["چ","و","ر","ک"],
    latinAnswers:["çörək"],
    arabicAnswers:["چورک"]
  },

  /* 6 */
  {
    latinLetters:["g","ü","l"],
    arabicLetters:["گ","و","ل"],
    latinAnswers:["gül"],
    arabicAnswers:["گول"]
  },

  /* 7 */
  {
    latinLetters:["a","ğ","a","c"],
    arabicLetters:["ا","غ","ا","ج"],
    latinAnswers:["ağac","ağ"],
    arabicAnswers:["اغاج","اغ"]
  },

  /* 8 */
  {
    latinLetters:["g","ö","z","a"],
    arabicLetters:["گ","و","ز","ا"],
    latinAnswers:["göz","öz"],
    arabicAnswers:["گوز","اوز"]
  },

  /* 9 */
  {
    latinLetters:["q","a","r","a"],
    arabicLetters:["ق","ا","ر","ا"],
    latinAnswers:["qara","qar","ara"],
    arabicAnswers:["قارا","قار","ارا"]
  },

  /* 10 */
  {
    latinLetters:["d","a","ş"],
    arabicLetters:["د","ا","ش"],
    latinAnswers:["daş","aş"],
    arabicAnswers:["داش","اش"]
  },

  /* 11 */
  {
    latinLetters:["s","u"],
    arabicLetters:["س","و"],
    latinAnswers:["su"],
    arabicAnswers:["سو"]
  },

  /* 12 */
  {
    latinLetters:["a","y"],
    arabicLetters:["آ","ی"],
    latinAnswers:["ay"],
    arabicAnswers:["آی"]
  },

  /* 13 */
  {
    latinLetters:["d","o","s","t"],
    arabicLetters:["د","و","س","ت"],
    latinAnswers:["dost"],
    arabicAnswers:["دوست"]
  },

  /* 14 */
  {
    latinLetters:["g","e","c","ə"],
    arabicLetters:["گ","ئ","ج","ه"],
    latinAnswers:["gecə"],
    arabicAnswers:["گئجه"]
  },

  /* 15 */
  {
    latinLetters:["s","e","v"],
    arabicLetters:["س","ئ","و"],
    latinAnswers:["sev"],
    arabicAnswers:["سئو"]
  },

  /* 16 */
  {
    latinLetters:["s","e","v","g","i"],
    arabicLetters:["س","ئ","و","گ","ی"],
    latinAnswers:["sevgi"],
    arabicAnswers:["سئوگی"]
  },

  /* 17 */
  {
    latinLetters:["b","a","l"],
    arabicLetters:["ب","ا","ل"],
    latinAnswers:["bal"],
    arabicAnswers:["بال"]
  },

  /* 18 */
  {
    latinLetters:["d","a","ğ"],
    arabicLetters:["د","ا","غ"],
    latinAnswers:["dağ"],
    arabicAnswers:["داغ"]
  },

  /* 19 */
  {
    latinLetters:["y","o","l"],
    arabicLetters:["ی","و","ل"],
    latinAnswers:["yol"],
    arabicAnswers:["یول"]
  },

  /* 20 */
  {
    latinLetters:["e","l"],
    arabicLetters:["ا","ئ","ل"],
    latinAnswers:["el"],
    arabicAnswers:["ائل"]
  }

];

/* STATE */

let mode =
  localStorage.getItem("hb_mode") || "latin";

let coins =
  Number(localStorage.getItem("hb_coins") || 0);

let score =
  Number(localStorage.getItem("hb_score") || 0);

let unlockedStage =
  Number(localStorage.getItem("hb_unlockedStage") || 1);

let selectedStage =
  Number(localStorage.getItem("hb_selectedStage") || 1);

let lives = 3;

let currentLetters = [];

let currentWord = "";

let selectedIndexes = [];

let foundWords = [];

let dragging = false;

let activePointerId = null;

let gameOver = false;

let modalActionType = "";

/* SAFE VALUES */

if(unlockedStage < 1)
  unlockedStage = 1;

if(unlockedStage > stages.length)
  unlockedStage = stages.length;

if(selectedStage < 1)
  selectedStage = 1;

if(selectedStage > unlockedStage)
  selectedStage = unlockedStage;

/* ELEMENTS */

const music =
  document.getElementById("music");

const homeScreen =
  document.getElementById("homeScreen");

const gameScreen =
  document.getElementById("gameScreen");

const latinBtn =
  document.getElementById("latinBtn");

const arabicBtn =
  document.getElementById("arabicBtn");

const continueBtn =
  document.getElementById("continueBtn");

const stageGrid =
  document.getElementById("stageGrid");

const stageInfo =
  document.getElementById("stageInfo");

const homeStage =
  document.getElementById("homeStage");

const homeCoins =
  document.getElementById("homeCoins");

const homeScore =
  document.getElementById("homeScore");

const gameStage =
  document.getElementById("gameStage");

const gameCoins =
  document.getElementById("gameCoins");

const gameLives =
  document.getElementById("gameLives");

const wordSlots =
  document.getElementById("wordSlots");

const currentWordEl =
  document.getElementById("currentWord");

const lettersArea =
  document.getElementById("lettersArea");

const message =
  document.getElementById("message");

const clearBtn =
  document.getElementById("clearBtn");

const checkBtn =
  document.getElementById("checkBtn");

const shuffleBtn =
  document.getElementById("shuffleBtn");

const hintBtn =
  document.getElementById("hintBtn");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const modalAction =
  document.getElementById("modalAction");

const musicBtn =
  document.getElementById("musicBtn");

/* SAVE */

function save(){

  localStorage.setItem(
    "hb_mode",
    mode
  );

  localStorage.setItem(
    "hb_coins",
    coins
  );

  localStorage.setItem(
    "hb_score",
    score
  );

  localStorage.setItem(
    "hb_unlockedStage",
    unlockedStage
  );

  localStorage.setItem(
    "hb_selectedStage",
    selectedStage
  );

}

/* MODE */

function setMode(newMode){

  mode = newMode;

  latinBtn.classList.toggle(
    "selected",
    mode === "latin"
  );

  arabicBtn.classList.toggle(
    "selected",
    mode === "arabic"
  );

  save();

}

latinBtn.onclick = function(){

  setMode("latin");

};

arabicBtn.onclick = function(){

  setMode("arabic");

};

/* HOME */

function updateHome(){

  homeStage.textContent =
    selectedStage;

  homeCoins.textContent =
    coins;

  homeScore.textContent =
    score;

}

/* STAGES */

function renderStages(){

  stageGrid.innerHTML = "";

  for(
    let i = 0;
    i < stages.length;
    i++
  ){

    const number = i + 1;

    const btn =
      document.createElement("button");

    btn.className =
      "stage-btn";

    if(number <= unlockedStage){

      btn.textContent =
        number;

      if(number === selectedStage){

        btn.classList.add(
          "current"
        );

      }

      btn.onclick = function(){

        selectedStage =
          number;

        save();

        updateHome();

        renderStages();

      };

    }else{

      btn.classList.add(
        "locked"
      );

      btn.textContent =
        "🔒";

    }

    stageGrid.appendChild(btn);

  }

  stageInfo.textContent =
    `${unlockedStage} / ${stages.length} mərhələ açıqdır`;

}

/* START */

continueBtn.onclick = function(){

  startGame(
    selectedStage
  );

};

function startGame(stageNumber){

  if(
    stageNumber < 1 ||
    stageNumber > unlockedStage
  ){
    return;
  }

  selectedStage =
    stageNumber;

  lives = 3;

  foundWords = [];

  currentWord = "";

  selectedIndexes = [];

  dragging = false;

  activePointerId = null;

  gameOver = false;

  message.textContent = "";

  message.className =
    "message";

  homeScreen.classList.remove(
    "active"
  );

  gameScreen.classList.add(
    "active"
  );

  loadStage();

  startMusic();

  save();

}

/* LOAD STAGE */

function loadStage(){

  const stage =
    stages[selectedStage - 1];

  currentLetters =
    mode === "latin"
      ? [...stage.latinLetters]
      : [...stage.arabicLetters];

  shuffleArray(
    currentLetters
  );

  gameStage.textContent =
    selectedStage;

  gameCoins.textContent =
    coins;

  updateLives();

  renderSlots();

  renderLetters();

  clearCurrentWord();

}

/* ANSWERS */

function getAnswers(){

  const stage =
    stages[selectedStage - 1];

  return mode === "latin"
    ? stage.latinAnswers
    : stage.arabicAnswers;

}

/* ANSWER SLOTS */

function renderSlots(){

  wordSlots.innerHTML = "";

  const answers =
    getAnswers();

  answers.forEach(
    answer => {

      const word =
        document.createElement(
          "div"
        );

      word.className =
        "answer-word";

      if(mode === "arabic"){

        word.classList.add(
          "arabic"
        );

      }

      if(
        foundWords.includes(
          answer
        )
      ){

        [...answer].forEach(
          letter => {

            const slot =
              document.createElement(
                "div"
              );

            slot.className =
              "answer-slot found";

            slot.textContent =
              letter;

            word.appendChild(
              slot
            );

          }
        );

      }else{

        [...answer].forEach(
          () => {

            const slot =
              document.createElement(
                "div"
              );

            slot.className =
              "answer-slot";

            slot.textContent =
              "";

            word.appendChild(
              slot
            );

          }
        );

      }

      wordSlots.appendChild(
        word
      );

    }
  );

}

/* LETTERS */

function renderLetters(){

  lettersArea.innerHTML =
    "";

  currentLetters.forEach(
    (letter,index) => {

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "letter";

      el.dataset.index =
        index;

      el.textContent =
        letter;

      lettersArea.appendChild(
        el
      );

    }
  );

}

/* TOUCH / DRAG */

lettersArea.addEventListener(
  "pointerdown",
  function(e){

    if(gameOver)
      return;

    if(
      e.pointerType === "mouse" &&
      e.button !== 0
    ){
      return;
    }

    const letter =
      e.target.closest(
        ".letter"
      );

    if(!letter)
      return;

    e.preventDefault();

    dragging = true;

    activePointerId =
      e.pointerId;

    clearCurrentWord();

    try{

      lettersArea.setPointerCapture(
        e.pointerId
      );

    }catch(err){}

    const index =
      Number(
        letter.dataset.index
      );

    addLetter(index);

  },
  {passive:false}
);

lettersArea.addEventListener(
  "pointermove",
  function(e){

    if(!dragging)
      return;

    if(
      activePointerId !==
      e.pointerId
    ){
      return;
    }

    e.preventDefault();

    const element =
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    if(!element)
      return;

    const letter =
      element.closest(
        ".letter"
      );

    if(!letter)
      return;

    const index =
      Number(
        letter.dataset.index
      );

    addLetter(index);

  },
  {passive:false}
);

lettersArea.addEventListener(
  "pointerup",
  function(e){

    if(
      activePointerId !==
      e.pointerId
    ){
      return;
    }

    e.preventDefault();

    dragging = false;

    try{

      if(
        lettersArea.hasPointerCapture(
          e.pointerId
        )
      ){

        lettersArea.releasePointerCapture(
          e.pointerId
        );

      }

    }catch(err){}

    activePointerId = null;

  },
  {passive:false}
);

lettersArea.addEventListener(
  "pointercancel",
  function(e){

    dragging = false;

    activePointerId = null;

    try{

      if(
        lettersArea.hasPointerCapture(
          e.pointerId
        )
      ){

        lettersArea.releasePointerCapture(
          e.pointerId
        );

      }

    }catch(err){}

  },
  {passive:false}
);

/* ADD LETTER */

function addLetter(index){

  if(
    selectedIndexes.includes(
      index
    )
  ){
    return;
  }

  selectedIndexes.push(
    index
  );

  currentWord +=
    currentLetters[index];

  currentWordEl.textContent =
    currentWord;

  currentWordEl.classList.remove(
    "pop"
  );

  void currentWordEl.offsetWidth;

  currentWordEl.classList.add(
    "pop"
  );

  const elements =
    lettersArea.querySelectorAll(
      ".letter"
    );

  if(elements[index]){

    elements[index].classList.add(
      "selected"
    );

  }

}

/* CLEAR */

function clearCurrentWord(){

  currentWord = "";

  selectedIndexes = [];

  currentWordEl.textContent =
    "";

  const elements =
    lettersArea.querySelectorAll(
      ".letter"
    );

  elements.forEach(
    el => {

      el.classList.remove(
        "selected"
      );

    }
  );

}

/* CHECK */

checkBtn.onclick =
  function(){

    checkWord();

  };

function checkWord(){

  if(!currentWord){

    message.textContent =
      "Əvvəlcə hərfləri seç.";

    message.className =
      "message wrong";

    return;

  }

  const answers =
    getAnswers();

  if(
    answers.includes(
      currentWord
    ) &&
    !foundWords.includes(
      currentWord
    )
  ){

    foundWords.push(
      currentWord
    );

    score += 10;

    coins += 1;

    playCorrectSound();

    message.textContent =
      "Düzdür! 👏";

    message.className =
      "message correct";

    renderSlots();

    updateGameStats();

    clearCurrentWord();

    gameScreen.classList.add(
      "pop"
    );

    setTimeout(
      () => {

        gameScreen.classList.remove(
          "pop"
        );

      },
      300
    );

    if(
      foundWords.length ===
      answers.length
    ){

      setTimeout(
        finishStage,
        500
      );

    }

  }else{

    playWrongSound();

    message.textContent =
      "Bu söz düzgün deyil.";

    message.className =
      "message wrong";

    lettersArea.classList.remove(
      "shake"
    );

    void lettersArea.offsetWidth;

    lettersArea.classList.add(
      "shake"
    );

    clearCurrentWord();

    loseLife();

  }

}

/* LIFE */

function loseLife(){

  lives--;

  updateLives();

  if(lives <= 0){

    setTimeout(
      showGameOver,
      300
    );

  }

}

function updateLives(){

  gameLives.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(
      3 - lives
    );

}

/* GAME STATS */

function updateGameStats(){

  gameCoins.textContent =
    coins;

  save();

}

/* FINISH */

function finishStage(){

  score += 10;

  coins += 5;

  if(
    selectedStage ===
    unlockedStage &&
    unlockedStage <
    stages.length
  ){

    unlockedStage++;

  }

  save();

  updateHome();

  renderStages();

  if(
    selectedStage <
    stages.length
  ){

    showModal(
      "Əla! 🎉",
      `Mərhələ ${selectedStage} tamamlandı.<br>
       5 sikkə qazandın.<br>
       Növbəti mərhələ açıldı.`,
      "Növbəti mərhələ",
      "next"
    );


}else{
  showModal(
    "Təbriklər! 🎉",
    `Bütün ${stages.length} mərhələni tamamladın.<br>
     🏆 Oyunu tamamladın!<br>
     İstəsən 20-ci mərhələni yenidən oynaya bilərsən.`,
    "20-ci mərhələ",
    "final"

  );
  }
}

/* GAME OVER */
    

function showGameOver(){

  gameOver = true;

  showModal(
    "Canlar bitdi ❤️",
    "Bu mərhələni yenidən sınaya bilərsən.",
    "Yenidən cəhd et",
    "retry"
  );

}

/* MODAL */

function showModal(
  title,
  text,
  buttonText,
  actionType
){

  modalTitle.textContent =
    title;

  modalText.innerHTML =
    text;

  modalAction.textContent =
    buttonText;

  modalActionType =
    actionType;

  modal.classList.add(
    "show"
  );

}

modalAction.onclick =
  function(){

    modal.classList.remove(
      "show"
    );

    if(
      modalActionType ===
      "next"
    ){

      selectedStage++;

      save();

      startGame(
        selectedStage
      );

    }

    else if(
      modalActionType ===
      "retry"
    ){

      startGame(
        selectedStage
      );

    }


else if(
  modalActionType ===
  "final"
){
  selectedStage = stages.length;

  save();

  startGame(
    stages.length
  );
}

    

  };

/* BUTTONS */

clearBtn.onclick =
  function(){

    clearCurrentWord();

  };

shuffleBtn.onclick =
  function(){

    shuffleArray(
      currentLetters
    );

    clearCurrentWord();

    renderLetters();

  };

/* SHUFFLE */

function shuffleArray(array){

  for(
    let i =
      array.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

}

/* HINT */

hintBtn.onclick =
  function(){

    if(coins < 10){

      message.textContent =
        "İpucu üçün 10 sikkə lazımdır.";

      message.className =
        "message wrong";

      return;

    }

    const remaining =
      getAnswers().filter(
        word =>
          !foundWords.includes(
            word
          )
      );

    if(!remaining.length)
      return;

    coins -= 10;

    gameCoins.textContent =
      coins;

    save();

    message.textContent =
      `İpucu: ${remaining[0].charAt(0)}...`;

    message.className =
      "message";

  };

/* MUSIC */

async function startMusic(){

  try{

    music.volume =
      0.75;

    await music.play();

    musicBtn.textContent =
      "🔊";

  }catch(err){

    musicBtn.textContent =
      "🔇";

  }

}

musicBtn.onclick =
  async function(){

    if(music.paused){

      try{

        await music.play();

        musicBtn.textContent =
          "🔊";

      }catch(err){

        musicBtn.textContent =
          "🔇";

      }

    }else{

      music.pause();

      musicBtn.textContent =
        "🔇";

    }

  };

/* CORRECT SOUND */

function playCorrectSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return;

    const ctx =
      new AudioContext();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value =
      720;

    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .18,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + .22
    );

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    osc.stop(
      ctx.currentTime + .23
    );

  }catch(err){}

}

/* WRONG SOUND */

function playWrongSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext)
      return;

    const ctx =
      new AudioContext();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value =
      180;

    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .13,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + .18
    );

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    osc.stop(
      ctx.currentTime + .19
    );

  }catch(err){}

}

/* INITIAL */

setMode(mode);

updateHome();

renderStages();

</script>

</body>
</html>

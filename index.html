<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg1:#071b2c;
  --bg2:#123c52;
  --gold:#ffd166;
  --gold2:#ffb703;
  --white:#fff;
  --muted:#b9d1dc;
  --glass:rgba(255,255,255,.11);
  --glass2:rgba(255,255,255,.17);
  --green:#55d68a;
  --red:#ff647c;
  --blue:#53b8ff;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    "Noto Sans Arabic",
    "Tahoma",
    Arial,
    sans-serif;
  background:
    radial-gradient(circle at top,#245b72 0%,var(--bg1) 48%,#030d16 100%);
  color:var(--white);
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:16px 14px 28px;
  position:relative;
}

.screen{
  display:none;
  min-height:calc(100vh - 44px);
  flex-direction:column;
}

.screen.active{
  display:flex;
}

/* ---------- HOME ---------- */

.logo{
  text-align:center;
  padding-top:30px;
}

.logo .ornament{
  font-size:28px;
  opacity:.8;
}

.logo h1{
  margin:4px 0;
  font-size:54px;
  line-height:1;
  color:var(--gold);
  text-shadow:
    0 3px 0 #8d5d00,
    0 0 25px rgba(255,209,102,.25);
}

.logo p{
  margin:12px 0 25px;
  color:var(--muted);
  font-size:15px;
}

.hero-card{
  background:
    linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 20px 50px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.1);
  border-radius:28px;
  padding:22px;
  backdrop-filter:blur(14px);
}

.hero-title{
  text-align:center;
  font-size:20px;
  margin-bottom:18px;
  color:#fff;
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode-btn{
  min-height:76px;
  border-radius:20px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,.15);
  color:white;
  font-size:17px;
  font-weight:bold;
  transition:.18s;
}

.mode-btn:active{
  transform:scale(.96);
}

.mode-btn.selected{
  background:linear-gradient(135deg,#f8b84e,#d88716);
  color:#18202a;
  box-shadow:0 8px 25px rgba(255,183,3,.25);
}

.mode-btn small{
  display:block;
  margin-top:5px;
  opacity:.75;
  font-size:11px;
}

.start-btn{
  width:100%;
  margin-top:18px;
  height:62px;
  border-radius:20px;
  background:linear-gradient(135deg,#ffd166,#f5a900);
  color:#18202a;
  font-size:21px;
  font-weight:900;
  box-shadow:0 10px 30px rgba(255,183,3,.25);
}

.start-btn:active{
  transform:scale(.97);
}

.home-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.stat-box{
  background:rgba(255,255,255,.07);
  border-radius:18px;
  padding:13px;
  text-align:center;
  border:1px solid rgba(255,255,255,.08);
}

.stat-box .number{
  color:var(--gold);
  font-size:21px;
  font-weight:900;
}

.stat-box .label{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.music-box{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 15px;
  border-radius:17px;
  background:rgba(0,0,0,.18);
}

.music-info{
  font-size:13px;
  color:var(--muted);
}

.music-btn{
  width:48px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.13);
  color:white;
  font-size:19px;
}

/* ---------- GAME ---------- */

.game-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.icon-btn{
  width:43px;
  height:43px;
  border-radius:14px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-size:18px;
}

.stage-info{
  text-align:center;
  flex:1;
}

.stage-info strong{
  display:block;
  color:var(--gold);
  font-size:17px;
}

.stage-info span{
  font-size:11px;
  color:var(--muted);
}

.coin-box{
  min-width:75px;
  height:43px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  border-radius:14px;
  background:rgba(255,255,255,.1);
  color:var(--gold);
  font-weight:bold;
}

.progress-wrap{
  margin-top:13px;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:99px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#ffb703,#ffd166);
  transition:.4s;
}

.message{
  min-height:34px;
  text-align:center;
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

.answers-card{
  margin-top:4px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;
  padding:17px 14px;
}

.answers-title{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-bottom:12px;
}

.answer-list{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.answer-slot{
  min-width:58px;
  height:43px;
  padding:0 10px;
  border-radius:13px;
  border:1px dashed rgba(255,255,255,.2);
  background:rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.45);
  font-size:17px;
  font-weight:bold;
}

.answer-slot.done{
  color:#082014;
  background:var(--green);
  border-color:var(--green);
  animation:pop .3s ease;
}

@keyframes pop{
  0%{transform:scale(.7)}
  80%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

/* current word */

.current-word{
  min-height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:13px 0;
}

.current-letter{
  width:43px;
  height:52px;
  border-bottom:3px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
  color:white;
}

/* letters */

.letters-panel{
  margin-top:auto;
  padding-top:8px;
}

.letters{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:11px;
  min-height:105px;
  align-content:center;
}

.letter{
  width:62px;
  height:62px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),rgba(255,255,255,.06));
  border:2px solid rgba(255,255,255,.18);
  color:white;
  font-size:25px;
  font-weight:900;
  box-shadow:
    0 7px 17px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.12);
  touch-action:none;
  user-select:none;
  transition:.12s;
  position:relative;
}

.letter.selected{
  background:linear-gradient(145deg,#ffd166,#eea900);
  color:#15202a;
  border-color:#ffe09a;
  transform:scale(1.09);
  box-shadow:
    0 0 0 5px rgba(255,209,102,.13),
    0 8px 25px rgba(255,183,3,.3);
}

.letter.used{
  opacity:.38;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  gap:9px;
  margin-top:14px;
}

.control-btn{
  height:51px;
  border-radius:17px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,.11);
  color:white;
  font-size:14px;
  font-weight:bold;
}

.control-btn.primary{
  background:linear-gradient(135deg,#ffd166,#f3aa09);
  color:#16202a;
}

.control-btn:active{
  transform:scale(.96);
}

/* bonus */

.bonus-card{
  margin-top:10px;
  padding:10px 13px;
  border-radius:17px;
  background:rgba(255,255,255,.05);
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

.bonus-card strong{
  color:var(--gold);
}

/* ---------- END ---------- */

.end-screen{
  justify-content:center;
  align-items:center;
}

.end-card{
  width:100%;
  text-align:center;
  background:
    linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.15);
  border-radius:30px;
  padding:30px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.end-icon{
  font-size:62px;
}

.end-card h2{
  color:var(--gold);
  font-size:30px;
  margin:8px 0;
}

.end-score{
  font-size:42px;
  font-weight:900;
  color:white;
  margin:15px 0;
}

.end-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin:20px 0;
}

.end-stat{
  background:rgba(0,0,0,.15);
  border-radius:15px;
  padding:12px 5px;
}

.end-stat b{
  display:block;
  color:var(--gold);
  font-size:19px;
}

.end-stat span{
  font-size:10px;
  color:var(--muted);
}

.end-actions{
  display:grid;
  gap:10px;
}

.end-actions button{
  height:55px;
  border-radius:18px;
  font-size:17px;
  font-weight:bold;
}

.play-again{
  background:linear-gradient(135deg,#ffd166,#f2a900);
  color:#17202a;
}

.go-home{
  background:var(--glass);
  color:white;
}

/* ---------- effects ---------- */

.correct-flash{
  animation:correctFlash .45s ease;
}

@keyframes correctFlash{
  0%{box-shadow:0 0 0 rgba(85,214,138,0)}
  50%{box-shadow:0 0 40px rgba(85,214,138,.5)}
  100%{box-shadow:0 0 0 rgba(85,214,138,0)}
}

.wrong-shake{
  animation:shake .35s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-9px)}
  75%{transform:translateX(9px)}
}

.pulse{
  animation:pulse .35s ease;
}

@keyframes pulse{
  50%{transform:scale(1.06)}
}

/* ---------- RTL ---------- */

html[dir="rtl"] .letter{
  font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif;
}

.hidden{
  display:none!important;
}

@media(max-width:370px){
  .letter{
    width:55px;
    height:55px;
  }

  .logo h1{
    font-size:47px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- HOME -->
  <section id="homeScreen" class="screen active">

    <div class="logo">
      <div class="ornament">✦ ❖ ✦</div>
      <h1>حیدربابا</h1>
      <p>بازی واژه‌های آذربایجانی</p>
    </div>

    <div class="hero-card">

      <div class="hero-title">
        زبان بازی را انتخاب کنید
      </div>

      <div class="mode-grid">

        <button id="latinModeBtn" class="mode-btn selected">
          🇮🇷 لاتین
          <small>A B C Ç Ş Ö Ü Ə</small>
        </button>

        <button id="arabicModeBtn" class="mode-btn">
          🇮🇷 عربی
          <small>الفبای عربی</small>
        </button>

      </div>

      <button id="startBtn" class="start-btn">
        ▶ شروع بازی
      </button>

      <div class="home-stats">

        <div class="stat-box">
          <div id="homeStage" class="number">۱</div>
          <div class="label">مرحله</div>
        </div>

        <div class="stat-box">
          <div id="homeCoins" class="number">۱۰۰</div>
          <div class="label">سکه</div>
        </div>

      </div>

      <div class="music-box">

        <div class="music-info">
          🎵 موسیقی حیدربابا
          <br>
          <small id="musicStatus">آماده پخش</small>
        </div>

        <button id="musicBtnHome" class="music-btn">🔊</button>

      </div>

    </div>

  </section>


  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="game-top">

      <button id="homeBtn" class="icon-btn">⌂</button>

      <div class="stage-info">
        <strong id="stageTitle">مرحله ۱</strong>
        <span id="foundText">۰ از ۳ کلمه</span>
      </div>

      <div class="coin-box">
        🪙 <span id="coinCount">100</span>
      </div>

    </div>

    <div class="progress-wrap">
      <div id="progressBar" class="progress"></div>
    </div>

    <div id="message" class="message">
      حروف را به هم وصل کن
    </div>

    <div class="answers-card">

      <div class="answers-title">
        <span>کلمات مرحله</span>
        <span id="lives">❤️❤️❤️</span>
      </div>

      <div id="answerList" class="answer-list"></div>

    </div>

    <div id="currentWord" class="current-word"></div>

    <div class="letters-panel">

      <div id="letters" class="letters"></div>

      <div class="controls">

        <button id="shuffleBtn" class="control-btn">
          🔀 جابه‌جایی
        </button>

        <button id="submitBtn" class="control-btn primary">
          ✓ ثبت کلمه
        </button>

        <button id="hintBtn" class="control-btn">
          💡 راهنما
        </button>

      </div>

      <div class="bonus-card">
        کلمات پنهان:
        <strong id="bonusCount">۰</strong>
        &nbsp; | &nbsp;
        پاداش:
        <strong>🪙 +۵</strong>
      </div>

    </div>

  </section>


  <!-- END -->
  <section id="endScreen" class="screen end-screen">

    <div class="end-card">

      <div id="endIcon" class="end-icon">🏆</div>

      <h2 id="endTitle">آفرین!</h2>

      <div id="endScore" class="end-score">۰</div>

      <div class="end-grid">

        <div class="end-stat">
          <b id="endWords">۰</b>
          <span>کلمه</span>
        </div>

        <div class="end-stat">
          <b id="endBonus">۰</b>
          <span>پنهان</span>
        </div>

        <div class="end-stat">
          <b id="endCoins">۰</b>
          <span>سکه</span>
        </div>

      </div>

      <div class="end-actions">

        <button id="nextStageBtn" class="play-again">
          مرحله بعد ▶
        </button>

        <button id="restartBtn" class="play-again">
          دوباره بازی کن
        </button>

        <button id="endHomeBtn" class="go-home">
          ⌂ صفحه اصلی
        </button>

      </div>

    </div>

  </section>

</div>


<!-- BACKGROUND MUSIC -->
<audio
  id="bgMusic"
  src="https://topaltopalchi-ship-it.github.io/S-zl-r/ays%C9%99l.mp3"
  loop
  preload="auto">
</audio>


<script>

/* =========================================================
   حیدربابا
   موتور بازی اتصال حروف
========================================================= */


/* ---------- STORAGE ---------- */

const STORAGE = {
  stage: "heydarbaba_stage",
  coins: "heydarbaba_coins",
  mode: "heydarbaba_mode",
  score: "heydarbaba_score",
  music: "heydarbaba_music"
};


/* ---------- STATE ---------- */

let mode = localStorage.getItem(STORAGE.mode) || "latin";

let stageNumber =
  Number(localStorage.getItem(STORAGE.stage) || 1);

let coins =
  Number(localStorage.getItem(STORAGE.coins) || 100);

let totalScore =
  Number(localStorage.getItem(STORAGE.score) || 0);

let lives = 3;

let selectedIndexes = [];

let currentWord = "";

let foundWords = [];

let bonusWords = [];

let musicEnabled =
  localStorage.getItem(STORAGE.music) !== "off";


/* ---------- STAGES ----------

   هر مرحله:
   lettersLatin = حروف قابل انتخاب
   answersLatin = کلمات اصلی
   bonusLatin = کلمات پنهان

   در حالت عربی، نمایش جداگانه و کنترل‌شده است.
*/

const stages = [

  {
    lettersLatin:["گ","ل","ا","ب"],
    lettersArabic:["گ","ل","ا","ب"],

    answersLatin:["گل","بال","گال"],
    answersArabic:["گل","بال","گال"],

    bonusLatin:["لب","با","لا"],
    bonusArabic:["لب","با","لا"]
  },

  {
    lettersLatin:["ا","و","د","ن"],
    lettersArabic:["ا","و","د","ن"],

    answersLatin:["نان","دان","وان"],
    answersArabic:["نان","دان","وان"],

    bonusLatin:["آن","نو","نا"]
    ,
    bonusArabic:["آن","نو","نا"]
  },

  {
    lettersLatin:["گ","و","ی","س"],
    lettersArabic:["گ","و","ی","س"],

    answersLatin:["گوی","سی","سو"],
    answersArabic:["گوی","سی","سو"],

    bonusLatin:["وی","گو","یس"],
    bonusArabic:["وی","گو","یس"]
  },

  {
    lettersLatin:["چ","و","ر","ک"],
    lettersArabic:["چ","و","ر","ک"],

    answersLatin:["چور","کور","روک"],
    answersArabic:["چور","کور","روک"],

    bonusLatin:["ور","رو","کو"],
    bonusArabic:["ور","رو","کو"]
  },

  {
    lettersLatin:["گ","و","ن","ش"],
    lettersArabic:["گ","و","ن","ش"],

    answersLatin:["گونش","گون","شون"],
    answersArabic:["گونش","گون","شون"],

    bonusLatin:["گوش","شون","نو"],
    bonusArabic:["گوش","شون","نو"]
  },

  {
    lettersLatin:["ا","ئ","و"],
    lettersArabic:["ا","ئ","و"],

    answersLatin:["ائو","او"],
    answersArabic:["ائو","او"],

    bonusLatin:["ئو","او"],
    bonusArabic:["ئو","او"]
  },

  {
    lettersLatin:["ا","غ","ا","ج"],
    lettersArabic:["ا","غ","ا","ج"],

    answersLatin:["آغا","غاج"],
    answersArabic:["آغا","غاج"],

    bonusLatin:["آج","غا","گا"],
    bonusArabic:["آج","غا","گا"]
  },

  {
    lettersLatin:["س","و","ا","ل"],
    lettersArabic:["س","و","ا","ل"],

    answersLatin:["سال","وال","سوال"],
    answersArabic:["سال","وال","سوال"],

    bonusLatin:["سا","لا","سو"],
    bonusArabic:["سا","لا","سو"]
  },

  {
    lettersLatin:["ا","ی","ل","ا"],
    lettersArabic:["ا","ی","ل","ا"],

    answersLatin:["آلا","الا","یالا"],
    answersArabic:["آلا","الا","یالا"],

    bonusLatin:["لا","یا","آل"],
    bonusArabic:["لا","یا","آل"]
  },

  {
    lettersLatin:["ب","ا","ه","ا","ر"],
    lettersArabic:["ب","ا","ه","ا","ر"],

    answersLatin:["بهار","بار","راه"],
    answersArabic:["بهار","بار","راه"],

    bonusLatin:["به","راه","بار"],
    bonusArabic:["به","راه","بار"]
  }

];


/* ---------- DOM ---------- */

const homeScreen = document.getElementById("homeScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");

const latinModeBtn = document.getElementById("latinModeBtn");
const arabicModeBtn = document.getElementById("arabicModeBtn");

const startBtn = document.getElementById("startBtn");

const homeStage = document.getElementById("homeStage");
const homeCoins = document.getElementById("homeCoins");

const musicBtnHome = document.getElementById("musicBtnHome");
const musicStatus = document.getElementById("musicStatus");

const bgMusic = document.getElementById("bgMusic");

const stageTitle = document.getElementById("stageTitle");
const foundText = document.getElementById("foundText");
const coinCount = document.getElementById("coinCount");
const progressBar = document.getElementById("progressBar");
const message = document.getElementById("message");

const answerList = document.getElementById("answerList");
const currentWordBox = document.getElementById("currentWord");
const lettersBox = document.getElementById("letters");

const livesBox = document.getElementById("lives");
const bonusCount = document.getElementById("bonusCount");

const shuffleBtn = document.getElementById("shuffleBtn");
const submitBtn = document.getElementById("submitBtn");
const hintBtn = document.getElementById("hintBtn");
const homeBtn = document.getElementById("homeBtn");

const endScore = document.getElementById("endScore");
const endWords = document.getElementById("endWords");
const endBonus = document.getElementById("endBonus");
const endCoins = document.getElementById("endCoins");

const nextStageBtn = document.getElementById("nextStageBtn");
const restartBtn = document.getElementById("restartBtn");
const endHomeBtn = document.getElementById("endHomeBtn");


/* ---------- MODE ---------- */

function setMode(newMode){

  mode = newMode;

  localStorage.setItem(STORAGE.mode, mode);

  latinModeBtn.classList.toggle(
    "selected",
    mode === "latin"
  );

  arabicModeBtn.classList.toggle(
    "selected",
    mode === "arabic"
  );

  if(mode === "arabic"){
    document.documentElement.dir = "rtl";
  }else{
    document.documentElement.dir = "ltr";
  }
}

latinModeBtn.addEventListener(
  "click",
  () => setMode("latin")
);

arabicModeBtn.addEventListener(
  "click",
  () => setMode("arabic")
);

setMode(mode);


/* ---------- SCREEN ---------- */

function showScreen(screen){

  [homeScreen,gameScreen,endScreen]
    .forEach(s => s.classList.remove("active"));

  screen.classList.add("active");
}


/* ---------- MUSIC ---------- */

async function startMusic(){

  if(!musicEnabled) return;

  try{

    bgMusic.volume = 0.45;

    await bgMusic.play();

    musicStatus.textContent = "موسیقی روشن است";
    musicBtnHome.textContent = "🔊";

  }catch(error){

    musicStatus.textContent =
      "برای پخش موسیقی دوباره دکمه را بزنید";

  }
}

function stopMusic(){

  bgMusic.pause();

}

function toggleMusic(){

  if(bgMusic.paused){

    musicEnabled = true;

    localStorage.setItem(
      STORAGE.music,
      "on"
    );

    startMusic();

  }else{

    musicEnabled = false;

    localStorage.setItem(
      STORAGE.music,
      "off"
    );

    stopMusic();

    musicStatus.textContent =
      "موسیقی خاموش است";

    musicBtnHome.textContent = "🔇";
  }
}

musicBtnHome.addEventListener(
  "click",
  toggleMusic
);


/* ---------- HOME ---------- */

function updateHome(){

  homeStage.textContent =
    toPersianNumber(stageNumber);

  homeCoins.textContent =
    toPersianNumber(coins);

  musicBtnHome.textContent =
    bgMusic.paused ? "🔇" : "🔊";

}

updateHome();


/* ---------- NUMBER ---------- */

function toPersianNumber(value){

  return String(value)
    .replace(/\d/g,d =>
      "۰۱۲۳۴۵۶۷۸۹"[d]
    );
}


/* ---------- LOAD STAGE ---------- */

function getStage(){

  const index =
    (stageNumber - 1) % stages.length;

  return stages[index];

}


function startGame(){

  startMusic();

  lives = 3;

  foundWords = [];

  bonusWords = [];

  selectedIndexes = [];

  currentWord = "";

  loadStage();

  showScreen(gameScreen);

}


function loadStage(){

  const stage = getStage();

  stageTitle.textContent =
    "مرحله " + toPersianNumber(stageNumber);

  const answers =
    mode === "latin"
      ? stage.answersLatin
      : stage.answersArabic;

  const letters =
    mode === "latin"
      ? stage.lettersLatin
      : stage.lettersArabic;

  renderAnswers(answers);

  renderLetters(letters);

  renderCurrentWord();

  updateStats();

  message.textContent =
    "حروف را به هم وصل کن";

}


/* ---------- ANSWERS ---------- */

function renderAnswers(answers){

  answerList.innerHTML = "";

  answers.forEach(word => {

    const slot =
      document.createElement("div");

    slot.className = "answer-slot";

    if(foundWords.includes(word)){

      slot.classList.add("done");

      slot.textContent = word;

    }else{

      slot.textContent =
        "•".repeat(Array.from(word).length);

    }

    answerList.appendChild(slot);

  });

}


/* ---------- LETTERS ---------- */

function renderLetters(letters){

  lettersBox.innerHTML = "";

  letters.forEach((letter,index) => {

    const button =
      document.createElement("button");

    button.className = "letter";

    button.textContent = letter;

    button.dataset.index = index;

    button.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        beginSelection(index);

      }
    );

    button.addEventListener(
      "pointerenter",
      event => {

        if(event.buttons === 1){

          extendSelection(index);

        }

      }
    );

    button.addEventListener(
      "pointerup",
      event => {

        event.preventDefault();

        finishSelection();

      }
    );

    lettersBox.appendChild(button);

  });

}


/* ---------- SELECTION ---------- */

function beginSelection(index){

  selectedIndexes = [index];

  updateSelectedLetters();

  renderCurrentWord();

}

function extendSelection(index){

  if(selectedIndexes.length === 0)
    return;

  if(selectedIndexes.includes(index))
    return;

  selectedIndexes.push(index);

  updateSelectedLetters();

  renderCurrentWord();

}

function finishSelection(){

  if(selectedIndexes.length === 0)
    return;

  currentWord =
    getSelectedWord();

  renderCurrentWord();

}


function getSelectedWord(){

  const stage = getStage();

  const letters =
    mode === "latin"
      ? stage.lettersLatin
      : stage.lettersArabic;

  return selectedIndexes
    .map(index => letters[index])
    .join("");

}


/* ---------- SELECTED UI ---------- */

function updateSelectedLetters(){

  document
    .querySelectorAll(".letter")
    .forEach(button => {

      const index =
        Number(button.dataset.index);

      button.classList.toggle(
        "selected",
        selectedIndexes.includes(index)
      );

    });

}


function renderCurrentWord(){

  currentWordBox.innerHTML = "";

  const chars =
    Array.from(currentWord);

  chars.forEach(char => {

    const box =
      document.createElement("div");

    box.className = "current-letter";

    box.textContent = char;

    currentWordBox.appendChild(box);

  });

}


/* ---------- SUBMIT ---------- */

function submitWord(){

  currentWord = getSelectedWord();

  if(!currentWord){

    message.textContent =
      "اول چند حرف را انتخاب کن";

    return;

  }

  const stage = getStage();

  const answers =
    mode === "latin"
      ? stage.answersLatin
      : stage.answersArabic;

  const bonuses =
    mode === "latin"
      ? stage.bonusLatin
      : stage.bonusArabic;

  const normalized =
    normalizeWord(currentWord);

  const normalizedAnswers =
    answers.map(normalizeWord);

  const normalizedBonuses =
    bonuses.map(normalizeWord);


  /* اصلی */

  const answerIndex =
    normalizedAnswers.indexOf(normalized);

  if(answerIndex !== -1){

    const actualWord =
      answers[answerIndex];

    if(!foundWords.includes(actualWord)){

      foundWords.push(actualWord);

      totalScore +=
        10 + actualWord.length * 2;

      playCorrectSound();

      message.textContent =
        "✨ آفرین! کلمه درست است";

      gameScreen.classList.add(
        "correct-flash"
      );

      setTimeout(() => {
        gameScreen.classList.remove(
          "correct-flash"
        );
      },450);

      clearSelection();

      renderAnswers(answers);

      updateStats();

      if(foundWords.length === answers.length){

        setTimeout(
          finishStage,
          550
        );

      }

      return;

    }else{

      message.textContent =
        "این کلمه را قبلاً پیدا کردی";

      clearSelection();

      return;

    }

  }


  /* پنهان */

  const bonusIndex =
    normalizedBonuses.indexOf(normalized);

  if(bonusIndex !== -1){

    const actualBonus =
      bonuses[bonusIndex];

    if(!bonusWords.includes(actualBonus)){

      bonusWords.push(actualBonus);

      coins += 5;

      totalScore += 5;

      saveData();

      playCorrectSound();

      message.textContent =
        "🌟 کلمه پنهان! +۵ سکه";

      bonusCount.textContent =
        toPersianNumber(bonusWords.length);

      coinCount.textContent =
        toPersianNumber(coins);

      clearSelection();

      return;

    }else{

      message.textContent =
        "این کلمه قبلاً پیدا شده";

      clearSelection();

      return;

    }

  }


  /* غلط */

  playWrongSound();

  lives--;

  updateLives();

  message.textContent =
    "❌ این کلمه در این مرحله نیست";

  gameScreen.classList.add(
    "wrong-shake"
  );

  setTimeout(() => {
    gameScreen.classList.remove(
      "wrong-shake"
    );
  },350);

  clearSelection();

  if(lives <= 0){

    setTimeout(() => {

      message.textContent =
        "❤️ جان‌ها تمام شد";

      setTimeout(
        restartCurrentStage,
        800
      );

    },250);

  }

}


/* ---------- NORMALIZE ---------- */

function normalizeWord(word){

  return word
    .trim()
    .toLocaleLowerCase("az-AZ");

}


/* ---------- CLEAR ---------- */

function clearSelection(){

  selectedIndexes = [];

  currentWord = "";

  updateSelectedLetters();

  renderCurrentWord();

}


/* ---------- SHUFFLE ---------- */

function shuffleArray(array){

  const result = [...array];

  for(let i=result.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    [result[i],result[j]] =
      [result[j],result[i]];

  }

  return result;

}


function shuffleLetters(){

  const stage = getStage();

  const letters =
    mode === "latin"
      ? stage.lettersLatin
      : stage.lettersArabic;

  const shuffled =
    shuffleArray(letters);

  selectedIndexes = [];

  currentWord = "";

  lettersBox.innerHTML = "";

  shuffled.forEach((letter,index) => {

    const button =
      document.createElement("button");

    button.className = "letter";

    button.textContent = letter;

    button.dataset.index = index;

    button.addEventListener(
      "pointerdown",
      e => {

        e.preventDefault();

        selectedIndexes = [index];

        updateSelectedLetters();

        currentWord = getSelectedWord();

        renderCurrentWord();

      }
    );

    button.addEventListener(
      "pointerenter",
      e => {

        if(e.buttons === 1){

          if(!selectedIndexes.includes(index)){

            selectedIndexes.push(index);

            updateSelectedLetters();

            currentWord =
              getSelectedWord();

            renderCurrentWord();

          }

        }

      }
    );

    button.addEventListener(
      "pointerup",
      e => {

        e.preventDefault();

        currentWord =
          getSelectedWord();

      }
    );

    lettersBox.appendChild(button);

  });

  message.textContent =
    "🔀 حروف جابه‌جا شدند";

}


/* ---------- HINT ---------- */

function useHint(){

  const stage = getStage();

  const answers =
    mode === "latin"
      ? stage.answersLatin
      : stage.answersArabic;

  const remaining =
    answers.filter(
      word => !foundWords.includes(word)
    );

  if(remaining.length === 0){

    message.textContent =
      "همهٔ کلمات پیدا شده‌اند";

    return;

  }

  if(coins < 10){

    message.textContent =
      "🪙 برای راهنما حداقل ۱۰ سکه لازم است";

    return;

  }

  const target = remaining[0];

  coins -= 10;

  saveData();

  coinCount.textContent =
    toPersianNumber(coins);

  message.textContent =
    "💡 کلمه با حرف «" +
    Array.from(target)[0] +
    "» شروع می‌شود";

}


/* ---------- STATS ---------- */

function updateStats(){

  const stage = getStage();

  const answers =
    mode === "latin"
      ? stage.answersLatin
      : stage.answersArabic;

  foundText.textContent =
    toPersianNumber(foundWords.length)
    + " از "
    + toPersianNumber(answers.length)
    + " کلمه";

  coinCount.textContent =
    toPersianNumber(coins);

  bonusCount.textContent =
    toPersianNumber(bonusWords.length);

  const percent =
    answers.length === 0
      ? 0
      : (foundWords.length / answers.length) * 100;

  progressBar.style.width =
    percent + "%";

  updateLives();

}


function updateLives(){

  livesBox.textContent =
    "❤️".repeat(lives)
    +
    "🖤".repeat(3-lives);

}


/* ---------- FINISH ---------- */

function finishStage(){

  const earnedCoins =
    10 + foundWords.length * 3;

  coins += earnedCoins;

  totalScore += 25;

  saveData();

  endScore.textContent =
    toPersianNumber(totalScore);

  endWords.textContent =
    toPersianNumber(foundWords.length);

  endBonus.textContent =
    toPersianNumber(bonusWords.length);

  endCoins.textContent =
    toPersianNumber(earnedCoins);

  document.getElementById("endTitle")
    .textContent =
      "آفرین قهرمان!";

  document.getElementById("endIcon")
    .textContent =
      "🏆";

  stageNumber++;

  saveData();

  updateHome();

  showScreen(endScreen);

}


/* ---------- RESTART ---------- */

function restartCurrentStage(){

  lives = 3;

  foundWords = [];

  bonusWords = [];

  selectedIndexes = [];

  currentWord = "";

  loadStage();

  showScreen(gameScreen);

}


/* ---------- SAVE ---------- */

function saveData(){

  localStorage.setItem(
    STORAGE.stage,
    stageNumber
  );

  localStorage.setItem(
    STORAGE.coins,
    coins
  );

  localStorage.setItem(
    STORAGE.score,
    totalScore
  );

  localStorage.setItem(
    STORAGE.mode,
    mode
  );

}


/* ---------- AUDIO EFFECTS ---------- */

let audioContext = null;


function getAudioContext(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

  }

  return audioContext;

}


function playCorrectSound(){

  try{

    const ctx =
      getAudioContext();

    if(ctx.state === "suspended")
      ctx.resume();

    const now =
      ctx.currentTime;

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      523.25,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      783.99,
      now + .18
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .15,
      now + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .3
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + .3);

  }catch(e){}

}


function playWrongSound(){

  try{

    const ctx =
      getAudioContext();

    if(ctx.state === "suspended")
      ctx.resume();

    const now =
      ctx.currentTime;

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
      220,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      110,
      now + .2
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .12,
      now + .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .25
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + .25);

  }catch(e){}

}


/* ---------- BUTTONS ---------- */

startBtn.addEventListener(
  "click",
  () => {

    getAudioContext();

    startGame();

  }
);

submitBtn.addEventListener(
  "click",
  submitWord
);

shuffleBtn.addEventListener(
  "click",
  shuffleLetters
);

hintBtn.addEventListener(
  "click",
  useHint
);

homeBtn.addEventListener(
  "click",
  () => {

    saveData();

    updateHome();

    showScreen(homeScreen);

  }
);

restartBtn.addEventListener(
  "click",
  restartCurrentStage
);

nextStageBtn.addEventListener(
  "click",
  () => {

    startGame();

  }
);

endHomeBtn.addEventListener(
  "click",
  () => {

    updateHome();

    showScreen(homeScreen);

  }
);


/* ---------- KEYBOARD ---------- */

document.addEventListener(
  "keydown",
  event => {

    if(!gameScreen.classList.contains("active"))
      return;

    if(event.key === "Enter"){

      submitWord();

    }

    if(event.key === "Escape"){

      clearSelection();

    }

  }
);


/* ---------- PREVENT LONG PRESS ---------- */

document.addEventListener(
  "contextmenu",
  event => {

    if(event.target.classList.contains("letter")){

      event.preventDefault();

    }

  }
);


/* ---------- INITIAL ---------- */

updateHome();

if(!musicEnabled){

  musicStatus.textContent =
    "موسیقی خاموش است";

  musicBtnHome.textContent =
    "🔇";

}

</script>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101820,#243b55);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.container{
  width:100%;
  max-width:600px;
}

.card{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
}

h1{
  font-size:42px;
  margin:5px 0 10px;
}

.subtitle{
  color:#d7e1ea;
  margin-bottom:25px;
}

button{
  border:0;
  border-radius:15px;
  padding:14px 20px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:scale(1.04);
}

.mode-buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin:20px 0;
}

.mode-btn{
  background:white;
  color:#17202a;
  min-width:170px;
}

.start-btn{
  background:#19c37d;
  color:white;
  width:100%;
  margin-top:10px;
}

.music-btn{
  background:rgba(255,255,255,.15);
  color:white;
  width:100%;
  margin-top:12px;
}

.stats{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.stat{
  flex:1;
  min-width:100px;
  background:rgba(0,0,0,.22);
  padding:12px 8px;
  border-radius:14px;
}

.stat strong{
  display:block;
  font-size:23px;
  margin-top:4px;
}

.timer-box{
  height:10px;
  background:rgba(255,255,255,.15);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

.timer-bar{
  height:100%;
  width:100%;
  background:#19c37d;
  transition:width 1s linear;
}

.word-label{
  color:#cbd5df;
  margin-bottom:10px;
}

.scrambled{
  font-size:42px;
  font-weight:bold;
  letter-spacing:7px;
  direction:ltr;
  margin:20px 0;
  min-height:60px;
  word-break:break-word;
}

.scrambled.arabic{
  direction:rtl;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:16px;
  border:2px solid rgba(255,255,255,.2);
  border-radius:15px;
  background:rgba(0,0,0,.2);
  color:white;
  font-size:20px;
  text-align:center;
  outline:none;
}

input:focus{
  border-color:#19c37d;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.actions button{
  flex:1;
}

.check-btn{
  background:#19c37d;
  color:white;
}

.hint-btn{
  background:#f4b942;
  color:#222;
}

.message{
  min-height:30px;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.correct{
  animation:correctAnim .45s;
}

.wrong{
  animation:wrongAnim .45s;
}

@keyframes correctAnim{
  50%{
    transform:scale(1.04);
  }
}

@keyframes wrongAnim{
  25%{
    transform:translateX(-8px);
  }

  50%{
    transform:translateX(8px);
  }

  75%{
    transform:translateX(-5px);
  }
}

.hidden{
  display:none;
}

.end-icon{
  font-size:65px;
  margin-bottom:5px;
}

.final-score{
  font-size:55px;
  font-weight:bold;
  margin:10px 0;
}

.record{
  background:rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
  margin:20px 0;
}

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.result-item{
  background:rgba(0,0,0,.20);
  padding:15px;
  border-radius:15px;
}

.result-item span{
  display:block;
  color:#cbd5df;
  margin-bottom:5px;
}

.result-item strong{
  font-size:25px;
}

.new-record{
  color:#ffd166;
  font-size:21px;
  font-weight:bold;
  margin:15px 0;
}

.end-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.play-again{
  background:#19c37d;
  color:white;
}

.home-btn{
  background:white;
  color:#17202a;
}

.music-control{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:15px;
  color:#d7e1ea;
  font-size:14px;
}

@media(max-width:480px){

  .card{
    padding:20px 15px;
  }

  h1{
    font-size:35px;
  }

  .scrambled{
    font-size:32px;
    letter-spacing:4px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    min-width:80px;
    font-size:13px;
  }

  .stat strong{
    font-size:20px;
  }
}
</style>
</head>

<body>

<!-- موسیقی زمینه -->
<audio
  id="bgMusic"
  src="Tar-Azari-09.mp3"
  loop
  preload="auto">
</audio>


<div class="container">

  <!-- صفحه شروع -->

  <div class="card" id="startScreen">

    <h1>🧩 SÖZLƏR</h1>

    <div class="subtitle">
      Qarışıq hərflərdən sözü tap!
    </div>

    <p>Əlifbanı seç:</p>

    <div class="mode-buttons">

      <button
        class="mode-btn"
        onclick="selectMode('latin')">
        🇮🇷 Latin
      </button>

      <button
        class="mode-btn"
        onclick="selectMode('arabic')">
        🇮🇷 Ərəb
      </button>

    </div>

    <div id="selectedMode">
      Əlifba seçilməyib
    </div>

    <button
      class="start-btn"
      onclick="startGame()">
      ▶️ Oyuna başla
    </button>

    <button
      class="music-btn"
      onclick="toggleMusic()"
      id="musicButton">
      🔊 Musiqi: Açıq
    </button>

  </div>


  <!-- صفحه بازی -->

  <div
    class="card hidden"
    id="gameScreen">

    <div class="stats">

      <div class="stat">
        Mərhələ
        <strong id="stage">1</strong>
      </div>

      <div class="stat">
        ❤️ Can
        <strong id="lives">3</strong>
      </div>

      <div class="stat">
        ⭐ Xal
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        🏆 Rekord
        <strong id="best">0</strong>
      </div>

    </div>


    <div class="timer-box">
      <div
        class="timer-bar"
        id="timerBar">
      </div>
    </div>


    <div class="word-label">
      Qarışıq söz:
    </div>


    <div
      class="scrambled"
      id="scrambledWord">
    </div>


    <input
      id="answer"
      type="text"
      autocomplete="off"
      placeholder="Cavabını yaz..."
    >


    <div class="actions">

      <button
        class="check-btn"
        onclick="checkAnswer()">
        ✓ Yoxla
      </button>

      <button
        class="hint-btn"
        onclick="showHint()">
        💡 İpucu
      </button>

    </div>


    <div
      class="message"
      id="message">
    </div>


    <div class="music-control">
      🎵 Tar musiqisi aktivdir
    </div>

  </div>


  <!-- صفحه پایان -->

  <div
    class="card hidden"
    id="endScreen">

    <div
      class="end-icon"
      id="endIcon">
      🏆
    </div>


    <h1>
      Oyun bitdi!
    </h1>


    <div
      class="subtitle"
      id="endMessage">
      Yaxşı oyun idi!
    </div>


    <div
      class="final-score"
      id="finalScore">
      0
    </div>


    <div>
      Yekun xal
    </div>


    <div class="record">

      🏆 Ən yaxşı nəticə:

      <strong id="finalBest">
        0
      </strong>

    </div>


    <div class="result-grid">

      <div class="result-item">

        <span>
          ✅ Düz cavab
        </span>

        <strong id="correctCount">
          0
        </strong>

      </div>


      <div class="result-item">

        <span>
          ❌ Səhv cavab
        </span>

        <strong id="wrongCount">
          0
        </strong>

      </div>


      <div class="result-item">

        <span>
          🎯 Mərhələ
        </span>

        <strong id="finalStage">
          1
        </strong>

      </div>


      <div class="result-item">

        <span>
          ❤️ Qalan can
        </span>

        <strong id="finalLives">
          0
        </strong>

      </div>

    </div>


    <div
      class="new-record hidden"
      id="newRecord">
      🎉 Yeni rekord!
    </div>


    <div class="end-buttons">

      <button
        class="play-again"
        onclick="restartGame()">
        🔄 Yenidən oyna
      </button>


      <button
        class="home-btn"
        onclick="goHome()">
        🏠 Əsas səhifə
      </button>

    </div>

  </div>

</div>


<script>

const words = [

  {latin:"Ana", arabic:"آنا"},
  {latin:"Ata", arabic:"آتا"},
  {latin:"Su", arabic:"سو"},
  {latin:"Ay", arabic:"آی"},
  {latin:"At", arabic:"آت"},
  {latin:"İt", arabic:"ایت"},
  {latin:"Əl", arabic:"ال"},
  {latin:"Nar", arabic:"نار"},
  {latin:"Yol", arabic:"یول"},
  {latin:"Çay", arabic:"چای"},
  {latin:"Duz", arabic:"دوز"},
  {latin:"Göy", arabic:"گوی"},
  {latin:"Ev", arabic:"ائو"},
  {latin:"Dağ", arabic:"داغ"},
  {latin:"Quş", arabic:"قوش"},
  {latin:"Göz", arabic:"گوز"},
  {latin:"Baş", arabic:"باش"},
  {latin:"Süd", arabic:"سود"},
  {latin:"Alma", arabic:"آلما"},
  {latin:"Dost", arabic:"دوست"},
  {latin:"Uşaq", arabic:"اوشاق"},
  {latin:"Kitab", arabic:"کیتاب"},
  {latin:"Qələm", arabic:"قلم"},
  {latin:"Meyvə", arabic:"میوه"},
  {latin:"Üzüm", arabic:"اوزوم"},
  {latin:"Günəş", arabic:"گونش"},
  {latin:"Çörək", arabic:"چورک"},
  {latin:"Məktəb", arabic:"مکتب"},
  {latin:"Dəniz", arabic:"دنیز"},
  {latin:"Torpaq", arabic:"تورپاق"},
  {latin:"Bulud", arabic:"بولود"},
  {latin:"Yağış", arabic:"یاغیش"},
  {latin:"Külək", arabic:"کولک"},
  {latin:"Ulduz", arabic:"اولدوز"},
  {latin:"Gecə", arabic:"گجه"},
  {latin:"Səhər", arabic:"سحر"},
  {latin:"Axşam", arabic:"آخشام"},
  {latin:"Maşın", arabic:"ماشین"},
  {latin:"Çiçək", arabic:"چیچک"},
  {latin:"Ağac", arabic:"آغاج"},
  {latin:"Yarpaq", arabic:"یارپاق"},
  {latin:"Armud", arabic:"آرمود"},
  {latin:"Balıq", arabic:"بالق"},
  {latin:"Pişik", arabic:"پیشیک"},
  {latin:"Qəhvə", arabic:"قهوه"},
  {latin:"Şəkər", arabic:"شکر"},
  {latin:"Ürək", arabic:"اورک"},
  {latin:"Ayaq", arabic:"آیاق"},
  {latin:"Ğələm", arabic:"غلم"}

];


let mode = "latin";

let stage = 1;

let lives = 3;

let score = 0;

let correctCount = 0;

let wrongCount = 0;

let currentWord = null;

let timer = null;

let timeLeft = 30;

let gameActive = false;

let hintUsed = false;

let musicEnabled = true;


let bestScore =
  Number(
    localStorage.getItem("sozlerBest")
  ) || 0;


const bgMusic =
  document.getElementById("bgMusic");


bgMusic.volume = 0.35;


document.getElementById("best")
  .textContent = bestScore;


/* انتخاب زبان */

function selectMode(selected){

  mode = selected;

  if(selected === "latin"){

    document.getElementById(
      "selectedMode"
    ).textContent =
      "🇮🇷 Latin əlifbası seçildi";

  }else{

    document.getElementById(
      "selectedMode"
    ).textContent =
      "🇮🇷 Ərəb əlifbası seçildi";

  }

}


/* موسیقی */

function startMusic(){

  if(!musicEnabled){
    return;
  }

  bgMusic.volume = 0.35;

  bgMusic.play().catch(() => {

    console.log(
      "Music playback waiting for user interaction."
    );

  });

}


function stopMusic(){

  bgMusic.pause();

  bgMusic.currentTime = 0;

}


function toggleMusic(){

  musicEnabled = !musicEnabled;

  const button =
    document.getElementById(
      "musicButton"
    );

  if(musicEnabled){

    button.textContent =
      "🔊 Musiqi: Açıq";

    if(gameActive){

      startMusic();

    }

  }else{

    button.textContent =
      "🔇 Musiqi: Bağlı";

    bgMusic.pause();

  }

}


/* شروع بازی */

function startGame(){

  startMusic();

  stage = 1;

  lives = 3;

  score = 0;

  correctCount = 0;

  wrongCount = 0;

  gameActive = true;


  document.getElementById(
    "startScreen"
  ).classList.add("hidden");


  document.getElementById(
    "endScreen"
  ).classList.add("hidden");


  document.getElementById(
    "gameScreen"
  ).classList.remove("hidden");


  updateStats();

  nextWord();

}


/* سختی بازی */

function getDifficulty(){

  if(stage <= 5){

    return {

      min:2,

      max:4,

      time:30,

      points:10

    };

  }


  if(stage <= 10){

    return {

      min:4,

      max:6,

      time:24,

      points:15

    };

  }


  return {

    min:6,

    max:20,

    time:Math.max(
      14,
      24 -
      Math.floor(
        (stage - 10) / 3
      )
    ),

    points:20

  };

}


/* انتخاب کلمه */

function getWord(){

  const difficulty =
    getDifficulty();


  let available =
    words.filter(word => {

      const length =
        Array.from(
          word.latin
        ).length;


      return (
        length >= difficulty.min &&
        length <= difficulty.max
      );

    });


  if(available.length === 0){

    available = words;

  }


  return available[
    Math.floor(
      Math.random() *
      available.length
    )
  ];

}


/* مخلوط کردن حروف */

function shuffle(text){

  const arr =
    Array.from(text);


  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }


  return arr.join("");

}


/* کلمه جدید */

function nextWord(){

  clearInterval(timer);

  hintUsed = false;


  currentWord =
    getWord();


  let displayWord =
    mode === "latin"
      ? currentWord.latin
      : currentWord.arabic;


  let scrambled =
    shuffle(displayWord);


  document.getElementById(
    "scrambledWord"
  ).textContent =
    scrambled;


  const scrambledElement =
    document.getElementById(
      "scrambledWord"
    );


  if(mode === "arabic"){

    scrambledElement
      .classList.add("arabic");

  }else{

    scrambledElement
      .classList.remove("arabic");

  }


  document.getElementById(
    "answer"
  ).value = "";


  document.getElementById(
    "answer"
  ).focus();


  document.getElementById(
    "message"
  ).textContent = "";


  const difficulty =
    getDifficulty();


  startTimer(
    difficulty.time
  );

}


/* تایمر */

function startTimer(seconds){

  timeLeft = seconds;

  updateTimer();


  timer =
    setInterval(() => {

      timeLeft--;

      updateTimer();


      if(timeLeft <= 0){

        clearInterval(timer);

        timeOut();

      }

    },1000);

}


function updateTimer(){

  const difficulty =
    getDifficulty();


  const percent =
    Math.max(
      0,
      (
        timeLeft /
        difficulty.time
      ) * 100
    );


  document.getElementById(
    "timerBar"
  ).style.width =
    percent + "%";

}


/* بررسی جواب */

function checkAnswer(){

  if(!gameActive){
    return;
  }


  const input =
    document.getElementById(
      "answer"
    ).value.trim();


  const correctAnswer =
    mode === "latin"
      ? currentWord.latin
      : currentWord.arabic;


  if(input === correctAnswer){

    clearInterval(timer);

    correctCount++;


    const difficulty =
      getDifficulty();


    let points =
      difficulty.points;


    if(hintUsed){

      points =
        Math.max(
          5,
          points - 5
        );

    }


    score += points;


    playCorrectSound();


    showMessage(
      "✅ Düzdür! +" +
      points +
      " xal"
    );


    document.getElementById(
      "gameScreen"
    ).classList.add("correct");


    setTimeout(() => {

      document.getElementById(
        "gameScreen"
      ).classList.remove("correct");


      stage++;

      updateStats();

      nextWord();

    },700);


  }else{

    wrongCount++;

    playWrongSound();

    loseLife(
      "❌ Səhv cavab!"
    );

  }

}


/* پایان زمان */

function timeOut(){

  wrongCount++;

  playWrongSound();

  loseLife(
    "⏰ Vaxt bitdi!"
  );

}


/* کم شدن جان */

function loseLife(message){

  lives--;

  updateStats();

  showMessage(message);


  document.getElementById(
    "gameScreen"
  ).classList.add("wrong");


  setTimeout(() => {

    document.getElementById(
      "gameScreen"
    ).classList.remove("wrong");

  },450);


  if(lives <= 0){

    setTimeout(() => {

      finishGame();

    },650);

  }else{

    setTimeout(() => {

      nextWord();

    },650);

  }

}


/* راهنما */

function showHint(){

  if(
    !currentWord ||
    hintUsed
  ){
    return;
  }


  hintUsed = true;


  const answer =
    mode === "latin"
      ? currentWord.latin
      : currentWord.arabic;


  const chars =
    Array.from(answer);


  const first =
    chars[0];


  showMessage(
    "💡 İlk hərf: " +
    first
  );

}


/* پیام */

function showMessage(text){

  document.getElementById(
    "message"
  ).textContent =
    text;

}


/* آمار */

function updateStats(){

  document.getElementById(
    "stage"
  ).textContent =
    stage;


  document.getElementById(
    "lives"
  ).textContent =
    lives;


  document.getElementById(
    "score"
  ).textContent =
    score;


  document.getElementById(
    "best"
  ).textContent =
    bestScore;

}


/* پایان بازی */

function finishGame(){

  stopMusic();

  gameActive = false;

  clearInterval(timer);


  const oldBest =
    bestScore;


  let isNewRecord =
    false;


  if(score > bestScore){

    bestScore = score;


    localStorage.setItem(
      "sozlerBest",
      bestScore
    );


    isNewRecord = true;

  }


  document.getElementById(
    "gameScreen"
  ).classList.add("hidden");


  document.getElementById(
    "endScreen"
  ).classList.remove("hidden");


  document.getElementById(
    "finalScore"
  ).textContent =
    score;


  document.getElementById(
    "finalBest"
  ).textContent =
    bestScore;


  document.getElementById(
    "correctCount"
  ).textContent =
    correctCount;


  document.getElementById(
    "wrongCount"
  ).textContent =
    wrongCount;


  document.getElementById(
    "finalStage"
  ).textContent =
    stage;


  document.getElementById(
    "finalLives"
  ).textContent =
    lives;


  const newRecord =
    document.getElementById(
      "newRecord"
    );


  const endIcon =
    document.getElementById(
      "endIcon"
    );


  const endMessage =
    document.getElementById(
      "endMessage"
    );


  if(isNewRecord){

    newRecord.classList.remove(
      "hidden"
    );


    endIcon.textContent =
      "🏆";


    endMessage.textContent =
      "Təbriklər! Yeni rekord qırdın!";

  }else{

    newRecord.classList.add(
      "hidden"
    );


    endIcon.textContent =
      "🎮";


    endMessage.textContent =
      "Yaxşı oyun idi! Yenidən cəhd et.";

  }

}


/* دوباره بازی */

function restartGame(){

  startGame();

}


/* صفحه اصلی */

function goHome(){

  stopMusic();

  clearInterval(timer);

  gameActive = false;


  document.getElementById(
    "gameScreen"
  ).classList.add("hidden");


  document.getElementById(
    "endScreen"
  ).classList.add("hidden");


  document.getElementById(
    "startScreen"
  ).classList.remove("hidden");

}


/* صدای جواب درست */

function getAudioContext(){

  if(!window.audioContext){

    window.audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  return window.audioContext;

}


function playCorrectSound(){

  const ctx =
    getAudioContext();


  const now =
    ctx.currentTime;


  const notes = [

    523.25,

    659.25,

    783.99

  ];


  notes.forEach(
    (frequency,index) => {

      const oscillator =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      oscillator.frequency.value =
        frequency;


      oscillator.type =
        "sine";


      gain.gain.setValueAtTime(
        0.0001,
        now +
        index * 0.09
      );


      gain.gain.exponentialRampToValueAtTime(
        0.18,
        now +
        index * 0.09 +
        0.02
      );


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now +
        index * 0.09 +
        0.16
      );


      oscillator.connect(gain);

      gain.connect(
        ctx.destination
      );


      oscillator.start(
        now +
        index * 0.09
      );


      oscillator.stop(
        now +
        index * 0.09 +
        0.18
      );

    }
  );

}

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #00695c, #26a69a, #80cbc4);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #222;
}

.container {
  width: 94%;
  max-width: 650px;
  margin: 20px auto;
}

.game-card {
  background: rgba(255,255,255,0.97);
  border-radius: 28px;
  padding: 25px;
  box-shadow: 0 15px 45px rgba(0,0,0,0.25);
}

.logo {
  text-align: center;
  font-size: 48px;
  font-weight: bold;
  color: #00796b;
  margin: 5px 0;
  letter-spacing: 3px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

#startScreen {
  text-align: center;
}

.start-icon {
  font-size: 70px;
  margin: 10px;
}

.start-title {
  font-size: 28px;
  color: #00796b;
  margin: 10px;
}

.start-text {
  color: #666;
  line-height: 1.8;
}

.mode-title {
  margin-top: 25px;
  margin-bottom: 10px;
  color: #555;
}

.mode-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.mode-buttons button {
  padding: 12px 22px;
  border-radius: 14px;
  background: #eeeeee;
  font-size: 17px;
  border: none;
  cursor: pointer;
}

.mode-buttons button.active {
  background: #00897b;
  color: white;
}

.start-btn {
  width: 85%;
  max-width: 350px;
  padding: 17px;
  margin-top: 20px;
  border-radius: 18px;
  background: #00897b;
  color: white;
  font-size: 23px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

button {
  transition: transform 0.15s, opacity 0.15s;
}

button:hover {
  transform: scale(1.04);
}

button:active {
  transform: scale(0.96);
}

#gameScreen {
  display: none;
}

.level {
  text-align: center;
  font-size: 16px;
  color: #777;
  margin-bottom: 10px;
}

.level-name {
  color: #00796b;
  font-weight: bold;
}

.info {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.info-box {
  background: #f5f5f5;
  border-radius: 14px;
  padding: 10px 5px;
  text-align: center;
  font-size: 14px;
}

.info-box strong {
  display: block;
  font-size: 21px;
  margin-top: 4px;
  color: #00796b;
}

#scrambled {
  min-height: 110px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #e0f2f1, #ffffff);
  border: 2px solid #80cbc4;
  border-radius: 20px;
  padding: 20px;
  margin: 15px 0;
  font-size: 36px;
  font-weight: bold;
  letter-spacing: 7px;
  direction: ltr;
  overflow-wrap: anywhere;
}

#scrambled.arabic {
  direction: rtl;
  letter-spacing: 3px;
}

#answer {
  width: 100%;
  padding: 16px;
  border: 2px solid #80cbc4;
  border-radius: 15px;
  font-size: 22px;
  text-align: center;
  outline: none;
}

#answer:focus {
  border-color: #00897b;
  box-shadow: 0 0 0 3px rgba(0,137,123,0.12);
}

#answer.arabic-input {
  direction: rtl;
}

.game-buttons {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.game-buttons button {
  padding: 12px 18px;
  border-radius: 13px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

.check-btn {
  background: #00897b;
  color: white;
}

.hint-btn {
  background: #ffb300;
  color: white;
}

.restart-btn {
  background: #607d8b;
  color: white;
}

#message {
  min-height: 38px;
  text-align: center;
  font-size: 19px;
  font-weight: bold;
  margin-top: 15px;
}

.correct-animation {
  animation: correctPulse 0.55s ease;
}

@keyframes correctPulse {
  0% {
    transform: scale(1);
  }

  40% {
    transform: scale(1.08);
  }

  70% {
    transform: scale(0.98);
  }

  100% {
    transform: scale(1);
  }
}

.wrong-animation {
  animation: shake 0.45s ease;
}

@keyframes shake {
  0%,100% {
    transform: translateX(0);
  }

  20% {
    transform: translateX(-12px);
  }

  40% {
    transform: translateX(12px);
  }

  60% {
    transform: translateX(-8px);
  }

  80% {
    transform: translateX(8px);
  }
}

#gameOver {
  display: none;
  text-align: center;
}

.game-over-icon {
  font-size: 65px;
}

.game-over-title {
  color: #00796b;
  font-size: 30px;
}

.final-score {
  font-size: 48px;
  font-weight: bold;
  color: #ff9800;
  margin: 10px;
}

.record-box {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 15px;
  margin: 15px 0;
}

.play-again {
  background: #00897b;
  color: white;
  padding: 15px 30px;
  border-radius: 15px;
  font-size: 19px;
  border: none;
  cursor: pointer;
}

.footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin-top: 18px;
}

@media (max-width: 500px) {

  .game-card {
    padding: 18px;
  }

  .logo {
    font-size: 38px;
  }

  #scrambled {
    font-size: 29px;
    letter-spacing: 5px;
  }

  .info {
    grid-template-columns: repeat(2, 1fr);
  }

  .start-btn {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="game-card">

<!-- ================= صفحه شروع ================= -->

<div id="startScreen">

  <div class="logo">SÖZLƏR</div>

  <div class="start-icon">🧩</div>

  <div class="start-title">
    Söz tapma oyunu
  </div>

  <div class="start-text">
    Qarışıq hərflərə bax və sözü tap!<br>
    Mərhələ yüksəldikcə oyun çətinləşir.
  </div>

  <div class="mode-title">
    Dil rejimini seç:
  </div>

  <div class="mode-buttons">

    <button id="latinStartBtn" class="active">
      🇮🇷 Latin
    </button>

    <button id="arabicStartBtn">
      🇮🇷 Ərəb
    </button>

  </div>

  <button id="startBtn" class="start-btn">
    🚀 Oyuna başla
  </button>

</div>


<!-- ================= صفحه بازی ================= -->

<div id="gameScreen">

  <div class="logo">
    SÖZLƏR
  </div>

  <div class="subtitle">
    Qarışıq hərflərdən sözü tap!
  </div>

  <div class="level">
    Mərhələ:
    <strong id="stage">1</strong>
    —
    <span id="levelName" class="level-name">
      Asan
    </span>
  </div>

  <div class="info">

    <div class="info-box">
      ❤️ Can
      <strong id="lives">3</strong>
    </div>

    <div class="info-box">
      ⏱️ Vaxt
      <strong id="timer">30</strong>
    </div>

    <div class="info-box">
      ⭐ Xal
      <strong id="score">0</strong>
    </div>

    <div class="info-box">
      🏆 Rekord
      <strong id="bestScore">0</strong>
    </div>

  </div>

  <div id="scrambled"></div>

  <input
    id="answer"
    type="text"
    autocomplete="off"
    placeholder="Cavabını yaz..."
  >

  <div class="game-buttons">

    <button id="checkBtn" class="check-btn">
      ✅ Yoxla
    </button>

    <button id="hintBtn" class="hint-btn">
      💡 İpucu
    </button>

    <button id="restartBtn" class="restart-btn">
      🔄 Yenidən
    </button>

  </div>

  <div id="message"></div>

</div>


<!-- ================= پایان بازی ================= -->

<div id="gameOver">

  <div class="game-over-icon">
    🏆
  </div>

  <div class="game-over-title">
    Oyun bitdi!
  </div>

  <p>
    Sənin xalın:
  </p>

  <div id="finalScore" class="final-score">
    0
  </div>

  <div class="record-box">

    🏆 Ən yaxşı xal

    <h2 id="finalBest">
      0
    </h2>

  </div>

  <button id="playAgainBtn" class="play-again">
    🔄 Yenidən oyna
  </button>

</div>


<div class="footer">
  SÖZLƏR • Azərbaycan Türkçəsi
</div>

</div>

</div>


<script>

/* =====================================================
   کلمات
===================================================== */

const words = [

  { latin:"Ana", arabic:"آنا" },
  { latin:"Ata", arabic:"آتا" },
  { latin:"Su", arabic:"سو" },
  { latin:"Ay", arabic:"آی" },
  { latin:"At", arabic:"آت" },
  { latin:"İt", arabic:"ایت" },
  { latin:"Əl", arabic:"ال" },
  { latin:"Nar", arabic:"نار" },
  { latin:"Yol", arabic:"یول" },
  { latin:"Çay", arabic:"چای" },
  { latin:"Duz", arabic:"دوز" },

  { latin:"Göy", arabic:"گوی" },
  { latin:"Ev", arabic:"ائو" },
  { latin:"Dağ", arabic:"داغ" },
  { latin:"Quş", arabic:"قوش" },
  { latin:"Göz", arabic:"گوز" },
  { latin:"Baş", arabic:"باش" },
  { latin:"Süd", arabic:"سود" },
  { latin:"Alma", arabic:"آلما" },
  { latin:"Dost", arabic:"دوست" },
  { latin:"Uşaq", arabic:"اوشاق" },
  { latin:"Kitab", arabic:"کیتاب" },
  { latin:"Qələm", arabic:"قلم" },
  { latin:"Meyvə", arabic:"میوه" },
  { latin:"Üzüm", arabic:"اوزوم" },

  { latin:"Günəş", arabic:"گونش" },
  { latin:"Çörək", arabic:"چورک" },
  { latin:"Məktəb", arabic:"مکتب" },
  { latin:"Dəniz", arabic:"دنیز" },
  { latin:"Torpaq", arabic:"تورپاق" },
  { latin:"Bulud", arabic:"بولود" },
  { latin:"Yağış", arabic:"یاغیش" },
  { latin:"Külək", arabic:"کولک" },
  { latin:"Ulduz", arabic:"اولدوز" },
  { latin:"Gecə", arabic:"گجه" },
  { latin:"Səhər", arabic:"سحر" },
  { latin:"Axşam", arabic:"آخشام" },
  { latin:"Maşın", arabic:"ماشین" },
  { latin:"Çiçək", arabic:"چیچک" },
  { latin:"Ağac", arabic:"آغاج" },
  { latin:"Yarpaq", arabic:"یارپاق" },
  { latin:"Armud", arabic:"آرمود" },
  { latin:"Balıq", arabic:"بالق" },
  { latin:"Pişik", arabic:"پیشیک" },
  { latin:"Qəhvə", arabic:"قهوه" },
  { latin:"Şəkər", arabic:"شکر" },
  { latin:"Ürək", arabic:"اورک" },
  { latin:"Ayaq", arabic:"آیاق" },
  { latin:"Ğələm", arabic:"غلم" }

];


/* =====================================================
   متغیرها
===================================================== */

let currentWord = null;

let currentMode = "latin";

let stage = 1;

let lives = 3;

let score = 0;

let timeLeft = 30;

let timerInterval = null;

let hintUsed = false;

let audioContext = null;


/* =====================================================
   عناصر
===================================================== */

const startScreen =
  document.getElementById("startScreen");

const gameScreen =
  document.getElementById("gameScreen");

const gameOver =
  document.getElementById("gameOver");

const startBtn =
  document.getElementById("startBtn");

const latinStartBtn =
  document.getElementById("latinStartBtn");

const arabicStartBtn =
  document.getElementById("arabicStartBtn");

const scrambledEl =
  document.getElementById("scrambled");

const answerEl =
  document.getElementById("answer");

const stageEl =
  document.getElementById("stage");

const levelNameEl =
  document.getElementById("levelName");

const livesEl =
  document.getElementById("lives");

const timerEl =
  document.getElementById("timer");

const scoreEl =
  document.getElementById("score");

const bestScoreEl =
  document.getElementById("bestScore");

const messageEl =
  document.getElementById("message");

const checkBtn =
  document.getElementById("checkBtn");

const hintBtn =
  document.getElementById("hintBtn");

const restartBtn =
  document.getElementById("restartBtn");

const finalScoreEl =
  document.getElementById("finalScore");

const finalBestEl =
  document.getElementById("finalBest");

const playAgainBtn =
  document.getElementById("playAgainBtn");


/* =====================================================
   صدا
===================================================== */

function getAudioContext() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}


function playCorrectSound() {

  const ctx =
    getAudioContext();

  const now =
    ctx.currentTime;

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.type = "sine";

  osc.frequency.setValueAtTime(
    523.25,
    now
  );

  osc.frequency.setValueAtTime(
    659.25,
    now + 0.12
  );

  osc.frequency.setValueAtTime(
    783.99,
    now + 0.24
  );

  gain.gain.setValueAtTime(
    0.001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.22,
    now + 0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.42
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + 0.45);
}


function playWrongSound() {

  const ctx =
    getAudioContext();

  const now =
    ctx.currentTime;

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(
    260,
    now
  );

  osc.frequency.setValueAtTime(
    180,
    now + 0.13
  );

  osc.frequency.setValueAtTime(
    120,
    now + 0.26
  );

  gain.gain.setValueAtTime(
    0.001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.16,
    now + 0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.4
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + 0.42);
}


/* =====================================================
   سطح مرحله
===================================================== */

function getDifficulty() {

  if (stage <= 5) {

    return {
      name: "Asan",
      minLength: 2,
      maxLength: 4,
      time: 30,
      points: 10
    };

  }

  if (stage <= 10) {

    return {
      name: "Orta",
      minLength: 4,
      maxLength: 6,
      time: 24,
      points: 15
    };

  }

  return {
    name: "Çətin",
    minLength: 6,
    maxLength: 20,
    time: Math.max(
      14,
      24 - Math.floor((stage - 10) / 3)
    ),
    points: 20
  };
}


/* =====================================================
   انتخاب کلمه بر اساس سختی
===================================================== */

function getWordForStage() {

  const difficulty =
    getDifficulty();

  let pool =
    words.filter(word => {

      const length =
        Array.from(word.latin).length;

      return (
        length >= difficulty.minLength &&
        length <= difficulty.maxLength
      );

    });


  /*
     اگر لیست مناسب کم بود،
     از کل کلمات استفاده می‌کنیم.
  */

  if (pool.length === 0) {
    pool = words;
  }


  /*
     تا حد ممکن کلمه قبلی تکرار نشود.
  */

  if (pool.length > 1) {

    const filtered =
      pool.filter(
        word => word !== currentWord
      );

    if (filtered.length > 0) {
      pool = filtered;
    }

  }


  return pool[
    Math.floor(
      Math.random() * pool.length
    )
  ];
}


/* =====================================================
   مخلوط کردن حروف
===================================================== */

function shuffleLetters(text) {

  const letters =
    Array.from(text);

  let shuffled;

  do {

    shuffled =
      [...letters];

    for (
      let i = shuffled.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        shuffled[i],
        shuffled[j]
      ] = [
        shuffled[j],
        shuffled[i]
      ];

    }

  } while (
    shuffled.join("") === text &&
    text.length > 1
  );

  return shuffled.join("");
}


/* =====================================================
   رکورد
===================================================== */

function getBestScore() {

  return Number(
    localStorage.getItem(
      "sozlerBest"
    ) || 0
  );

}


function updateBestScore() {

  bestScoreEl.textContent =
    getBestScore();

}


/* =====================================================
   شروع بازی
===================================================== */

function startGame() {

  getAudioContext();

  startScreen.style.display =
    "none";

  gameOver.style.display =
    "none";

  gameScreen.style.display =
    "block";

  stage = 1;

  lives = 3;

  score = 0;

  stageEl.textContent =
    stage;

  livesEl.textContent =
    lives;

  scoreEl.textContent =
    score;

  updateBestScore();

  showNewWord();
}


/* =====================================================
   نمایش کلمه جدید
===================================================== */

function showNewWord() {

  clearInterval(
    timerInterval
  );

  currentWord =
    getWordForStage();

  const text =
    currentMode === "latin"
      ? currentWord.latin
      : currentWord.arabic;

  scrambledEl.textContent =
    shuffleLetters(text);


  const difficulty =
    getDifficulty();

  levelNameEl.textContent =
    difficulty.name;


  if (currentMode === "arabic") {

    scrambledEl.classList.add(
      "arabic"
    );

    answerEl.classList.add(
      "arabic-input"
    );

    answerEl.placeholder =
      "Cavabı ərəb hərfləri ilə yaz...";

  } else {

    scrambledEl.classList.remove(
      "arabic"
    );

    answerEl.classList.remove(
      "arabic-input"
    );

    answerEl.placeholder =
      "Cavabını yaz...";

  }


  answerEl.value =
    "";

  hintUsed =
    false;

  messageEl.textContent =
    "";

  timeLeft =
    difficulty.time;

  timerEl.textContent =
    timeLeft;

  startTimer();

  answerEl.focus();
}


/* =====================================================
   تایمر
===================================================== */

function startTimer() {

  clearInterval(
    timerInterval
  );

  timerInterval =
    setInterval(() => {

      timeLeft--;

      timerEl.textContent =
        timeLeft;

      if (timeLeft <= 0) {

        clearInterval(
          timerInterval
        );

        messageEl.textContent =
          "⏰ Vaxt bitdi!";

        loseLife();

      }

    }, 1000);
}


/* =====================================================
   بررسی جواب
===================================================== */

function checkAnswer() {

  getAudioContext();

  const userAnswer =
    answerEl.value.trim();

  if (!userAnswer) {

    messageEl.textContent =
      "✏️ Cavabını yaz!";

    return;
  }


  const correctAnswer =
    currentMode === "latin"
      ? currentWord.latin
      : currentWord.arabic;


  if (
    userAnswer === correctAnswer
  ) {

    clearInterval(
      timerInterval
    );

    playCorrectSound();


    scrambledEl.classList.remove(
      "wrong-animation"
    );

    void scrambledEl.offsetWidth;

    scrambledEl.classList.add(
      "correct-animation"
    );


    const difficulty =
      getDifficulty();

    let points =
      difficulty.points;


    if (hintUsed) {
      points -= 5;
    }


    if (points < 5) {
      points = 5;
    }


    score += points;

    scoreEl.textContent =
      score;


    messageEl.textContent =
      "🎉 Düzdür! +" +
      points +
      " xal";


    setTimeout(() => {

      stage++;

      stageEl.textContent =
        stage;

      showNewWord();

    }, 650);


  } else {

    scrambledEl.classList.remove(
      "correct-animation"
    );

    void scrambledEl.offsetWidth;

    scrambledEl.classList.add(
      "wrong-animation"
    );

    messageEl.textContent =
      "❌ Səhv cavab!";

    loseLife();
  }
}


/* =====================================================
   کم شدن جان
===================================================== */

function loseLife() {

  playWrongSound();

  lives--;

  livesEl.textContent =
    lives;

  answerEl.value =
    "";


  if (lives <= 0) {

    clearInterval(
      timerInterval
    );

    setTimeout(
      finishGame,
      600
    );

    return;
  }


  setTimeout(
    showNewWord,
    650
  );
}


/* =====================================================
   راهنما
===================================================== */

function showHint() {

  if (
    hintUsed ||
    !currentWord
  ) {
    return;
  }

  hintUsed =
    true;

  const answer =
    currentMode === "latin"
      ? currentWord.latin
      : currentWord.arabic;

  const firstLetter =
    Array.from(answer)[0];

  messageEl.textContent =
    "💡 İlk hərf: " +
    firstLetter;
}


/* =====================================================
   پایان بازی
===================================================== */

function finishGame() {

  clearInterval(
    timerInterval
  );


  const oldBest =
    getBestScore();


  if (score > oldBest) {

    localStorage.setItem(
      "sozlerBest",
      score
    );

  }


  finalScoreEl.textContent =
    score;

  finalBestEl.textContent =
    getBestScore();


  gameScreen.style.display =
    "none";

  gameOver.style.display =
    "block";
}


/* =====================================================
   شروع دوباره
===================================================== */

function restartGame() {

  startGame();
}


/* =====================================================
   انتخاب Latin
===================================================== */

latinStartBtn.addEventListener(
  "click",
  () => {

    currentMode =
      "latin";

    latinStartBtn.classList.add(
      "active"
    );

    arabicStartBtn.classList.remove(
      "active"
    );

  }
);


/* =====================================================
   انتخاب عربی
===================================================== */

arabicStartBtn.addEventListener(
  "click",
  () => {

    currentMode =
      "arabic";

    arabicStartBtn.classList.add(
      "active"
    );

    latinStartBtn.classList.remove(
      "active"
    );

  }
);


/* =====================================================
   دکمه‌ها
===================================================== */

startBtn.addEventListener(
  "click",
  startGame
);

checkBtn.addEventListener(
  "click",
  checkAnswer
);

hintBtn.addEventListener(
  "click",
  showHint
);

restartBtn.addEventListener(
  "click",
  restartGame
);

playAgainBtn.addEventListener(
  "click",
  restartGame
);


/* =====================================================
   Enter
===================================================== */

answerEl.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      checkAnswer();

    }

  }
);


/* =====================================================
   شروع اولیه
===================================================== */

updateBestScore();

</script>

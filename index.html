<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.25),transparent 28%),
    linear-gradient(135deg,#173f3a,#0d2525 55%,#061616);
  color:#fff;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:18px 14px 30px;
}

.glass{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border-radius:28px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.logo{
  text-align:center;
  font-size:38px;
  font-weight:900;
  margin:12px 0 5px;
  text-shadow:0 4px 15px rgba(0,0,0,.4);
}

.subtitle{
  text-align:center;
  opacity:.78;
  margin-bottom:20px;
}

.home-card{
  padding:20px;
}

.mode-title{
  text-align:center;
  font-size:18px;
  margin-bottom:12px;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.mode-btn,
.start-btn,
.action-btn,
.stage-btn{
  border:0;
  color:white;
  cursor:pointer;
  border-radius:18px;
  padding:15px 12px;
  font-weight:800;
}

.mode-btn{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
}

.mode-btn.selected{
  background:rgba(255,196,80,.28);
  border-color:rgba(255,210,100,.65);
}

.start-btn{
  width:100%;
  margin-top:16px;
  background:linear-gradient(135deg,#d69b32,#a96d19);
  font-size:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:16px 0;
}

.stat{
  text-align:center;
  padding:11px 5px;
  background:rgba(255,255,255,.08);
  border-radius:16px;
}

.stat small{
  display:block;
  opacity:.65;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:18px;
}

.stage-title{
  text-align:center;
  margin:20px 0 12px;
  font-size:20px;
}

.stage-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  margin-top:12px;
}

.stage-btn{
  min-height:55px;
  padding:8px 2px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.12);
}

.stage-btn.open{
  background:rgba(214,155,50,.27);
}

.stage-btn.current{
  border:2px solid rgba(255,215,120,.85);
}

.stage-btn.locked{
  opacity:.35;
}

.stage-info{
  text-align:center;
  margin-top:12px;
  opacity:.72;
  font-size:13px;
}

.game-top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.top-box{
  padding:10px 5px;
  text-align:center;
  border-radius:16px;
  background:rgba(255,255,255,.09);
}

.top-box small{
  display:block;
  opacity:.6;
  font-size:10px;
}

.top-box strong{
  display:block;
  margin-top:3px;
}

.game-card{
  padding:16px;
}

.word-slots{
  min-height:90px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-content:center;
  gap:8px;
  margin-bottom:18px;
}

.answer-slot{
  min-width:42px;
  height:42px;
  padding:7px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:rgba(255,255,255,.08);
  border:1px dashed rgba(255,255,255,.22);
  font-size:20px;
  font-weight:800;
}

.answer-slot.found{
  background:rgba(72,180,116,.28);
  border-style:solid;
  border-color:rgba(100,220,145,.5);
}

.letters-area{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letter{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  font-size:25px;
  font-weight:900;
  background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.07));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 18px rgba(0,0,0,.20);
  touch-action:none;
  transition:.12s;
}

.letter.selected{
  transform:scale(.92);
  background:rgba(222,165,57,.65);
  border-color:#ffd978;
  box-shadow:0 0 18px rgba(255,210,100,.45);
}

.letter.used{
  opacity:.45;
}

.current-word{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:15px 0;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  direction:auto;
}

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.action-btn{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.12);
  padding:12px 5px;
}

.action-btn.hint{
  background:rgba(214,155,50,.22);
}

.message{
  min-height:25px;
  text-align:center;
  margin-top:12px;
  font-weight:700;
}

.message.correct{
  color:#9cf0bb;
}

.message.wrong{
  color:#ffaaa0;
}

.music-btn{
  position:fixed;
  right:14px;
  bottom:14px;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:20px;
  z-index:20;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.58);
  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:390px;
  padding:25px;
  text-align:center;
  border-radius:28px;
  background:rgba(24,54,51,.97);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-card h2{
  margin-top:0;
}

.modal-card p{
  line-height:1.7;
  opacity:.82;
}

.modal-card button{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:16px;
  padding:14px;
  font-weight:800;
  color:#fff;
  background:linear-gradient(135deg,#d69b32,#a96d19);
}

.shake{
  animation:shake .35s;
}

.pop{
  animation:pop .28s;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

@keyframes pop{
  50%{transform:scale(1.04)}
}

@media(max-width:360px){
  .letter{
    font-size:21px;
    border-radius:17px;
  }

  .stage-grid{
    gap:6px;
  }

  .stage-btn{
    min-height:48px;
  }
}
</style>
</head>

<body>

<audio id="music" loop preload="auto">
  <source src="https://topaltopalchi-ship-it.github.io/S-zl-r/ays%C9%99l.mp3" type="audio/mpeg">
</audio>

<div class="app">

  <!-- HOME -->
  <section id="homeScreen" class="screen active">

    <div class="logo">حیدربابا</div>
    <div class="subtitle">Sözləri tap, mərhələləri aç</div>

    <div class="glass home-card">

      <div class="mode-title">Əlifbanı seç</div>

      <div class="mode-buttons">
        <button id="latinBtn" class="mode-btn selected">
          🇮🇷 Latin
        </button>

        <button id="arabicBtn" class="mode-btn">
          🇮🇷 Ərəb
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <small>Mərhələ</small>
          <strong id="homeStage">1</strong>
        </div>

        <div class="stat">
          <small>Sikkə</small>
          <strong id="homeCoins">0</strong>
        </div>

        <div class="stat">
          <small>Xal</small>
          <strong id="homeScore">0</strong>
        </div>
      </div>

      <button id="continueBtn" class="start-btn">
        Oyuna başla
      </button>

      <div class="stage-title">Mərhələlər</div>

      <div id="stageGrid" class="stage-grid"></div>

      <div id="stageInfo" class="stage-info"></div>

    </div>
  </section>


  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="logo" style="font-size:30px;">حیدربابا</div>

    <div class="game-top">

      <div class="top-box">
        <small>Mərhələ</small>
        <strong id="gameStage">1</strong>
      </div>

      <div class="top-box">
        <small>Sikkə</small>
        <strong id="gameCoins">0</strong>
      </div>

      <div class="top-box">
        <small>Can</small>
        <strong id="gameLives">❤️❤️❤️</strong>
      </div>

    </div>

    <div class="glass game-card">

      <div id="wordSlots" class="word-slots"></div>

      <div id="currentWord" class="current-word"></div>

      <div id="lettersArea" class="letters-area"></div>

      <div class="game-actions">

        <button id="clearBtn" class="action-btn">
          Təmizlə
        </button>

        <button id="hintBtn" class="action-btn hint">
          💡 İpucu
        </button>

        <button id="shuffleBtn" class="action-btn">
          🔀 Qarışdır
        </button>

      </div>

      <div id="message" class="message"></div>

    </div>

  </section>

</div>


<button id="musicBtn" class="music-btn">🔊</button>


<!-- MODAL -->
<div id="modal" class="modal">

  <div class="modal-card">

    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>

    <button id="modalAction"></button>

  </div>

</div>


<script>

/* =========================================================
   MƏRHƏLƏLƏR
   ========================================================= */

const stages = [

  {
    latinLetters:["a","t","a","n"],
    arabicLetters:["ا","ت","ا","ن"],
    latinAnswers:["ata","ana"],
    arabicAnswers:["اتا","انا"]
  },

  {
    latinLetters:["a","l","m","a"],
    arabicLetters:["ا","ل","م","ا"],
    latinAnswers:["alma","al"],
    arabicAnswers:["الما","ال"]
  },

  {
    latinLetters:["e","v","ə"],
    arabicLetters:["ائ","و"],
    latinAnswers:["ev","evə"],
    arabicAnswers:["ائو","ائوا"]
  },

  {
    latinLetters:["g","ü","n"],
    arabicLetters:["گ","و","ن"],
    latinAnswers:["gün"],
    arabicAnswers:["گون"]
  },

  {
    latinLetters:["g","ü","n","ə","ş"],
    arabicLetters:["گ","و","ن","ش"],
    latinAnswers:["gün","günəş"],
    arabicAnswers:["گون","گونش"]
  },

  {
    latinLetters:["ç","ö","r","ə","k"],
    arabicLetters:["چ","و","ر","ک"],
    latinAnswers:["çörək"],
    arabicAnswers:["چورک"]
  },

  {
    latinLetters:["a","ğ","a","c"],
    arabicLetters:["ا","غ","ا","ج"],
    latinAnswers:["ağac","ağ"],
    arabicAnswers:["اغاج","اغ"]
  },

  {
    latinLetters:["g","ö","z"],
    arabicLetters:["گ","و","ز"],
    latinAnswers:["göz","öz"],
    arabicAnswers:["گوز","اوز"]
  },

  {
    latinLetters:["g","ü","l"],
    arabicLetters:["گ","و","ل"],
    latinAnswers:["gül"],
    arabicAnswers:["گول"]
  },

  {
    latinLetters:["q","a","r","a"],
    arabicLetters:["ق","ا","ر","ا"],
    latinAnswers:["qara","qar","ara"],
    arabicAnswers:["قارا","قار","ارا"]
  },

  {
    latinLetters:["d","a","ş"],
    arabicLetters:["د","ا","ش"],
    latinAnswers:["daş","aş"],
    arabicAnswers:["داش","اش"]
  },

  {
    latinLetters:["s","u"],
    arabicLetters:["س","و"],
    latinAnswers:["su"],
    arabicAnswers:["سو"]
  },

  {
    latinLetters:["a","y"],
    arabicLetters:["ا","ی"],
    latinAnswers:["ay"],
    arabicAnswers:["ای"]
  },

  {
    latinLetters:["g","e","c","ə"],
    arabicLetters:["گ","ئ","ج","ا"],
    latinAnswers:["gecə"],
    arabicAnswers:["گئجا"]
  },

  {
    latinLetters:["d","o","s","t"],
    arabicLetters:["د","و","س","ت"],
    latinAnswers:["dost"],
    arabicAnswers:["دوست"]
  },

  {
    latinLetters:["s","e","v"],
    arabicLetters:["س","ئ","و"],
    latinAnswers:["sev"],
    arabicAnswers:["سئو"]
  },

  {
    latinLetters:["s","e","v","i"],
    arabicLetters:["س","ئ","و","ی"],
    latinAnswers:["sevi"],
    arabicAnswers:["سئوی"]
  },

  {
    latinLetters:["b","a","l"],
    arabicLetters:["ب","ا","ل"],
    latinAnswers:["bal"],
    arabicAnswers:["بال"]
  },

  {
    latinLetters:["d","a","ğ"],
    arabicLetters:["د","ا","غ"],
    latinAnswers:["dağ"],
    arabicAnswers:["داغ"]
  },

  {
    latinLetters:["y","o","l"],
    arabicLetters:["ی","و","ل"],
    latinAnswers:["yol"],
    arabicAnswers:["یول"]
  }

];


/* =========================================================
   STATE
   ========================================================= */

let mode = localStorage.getItem("hb_mode") || "latin";

let coins = Number(localStorage.getItem("hb_coins") || 0);

let score = Number(localStorage.getItem("hb_score") || 0);

let unlockedStage = Number(
  localStorage.getItem("hb_unlockedStage") || 1
);

let selectedStage = Number(
  localStorage.getItem("hb_selectedStage") || 1
);

if(unlockedStage < 1){
  unlockedStage = 1;
}

if(unlockedStage > stages.length){
  unlockedStage = stages.length;
}

if(selectedStage < 1){
  selectedStage = 1;
}

if(selectedStage > unlockedStage){
  selectedStage = unlockedStage;
}

let lives = 3;

let foundWords = [];

let currentLetters = [];

let currentWord = "";

let selectedIndexes = [];

let dragging = false;

let gameOver = false;

let modalActionType = "";

const music = document.getElementById("music");


/* =========================================================
   ELEMENTS
   ========================================================= */

const homeScreen = document.getElementById("homeScreen");
const gameScreen = document.getElementById("gameScreen");

const latinBtn = document.getElementById("latinBtn");
const arabicBtn = document.getElementById("arabicBtn");

const continueBtn = document.getElementById("continueBtn");

const stageGrid = document.getElementById("stageGrid");
const stageInfo = document.getElementById("stageInfo");

const homeStage = document.getElementById("homeStage");
const homeCoins = document.getElementById("homeCoins");
const homeScore = document.getElementById("homeScore");

const gameStage = document.getElementById("gameStage");
const gameCoins = document.getElementById("gameCoins");
const gameLives = document.getElementById("gameLives");

const lettersArea = document.getElementById("lettersArea");
const currentWordEl = document.getElementById("currentWord");
const wordSlots = document.getElementById("wordSlots");
const message = document.getElementById("message");

const clearBtn = document.getElementById("clearBtn");
const hintBtn = document.getElementById("hintBtn");
const shuffleBtn = document.getElementById("shuffleBtn");

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
const modalAction = document.getElementById("modalAction");

const musicBtn = document.getElementById("musicBtn");


/* =========================================================
   SAVE
   ========================================================= */

function save(){

  localStorage.setItem("hb_mode",mode);

  localStorage.setItem("hb_coins",coins);

  localStorage.setItem("hb_score",score);

  localStorage.setItem(
    "hb_unlockedStage",
    unlockedStage
  );

  localStorage.setItem(
    "hb_selectedStage",
    selectedStage
  );

}


/* =========================================================
   MODE
   ========================================================= */

function setMode(newMode){

  mode = newMode;

  latinBtn.classList.toggle(
    "selected",
    mode === "latin"
  );

  arabicBtn.classList.toggle(
    "selected",
    mode === "arabic"
  );

  save();

  renderStages();

}


latinBtn.addEventListener("click",()=>{

  setMode("latin");

});


arabicBtn.addEventListener("click",()=>{

  setMode("arabic");

});


/* =========================================================
   HOME
   ========================================================= */

function showHome(){

  gameScreen.classList.remove("active");

  homeScreen.classList.add("active");

  updateHome();

  renderStages();

}


function updateHome(){

  homeStage.textContent = selectedStage;

  homeCoins.textContent = coins;

  homeScore.textContent = score;

}


function renderStages(){

  stageGrid.innerHTML = "";

  for(let i=0;i<stages.length;i++){

    const btn = document.createElement("button");

    btn.className = "stage-btn";

    const stageNumber = i + 1;

    if(stageNumber <= unlockedStage){

      btn.classList.add("open");

      btn.textContent = stageNumber;

      if(stageNumber === selectedStage){

        btn.classList.add("current");

      }

      btn.addEventListener("click",()=>{

        selectedStage = stageNumber;

        save();

        updateHome();

        renderStages();

      });

    }else{

      btn.classList.add("locked");

      btn.textContent = "🔒";

    }

    stageGrid.appendChild(btn);

  }

  stageInfo.textContent =
    `${unlockedStage} / ${stages.length} mərhələ açıqdır`;

}


continueBtn.addEventListener("click",()=>{

  startGame(selectedStage);

});


/* =========================================================
   START GAME
   ========================================================= */

function startGame(stageNumber){

  if(stageNumber > unlockedStage){

    return;

  }

  selectedStage = stageNumber;

  lives = 3;

  foundWords = [];

  currentWord = "";

  selectedIndexes = [];

  dragging = false;

  gameOver = false;

  message.textContent = "";

  message.className = "message";

  homeScreen.classList.remove("active");

  gameScreen.classList.add("active");

  loadStage();

  startMusic();

  save();

}


/* =========================================================
   LOAD STAGE
   ========================================================= */

function loadStage(){

  const stage = stages[selectedStage - 1];

  currentLetters =
    mode === "latin"
      ? [...stage.latinLetters]
      : [...stage.arabicLetters];

  shuffleArray(currentLetters);

  gameStage.textContent = selectedStage;

  gameCoins.textContent = coins;

  updateLives();

  renderSlots();

  renderLetters();

  clearCurrentWord();

}


/* =========================================================
   ANSWERS
   ========================================================= */

function getAnswers(){

  const stage = stages[selectedStage - 1];

  return mode === "latin"
    ? stage.latinAnswers
    : stage.arabicAnswers;

}


/* =========================================================
   SLOTS
   ========================================================= */

function renderSlots(){

  wordSlots.innerHTML = "";

  const answers = getAnswers();

  answers.forEach(answer=>{

    const slot = document.createElement("div");

    slot.className = "answer-slot";
if(foundWords.includes(answer)){
  slot.classList.add("found");
  slot.textContent = answer;
}else{
  slot.textContent = "•".repeat(
    Math.max(2,answer.length)
  );
    }
  

    wordSlots.appendChild(slot);

  });

}


/* =========================================================
   LETTERS
   ========================================================= */

function renderLetters(){

  lettersArea.innerHTML = "";

  currentLetters.forEach((letter,index)=>{

    const el = document.createElement("div");

    el.className = "letter";

    el.dataset.index = index;

    el.textContent = letter;

    el.addEventListener(
      "pointerdown",
      startSelect
    );

    el.addEventListener(
      "pointermove",
      moveSelect
    );

    el.addEventListener(
      "pointerup",
      endSelect
    );

    el.addEventListener(
      "pointercancel",
      endSelect
    );

    lettersArea.appendChild(el);

  });

}


/* =========================================================
   DRAG / TOUCH
   ========================================================= */

function startSelect(e){

  if(gameOver){

    return;

  }

  e.preventDefault();

  dragging = true;

  selectedIndexes = [];

  clearCurrentWord();

  const index = Number(
    e.currentTarget.dataset.index
  );

  addLetter(index);

  try{

    lettersArea.setPointerCapture(e.pointerId);

  }catch(err){}

}


function moveSelect(e){

  if(!dragging || gameOver){

    return;

  }

  e.preventDefault();

  const element =
    document.elementFromPoint(
      e.clientX,
      e.clientY
    );

  if(!element){

    return;

  }

  const letterEl =
    element.closest(".letter");

  if(!letterEl){

    return;

  }

  const index =
    Number(letterEl.dataset.index);

  addLetter(index);

}


function endSelect(e){

  if(!dragging){

    return;

  }

  dragging = false;

  try{

    lettersArea.releasePointerCapture(
      e.pointerId
    );

  }catch(err){}

  submitWord();

}


document.addEventListener(
  "touchmove",
  function(e){

    if(dragging){

      e.preventDefault();

    }

  },
  {passive:false}
);


/* =========================================================
   ADD LETTER
   ========================================================= */

function addLetter(index){

  if(selectedIndexes.includes(index)){

    return;

  }

  selectedIndexes.push(index);

  currentWord += currentLetters[index];

  currentWordEl.textContent = currentWord;

  const letters =
    lettersArea.querySelectorAll(".letter");

  if(letters[index]){

    letters[index].classList.add("selected");

  }

}


/* =========================================================
   CLEAR WORD
   ========================================================= */

function clearCurrentWord(){

  currentWord = "";

  selectedIndexes = [];

  currentWordEl.textContent = "";

  const letters =
    lettersArea.querySelectorAll(".letter");

  letters.forEach(el=>{

    el.classList.remove("selected");

  });

}


/* =========================================================
   SUBMIT WORD
   ========================================================= */

function submitWord(){

  if(!currentWord){

    return;

  }

  const answers = getAnswers();

  if(
    answers.includes(currentWord) &&
    !foundWords.includes(currentWord)
  ){

    foundWords.push(currentWord);

    score += 10;

    coins += 1;

    playCorrectSound();

    message.textContent =
      "آفرین! درست است 👏";

    message.className =
      "message correct";

    wordSlots.classList.remove("pop");

    void wordSlots.offsetWidth;

    wordSlots.classList.add("pop");

    renderSlots();

    updateGameStats();

    clearCurrentWord();

    if(foundWords.length === answers.length){

      setTimeout(
        finishStage,
        500
      );

    }

  }else{

    playWrongSound();

    message.textContent =
      "این کلمه در این مرحله نیست.";

    message.className =
      "message wrong";

    lettersArea.classList.remove("shake");

    void lettersArea.offsetWidth;

    lettersArea.classList.add("shake");

    clearCurrentWord();

    loseLife();

  }

}


/* =========================================================
   LIFE
   ========================================================= */

function loseLife(){

  lives--;

  updateLives();

  if(lives <= 0){

    setTimeout(
      showGameOver,
      300
    );

  }

}


function updateLives(){

  gameLives.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3-lives);

}


function updateGameStats(){

  gameCoins.textContent = coins;

  save();

}


/* =========================================================
   FINISH STAGE
   ========================================================= */

function finishStage(){

  score += 10;

  coins += 5;

  if(
    selectedStage === unlockedStage &&
    unlockedStage < stages.length
  ){

    unlockedStage++;

  }

  save();

  if(selectedStage < stages.length){

    showModal(
      "آفرین! 🎉",
      `مرحله ${selectedStage} را کامل کردی.<br>
       ۵ سکه جایزه گرفتی.<br>
       مرحله ${selectedStage + 1} باز شد.`,
      "مرحله بعد",
      "next"
    );

  }else{

    showModal(
      "تبریک! 🎉",
      `همه ${stages.length} مرحله را کامل کردی.`,
      "بازگشت به مرحله ۱",
      "restart"
    );

  }

}


/* =========================================================
   GAME OVER
   ========================================================= */

function showGameOver(){

  gameOver = true;

  showModal(
    "این بار نشد ❤️",
    `جان‌ها تمام شد.<br>
     می‌توانی همین مرحله را دوباره بازی کنی.`,
    "تلاش دوباره",
    "retry"
  );

}


/* =========================================================
   MODAL
   ========================================================= */

function showModal(
  title,
  text,
  buttonText,
  actionType
){

  modalTitle.textContent = title;

  modalText.innerHTML = text;

  modalAction.textContent = buttonText;

  modalActionType = actionType;

  modal.classList.add("show");

}


modalAction.addEventListener("click",()=>{

  modal.classList.remove("show");

  if(modalActionType === "next"){

    selectedStage++;

    if(selectedStage > unlockedStage){

      selectedStage = unlockedStage;

    }

    save();

    startGame(selectedStage);

  }

  else if(modalActionType === "retry"){

    startGame(selectedStage);

  }

  else if(modalActionType === "restart"){

    selectedStage = 1;

    save();

    startGame(1);

  }

});


/* =========================================================
   HINT
   ========================================================= */

hintBtn.addEventListener("click",()=>{

  if(coins < 10){

    message.textContent =
      "برای راهنما ۱۰ سکه لازم است.";

    message.className =
      "message wrong";

    return;

  }

  const answers = getAnswers();

  const remaining =
    answers.filter(
      word=>!foundWords.includes(word)
    );

  if(remaining.length === 0){

    return;

  }

  const word = remaining[0];

  coins -= 10;

  save();

  gameCoins.textContent = coins;

  message.textContent =
    `راهنما: ${word.charAt(0)}...`;

  message.className =
    "message";

});


/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.addEventListener(
  "click",
  clearCurrentWord
);


/* =========================================================
   SHUFFLE
   ========================================================= */

shuffleBtn.addEventListener("click",()=>{

  shuffleArray(currentLetters);

  clearCurrentWord();

  renderLetters();

});


function shuffleArray(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


/* =========================================================
   MUSIC
   ========================================================= */

async function startMusic(){

  try{

    await music.play();

    musicBtn.textContent = "🔊";

  }catch(err){

    musicBtn.textContent = "🔇";

  }

}


musicBtn.addEventListener("click",async()=>{

  if(music.paused){

    try{

      await music.play();

      musicBtn.textContent = "🔊";

    }catch(err){

      musicBtn.textContent = "🔇";

    }

  }else{

    music.pause();

    musicBtn.textContent = "🔇";

  }

});


/* =========================================================
   SOUNDS
   ========================================================= */

function playCorrectSound(){

  try{

    const ctx =
      new (window.AudioContext ||
      window.webkitAudioContext)();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value = 720;

    gain.gain.setValueAtTime(
      0.001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.22
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
      ctx.currentTime + 0.23
    );

  }catch(err){}

}


function playWrongSound(){

  try{

    const ctx =
      new (window.AudioContext ||
      window.webkitAudioContext)();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.frequency.value = 180;

    gain.gain.setValueAtTime(
      0.001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.13,
      ctx.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.18
    );

    osc.connect(gain);

    gain.connect(ctx.destination);

    osc.start();

    osc.stop(
      ctx.currentTime + 0.19
    );

  }catch(err){}

}


/* =========================================================
   INIT
   ========================================================= */

setMode(mode);

updateHome();

renderStages();

</script>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SÖZLƏR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.game{
  width:100%;
  max-width:520px;
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  text-align:center;
}

h1{
  margin:0 0 5px;
  font-size:42px;
  color:#333;
}

.subtitle{
  color:#777;
  margin-bottom:25px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  margin:8px 0;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.alphabet-btn{
  background:#f1f3ff;
  color:#333;
}

.alphabet-btn:hover{
  background:#e1e5ff;
}

.stats{
  display:flex;
  justify-content:space-between;
  background:#f5f5f5;
  border-radius:15px;
  padding:15px;
  margin-bottom:20px;
}

.stat{
  display:flex;
  flex-direction:column;
}

.stat-number{
  font-size:24px;
  font-weight:bold;
  color:#5b63d3;
}

.stat-label{
  font-size:13px;
  color:#777;
}

.letters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:25px 0;
}

.letter{
  width:55px;
  height:55px;
  background:#eee;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  font-weight:bold;
}

.hint{
  background:#fff5d6;
  border-radius:15px;
  padding:14px;
  margin:15px 0;
  color:#765900;
}

input{
  width:100%;
  padding:16px;
  border:2px solid #ddd;
  border-radius:15px;
  font-size:20px;
  text-align:center;
  outline:none;
}

input:focus{
  border-color:#667eea;
}

.check-btn{
  background:#667eea;
  color:white;
}

.hint-btn{
  background:#f0f0f0;
  color:#333;
}

.message{
  min-height:28px;
  margin:12px 0;
  font-size:18px;
  font-weight:bold;
}

.hidden{
  display:none;
}

/* نمایش Ü به شکل و با ۷ کوچک */
.special-u{
  position:relative;
  display:inline-block;
  padding-top:14px;
  margin:0 2px;
  line-height:1;
}

.special-u::before{
  content:"۷";
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%) scale(.55);
  font-weight:bold;
}

/* نمایش Ö به شکل و با همزه کوچک */
.special-o{
  position:relative;
  display:inline-block;
  padding-top:14px;
  margin:0 2px;
  line-height:1;
}

.special-o::before{
  content:"ء";
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%) scale(.65);
  font-weight:bold;
}

.arabic-word{
  direction:rtl;
  font-size:42px;
  font-weight:bold;
  margin:25px 0;
  line-height:1.8;
}

.back-btn{
  background:#eee;
  color:#333;
}
</style>
</head>

<body>

<div class="game">

  <!-- صفحه انتخاب الفبا -->
  <div id="startScreen">

    <h1>SÖZLƏR</h1>

    <div class="subtitle">
      Azərbaycan Türkcəsi söz oyunu
    </div>

    <button class="alphabet-btn" onclick="startGame('latin')">
      🇮🇷 Azərbaycan Türkcəsi — Latın əlifbası
    </button>

    <button class="alphabet-btn" onclick="startGame('arabic')">
      🇮🇷 Azərbaycan Türkcəsi — Ərəb əlifbası
    </button>

  </div>


  <!-- صفحه بازی -->
  <div id="gameScreen" class="hidden">

    <h1>SÖZLƏR</h1>

    <div class="subtitle" id="modeTitle"></div>

    <div class="stats">

      <div class="stat">
        <span class="stat-number" id="score">0</span>
        <span class="stat-label">Xal</span>
      </div>

      <div class="stat">
        <span class="stat-number" id="wordNumber">1</span>
        <span class="stat-label">Söz</span>
      </div>

    </div>


    <!-- حروف لاتین -->
    <div id="latinLetters" class="letters"></div>


    <!-- کلمه عربی -->
    <div id="arabicWord" class="arabic-word hidden"></div>


    <div class="hint" id="hintBox">
      💡 İpucu üçün düyməyə bas
    </div>


    <input
      id="answer"
      type="text"
      placeholder="Cavabınızı yazın..."
      autocomplete="off"
    >


    <button class="check-btn" onclick="checkAnswer()">
      Yoxla
    </button>

    <button class="hint-btn" onclick="showHint()">
      💡 İpucu
    </button>


    <div id="message" class="message"></div>


    <button class="back-btn" onclick="backToStart()">
      ← Geri
    </button>

  </div>

</div>


<script>

/* =========================
   کلمات بازی
========================= */

const words = [

  {
    latin:"günəş",
    arabic:"گ[U]nəş",
    hint:"Yerə işıq və istilik verir."
  },

  {
    latin:"çörək",
    arabic:"ç[O]rək",
    hint:"Süfrədə ən çox yeyilən qidalardan biridir."
  },

  {
    latin:"bulud",
    arabic:"bulud",
    hint:"Göydə görünür və yağış gətirə bilər."
  },

  {
    latin:"su",
    arabic:"su",
    hint:"İçmək üçün lazımdır."
  },

  {
    latin:"kitab",
    arabic:"kitab",
    hint:"Oxumaq üçün istifadə olunur."
  },

  {
    latin:"məktəb",
    arabic:"məktəb",
    hint:"Şagirdlər burada oxuyurlar."
  },

  {
    latin:"ev",
    arabic:"ائو",
    hint:"İnsanların yaşadığı yer."
  },

  {
    latin:"qapı",
    arabic:"قاپی",
    hint:"Evə və otağa giriş üçün istifadə olunur."
  },

  {
    latin:"çiçək",
    arabic:"چیچək",
    hint:"Bitkilərdə gözəl görünən hissədir."
  },

  {
    latin:"dəniz",
    arabic:"دنیز",
    hint:"Böyük su sahəsidir."
  },

  {
    latin:"dağ",
    arabic:"داغ",
    hint:"Çox hündür təbii yüksəklikdir."
  },

  {
    latin:"ağac",
    arabic:"آغاج",
    hint:"Meşələrdə çox olur."
  },

  {
    latin:"göy",
    arabic:"g[O]y",
    hint:"Səmanın rəngidir."
  },

  {
    latin:"ay",
    arabic:"آی",
    hint:"Gecə səmada görünür."
  },

  {
    latin:"ulduz",
    arabic:"ulduz",
    hint:"Gecə səmasında parlayır."
  }

];


/* =========================
   dəyişənlər
========================= */

let currentMode = "latin";
let currentWord = 0;
let score = 0;


/* =========================
   başlanğıc
========================= */

function startGame(mode){

  currentMode = mode;
  currentWord = 0;
  score = 0;

  document
    .getElementById("startScreen")
    .classList
    .add("hidden");

  document
    .getElementById("gameScreen")
    .classList
    .remove("hidden");

  document.getElementById("score").textContent = score;

  document.getElementById("modeTitle").textContent =
    mode === "latin"
    ? "Latın əlifbası"
    : "Ərəb əlifbası";

  loadWord();
}


/* =========================
   نمایش کلمه
========================= */

function loadWord(){

  const word = words[currentWord];

  document.getElementById("wordNumber").textContent =
    currentWord + 1;

  document.getElementById("answer").value = "";

  document.getElementById("message").textContent = "";

  document.getElementById("hintBox").textContent =
    "💡 İpucu üçün düyməyə bas";


  if(currentMode === "latin"){

    document
      .getElementById("latinLetters")
      .classList
      .remove("hidden");

    document
      .getElementById("arabicWord")
      .classList
      .add("hidden");

    showScrambledLetters(word.latin);

  }else{

    document
      .getElementById("latinLetters")
      .classList
      .add("hidden");

    document
      .getElementById("arabicWord")
      .classList
      .remove("hidden");

    document.getElementById("arabicWord").innerHTML =
      makeArabicDisplay(word.arabic);

  }
}


/* =========================
   حروف درهم‌ریخته
========================= */

function showScrambledLetters(word){

  let letters = Array.from(word);

  letters.sort(() => Math.random() - 0.5);

  const box =
    document.getElementById("latinLetters");

  box.innerHTML = "";

  letters.forEach(letter => {

    const div = document.createElement("div");

    div.className = "letter";

    div.textContent = letter;

    box.appendChild(div);

  });
}


/* =========================
   نمایش مخصوص عربی
========================= */

function makeArabicDisplay(word){

  let result = "";

  for(let i = 0; i < word.length; i++){

    const char = word[i];

    if(char === "["){

      let end = word.indexOf("]", i);

      let marker = word.substring(i + 1, end);

      if(marker === "U"){

        result +=
          '<span class="special-u">و</span>';

      }

      if(marker === "O"){

        result +=
          '<span class="special-o">و</span>';

      }

      i = end;

    }else{

      result += char;

    }

  }

  return result;
}


/* =========================
   بررسی جواب
========================= */

function checkAnswer(){

  const input =
    document
      .getElementById("answer")
      .value
      .trim()
      .toLowerCase();

  if(!input){

    document.getElementById("message").textContent =
      "✍️ Zəhmət olmasa cavab yazın.";

    return;
  }


  const word = words[currentWord];

  let correct = false;


  if(currentMode === "latin"){

    correct =
      normalize(input) ===
      normalize(word.latin);

  }else{

    /*
      در حالت عربی، جواب لاتین هم پذیرفته می‌شود
      تا کاربر بتواند نام کلمه را وارد کند.
    */

    correct =
      normalize(input) ===
      normalize(word.latin)
      ||
      normalizeArabic(input) ===
      normalizeArabic(word.arabic);

  }


  if(correct){

    score += 10;

    document.getElementById("score").textContent =
      score;

    document.getElementById("message").textContent =
      "✅ Düzdür! +10 xal";


    setTimeout(() => {

      currentWord++;

      if(currentWord >= words.length){

        finishGame();

      }else{

        loadWord();

      }

    },1000);


  }else{

    document.getElementById("message").textContent =
      "❌ Yenidən cəhd edin.";

  }

}


/* =========================
   نرمال‌سازی لاتین
========================= */

function normalize(text){

  return text
    .toLowerCase()
    .trim()
    .normalize("NFC");
}


/* =========================
   نرمال‌سازی عربی
========================= */

function normalizeArabic(text){

  return text
    .trim()
    .replace(/\[U\]/g,"ۈ")
    .replace(/\[O\]/g,"ۆ")
    .replace(/و/g,"و")
    .normalize("NFC");
}


/* =========================
   راهنما
========================= */

function showHint(){

  document.getElementById("hintBox").textContent =
    "💡 " + words[currentWord].hint;

}


/* =========================
   پایان بازی
========================= */

function finishGame(){

  document.getElementById("latinLetters").classList.add("hidden");

  document.getElementById("arabicWord").classList.add("hidden");

  document.getElementById("hintBox").textContent =
    "🎉 Oyun bitdi!";

  document.getElementById("message").textContent =
    "🏆 Xalınız: " + score;

}


/* =========================
   برگشت
========================= */

function backToStart(){

  document
    .getElementById("gameScreen")
    .classList
    .add("hidden");

  document
    .getElementById("startScreen")
    .classList
    .remove("hidden");

}

</script>

</body>
</html>

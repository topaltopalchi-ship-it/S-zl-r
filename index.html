<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>حیدربابا</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans",sans-serif;
  background:#10151d;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#app{
  width:100%;
  max-width:520px;
  height:100%;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%,rgba(255,205,100,.18),transparent 35%),
    linear-gradient(145deg,#17202b,#0b1017 70%);
}

.screen{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
}

.screen.active{
  display:flex;
}

/* HOME */

#home{
  align-items:center;
  justify-content:center;
  padding:25px;
}

.logo{
  font-size:48px;
  font-weight:900;
  margin-bottom:8px;
  text-shadow:0 5px 20px rgba(0,0,0,.6);
}

.subtitle{
  color:#d9c28c;
  font-size:16px;
  margin-bottom:35px;
}

.startBtn{
  border:0;
  width:80%;
  max-width:330px;
  padding:18px;
  border-radius:22px;
  font-size:22px;
  font-weight:bold;
  color:#21180a;
  background:linear-gradient(135deg,#ffd979,#c99742);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.modes{
  display:flex;
  gap:12px;
  width:80%;
  max-width:330px;
  margin-top:16px;
}

.modeBtn{
  flex:1;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  color:white;
  padding:13px 8px;
  border-radius:16px;
  font-size:15px;
  font-weight:bold;
}

/* GAME */

#game{
  padding:14px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-bottom:10px;
}

.stat{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:8px 7px;
  min-width:64px;
  text-align:center;
  font-size:12px;
}

.stat b{
  display:block;
  margin-top:2px;
  font-size:16px;
}

.stageTitle{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:4px 0 3px;
}

.progress{
  height:5px;
  border-radius:10px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
  margin:0 5px 12px;
}

.progressFill{
  height:100%;
  width:0%;
  background:#e6b85c;
  transition:.3s;
}

.board{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:3px 0 8px;
}

.answers{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  min-height:130px;
  padding-top:4px;
}

.answerRow{
  display:flex;
  justify-content:center;
  gap:6px;
  min-height:42px;
  flex-wrap:wrap;
}

.answerLetter{
  width:34px;
  height:40px;
  border-bottom:3px solid rgba(255,215,120,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
}

.answerLetter.empty{
  color:transparent;
}

.selectedWord{
  min-height:42px;
  font-size:27px;
  font-weight:bold;
  letter-spacing:2px;
  color:#ffe3a0;
  text-align:center;
}

.lettersArea{
  width:100%;
  min-height:275px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letters{
  width:265px;
  height:265px;
  position:relative;
  touch-action:none;
}

.letter{
  width:64px;
  height:64px;
  border-radius:50%;
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(145deg,#303b4a,#1a222d);
  border:2px solid rgba(255,255,255,.15);

  box-shadow:
    inset 0 2px 5px rgba(255,255,255,.08),
    0 8px 20px rgba(0,0,0,.4);

  color:#fff;
  font-size:25px;
  font-weight:bold;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.letter.selected{
  transform:translate(-50%,-50%) scale(1.13);
  background:linear-gradient(145deg,#e4b85e,#a8752c);
  color:#201707;
  border-color:#ffe2a0;

  box-shadow:
    0 0 0 5px rgba(228,184,94,.15),
    0 10px 25px rgba(0,0,0,.5);
}

.centerLetter{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aeb6c0;
  font-size:12px;
}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:5px;
}

.controlBtn{
  width:58px;
  height:45px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:20px;
}

/* MODAL */

.modal{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:360px;
  background:linear-gradient(145deg,#253140,#141b24);
  border:1px solid rgba(255,255,255,.14);
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.modalBox h2{
  margin-top:0;
  font-size:29px;
}

.modalBox p{
  color:#c7ced8;
  line-height:1.6;
}

.modalBtns{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modalBtns button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:14px;
  font-weight:bold;
  font-size:15px;
}

.nextBtn{
  background:#e2b65b;
}

.restartBtn{
  background:#394655;
  color:white;
}

.message{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%) scale(.8);
  opacity:0;
  pointer-events:none;
  padding:12px 22px;
  border-radius:18px;
  font-weight:bold;
  font-size:18px;
  z-index:100;
  transition:.2s;
}

.message.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.message.good{
  background:#315d40;
  color:#e8ffe9;
}

.message.bad{
  background:#703b3b;
  color:#ffe9e9;
}

@media(max-height:700px){

  .lettersArea{
    min-height:225px;
  }

  .letters{
    width:230px;
    height:230px;
  }

  .letter{
    width:58px;
    height:58px;
  }

  .answers{
    min-height:115px;
  }

  .logo{
    font-size:40px;
  }
}
</style>
</head>

<body>

<div id="app">

<section id="home" class="screen active">

  <div class="logo">حیدربابا</div>

  <div class="subtitle">
    Azərbaycan söz oyunu
  </div>

  <button id="startBtn" class="startBtn">
    Oyuna başla
  </button>

  <div class="modes">

    <button id="latinBtn" class="modeBtn">
      🇮🇷 LATIN
    </button>

    <button id="arabicBtn" class="modeBtn">
      🇮🇷 ƏRƏB
    </button>

  </div>

</section>


<section id="game" class="screen">

  <div class="topbar">

    <div class="stat">
      ❤️
      <b id="lives">3</b>
    </div>

    <div class="stat">
      Mərhələ
      <b id="stage">1</b>
    </div>

    <div class="stat">
      🪙
      <b id="coins">0</b>
    </div>

    <div class="stat">
      ⭐
      <b id="score">0</b>
    </div>

  </div>

  <div class="stageTitle">
    Sözləri tap
  </div>

  <div class="progress">
    <div id="progressFill" class="progressFill"></div>
  </div>

  <div class="board">

    <div id="answers" class="answers"></div>

    <div id="selectedWord" class="selectedWord"></div>

    <div id="lettersArea" class="lettersArea">

      <div id="letters" class="letters"></div>

      <div class="centerLetter">
        حیدربابا
      </div>

    </div>

    <div class="controls">

      <button id="hintBtn" class="controlBtn">
        💡
      </button>

      <button id="shuffleBtn" class="controlBtn">
        🔄
      </button>

      <button id="musicBtn" class="controlBtn">
        🎵
      </button>

    </div>

  </div>

</section>


<div id="modal" class="modal">

  <div class="modalBox">

    <h2 id="modalTitle">
      Mərhələ tamamlandı!
    </h2>

    <p id="modalText">
      Əla!
    </p>

    <div class="modalBtns">

      <button id="restartBtn" class="restartBtn">
        Yenidən
      </button>

      <button id="nextBtn" class="nextBtn">
        Növbəti
      </button>

    </div>

  </div>

</div>


<div id="message" class="message"></div>


<audio id="music" loop preload="auto">
  <source src="ays%C9%99l.mp3" type="audio/mpeg">
</audio>

</div>


<script>

/* =====================================================
   MƏRHƏLƏLƏR

   Qeyd:
   - Azərbaycan dilində real sözlər
   - Latin və Ərəb ayrıca
   - Təkrarlanan hərflər ayrıca daşdır
   - Mərhələ 10: SEV / SEVI
===================================================== */

const stages = [

  /* 1 */
  {
    latinLetters:["a","t","a","n"],
    arabicLetters:["ا","ت","ا","ن"],

    latinAnswers:["ata","ana","an"],
    arabicAnswers:["اتا","انا","ان"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 2 */
  {
    latinLetters:["a","l","s"],
    arabicLetters:["ا","ل","س"],

    latinAnswers:["al","sal","as"],
    arabicAnswers:["ال","سال","اس"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 3 */
  {
    latinLetters:["g","ü","n","ə","ş"],
    arabicLetters:["گ","و","ن","ش","ا"],

    latinAnswers:["gün","günəş","şən"],
    arabicAnswers:["گون","گونش","شن"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 4 */
  {
    latinLetters:["ç","ö","r","ə","k"],
    arabicLetters:["چ","و","ر","ک"],

    latinAnswers:["çörək","kör"],
    arabicAnswers:["چورک","کور"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 5 */
  {
    latinLetters:["g","ü","l","ə"],
    arabicLetters:["گ","و","ل","ا"],

    latinAnswers:["gül","gəl","əl"],
    arabicAnswers:["گول","گل","ال"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 6 */
  {
    latinLetters:["a","ğ","a","c"],
    arabicLetters:["ا","غ","ا","ج"],

    latinAnswers:["ağac","ağ","ac"],
    arabicAnswers:["اغاج","اغ","اج"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 7 */
  {
    latinLetters:["g","ö","z"],
    arabicLetters:["گ","و","ز"],

    latinAnswers:["göz","öz"],
    arabicAnswers:["گوز","اوز"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 8 */
  {
    latinLetters:["q","a","r","a"],
    arabicLetters:["ق","ا","ر","ا"],

    latinAnswers:["qar","qara","ara"],
    arabicAnswers:["قار","قارا","ارا"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 9 */
  {
    latinLetters:["d","a","ş"],
    arabicLetters:["د","ا","ش"],

    latinAnswers:["daş","aş"],
    arabicAnswers:["داش","اش"],

    latinBonus:[],
    arabicBonus:[]
  },

  /* 10
     طبق چیزی که خودت گفتی */
  {
    latinLetters:["s","e","v","i"],
    arabicLetters:["س","ئ","و","ی"],

    latinAnswers:["sev","sevi"],
    arabicAnswers:["سئو","سئوی"],

    latinBonus:[],
    arabicBonus:[]
  }

];


/* =====================================================
   ELEMENTS
===================================================== */

const home =
  document.getElementById("home");

const game =
  document.getElementById("game");

const startBtn =
  document.getElementById("startBtn");

const latinBtn =
  document.getElementById("latinBtn");

const arabicBtn =
  document.getElementById("arabicBtn");

const livesEl =
  document.getElementById("lives");

const stageEl =
  document.getElementById("stage");

const coinsEl =
  document.getElementById("coins");

const scoreEl =
  document.getElementById("score");

const progressFill =
  document.getElementById("progressFill");

const answersEl =
  document.getElementById("answers");

const selectedWordEl =
  document.getElementById("selectedWord");

const lettersEl =
  document.getElementById("letters");

const lettersArea =
  document.getElementById("lettersArea");

const hintBtn =
  document.getElementById("hintBtn");

const shuffleBtn =
  document.getElementById("shuffleBtn");

const musicBtn =
  document.getElementById("musicBtn");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

const nextBtn =
  document.getElementById("nextBtn");

const restartBtn =
  document.getElementById("restartBtn");

const messageEl =
  document.getElementById("message");

const music =
  document.getElementById("music");


/* =====================================================
   STATE
===================================================== */

let mode =
  localStorage.getItem("mode") || "latin";

let stageNumber =
  Number(localStorage.getItem("stageNumber")) || 1;

let coins =
  Number(localStorage.getItem("coins")) || 0;

let score =
  Number(localStorage.getItem("score")) || 0;

let lives = 3;

let currentStage = null;

let selectedIndexes = [];
let selectedLetters = [];

let foundAnswers = [];

let isDragging = false;

let activePointerId = null;

let musicEnabled =
  localStorage.getItem("musicEnabled") !== "false";


/* =====================================================
   SAVE
===================================================== */

function save(){

  localStorage.setItem(
    "mode",
    mode
  );

  localStorage.setItem(
    "stageNumber",
    stageNumber
  );

  localStorage.setItem(
    "coins",
    coins
  );

  localStorage.setItem(
    "score",
    score
  );

  localStorage.setItem(
    "musicEnabled",
    musicEnabled
  );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  livesEl.textContent = lives;

  stageEl.textContent =
    stageNumber;

  coinsEl.textContent =
    coins;

  scoreEl.textContent =
    score;

}


/* =====================================================
   DATA
===================================================== */

function getLetters(){

  return mode === "latin"
    ? currentStage.latinLetters
    : currentStage.arabicLetters;

}


function getAnswers(){

  return mode === "latin"
    ? currentStage.latinAnswers
    : currentStage.arabicAnswers;

}


function getBonus(){

  return mode === "latin"
    ? currentStage.latinBonus
    : currentStage.arabicBonus;

}


function normalizeWord(word){

  return word
    .trim()
    .toLocaleLowerCase("az-AZ");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  messageEl.textContent =
    text;

  messageEl.className =
    "message show " + type;

  clearTimeout(
    showMessage.timer
  );

  showMessage.timer =
    setTimeout(()=>{

      messageEl.className =
        "message";

    },900);

}


/* =====================================================
   MODE
===================================================== */

function setMode(newMode){

  mode = newMode;

  latinBtn.style.background =
    mode === "latin"
      ? "rgba(226,182,91,.35)"
      : "rgba(255,255,255,.08)";

  arabicBtn.style.background =
    mode === "arabic"
      ? "rgba(226,182,91,.35)"
      : "rgba(255,255,255,.08)";

  save();

}


latinBtn.addEventListener(
  "click",
  ()=>{
    setMode("latin");
  }
);


arabicBtn.addEventListener(
  "click",
  ()=>{
    setMode("arabic");
  }
);


/* =====================================================
   MUSIC
===================================================== */

function startMusic(){

  if(!musicEnabled)
    return;

  music.volume = .35;

  music.play().catch(()=>{});

}


function updateMusicButton(){

  musicBtn.textContent =
    musicEnabled
      ? "🎵"
      : "🔇";

}


musicBtn.addEventListener(
  "click",
  ()=>{

    musicEnabled =
      !musicEnabled;

    if(musicEnabled){

      startMusic();

    }else{

      music.pause();

    }

    updateMusicButton();

    save();

  }
);


/* =====================================================
   START
===================================================== */

startBtn.addEventListener(
  "click",
  ()=>{

    home.classList.remove(
      "active"
    );

    game.classList.add(
      "active"
    );

    loadStage();

    startMusic();

  }
);


/* =====================================================
   LOAD STAGE
===================================================== */

function loadStage(){

  if(stageNumber > stages.length){

    stageNumber = 1;

  }

  currentStage =
    stages[stageNumber - 1];

  lives = 3;

  selectedIndexes = [];

  selectedLetters = [];

  foundAnswers = [];

  renderAnswers();

  renderLetters();

  selectedWordEl.textContent =
    "";

  progressFill.style.width =
    (
      ((stageNumber - 1) /
      stages.length) * 100
    ) + "%";

  updateStats();

  save();

}


/* =====================================================
   ANSWERS
===================================================== */

function renderAnswers(){

  answersEl.innerHTML = "";

  const answers =
    getAnswers();

  answers.forEach(
    word=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "answerRow";

      for(
        const char of Array.from(word)
      ){

        const box =
          document.createElement(
            "div"
          );

        box.className =
          "answerLetter";

        if(
          foundAnswers.includes(word)
        ){

          box.textContent =
            char;

        }else{

          box.textContent =
            "•";

          box.classList.add(
            "empty"
          );

        }

        row.appendChild(box);

      }

      answersEl.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   LETTERS
===================================================== */

function renderLetters(){

  lettersEl.innerHTML = "";

  const letters =
    getLetters();

  const radius = 94;

  const center = 132.5;

  letters.forEach(
    (letter,index)=>{

      const angle =
        (
          -90 +
          (360 / letters.length) *
          index
        ) * Math.PI / 180;

      const x =
        center +
        Math.cos(angle) *
        radius;

      const y =
        center +
        Math.sin(angle) *
        radius;

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "letter";

      el.textContent =
        letter;

      el.dataset.index =
        index;

      el.style.left =
        x + "px";

      el.style.top =
        y + "px";

      el.addEventListener(
        "pointerdown",
        onLetterPointerDown
      );

      lettersEl.appendChild(
        el
      );

    }
  );

}


/* =====================================================
   SELECT
===================================================== */

function selectLetter(index){

  if(
    selectedIndexes.includes(index)
  )
    return;

  const letters =
    getLetters();

  selectedIndexes.push(index);

  selectedLetters.push(
    letters[index]
  );

  const el =
    lettersEl.querySelector(
      `.letter[data-index="${index}"]`
    );

  if(el){

    el.classList.add(
      "selected"
    );

  }

  selectedWordEl.textContent =
    selectedLetters.join("");

}


/* =====================================================
   POINTER DOWN
===================================================== */

function onLetterPointerDown(e){

  e.preventDefault();

  isDragging = true;

  activePointerId =
    e.pointerId;

  lettersEl.setPointerCapture?.(
    e.pointerId
  );

  const index =
    Number(
      e.currentTarget.dataset.index
    );

  selectLetter(index);

}


/* =====================================================
   POINTER MOVE
===================================================== */

lettersArea.addEventListener(
  "pointermove",
  e=>{

    if(!isDragging)
      return;

    if(
      activePointerId !== null &&
      e.pointerId !== activePointerId
    )
      return;

    const element =
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    if(!element)
      return;

    const letter =
      element.closest(".letter");

    if(!letter)
      return;

    const index =
      Number(
        letter.dataset.index
      );

    selectLetter(index);

  },
  {passive:false}
);


/* =====================================================
   POINTER UP
===================================================== */

function finishPointer(e){

  if(!isDragging)
    return;

  if(
    activePointerId !== null &&
    e.pointerId !== activePointerId
  )
    return;

  isDragging = false;

  activePointerId = null;

  submitWord();

}


lettersArea.addEventListener(
  "pointerup",
  finishPointer
);

lettersArea.addEventListener(
  "pointercancel",
  finishPointer
);


/* =====================================================
   TOUCH
===================================================== */

lettersArea.addEventListener(
  "touchmove",
  e=>{

    if(isDragging)
      e.preventDefault();

  },
  {passive:false}
);


/* =====================================================
   SUBMIT
===================================================== */

function submitWord(){

  if(
    selectedLetters.length === 0
  )
    return;

  const word =
    selectedLetters.join("");

  const normalized =
    normalizeWord(word);

  const answers =
    getAnswers();

  const bonus =
    getBonus();


  /* MAIN */

  const mainWord =
    answers.find(
      w =>
        normalizeWord(w) ===
        normalized
    );

  if(mainWord){

    if(
      foundAnswers.includes(
        mainWord
      )
    ){

      showMessage(
        "Bu söz artıq tapılıb",
        "bad"
      );

      clearSelection();

      return;

    }

    foundAnswers.push(
      mainWord
    );

    score += 10;

    coins += 2;

    playCorrect();

    renderAnswers();

    showMessage(
      "Düzdür! +10 ⭐",
      "good"
    );

    clearSelection();

    updateStats();

    save();

    checkStageComplete();

    return;

  }


  /* BONUS */

  const bonusWord =
    bonus.find(
      w =>
        normalizeWord(w) ===
        normalized
    );

  if(bonusWord){

    score += 5;

    coins += 5;

    playCorrect();

    showMessage(
      "Gizli söz! +5 🪙",
      "good"
    );

    clearSelection();

    updateStats();

    save();

    return;

  }


  /* WRONG */

  lives--;

  playWrong();

  showMessage(
    "Səhv söz",
    "bad"
  );

  clearSelection();

  updateStats();

  if(lives <= 0){

    setTimeout(
      gameOver,
      450
    );

  }

}


/* =====================================================
   CLEAR
===================================================== */

function clearSelection(){

  selectedIndexes = [];

  selectedLetters = [];

  selectedWordEl.textContent =
    "";

  lettersEl
    .querySelectorAll(
      ".letter.selected"
    )
    .forEach(
      el=>{
        el.classList.remove(
          "selected"
        );
      }
    );

}


/* =====================================================
   COMPLETE
===================================================== */

function checkStageComplete(){

  const answers =
    getAnswers();

  if(
    foundAnswers.length >=
    answers.length
  ){

    setTimeout(
      finishStage,
      450
    );

  }

}


/* =====================================================
   FINISH
===================================================== */

function finishStage(){

  modal.classList.add(
    "show"
  );

  modalTitle.textContent =
    "Mərhələ tamamlandı! 🎉";

  modalText.textContent =
    "Bütün sözləri tapdın.";

  nextBtn.style.display =
    "block";

}


/* =====================================================
   NEXT
===================================================== */

nextBtn.addEventListener(
  "click",
  ()=>{

    modal.classList.remove(
      "show"
    );

    if(
      stageNumber < stages.length
    ){

      stageNumber++;

    }else{

      stageNumber = 1;

    }

    loadStage();

  }
);


/* =====================================================
   RESTART
===================================================== */

restartBtn.addEventListener(
  "click",
  ()=>{

    modal.classList.remove(
      "show"
    );

    loadStage();

  }
);


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  modal.classList.add(
    "show"
  );

  modalTitle.textContent =
    "Canlar bitdi ❤️";

  modalText.textContent =
    "Bu mərhələni yenidən sınaya bilərsən.";

  nextBtn.style.display =
    "none";

}


/* =====================================================
   HINT
===================================================== */

hintBtn.addEventListener(
  "click",
  ()=>{

    if(coins < 10){

      showMessage(
        "İpucu üçün 10 🪙 lazımdır",
        "bad"
      );

      return;

    }

    const answers =
      getAnswers();

    const remaining =
      answers.filter(
        word =>
          !foundAnswers.includes(
            word
          )
      );

    if(
      remaining.length === 0
    )
      return;

    const word =
      remaining[0];

    coins -= 10;

    score += 2;

    foundAnswers.push(
      word
    );

    renderAnswers();

    updateStats();

    showMessage(
      "İpucu açıldı! -10 🪙",
      "good"
    );

    save();

    checkStageComplete();

  }
);


/* =====================================================
   SHUFFLE
===================================================== */

shuffleBtn.addEventListener(
  "click",
  ()=>{

    const nodes =
      Array.from(
        lettersEl.querySelectorAll(
          ".letter"
        )
      );

    for(
      let i=nodes.length-1;
      i>0;
      i--
    ){

      const j =
        Math.floor(
          Math.random() *
          (i+1)
        );

      [
        nodes[i],
        nodes[j]
      ] =
      [
        nodes[j],
        nodes[i]
      ];

    }

    nodes.forEach(
      node=>{
        lettersEl.appendChild(
          node
        );
      }
    );

  }
);


/* =====================================================
   CORRECT SOUND
===================================================== */

function playCorrect(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx =
      new AudioContext();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.type =
      "sine";

    osc.frequency.setValueAtTime(
      650,
      ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      900,
      ctx.currentTime + .12
    );

    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .18,
      ctx.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime + .18
    );

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    osc.stop(
      ctx.currentTime + .2
    );

  }catch(e){}

}


/* =====================================================
   WRONG SOUND
===================================================== */

function playWrong(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx =
      new AudioContext();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.type =
      "square";

    osc.frequency.setValueAtTime(
      180,
      ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      90,
      ctx.currentTime + .18
    );

    gain.gain.setValueAtTime(
      .0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .12,
      ctx.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime + .2
    );

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.start();

    osc.stop(
      ctx.currentTime + .21
    );

  }catch(e){}

}


/* =====================================================
   STARTUP
===================================================== */

setMode(mode);

updateMusicButton();

updateStats();

</script>

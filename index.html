<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZLƏR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #222;
}

.container {
  width: 94%;
  max-width: 500px;
  background: white;
  border-radius: 24px;
  padding: 25px 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.15);
  text-align: center;
}

h1 {
  margin: 5px 0 8px;
  font-size: 42px;
  letter-spacing: 3px;
}

h2 {
  margin-top: 10px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 16px;
  margin: 8px 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.97);
}

.latin-btn {
  background: #e8f0fe;
  color: #174ea6;
}

.arabic-btn {
  background: #fff0e0;
  color: #a34b00;
}

.green-btn {
  background: #1f9d55;
  color: white;
}

.yellow-btn {
  background: #f5b700;
  color: white;
}

.gray-btn {
  background: #777;
  color: white;
}

.hidden {
  display: none !important;
}

.top {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-bottom: 15px;
  font-weight: bold;
}

.score {
  color: #1f8f4d;
}

.best {
  color: #c58a00;
}

.lives {
  color: #d33;
}

.timer {
  background: #f1f1f1;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 15px;
  font-weight: bold;
}

.timer.warning {
  color: #d33;
  background: #ffe5e5;
}

.combo {
  min-height: 25px;
  color: #e67e00;
  font-weight: bold;
  margin-bottom: 8px;
}

.word-number {
  color: #666;
  margin-bottom: 15px;
}

.scrambled {
  min-height: 100px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 15px 0;
  direction: ltr;
}

.letter {
  background: #eef2f7;
  border-radius: 12px;
  padding: 12px 15px;
  font-size: 25px;
  font-weight: bold;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  min-width: 45px;
}

.arabic-letters {
  direction: rtl;
}

.arabic-letters .letter {
  font-family: Tahoma, Arial, sans-serif;
}

.hint {
  background: #fff8d9;
  border-radius: 14px;
  padding: 13px;
  margin: 15px 0;
  color: #765d00;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 15px;
  border: 2px solid #ddd;
  border-radius: 14px;
  font-size: 18px;
  text-align: center;
  outline: none;
  margin-bottom: 8px;
}

input:focus {
  border-color: #4b8df8;
}

.result {
  font-size: 20px;
  font-weight: bold;
  margin: 15px 0;
  min-height: 30px;
}

.final-score {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0;
  color: #1f8f4d;
}

.small {
  color: #777;
  font-size: 14px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

  <!-- START -->
  <div id="startScreen">

    <h1>SÖZLƏR</h1>

    <div class="subtitle">
      Azərbaycan Türkcəsi söz oyunu
    </div>

    <button class="latin-btn" onclick="startGame('latin')">
      🇮🇷 Azərbaycan Türkcəsi — Latın əlifbası
    </button>

    <button class="arabic-btn" onclick="startGame('arabic')">
      🇮🇷 Azərbaycan Türkcəsi — Ərəb əlifbası
    </button>

    <p class="small">
      Sözləri tap, xal qazan və rekordunu artır!
    </p>

  </div>


  <!-- GAME -->
  <div id="gameScreen" class="hidden">

    <div class="top">

      <div class="score">
        Xal: <span id="score">0</span>
      </div>

      <div class="best">
        Rekord: <span id="bestScore">0</span>
      </div>

      <div class="lives">
        ❤️ <span id="lives">3</span>
      </div>

    </div>

    <div id="timer" class="timer">
      ⏱️ Vaxt: <span id="time">20</span>
    </div>

    <div id="combo" class="combo"></div>

    <div class="word-number">
      Söz <span id="wordNumber">1</span> /
      <span id="totalWords">50</span>
    </div>

    <!-- Scrambled letters -->
    <div id="scrambled" class="scrambled"></div>

    <div id="hint" class="hint">
      💡 İpucu üçün düyməyə bas.
    </div>

    <input
      id="answer"
      type="text"
      placeholder="Cavabı yaz..."
      autocomplete="off"
      onkeydown="handleEnter(event)"
    >

    <button class="green-btn" onclick="checkAnswer()">
      Yoxla
    </button>

    <button class="yellow-btn" onclick="showHint()">
      💡 İpucu
    </button>

    <div id="result" class="result"></div>

    <button class="gray-btn" onclick="backToStart()">
      ↩️ Geri
    </button>

  </div>


  <!-- END -->
  <div id="endScreen" class="hidden">

    <h1>🎉</h1>

    <h2>Oyun bitdi!</h2>

    <div class="final-score">
      Xalın: <span id="finalScore">0</span>
    </div>

    <div class="best">
      Rekord: <span id="finalBest">0</span>
    </div>

    <p id="endReason" class="small"></p>

    <button class="green-btn" onclick="playAgain()">
      🔄 Yenidən oyna
    </button>

    <button class="gray-btn" onclick="backToStart()">
      🏠 Əsas səhifə
    </button>

  </div>

</div>


<script>

const words = [

  {latin:"günəş", arabic:"گونش", hint:"Yerə işıq və istilik verir."},
  {latin:"çörək", arabic:"چورک", hint:"Süfrədə yeyilən əsas qidalardan biridir."},
  {latin:"bulud", arabic:"بلود", hint:"Göydə görünür və yağış gətirə bilər."},
  {latin:"su", arabic:"سو", hint:"İçmək üçün lazımdır."},
  {latin:"kitab", arabic:"کیتاب", hint:"Oxumaq üçün istifadə olunur."},
  {latin:"məktəb", arabic:"مکتب", hint:"Şagirdlər burada oxuyurlar."},
  {latin:"ev", arabic:"ائو", hint:"İnsanların yaşadığı yerdir."},
  {latin:"qapı", arabic:"قاپی", hint:"Evə və otağa giriş üçün istifadə olunur."},
  {latin:"çiçək", arabic:"چیچک", hint:"Bitkilərdə gözəl görünən hissədir."},
  {latin:"dəniz", arabic:"دنیز", hint:"Böyük su sahəsidir."},
  {latin:"dağ", arabic:"داغ", hint:"Çox hündür təbii yüksəklikdir."},
  {latin:"ağac", arabic:"آغاج", hint:"Meşələrdə çox olur."},
  {latin:"göy", arabic:"گوی", hint:"Səmanın rəngidir."},
  {latin:"ay", arabic:"آی", hint:"Gecə səmada görünür."},
  {latin:"ulduz", arabic:"اولدوز", hint:"Gecə səmasında parlayır."},

  {latin:"ana", arabic:"آنا", hint:"Uşağı dünyaya gətirən qadın."},
  {latin:"ata", arabic:"آتا", hint:"Ailədə kişi valideyn."},
  {latin:"qardaş", arabic:"قارداش", hint:"Eyni ailədən olan oğlan."},
  {latin:"bacı", arabic:"باجی", hint:"Eyni ailədən olan qız."},
  {latin:"uşaq", arabic:"اوشاق", hint:"Kiçik yaşda insan."},
  {latin:"dost", arabic:"دوست", hint:"Səninlə yaxşı münasibəti olan insan."},
  {latin:"yol", arabic:"یول", hint:"Getmək üçün istifadə olunan keçid."},
  {latin:"maşın", arabic:"ماشین", hint:"Yolda hərəkət edən nəqliyyat vasitəsi."},
  {latin:"telefon", arabic:"تلفون", hint:"Danışmaq və əlaqə saxlamaq üçün istifadə olunur."},
  {latin:"qələm", arabic:"قلم", hint:"Yazmaq üçün istifadə olunur."},
  {latin:"kağız", arabic:"کاغذ", hint:"Yazmaq və çəkmək üçün istifadə olunur."},
  {latin:"masa", arabic:"میز", hint:"Üstündə əşyalar qoyulan mebel."},
  {latin:"stul", arabic:"ستول", hint:"Oturmaq üçün istifadə olunur."},
  {latin:"otaq", arabic:"اوتاق", hint:"Evin daxilində olan məkan."},
  {latin:"pəncərə", arabic:"پنجَرَه", hint:"İşıq və hava daxil olması üçün açılır."},
  {latin:"bağ", arabic:"باغ", hint:"Ağac və bitkilərin olduğu yer."},
  {latin:"meyvə", arabic:"میوه", hint:"Ağac və bitkilərdən alınan qida."},
  {latin:"alma", arabic:"آلما", hint:"Məşhur qırmızı və ya yaşıl meyvə."},
  {latin:"üzüm", arabic:"اوزوم", hint:"Salxım şəklində bitən meyvə."},
  {latin:"çay", arabic:"چای", hint:"İsti içki kimi də istifadə olunur."},
  {latin:"qəhvə", arabic:"قهوه", hint:"İsti və məşhur içki."},
  {latin:"süd", arabic:"سود", hint:"Ağ rəngli içki və qida."},
  {latin:"duz", arabic:"دوز", hint:"Yeməyə dad vermək üçün istifadə olunur."},
  {latin:"şəkər", arabic:"شکر", hint:"Şirin dad verir."},
  {latin:"gecə", arabic:"گجه", hint:"Günəş batdıqdan sonrakı vaxt."},
  {latin:"səhər", arabic:"سحر", hint:"Günün başladığı vaxt."},
  {latin:"gündüz", arabic:"گوندوز", hint:"Günəşin göründüyü vaxt."},
  {latin:"yağış", arabic:"یاغیش", hint:"Buludlardan yerə düşən su."},
  {latin:"qar", arabic:"قار", hint:"Soyuq havada göydən düşən ağ yağıntı."},
  {latin:"külək", arabic:"کولک", hint:"Havanın hərəkətidir."},
  {latin:"torpaq", arabic:"تورپاق", hint:"Bitkilərin böyüdüyü yer."},
  {latin:"daş", arabic:"داش", hint:"Təbiətdə olan sərt maddə."},
  {latin:"ağ", arabic:"آغ", hint:"Qara rəngin əksi."},
  {latin:"qara", arabic:"قارا", hint:"Tünd rənglərdən biri."},
  {latin:"qırmızı", arabic:"قیرمیزی", hint:"Gül və alma kimi əşyalarda olan rəng."},
  {latin:"yaşıl", arabic:"یاشیل", hint:"Ot və yarpaqların rəngi."},
  {latin:"sarı", arabic:"ساری", hint:"Günəşə bənzər parlaq rəng."},
  {latin:"böyük", arabic:"بویوک", hint:"Kiçik sözünün əksi."},
  {latin:"kiçik", arabic:"کیچیک", hint:"Böyük sözünün əksi."},
  {latin:"isti", arabic:"ایستی", hint:"Soyuğun əksi."},
  {latin:"soyuq", arabic:"سویوق", hint:"İstinin əksi."}

];


let mode = "latin";
let currentIndex = 0;
let score = 0;
let lives = 3;
let combo = 0;
let hintUsed = false;
let currentWord = null;

let timeLeft = 20;
let timerInterval = null;
let movingToNext = false;


const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");

document.getElementById("totalWords").textContent =
  words.length;


function getBestScore() {

  return Number(
    localStorage.getItem("sozlerBestScore") || 0
  );

}


function saveBestScore() {

  const best = getBestScore();

  if (score > best) {
    localStorage.setItem(
      "sozlerBestScore",
      score
    );
  }

}


function startGame(selectedMode) {

  mode = selectedMode;

  currentIndex = 0;
  score = 0;
  lives = 3;
  combo = 0;

  startScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  document.getElementById("score").textContent =
    score;

  document.getElementById("lives").textContent =
    lives;

  document.getElementById("bestScore").textContent =
    getBestScore();

  document.getElementById("combo").textContent =
    "";

  loadWord();

}


function loadWord() {

  clearInterval(timerInterval);

  movingToNext = false;

  if (currentIndex >= words.length) {
    finishGame("🎉 Bütün sözləri tamamladın!");
    return;
  }

  currentWord = words[currentIndex];

  hintUsed = false;

  document.getElementById("wordNumber").textContent =
    currentIndex + 1;

  document.getElementById("answer").value = "";

  document.getElementById("result").textContent = "";

  document.getElementById("hint").textContent =
    "💡 İpucu üçün düyməyə bas.";

  updateCombo();

  showScrambledLetters();

  startTimer();

  document.getElementById("answer").focus();

}


function showScrambledLetters() {

  const scrambled =
    document.getElementById("scrambled");

  scrambled.innerHTML = "";

  let text;

  if (mode === "latin") {
    text = currentWord.latin;
    scrambled.classList.remove("arabic-letters");
  } else {
    text = currentWord.arabic;
    scrambled.classList.add("arabic-letters");
  }

  const letters = Array.from(text);

  shuffleArray(letters);

  letters.forEach(letter => {

    const div =
      document.createElement("div");

    div.className = "letter";
    div.textContent = letter;

    scrambled.appendChild(div);

  });

}


function shuffleArray(array) {

  /*
    Fisher-Yates shuffle
    برای جابه‌جایی واقعی حروف
  */

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
      [array[j], array[i]];

  }

  /*
    اگر اتفاقاً همان ترتیب اصلی درآمد،
    دوباره جابه‌جا می‌کنیم.
  */

}


function startTimer() {

  timeLeft = 20;

  updateTimer();

  timerInterval =
    setInterval(() => {

      timeLeft--;

      updateTimer();

      if (timeLeft <= 0) {

        clearInterval(timerInterval);

        timeExpired();

      }

    }, 1000);

}


function updateTimer() {

  const timer =
    document.getElementById("timer");

  document.getElementById("time").textContent =
    timeLeft;

  if (timeLeft <= 5) {
    timer.classList.add("warning");
  } else {
    timer.classList.remove("warning");
  }

}


function timeExpired() {

  if (movingToNext) return;

  movingToNext = true;

  lives--;

  combo = 0;

  updateLives();
  updateCombo();

  document.getElementById("result").textContent =
    "⏰ Vaxt bitdi!";

  if (lives <= 0) {

    setTimeout(() => {
      finishGame("💔 Bütün canların bitdi.");
    }, 900);

    return;
  }

  setTimeout(() => {

    currentIndex++;
    loadWord();

  }, 900);

}


function showHint() {

  if (!currentWord) return;

  document.getElementById("hint").textContent =
    "💡 " + currentWord.hint;

  hintUsed = true;

}


function normalize(text) {

  return text
    .trim()
    .toLocaleLowerCase("az-AZ")
    .normalize("NFC");

}


function checkAnswer() {

  if (!currentWord || movingToNext) return;

  const input =
    document.getElementById("answer").value;

  const answer =
    normalize(input);

  const correct =
    normalize(currentWord.latin);

  const result =
    document.getElementById("result");

  if (!answer) {

    result.textContent =
      "✍️ Əvvəl cavabı yaz.";

    return;
  }


  if (answer === correct) {

    movingToNext = true;

    clearInterval(timerInterval);

    combo++;

    /*
      امتیاز پایه ۱۰ است.
      هر زنجیره درست، ۲ امتیاز اضافه می‌کند.
      اگر از راهنمایی استفاده شده باشد،
      ۵ امتیاز از امتیاز نهایی کم می‌شود.
    */

    let points =
      10 + ((combo - 1) * 2);

    if (hintUsed) {
      points = Math.max(5, points - 5);
    }

    score += points;

    result.textContent =
      "✅ Doğrudur! +" +
      points +
      " xal";

    document.getElementById("score").textContent =
      score;

    saveBestScore();

    document.getElementById("bestScore").textContent =
      getBestScore();

    updateCombo();

    setTimeout(() => {

      currentIndex++;

      loadWord();

    }, 900);

  } else {

    lives--;

    combo = 0;

    updateLives();
    updateCombo();

    result.textContent =
      "❌ Yanlışdır!";

    if (lives <= 0) {

      clearInterval(timerInterval);

      movingToNext = true;

      setTimeout(() => {

        finishGame(
          "💔 Bütün canların bitdi."
        );

      }, 700);

    }

  }

}


function updateLives() {

  document.getElementById("lives").textContent =
    lives;

}


function updateCombo() {

  const comboElement =
    document.getElementById("combo");

  if (combo >= 2) {

    comboElement.textContent =
      "🔥 Zəncir: " + combo;

  } else {

    comboElement.textContent =
      "";

  }

}


function handleEnter(event) {

  if (event.key === "Enter") {
    checkAnswer();
  }

}


function finishGame(reason) {

  clearInterval(timerInterval);

  saveBestScore();

  document.getElementById("finalScore").textContent =
    score;

  document.getElementById("finalBest").textContent =
    getBestScore();

  document.getElementById("endReason").textContent =
    reason;

  gameScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");

}


function playAgain() {

  endScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  currentIndex = 0;
  score = 0;
  lives = 3;
  combo = 0;

  document.getElementById("score").textContent =
    score;

  document.getElementById("lives").textContent =
    lives;

  loadWord();

}


function backToStart() {

  clearInterval(timerInterval);

  gameScreen.classList.add("hidden");
  endScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");

}


</script>

</body>
</html>
